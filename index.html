      ctx.strokeStyle = "rgba(255,225,160,0.5)";
      ctx.beginPath();
      ctx.moveTo(off + 420, GROUND - 18);
      ctx.quadraticCurveTo(off + 760, GROUND - 46, off + 1120, GROUND - 16);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,235,180,0.85)";
      for (let i = 0; i <= 16; i++) {
        const t2 = i / 16;
        const lx = off + 420 + (1120 - 420) * t2;
        const ly = GROUND - 18 + (-28 * Math.sin(t2 * Math.PI)) + 2;
        ctx.beginPath(); ctx.arc(lx, ly, 1.8, 0, 7); ctx.fill();
      }
      // fishing dhows drifting offshore
      const dx2 = off + 900 + ((now / 70) % 300);
      ctx.fillStyle = "#2a2438";
      ctx.beginPath();
      ctx.moveTo(dx2, GROUND - 30); ctx.lineTo(dx2 + 4, GROUND - 58); ctx.lineTo(dx2 + 24, GROUND - 33);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(dx2 - 8, GROUND - 30, 38, 5);
    }
  } else if (city.bg === "capetown") {
    for (let rep = 0; rep < 4; rep++) {
      const off = rep * 1500;
      if (off > scnV1 || off + 1500 + 500 < scnV0) continue;
      // the working harbour: cranes, containers, a moored freighter
      ctx.fillStyle = "rgba(46,86,120,0.5)";
      ctx.fillRect(off + 820, GROUND - 26, 660, 28);
      ctx.fillStyle = "#252b3a";
      ctx.fillRect(off + 900, GROUND - 44, 190, 18);      // freighter hull
      ctx.fillRect(off + 1040, GROUND - 62, 40, 20);
      for (let c2 = 0; c2 < 7; c2++) {                    // deck containers
        ctx.fillStyle = ["#2e4a6a", "#6a3a3a", "#3a5a3a"][c2 % 3];
        ctx.fillRect(off + 908 + c2 * 18, GROUND - 56, 15, 12);
      }
      ctx.strokeStyle = "#2b3346"; ctx.lineWidth = 3;     // gantry cranes
      for (const gx of [off + 860, off + 1140, off + 1320]) {
        ctx.beginPath();
        ctx.moveTo(gx, GROUND - 26); ctx.lineTo(gx, GROUND - 96);
        ctx.lineTo(gx + 54, GROUND - 96);
        ctx.moveTo(gx + 20, GROUND - 26); ctx.lineTo(gx + 20, GROUND - 96);
        ctx.stroke();
      }
      ctx.lineWidth = 1;
      // Signal Hill with its noon gun battery
      ctx.fillStyle = "#232a3c";
      ctx.beginPath();
      ctx.moveTo(off + 520, GROUND); ctx.lineTo(off + 640, GROUND - 104);
      ctx.lineTo(off + 760, GROUND); ctx.closePath(); ctx.fill();
    }
  } else if (city.bg === "honolulu") {
    // Waikīkī shoreline: open ocean, breaking surf and a sand strand
    const shore = GROUND - 42;
    ctx.fillStyle = "#1d5f7e";
    ctx.fillRect(scnV0, GROUND - 108, scnV1 - scnV0, 52);
    ctx.fillStyle = "#2b7c96";                            // shallow reef water
    ctx.fillRect(scnV0, GROUND - 66, scnV1 - scnV0, 18);
    ctx.fillStyle = "rgba(120,215,225,0.35)";
    for (let i = 0; i < 90; i++) {
      const sx3 = (i * 150 + (now / 55) % 150) % 13000 - 400;
      if (sx3 < scnV0 - 50 || sx3 > scnV1) continue;
      ctx.fillRect(sx3, GROUND - 104 + (i % 5) * 10, 44, 2.4);
    }
    for (let i = 0; i < 5; i++) {                         // rollers breaking on the reef
      const ph = ((now / (1500 + i * 340)) % 1);
      ctx.fillStyle = "rgba(240,255,255," + (0.45 * (1 - ph)) + ")";
      ctx.fillRect(scnV0, GROUND - 62 + ph * 14, scnV1 - scnV0, 3);
    }
    ctx.fillStyle = "#e0cda2";                            // the strand
    ctx.fillRect(scnV0, shore - 12, scnV1 - scnV0, 14);
    ctx.fillStyle = "rgba(255,252,240,0.5)";              // wash line
    ctx.fillRect(scnV0, shore - 13, scnV1 - scnV0, 2.5);
    ctx.fillStyle = "#cbb489";
    for (let i = 0; i < 60; i++) {
      const sx3 = (i * 230) % 13000 - 400;
      if (sx3 < scnV0 - 40 || sx3 > scnV1) continue;
      ctx.beginPath(); ctx.ellipse(sx3, shore - 4, 30, 4, 0, 0, 7); ctx.fill();
    }
    for (let rep = 0; rep < 4; rep++) {
      const off = rep * 1500;
      if (off > scnV1 || off + 1500 + 500 < scnV0) continue;
      // beach umbrellas and surfboards stuck in the sand
      for (let i = 0; i < 5; i++) {
        const ux = off + 120 + i * 290;
        ctx.strokeStyle = "#8a7a5a"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(ux, shore - 6); ctx.lineTo(ux, shore - 20); ctx.stroke();
        ctx.lineWidth = 1;
        ctx.fillStyle = ["#e0564a", "#3f9ac0", "#e8b83c"][i % 3];
        ctx.beginPath();
        ctx.moveTo(ux - 11, shore - 19); ctx.quadraticCurveTo(ux, shore - 27, ux + 11, shore - 19);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#f0e8d0";
        ctx.save();
        ctx.translate(ux + 20, shore - 12); ctx.rotate(-0.35);
        ctx.beginPath(); ctx.ellipse(0, 0, 3, 11, 0, 0, 7); ctx.fill();
        ctx.restore();
      }
      // outrigger canoes and a catamaran on the swell
      for (let i = 0; i < 3; i++) {
        const sx2 = off + 200 + i * 380 + ((now / (90 + i * 30)) % 380);
        ctx.fillStyle = "#2a3348";
        ctx.fillRect(sx2, GROUND - 22, 30, 4);
        ctx.beginPath();
        ctx.moveTo(sx2 + 14, GROUND - 22); ctx.lineTo(sx2 + 16, GROUND - 46);
        ctx.lineTo(sx2 + 32, GROUND - 24); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#2a3348";
        ctx.beginPath(); ctx.moveTo(sx2 + 4, GROUND - 20); ctx.lineTo(sx2 - 8, GROUND - 16); ctx.stroke();
      }
      // a rainbow arcing over the bay
      const rc = ["rgba(255,120,120,0.16)", "rgba(255,200,110,0.16)", "rgba(150,230,140,0.16)", "rgba(130,180,255,0.16)"];
      rc.forEach((col, i) => {
        ctx.strokeStyle = col; ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(off + 700, GROUND + 30, 190 + i * 6, Math.PI * 1.12, Math.PI * 1.88);
        ctx.stroke();
      });
      ctx.lineWidth = 1;
      // palms along the strand
      for (let i = 0; i < 7; i++) {
        const px = off + 120 + i * 190;
        ctx.strokeStyle = "#2f3a34"; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px, GROUND); ctx.quadraticCurveTo(px + 6, GROUND - 30, px + 2, GROUND - 56);
        ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillStyle = "#2b4436";
        for (let f = 0; f < 5; f++) {
          const a2 = Math.PI + (f / 4) * Math.PI;
          ctx.beginPath();
          ctx.ellipse(px + 2 + Math.cos(a2) * 15, GROUND - 56 + Math.sin(a2) * 8, 16, 4.5, a2, 0, 7);
          ctx.fill();
        }
      }
    }
  }
}

// ---------- Per-city transit gliding through the mid-ground ----------
function drawCityTransit(city) {
  const now = performance.now();
  if (city.bg === "tokyo") {
    // Shinkansen on an elevated viaduct, streaking past
    const railY = GROUND - 96;
    ctx.fillStyle = "#242138";
    ctx.fillRect(-200, railY + 12, 4200, 6);                      // viaduct deck
    for (let px = -160; px < 4000; px += 140) ctx.fillRect(px, railY + 18, 10, GROUND - railY - 48); // piers
    const span = 4400;
    const tx = span - ((now * 0.42) % span) - 400;                // right-to-left, fast
    ctx.save();
    ctx.translate(tx, railY);
    // long nose lead car + 3 cars
    ctx.fillStyle = "#e8ecf2";
    ctx.beginPath();                                              // duck-bill nose
    ctx.moveTo(-58, 12);
    ctx.quadraticCurveTo(-40, -2, -8, -2);
    ctx.lineTo(300, -2); ctx.lineTo(300, 12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#2255aa";                                    // blue stripe
    ctx.fillRect(-30, 4, 330, 3);
    ctx.fillStyle = "#8899bb";                                    // windows
    for (let wx = 10; wx < 295; wx += 22) ctx.fillRect(wx, 0, 12, 3);
    ctx.restore();
  } else if (city.bg === "sanfran") {
    // trolley gliding along a mid-ground street with catenary sparks
    const ty = GROUND - 44;
    const span = 3800;
    const tx = ((now * 0.05) % span) - 200;
    ctx.fillStyle = "#7a4530";
    ctx.fillRect(tx, ty - 16, 52, 16);
    ctx.fillStyle = "#e8d8a8";
    for (let wx = 4; wx < 48; wx += 10) ctx.fillRect(tx + wx, ty - 12, 6, 6);
    ctx.strokeStyle = "#555";
    ctx.beginPath(); ctx.moveTo(tx + 26, ty - 16); ctx.lineTo(tx + 34, ty - 26); ctx.stroke();
  }
}

function drawGroundStrip(city) {
  const desert = city.bg === "cairo" || city.bg === "dubai";
  const snowy = city.weather === "snow";
  // sidewalk band nearest the buildings, asphalt below
  ctx.fillStyle = desert ? "#544936" : "#3a3a44";
  ctx.fillRect(camX - 50, GROUND, W + 100, 8);
  ctx.fillStyle = desert ? "#3f382a" : "#2a2a34";
  ctx.fillRect(camX - 50, GROUND + 8, W + 100, H - GROUND - 8);
  if (desert) {                                   // wind-blown sand drifting over the tarmac
    ctx.fillStyle = "rgba(190,165,110,0.22)";
    for (let x = Math.floor(camX / 90) * 90; x < camX + W + 90; x += 90) {
      ctx.beginPath();
      ctx.ellipse(x + ((x / 90) % 3) * 20, GROUND + 26, 44, 6, 0, 0, 7);
      ctx.fill();
    }
  }
  // curb highlight + paving joints
  ctx.fillStyle = desert ? "#6a5c42" : "#4a4a56";
  ctx.fillRect(camX - 50, GROUND + 7, W + 100, 1.5);
  ctx.fillStyle = "#31313c";
  for (let x = Math.floor(camX / 28) * 28; x < camX + W + 28; x += 28)
    ctx.fillRect(x, GROUND, 1.5, 8);
  // lane dashes
  ctx.fillStyle = "#c8c840";
  for (let x = Math.floor(camX / 60) * 60; x < camX + W + 60; x += 60)
    ctx.fillRect(x, GROUND + 24, 26, 4);
  // zebra crosswalks every few hundred px
  ctx.fillStyle = "rgba(220,220,225,0.5)";
  for (let x = Math.floor(camX / 420) * 420; x < camX + W + 420; x += 420)
    for (let s = 0; s < 5; s++) ctx.fillRect(x + s * 9, GROUND + 12, 5, 18);
  // streetlights on the sidewalk
  for (let x = Math.floor(camX / 260) * 260; x < camX + W + 260; x += 260) {
    ctx.strokeStyle = "#4a4a56"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, GROUND + 6); ctx.lineTo(x, GROUND - 34); ctx.lineTo(x + 10, GROUND - 34);
    ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = city.time === "day" ? "#5a5a66" : "#ffe9a0";
    ctx.fillRect(x + 8, GROUND - 36, 6, 4);
    if (city.time !== "day") {
      ctx.fillStyle = "rgba(255,233,160,0.08)";
      ctx.beginPath();
      ctx.moveTo(x + 11, GROUND - 32); ctx.lineTo(x - 2, GROUND + 6); ctx.lineTo(x + 24, GROUND + 6);
      ctx.closePath(); ctx.fill();
    }
  }
  if (city.bg === "honolulu") {
    // Waikīkī promenade: pale coral paving instead of asphalt
    ctx.fillStyle = "#c9b489";
    ctx.fillRect(camX - 50, GROUND, W + 100, 10);
    ctx.fillStyle = "#a89a74";
    ctx.fillRect(camX - 50, GROUND + 10, W + 100, H - GROUND - 10);
    ctx.fillStyle = "rgba(255,250,235,0.18)";
    for (let x = Math.floor(camX / 46) * 46; x < camX + W + 46; x += 46)
      ctx.fillRect(x, GROUND + 12, 22, 3);
  }
  if (snowy) {                                    // ploughed snow banked along the kerb
    ctx.fillStyle = "rgba(232,240,250,0.82)";
    ctx.fillRect(camX - 50, GROUND, W + 100, 4);
    ctx.fillStyle = "rgba(226,236,248,0.55)";
    for (let x = Math.floor(camX / 70) * 70; x < camX + W + 70; x += 70) {
      ctx.beginPath();
      ctx.ellipse(x, GROUND + 9, 30, 5, 0, Math.PI, 0);
      ctx.fill();
    }
    ctx.fillStyle = "rgba(210,224,240,0.18)";     // slush over the road
    ctx.fillRect(camX - 50, GROUND + 8, W + 100, H - GROUND - 8);
  }
  // incoming naval fire: blinking impact reticles where the shells will land
  for (const mk of navMarks) {
    if (mk.x < camX - 40 || mk.x > camX + W + 40) continue;
    const blink = Math.floor(performance.now() / 140) % 2;
    ctx.strokeStyle = blink ? "#ff6a4a" : "#8a2a1c";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mk.x, GROUND + 2, 14, 0, 7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mk.x - 22, GROUND + 2); ctx.lineTo(mk.x - 8, GROUND + 2);
    ctx.moveTo(mk.x + 8, GROUND + 2); ctx.lineTo(mk.x + 22, GROUND + 2);
    ctx.stroke(); ctx.lineWidth = 1;
  }
  // quake wavefronts ripple along the street
  for (const q of quakes) {
    for (const sgn of [-1, 1]) {
      const fx = q.x + sgn * q.r;
      if (fx < camX - 40 || fx > camX + W + 40) continue;
      const a2 = 0.5 * (1 - q.r / q.max);
      ctx.strokeStyle = "rgba(210,190,150," + a2 + ")";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(fx, GROUND + 4, 20, 7, 0, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(fx, GROUND + 5, 34, 10, 0, Math.PI, 0); ctx.stroke();
      ctx.lineWidth = 1;
    }
  }
  // stomp craters (slow tanks)
  for (const c of craters) {
    ctx.fillStyle = "#1a1a22";
    ctx.beginPath(); ctx.ellipse(c.x, GROUND + 4, c.r, 9, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#3a3a44";
    ctx.beginPath(); ctx.ellipse(c.x, GROUND + 2, c.r, 7, 0, Math.PI, 0); ctx.stroke();
  }
  // rubble piles on ground for destroyed buildings
  for (const b of buildings) if (b.rubble) {
    if (b.x + b.w < camX - 60 || b.x > camX + W + 60) continue;   // off-screen
    ctx.fillStyle = "#4a4238";
    ctx.beginPath();
    ctx.moveTo(b.x - 6, GROUND);
    ctx.lineTo(b.x + b.w * 0.3, GROUND - 18 - (b.maxHp % 12));
    ctx.lineTo(b.x + b.w * 0.6, GROUND - 8);
    ctx.lineTo(b.x + b.w + 6, GROUND);
    ctx.closePath(); ctx.fill();
    // fresh, grabbable rubble pulses softly + kicks up dust
    if (!b.chunkTaken && (b.rubbleT || 0) > 0) {
      const p = 0.25 + Math.sin(performance.now() / 220) * 0.15;
      ctx.fillStyle = `rgba(255,220,150,${p * Math.min(1, b.rubbleT / 2)})`;
      ctx.beginPath();
      ctx.ellipse(b.x + b.w * 0.35, GROUND - 12, b.w * 0.32, 10, 0, 0, 7);
      ctx.fill();
      smokeStatic(b.x + b.w * 0.4, GROUND - 14);
    }
  }
}

// ---------- Facades: one renderer per architectural style ----------
function drawFacade(b, city, dmg) {
  const x = b.x, w = b.w, h = b.h, top = GROUND - h, cx = x + w / 2;
  const sd = b.seed || 0;
  const lit = city.tint + (dmg > 0.5 ? "22" : "cc");   // warm interior light
  const night = city.time === "night" || city.time === "dusk";
  // helper: regular window grid
  const grid = (x0, y0, x1, y1, stepX, stepY, ww, wh, onCol, offCol, skip) => {
    for (let wy = y0; wy < y1 - wh; wy += stepY)
      for (let wx = x0; wx < x1 - ww; wx += stepX) {
        const k = (Math.round(wx) * 7 + Math.round(wy) * 13 + sd) % 7;
        if (skip && k === 0) continue;
        ctx.fillStyle = k < 3 ? onCol : offCol;
        ctx.fillRect(wx, wy, ww, wh);
      }
  };
  const shadeR = (a = 0.24) => { ctx.fillStyle = `rgba(0,0,12,${a})`; ctx.fillRect(x + w - 7, top, 7, h); };
  const lightL = (a = 0.07) => { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(x, top, 4, h); };

  switch (b.arch) {

  case "haussmann": {
    // Paris: cream limestone, uniform cornice line, iron balconies, zinc mansard
    const stone = ["#c8bda2", "#c2b79c", "#cec3a8"][b.style];
    const mansY = top + h * 0.22;
    ctx.fillStyle = stone;
    ctx.fillRect(x, mansY, w, GROUND - mansY);
    ctx.fillStyle = "#5c6068";                          // zinc mansard roof
    ctx.beginPath();
    ctx.moveTo(x - 2, mansY); ctx.lineTo(x + 6, top + 3);
    ctx.lineTo(x + w - 6, top + 3); ctx.lineTo(x + w + 2, mansY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#6d7178";
    for (let dx = x + 8; dx < x + w - 10; dx += 16) ctx.fillRect(dx, top + 6, 7, 8);   // dormers
    ctx.fillStyle = "#8a7a68";                          // chimney pots
    for (let dx = x + 5; dx < x + w - 6; dx += 22) ctx.fillRect(dx, top - 7, 5, 10);
    ctx.fillStyle = "#d6cbb0";                          // heavy cornice
    ctx.fillRect(x - 3, mansY - 4, w + 6, 5);
    ctx.fillStyle = "#a89c84";
    ctx.fillRect(x - 3, mansY + 1, w + 6, 2);
    // tall french windows, one bay per ~14px
    const bays = Math.max(2, Math.round(w / 15));
    for (let f = 0; f < 5; f++) {
      const wy = mansY + 10 + f * ((GROUND - mansY - 26) / 5);
      for (let i = 0; i < bays; i++) {
        const wx = x + 5 + i * ((w - 10) / bays);
        ctx.fillStyle = night && ((i * 3 + f + sd) % 5 < 2) ? lit : "rgba(48,44,52,0.85)";
        ctx.fillRect(wx, wy, (w - 10) / bays - 6, 13);
        ctx.fillStyle = "#b3a88e";                      // stone surround
        ctx.fillRect(wx - 1, wy - 2, (w - 10) / bays - 4, 2);
      }
      // wrought-iron balcony on the 2nd and 5th floors
      if (f === 1 || f === 4) {
        ctx.strokeStyle = "rgba(30,30,36,0.85)"; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + 2, wy + 15); ctx.lineTo(x + w - 2, wy + 15);
        for (let bxp = x + 3; bxp < x + w - 3; bxp += 4) { ctx.moveTo(bxp, wy + 15); ctx.lineTo(bxp, wy + 9); }
        ctx.stroke();
      }
    }
    ctx.fillStyle = "#5a4636";                          // porte cochère
    ctx.fillRect(cx - 9, GROUND - 20, 18, 20);
    ctx.fillStyle = "#c9b06a";
    ctx.fillRect(cx - 9, GROUND - 21, 18, 2);
    shadeR(0.18); lightL();
    break;
  }

  case "ladefense": case "cityglass": case "harbourglass": case "pudong":
  case "gulfglass": case "ustower": case "jpoffice": {
    // modern curtain-wall towers — tint and mullion density vary by district
    const TONE = { ladefense: ["#59657a", "#4e5a70"], cityglass: ["#4c5a68", "#43505e"],
                   harbourglass: ["#3e5a72", "#365064"], pudong: ["#3a4a68", "#324058"],
                   gulfglass: ["#42506a", "#394660"], ustower: ["#4a4a5c", "#414152"],
                   jpoffice: ["#454a60", "#3c4154"] }[b.arch];
    ctx.fillStyle = TONE[b.style % 2];
    ctx.fillRect(x, top, w, h);
    // glass sheen band down the left third
    const g2 = ctx.createLinearGradient(x, 0, x + w, 0);
    g2.addColorStop(0, "rgba(255,255,255,0.13)");
    g2.addColorStop(0.35, "rgba(255,255,255,0.03)");
    g2.addColorStop(1, "rgba(0,0,20,0.22)");
    ctx.fillStyle = g2;
    ctx.fillRect(x, top, w, h);
    ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 1;   // mullions
    for (let mx = x + 6; mx < x + w - 3; mx += 9) {
      ctx.beginPath(); ctx.moveTo(mx, top); ctx.lineTo(mx, GROUND); ctx.stroke();
    }
    for (let my = top + 6; my < GROUND; my += 11) {
      ctx.beginPath(); ctx.moveTo(x, my); ctx.lineTo(x + w, my); ctx.stroke();
    }
    grid(x + 6, top + 7, x + w - 2, GROUND - 12, 9, 11, 6, 8, lit, "rgba(150,180,210,0.16)", true);
    // crown: setback, mast, or sloped cap
    const rk = sd % 3;
    ctx.fillStyle = shade(TONE[0], -14);
    if (rk === 0) { ctx.fillRect(x + w * 0.18, top - 10, w * 0.64, 10); }
    else if (rk === 1) {
      ctx.beginPath();
      ctx.moveTo(x, top); ctx.lineTo(x + w * 0.55, top - 16); ctx.lineTo(x + w, top);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(cx - 2, top - 20, 4, 20);
      ctx.fillRect(x + w * 0.3, top - 5, w * 0.4, 5);
    }
    if (night && (sd % 2)) { ctx.fillStyle = "#ff5555"; ctx.fillRect(cx - 1.5, top - 22, 3, 3); }
    ctx.fillStyle = "rgba(190,220,255,0.5)";            // lobby glazing
    ctx.fillRect(x + 4, GROUND - 16, w - 8, 16);
    ctx.fillStyle = "rgba(20,24,34,0.6)";
    ctx.fillRect(cx - 7, GROUND - 15, 14, 15);
    break;
  }

  case "artdeco": {
    // NYC midtown: brick tower with setbacks and a stone base
    const brick = ["#6a4c40", "#5e4438", "#734f42"][b.style];
    const setb = [[1, 0], [0.82, 0.42], [0.62, 0.72], [0.42, 0.9]];
    let prevY = GROUND;
    for (const [wf, hf] of setb) {
      const tw = w * wf, ty = GROUND - h * (hf === 0 ? 0.42 : hf);
      const tx = cx - tw / 2;
      ctx.fillStyle = brick;
      ctx.fillRect(tx, ty, tw, prevY - ty);
      ctx.fillStyle = "rgba(0,0,12,0.22)";
      ctx.fillRect(tx + tw - 6, ty, 6, prevY - ty);
      ctx.fillStyle = "#8d7160";                        // limestone ledge
      ctx.fillRect(tx - 2, ty - 3, tw + 4, 4);
      grid(tx + 5, ty + 7, tx + tw - 3, prevY - 6, 10, 12, 5, 8, lit, "rgba(24,20,28,0.8)", true);
      // vertical piers
      ctx.fillStyle = "rgba(255,240,220,0.05)";
      for (let px = tx + 4; px < tx + tw - 4; px += 10) ctx.fillRect(px - 1.5, ty, 2, prevY - ty);
      prevY = ty;
      if (hf === 0) break;
    }
    ctx.fillStyle = "#8d7160";                          // stone base + shopfronts
    ctx.fillRect(x, GROUND - 20, w, 20);
    ctx.fillStyle = "rgba(255,220,150,0.75)";
    for (let sx = x + 4; sx < x + w - 8; sx += 14) ctx.fillRect(sx, GROUND - 15, 9, 9);
    if (sd % 3 === 0) { ctx.fillStyle = "#4a4a52"; ctx.fillRect(cx - 2, top - 16, 4, 16); }
    break;
  }

  case "brownstone": {
    // NY low-rise: brick, cornice, stoop, fire escape, rooftop water tower
    const brick = ["#6b4034", "#5c382e", "#75463a"][b.style];
    ctx.fillStyle = brick;
    ctx.fillRect(x, top, w, h);
    ctx.strokeStyle = "rgba(0,0,0,0.10)";               // brick courses
    for (let by2 = top + 4; by2 < GROUND; by2 += 5) {
      ctx.beginPath(); ctx.moveTo(x, by2); ctx.lineTo(x + w, by2); ctx.stroke();
    }
    ctx.fillStyle = "#8a6a54";                          // pressed-metal cornice
    ctx.fillRect(x - 3, top - 5, w + 6, 6);
    ctx.fillStyle = "#6a5040";
    ctx.fillRect(x - 3, top + 1, w + 6, 2);
    grid(x + 6, top + 12, x + w - 4, GROUND - 20, 13, 16, 8, 11, lit, "rgba(26,20,26,0.85)", true);
    ctx.fillStyle = "#8a6a54";                          // window lintels
    for (let wy = top + 10; wy < GROUND - 22; wy += 16)
      for (let wx = x + 6; wx < x + w - 10; wx += 13) ctx.fillRect(wx - 1, wy, 10, 2);
    // zig-zag fire escape
    ctx.strokeStyle = "rgba(24,22,26,0.85)"; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let wy = top + 14; wy < GROUND - 18; wy += 16) {
      ctx.moveTo(x + 4, wy + 12); ctx.lineTo(x + w - 6, wy + 12);
      ctx.moveTo(x + 6, wy + 12); ctx.lineTo(x + w - 8, wy + 26);
    }
    ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = "#4a3226";                          // stoop + door
    ctx.fillRect(cx - 7, GROUND - 17, 14, 17);
    ctx.fillStyle = "#c8b89a";
    for (let s2 = 0; s2 < 3; s2++) ctx.fillRect(cx - 10, GROUND - 5 + s2 * 2, 20, 2);
    if (sd % 2 === 0) {                                 // the New York water tower
      const tx = x + w * 0.55;
      ctx.strokeStyle = "#3a3028"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tx - 4, top); ctx.lineTo(tx - 3, top - 6);
      ctx.moveTo(tx + 9, top); ctx.lineTo(tx + 8, top - 6);
      ctx.stroke(); ctx.lineWidth = 1;
      ctx.fillStyle = "#6a4f36";
      ctx.fillRect(tx - 5, top - 17, 15, 11);
      ctx.fillStyle = "#54402c";
      ctx.beginPath();
      ctx.moveTo(tx - 7, top - 17); ctx.lineTo(tx + 2.5, top - 24); ctx.lineTo(tx + 12, top - 17);
      ctx.closePath(); ctx.fill();
    }
    break;
  }

  case "georgian": {
    // London terrace: Portland stone / stock brick, sash windows, chimney stacks
    const face = ["#8e8578", "#7d7568", "#96897a"][b.style];
    ctx.fillStyle = face;
    ctx.fillRect(x, top + 6, w, GROUND - top - 6);
    ctx.fillStyle = "#4e5450";                          // slate roof
    ctx.beginPath();
    ctx.moveTo(x - 2, top + 7); ctx.lineTo(x + 7, top - 3);
    ctx.lineTo(x + w - 7, top - 3); ctx.lineTo(x + w + 2, top + 7);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#6d5b4c";                          // chimney stack with pots
    ctx.fillRect(x + w - 16, top - 16, 12, 14);
    ctx.fillStyle = "#8a6a55";
    ctx.fillRect(x + w - 14, top - 21, 3.5, 6);
    ctx.fillRect(x + w - 9, top - 21, 3.5, 6);
    ctx.fillStyle = "#a49a8a";                          // parapet band
    ctx.fillRect(x - 2, top + 6, w + 4, 3);
    // sash windows with glazing bars
    const bays = Math.max(2, Math.round(w / 18));
    for (let f = 0; f < 4; f++) {
      const wy = top + 16 + f * ((GROUND - top - 34) / 4);
      for (let i = 0; i < bays; i++) {
        const wx = x + 6 + i * ((w - 12) / bays), ww2 = (w - 12) / bays - 7;
        ctx.fillStyle = night && ((i + f * 2 + sd) % 4 < 2) ? lit : "rgba(40,42,46,0.85)";
        ctx.fillRect(wx, wy, ww2, 12);
        ctx.strokeStyle = "rgba(230,230,225,0.55)";
        ctx.beginPath();
        ctx.moveTo(wx + ww2 / 2, wy); ctx.lineTo(wx + ww2 / 2, wy + 12);
        ctx.moveTo(wx, wy + 6); ctx.lineTo(wx + ww2, wy + 6);
        ctx.stroke();
      }
    }
    ctx.fillStyle = "#243c2e";                          // glossy front door + fanlight
    ctx.fillRect(cx - 6, GROUND - 18, 12, 18);
    ctx.fillStyle = "rgba(255,235,190,0.8)";
    ctx.beginPath(); ctx.arc(cx, GROUND - 18, 6, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = "rgba(20,20,24,0.8)";             // area railings
    ctx.beginPath();
    for (let rx = x + 2; rx < x + w - 2; rx += 4) { ctx.moveTo(rx, GROUND); ctx.lineTo(rx, GROUND - 7); }
    ctx.stroke();
    break;
  }

  case "victorian": {
    // San Francisco: painted lady with bay window stack and gabled roof
    const hue = ["#c9a8b4", "#b8c4a8", "#d8c49a", "#a8bcd0", "#d0b0a0", "#c0b0cc"][sd % 6];
    ctx.fillStyle = hue;
    ctx.fillRect(x, top + 10, w, GROUND - top - 10);
    ctx.fillStyle = shade(hue, -34);                    // gable roof
    ctx.beginPath();
    ctx.moveTo(x - 3, top + 11); ctx.lineTo(cx, top - 6); ctx.lineTo(x + w + 3, top + 11);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f2ece2";                          // white trim bands
    ctx.fillRect(x, top + 9, w, 3);
    // projecting bay window stack
    const bw = w * 0.52;
    ctx.fillStyle = shade(hue, 12);
    ctx.fillRect(cx - bw / 2, top + 14, bw, GROUND - top - 30);
    ctx.fillStyle = "rgba(0,0,20,0.14)";
    ctx.fillRect(cx + bw / 2 - 5, top + 14, 5, GROUND - top - 30);
    for (let wy = top + 20; wy < GROUND - 22; wy += 18) {
      ctx.fillStyle = night && ((wy + sd) % 3 < 2) ? lit : "rgba(60,64,76,0.85)";
      ctx.fillRect(cx - bw / 2 + 4, wy, bw - 8, 12);
      ctx.fillStyle = "#f2ece2";
      ctx.fillRect(cx - bw / 2 + 2, wy + 12, bw - 4, 3);
      ctx.fillStyle = "#f2ece2";
      ctx.fillRect(cx - 1, wy, 2, 12);                  // sash divider
    }
    ctx.fillStyle = "#6a4636";                          // door on the raised entry
    ctx.fillRect(x + 4, GROUND - 20, 11, 20);
    ctx.fillStyle = "#f2ece2";

        ctx.closePath(); ctx.fill();
        if (night && (Math.round(wx) + Math.round(wy) + sd) % 3 === 0) {
          ctx.fillStyle = lit; ctx.fillRect(wx + 2, wy + 4, 6, 10);
          ctx.fillStyle = "rgba(45,28,18,0.82)";
        }
      }
    ctx.fillStyle = "#d8c8a8";                           // turret finials
    for (let px = x + 8; px < x + w - 6; px += 24) ctx.fillRect(px, top - 12, 5, 12);
    ctx.fillStyle = "rgba(40,24,14,0.9)";
    ctx.fillRect(cx - 10, GROUND - 20, 20, 20);
    break;
  }

  case "mumbaitower": {
    // Mumbai high-rise: concrete frame with projecting balconies and AC boxes
    const face = ["#b8b0a2", "#a89f90", "#c4bcae"][b.style];
    ctx.fillStyle = face;
    ctx.fillRect(x, top, w, h);
    shadeR(0.22); lightL(0.08);
    for (let fy = top + 10; fy < GROUND - 14; fy += 13) {
      ctx.fillStyle = shade(face, -20);                  // slab edge
      ctx.fillRect(x - 3, fy, w + 6, 3);
      ctx.fillStyle = "rgba(40,44,52,0.7)";              // recessed balcony
      ctx.fillRect(x + 4, fy - 9, w - 8, 9);
      ctx.fillStyle = night ? lit : "rgba(150,170,180,0.4)";
      for (let wx = x + 7; wx < x + w - 9; wx += 12)
        if ((Math.round(wx) + Math.round(fy) + sd) % 4) ctx.fillRect(wx, fy - 8, 7, 7);
      ctx.fillStyle = "#8a8a92";                         // AC condensers on the rail
      if ((Math.round(fy) + sd) % 2) ctx.fillRect(x + w - 14, fy - 6, 8, 6);
    }
    ctx.fillStyle = shade(face, -30);
    ctx.fillRect(x - 2, top - 5, w + 4, 6);
    ctx.fillStyle = "rgba(30,30,36,0.9)";
    ctx.fillRect(x + w * 0.24, top - 14, 15, 10);        // water tank
    if (night) { ctx.fillStyle = "#ff5555"; ctx.fillRect(cx - 1.5, top - 18, 3, 3); }
    break;
  }

  case "capedutch": {
    // Cape Dutch: whitewashed walls, thatch roof, scrolled centre gable
    const wall = ["#eee7d8", "#e4dccb", "#f2ecdd"][b.style];
    ctx.fillStyle = wall;
    ctx.fillRect(x, top + 16, w, GROUND - top - 16);
    ctx.fillStyle = "#9a8258";                           // thatch
    ctx.beginPath();
    ctx.moveTo(x - 6, top + 17); ctx.lineTo(x + 10, top - 2);
    ctx.lineTo(x + w - 10, top - 2); ctx.lineTo(x + w + 6, top + 17);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(110,90,58,0.6)";
    ctx.beginPath();
    for (let rx = x - 4; rx < x + w + 6; rx += 6) { ctx.moveTo(rx, top + 17); ctx.lineTo(rx + 8, top - 1); }
    ctx.stroke();
    // the scrolled Cape gable over the door
    ctx.fillStyle = wall;
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.19, top + 18);
    ctx.quadraticCurveTo(cx - w * 0.13, top - 4, cx - w * 0.05, top + 2);
    ctx.quadraticCurveTo(cx, top - 14, cx + w * 0.05, top + 2);
    ctx.quadraticCurveTo(cx + w * 0.13, top - 4, cx + w * 0.19, top + 18);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(wall, -22);
    ctx.fillRect(cx - w * 0.2, top + 16, w * 0.4, 3);
    ctx.fillStyle = "#2c4a3a";                           // small-paned windows with shutters
    for (let wx = x + 9; wx < x + w - 14; wx += 20) {
      ctx.fillRect(wx, GROUND - 34, 13, 16);
      ctx.strokeStyle = wall; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(wx + 6.5, GROUND - 34); ctx.lineTo(wx + 6.5, GROUND - 18);
      ctx.moveTo(wx, GROUND - 26); ctx.lineTo(wx + 13, GROUND - 26);
      ctx.stroke(); ctx.lineWidth = 1;
      ctx.fillStyle = "#2c4a3a";
    }
    ctx.fillStyle = "#5a3f2c";
    ctx.fillRect(cx - 8, GROUND - 20, 16, 20);
    ctx.fillStyle = wall;
    ctx.fillRect(cx - 11, GROUND - 22, 22, 3);
    break;
  }

  case "bokaap": {
    // Bo-Kaap street: saturated flat-fronted houses, stepping up the hill
    const hues = ["#3fa9d8", "#f0577a", "#4fc78a", "#f2b53c", "#a874d8", "#f07a3c", "#42c8c0"];
    const col = hues[sd % hues.length];
    ctx.fillStyle = col;
    ctx.fillRect(x, top + 6, w, GROUND - top - 6);
    ctx.fillStyle = "rgba(0,0,25,0.14)";
    ctx.fillRect(x + w - 6, top + 6, 6, GROUND - top - 6);
    ctx.fillStyle = shade(col, 34);                      // parapet
    ctx.fillRect(x - 2, top, w + 4, 7);
    ctx.fillStyle = "#f4efe4";                           // white mouldings
    ctx.fillRect(x, top + 12, w, 2.5);
    for (let wy = top + 22; wy < GROUND - 24; wy += 22) {
      ctx.fillStyle = "rgba(255,240,205,0.9)";
      ctx.fillRect(x + 6, wy, w - 14, 14);
      ctx.fillStyle = "#f4efe4";
      ctx.fillRect(x + 4, wy - 3, w - 10, 3);
      ctx.fillRect(x + 6 + (w - 14) / 2 - 1, wy, 2, 14);
    }
    ctx.fillStyle = shade(col, -42);                     // door + stoep
    ctx.fillRect(cx - 8, GROUND - 22, 16, 22);
    ctx.fillStyle = "#e0dccc";
    ctx.fillRect(x + 2, GROUND - 4, w - 4, 4);
    break;
  }

  case "capeglass": {
    // Cape Town CBD: mid-rise glass with sun louvres
    const face = ["#5a6a72", "#4e5e68", "#64747c"][b.style];
    ctx.fillStyle = face;
    ctx.fillRect(x, top, w, h);
    const g3 = ctx.createLinearGradient(x, 0, x + w, 0);
    g3.addColorStop(0, "rgba(255,255,255,0.12)");
    g3.addColorStop(1, "rgba(0,0,20,0.22)");
    ctx.fillStyle = g3; ctx.fillRect(x, top, w, h);
    ctx.fillStyle = "rgba(210,225,230,0.35)";            // horizontal brise-soleil
    for (let fy = top + 9; fy < GROUND - 10; fy += 11) ctx.fillRect(x - 2, fy, w + 4, 3);
    grid(x + 6, top + 12, x + w - 4, GROUND - 14, 10, 11, 6, 6, lit, "rgba(150,185,195,0.2)", true);
    ctx.fillStyle = shade(face, -22);
    ctx.fillRect(x + w * 0.2, top - 8, w * 0.6, 8);
    ctx.fillStyle = "rgba(190,220,225,0.5)";
    ctx.fillRect(x + 4, GROUND - 15, w - 8, 15);
    break;
  }

  case "tikilow": {
    // Waikīkī low-rise: pastel stucco, deep lanais, palms and shade awnings
    const face = ["#e8dcc6", "#dcc8b0", "#f0e2cc"][b.style];
    ctx.fillStyle = face;
    ctx.fillRect(x, top + 6, w, GROUND - top - 6);
    ctx.fillStyle = "rgba(60,40,30,0.14)";
    ctx.fillRect(x + w - 7, top + 6, 7, GROUND - top - 6);
    ctx.fillStyle = "#7a5c44";                           // shallow hipped roof
    ctx.beginPath();
    ctx.moveTo(x - 8, top + 7); ctx.lineTo(x + 12, top - 2);
    ctx.lineTo(x + w - 12, top - 2); ctx.lineTo(x + w + 8, top + 7);
    ctx.closePath(); ctx.fill();
    for (let fy = top + 20; fy < GROUND - 14; fy += 18) {
      ctx.fillStyle = "rgba(35,30,26,0.6)";              // deep shaded lanai
      ctx.fillRect(x + 4, fy - 12, w - 8, 12);
      ctx.fillStyle = night ? lit : "rgba(160,190,190,0.45)";
      for (let wx = x + 8; wx < x + w - 10; wx += 13) ctx.fillRect(wx, fy - 10, 7, 8);
      ctx.fillStyle = shade(face, -18);
      ctx.fillRect(x - 2, fy, w + 4, 3);
      ctx.fillStyle = ["#3fa08a", "#e0704a", "#e8b83c"][(Math.round(fy) + sd) % 3];
      ctx.fillRect(x + 2, fy - 15, w - 4, 3);            // striped awning
    }
    ctx.fillStyle = "rgba(255,236,190,0.75)";
    ctx.fillRect(x + 5, GROUND - 16, w - 10, 16);
    // a palm leaning across the frontage
    ctx.strokeStyle = "#8a6a48"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 5, GROUND); ctx.quadraticCurveTo(x + 1, GROUND - 24, x + 8, GROUND - 42);
    ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = "#3f7a48";
    for (let f = 0; f < 5; f++) {
      const a2 = Math.PI + (f / 4) * Math.PI;
      ctx.beginPath();
      ctx.ellipse(x + 8 + Math.cos(a2) * 11, GROUND - 42 + Math.sin(a2) * 6, 12, 3.6, a2, 0, 7);
      ctx.fill();
    }
    break;
  }

  case "resort": {
    // Waikīkī resort tower: balcony-striped slab facing the ocean
    const face = ["#dfe4e8", "#d2d8dd", "#e8edf0"][b.style];
    ctx.fillStyle = face;
    ctx.fillRect(x, top, w, h);
    shadeR(0.2); lightL(0.09);
    for (let fy = top + 12; fy < GROUND - 16; fy += 12) {
      ctx.fillStyle = "rgba(45,55,65,0.55)";             // balcony recess
      ctx.fillRect(x + 3, fy - 8, w - 6, 8);
      ctx.fillStyle = night ? lit : "rgba(150,185,205,0.4)";
      for (let wx = x + 6; wx < x + w - 8; wx += 11)
        if ((Math.round(wx) + Math.round(fy) + sd) % 4) ctx.fillRect(wx, fy - 7, 7, 6);
      ctx.fillStyle = shade(face, -16);                  // slab
      ctx.fillRect(x - 3, fy, w + 6, 3);
      ctx.fillStyle = "rgba(255,255,255,0.5)";           // rail
      ctx.fillRect(x - 3, fy - 1.5, w + 6, 1);
    }
    ctx.fillStyle = shade(face, -26);
    ctx.fillRect(x - 2, top - 6, w + 4, 7);
    ctx.fillStyle = "rgba(120,200,220,0.45)";            // rooftop pool
    ctx.fillRect(x + w * 0.3, top - 11, w * 0.4, 5);
    ctx.fillStyle = "rgba(190,225,235,0.55)";            // lobby glazing
    ctx.fillRect(x + 4, GROUND - 18, w - 8, 18);
    ctx.fillStyle = "#3f7a48";                           // planting at the entrance
    for (let px = x + 6; px < x + w - 6; px += 14) {
      ctx.beginPath(); ctx.arc(px, GROUND - 2, 6, Math.PI, 0); ctx.fill();
    }
    break;
  }

  default: {
    ctx.fillStyle = ["#343044", "#2e3040", "#38323e"][b.style];
    ctx.fillRect(x, top, w, h);
    shadeR(); lightL();
    grid(x + 6, top + 8, x + w - 4, GROUND - 14, 12, 14, 5, 7, lit, "rgba(20,22,34,0.7)", true);
    ctx.fillStyle = "rgba(15,15,25,0.85)";
    ctx.fillRect(cx - 6, GROUND - 13, 12, 13);
  }
  }
}

function drawBuildings(city) {
  for (const b of buildings) {
    if (b.rubble) continue;
    // cull off-screen blocks — cities are long, only a screenful is ever visible.
    // margin covers toppling towers, which sweep out to their own height sideways.
    if (b.x + b.w < camX - b.h - 80 || b.x > camX + W + b.h + 80) continue;
    const bx = b.x, bh = b.h, by = GROUND - bh;
    const dmg = 1 - b.hp / b.maxHp;
    // toppling towers rotate about their base corner; sinking ones tilt & submerge
    const toppling = b.falling && (b.falling.mode === "topple" || b.falling.mode === "sink");
    if (toppling) {
      ctx.save();
      if (b.falling.mode === "sink") {
        // clip to street level so the tower vanishes INTO the ground
        ctx.beginPath(); ctx.rect(b.x - 60, -H, b.w + 120, GROUND + H); ctx.clip();
        ctx.translate(0, b.falling.sink || 0);
      }
      const px = b.falling.dir > 0 ? b.x + b.w : b.x;   // pivot at the base edge
      ctx.translate(px, GROUND);
      ctx.rotate(b.falling.ang || 0);
      ctx.translate(-px, -GROUND);
    }
    // sheared-off top block tumbling away
    if (b.falling && b.falling.mode === "shear") {
      const f = b.falling;
      ctx.save();
      const tx2 = b.x + b.w / 2 + (f.sx || 0), ty2 = GROUND - b.h - f.topH / 2 + (f.sy || 0);
      ctx.translate(tx2, ty2);
      ctx.rotate(f.sang || 0);
      ctx.fillStyle = "#3a3444";
      ctx.fillRect(-b.w / 2, -f.topH / 2, b.w, f.topH);
      ctx.fillStyle = city.tint + "55";
      for (let wy = -f.topH / 2 + 4; wy < f.topH / 2 - 6; wy += 12)
        for (let wx = -b.w / 2 + 5; wx < b.w / 2 - 8; wx += 11) ctx.fillRect(wx, wy, 4, 6);
      // ragged broken underside
      ctx.fillStyle = "#2a2430";
      ctx.beginPath();
      ctx.moveTo(-b.w / 2, f.topH / 2);
      for (let zx = -b.w / 2; zx < b.w / 2; zx += 9) ctx.lineTo(zx + 4.5, f.topH / 2 + 5);
      ctx.lineTo(b.w / 2, f.topH / 2);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (b.landmark) {
      drawLandmark(b, city);
    } else {
      drawFacade(b, city, dmg);
    }
    // cracks when damaged
    if (dmg > 0.35) {
      ctx.strokeStyle = "rgba(0,0,0,0.55)";
      ctx.beginPath();
      ctx.moveTo(bx + b.w * 0.2, GROUND - 4);
      ctx.lineTo(bx + b.w * 0.45, GROUND - bh * 0.4);
      ctx.lineTo(bx + b.w * 0.3, GROUND - bh * 0.7);
      ctx.stroke();
    }
    if (dmg > 0.65) {
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.fillRect(bx, by, b.w, 10);
      smokeStatic(bx + b.w / 2, by);
    }
    // fire
    if (b.burn > 0) {
      ctx.fillStyle = `rgba(255,${120 + Math.random() * 80 | 0},30,0.8)`;
      const fx = bx + b.w * (0.3 + Math.sin(performance.now() / 120) * 0.15);
      ctx.beginPath();
      ctx.moveTo(fx - 7, by + 20);
      ctx.lineTo(fx, by + 20 - 16 - Math.random() * 8);
      ctx.lineTo(fx + 7, by + 20);
      ctx.closePath(); ctx.fill();
    }
    if (toppling) ctx.restore();
  }
}
function smokeStatic(x, y) {
  ctx.fillStyle = "rgba(80,80,90,0.35)";
  const t = performance.now() / 400;
  for (let i = 0; i < 3; i++)
    ctx.beginPath(), ctx.arc(x + Math.sin(t + i * 2) * 8, y - 8 - i * 10, 6 + i * 2, 0, 7), ctx.fill();
}

// ---------- Recognizable landmark renderings ----------
function drawLandmark(b, city) {
  const cx = b.x + b.w / 2, top = GROUND - b.h;
  const blink = Math.floor(performance.now() / 500) % 2;
  const lm = b.lmType || CITIES[cityIdx].landmark;
  const stage = b.stage || 0;
  ctx.save();
  if (stage > 0) {
    // wounded landmark leans from its base
    ctx.translate(cx, GROUND);
    ctx.rotate((stage === 1 ? 0.025 : 0.07) * (b.leanDir || 1));
    ctx.translate(-cx, -GROUND);
  }

  if (lm === "tower") {
    // Tokyo Tower: solid tapered silhouette, alternating orange/white bands,
    // open arched base, two observatory decks, digital antenna
    const wBase = b.w / 2 + 8, wTop = 5;
    const wAt = f => wTop + (wBase - wTop) * Math.pow(1 - f, 1.7); // width at height fraction f
    const legTopF = 0.22;                               // legs join at ~22% height
    // banded body above the legs
    const BANDS = 9;
    for (let i = 0; i < BANDS; i++) {
      const f0 = legTopF + (1 - legTopF) * (i / BANDS);
      const f1 = legTopF + (1 - legTopF) * ((i + 1) / BANDS);
      const y0 = GROUND - b.h * f0, y1 = GROUND - b.h * f1;
      const w0 = wAt(f0), w1 = wAt(f1);
      ctx.fillStyle = i % 2 ? "#f2eee0" : "#e8482a";
      ctx.beginPath();
      ctx.moveTo(cx - w0, y0); ctx.lineTo(cx + w0, y0);
      ctx.lineTo(cx + w1, y1); ctx.lineTo(cx - w1, y1);
      ctx.closePath(); ctx.fill();
    }
    // splayed legs with open arch under them
    const wL = wAt(legTopF), yL = GROUND - b.h * legTopF;
    ctx.fillStyle = "#e8482a";
    ctx.beginPath();                                    // left leg
    ctx.moveTo(cx - wBase - 6, GROUND);
    ctx.quadraticCurveTo(cx - wL - 8, GROUND - b.h * 0.12, cx - wL, yL);
    ctx.lineTo(cx - wL * 0.35, yL);
    ctx.quadraticCurveTo(cx - wBase * 0.5, GROUND - b.h * 0.08, cx - wBase * 0.45, GROUND);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                                    // right leg
    ctx.moveTo(cx + wBase + 6, GROUND);
    ctx.quadraticCurveTo(cx + wL + 8, GROUND - b.h * 0.12, cx + wL, yL);
    ctx.lineTo(cx + wL * 0.35, yL);
    ctx.quadraticCurveTo(cx + wBase * 0.5, GROUND - b.h * 0.08, cx + wBase * 0.45, GROUND);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                                    // arch crossbeam
    ctx.moveTo(cx - wL, yL); ctx.lineTo(cx + wL, yL);
    ctx.lineTo(cx + wL, yL + 5); ctx.lineTo(cx - wL, yL + 5);
    ctx.closePath(); ctx.fill();
    // subtle lattice shading over the body
    ctx.strokeStyle = "rgba(120,30,15,0.35)"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < BANDS; i++) {
      const f0 = legTopF + (1 - legTopF) * (i / BANDS);
      const f1 = legTopF + (1 - legTopF) * ((i + 1) / BANDS);
      const y0 = GROUND - b.h * f0, y1 = GROUND - b.h * f1;
      const w0 = wAt(f0), w1 = wAt(f1);
      ctx.moveTo(cx - w0, y0); ctx.lineTo(cx + w1, y1);
      ctx.moveTo(cx + w0, y0); ctx.lineTo(cx - w1, y1);
    }
    ctx.stroke();
    // right-side shading for volume
    ctx.fillStyle = "rgba(0,0,20,0.18)";
    ctx.beginPath();
    ctx.moveTo(cx, GROUND - b.h * legTopF); ctx.lineTo(cx + wL, GROUND - b.h * legTopF);
    ctx.lineTo(cx + wTop, top); ctx.lineTo(cx, top);
    ctx.closePath(); ctx.fill();
    // main observatory (white, 45%) with windows
    const oy = GROUND - b.h * 0.44, ow = wAt(0.44) + 10;
    ctx.fillStyle = "#f2eee0";
    ctx.fillRect(cx - ow, oy, ow * 2, 11);
    ctx.fillStyle = "#e8482a";
    ctx.fillRect(cx - ow, oy, ow * 2, 2.5);
    ctx.fillStyle = "#7a8aa0";
    for (let wx2 = -ow + 3; wx2 < ow - 4; wx2 += 7) ctx.fillRect(cx + wx2, oy + 4, 4, 5);
    // top deck (80%), smaller — gone once cracked
    if (stage < 1) {
      const ty2 = GROUND - b.h * 0.8, tw2 = wAt(0.8) + 7;
      ctx.fillStyle = "#f2eee0";
      ctx.fillRect(cx - tw2, ty2, tw2 * 2, 8);
      ctx.fillStyle = "#7a8aa0";
      for (let wx2 = -tw2 + 2; wx2 < tw2 - 3; wx2 += 6) ctx.fillRect(cx + wx2, ty2 + 2, 3, 4);
    }
    // antenna + beacon (snaps off at stage 2)
    if (stage < 2) {
      ctx.strokeStyle = "#f2eee0"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, top - 16); ctx.stroke();
      ctx.strokeStyle = "#e8482a";
      ctx.beginPath(); ctx.moveTo(cx, top - 16); ctx.lineTo(cx, top - 28); ctx.stroke();
      if (blink) { ctx.fillStyle = "#ff4444"; ctx.fillRect(cx - 2, top - 32, 4, 4); }
      ctx.lineWidth = 1;
    }

  } else if (lm === "spire") {
    // Empire State Building: limestone base, ribbed setback tower,
    // stepped art-deco crown, mooring mast + broadcast antenna
    const stone = "#9c9382", stoneD = "#7b7364", stoneL = "#b6ab97", pier = "#8b8272";
    const Y = f => GROUND - b.h * f;
    // (width fraction, bottom fraction, top fraction) — bottom-up massing
    const tiers = [
      [1.00, 0.00, 0.19],    // five-storey base filling the block
      [0.79, 0.19, 0.255],   // first shoulders
      [0.58, 0.255, 0.70],   // main shaft
      [0.485, 0.70, 0.785],
      [0.385, 0.785, 0.845],
      [0.295, 0.845, 0.895],  // 86th-floor observatory
    ];
    const topTier = stage >= 2 ? 3 : tiers.length;      // upper massing shears off when gutted
    for (let i = 0; i < topTier; i++) {
      const [wf, y0, y1] = tiers[i];
      const tw = b.w * wf, x0 = cx - tw / 2, yTop = Y(y1), hgt = Y(y0) - yTop;
      ctx.fillStyle = stone;
      ctx.fillRect(x0, yTop, tw, hgt);
      ctx.fillStyle = "rgba(255,250,235,0.10)";          // sunlit left face
      ctx.fillRect(x0, yTop, tw * 0.22, hgt);
      ctx.fillStyle = "rgba(20,14,30,0.20)";             // shaded right face
      ctx.fillRect(x0 + tw * 0.74, yTop, tw * 0.26, hgt);
      // signature vertical limestone piers with recessed window strips between
      const cols = Math.max(3, Math.round(tw / 7));
      for (let c2 = 0; c2 < cols; c2++) {
        const px = x0 + 2 + c2 * ((tw - 4) / cols);
        ctx.fillStyle = pier;
        ctx.fillRect(px, yTop + 2, 2, hgt - 3);
        // lit windows at dusk, in stacked bays
        for (let wy = yTop + 4; wy < yTop + hgt - 3; wy += 7) {
          const lit = (c2 * 7 + Math.round(wy)) % 5 !== 0;
          ctx.fillStyle = lit ? city.tint + "88" : "rgba(30,26,38,0.85)";
          ctx.fillRect(px + 2.5, wy, Math.max(1.5, (tw - 4) / cols - 3), 4);
        }
      }
      // setback ledge cap
      ctx.fillStyle = stoneL;
      ctx.fillRect(x0 - 1.5, yTop - 2.5, tw + 3, 3);
      ctx.fillStyle = stoneD;
      ctx.fillRect(x0 - 1.5, yTop + 0.5, tw + 3, 1);
    }
    // entrance canopy + flagpoles on the base
    ctx.fillStyle = stoneD;
    ctx.fillRect(cx - b.w * 0.16, GROUND - 20, b.w * 0.32, 20);
    ctx.fillStyle = "#c9b06a";
    ctx.fillRect(cx - b.w * 0.14, GROUND - 21, b.w * 0.28, 3);
    if (stage < 2) {

      ctx.fillStyle = i % 2 ? iron : ironL;
      ctx.beginPath();
      ctx.moveTo(cx - hw(f0), GROUND - b.h * f0);
      ctx.lineTo(cx + hw(f0), GROUND - b.h * f0);
      ctx.lineTo(cx + hw(f1), GROUND - b.h * f1);
      ctx.lineTo(cx - hw(f1), GROUND - b.h * f1);
      ctx.closePath(); ctx.fill();
    }
    // criss-cross lattice etched over the body
    ctx.strokeStyle = "rgba(50,38,28,0.5)"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 13; i++) {
      const f0 = legTop + (bodyTop - legTop) * (i / 13);
      const f1 = legTop + (bodyTop - legTop) * ((i + 1) / 13);
      ctx.moveTo(cx - hw(f0), GROUND - b.h * f0); ctx.lineTo(cx + hw(f1), GROUND - b.h * f1);
      ctx.moveTo(cx + hw(f0), GROUND - b.h * f0); ctx.lineTo(cx - hw(f1), GROUND - b.h * f1);
    }
    ctx.stroke();
    ctx.fillStyle = "rgba(20,14,10,0.22)";                          // shaded right side
    ctx.beginPath();
    ctx.moveTo(cx + hw(legTop) * 0.3, GROUND - b.h * legTop);
    ctx.lineTo(cx + hw(legTop), GROUND - b.h * legTop);
    ctx.lineTo(cx + hw(bodyTop), GROUND - b.h * bodyTop);
    ctx.lineTo(cx + hw(bodyTop) * 0.3, GROUND - b.h * bodyTop);

  } else if (lm === "skytree") {

    const hw = f => {

      const y0 = GROUND - b.h * f0, y1 = GROUND - b.h * f1;

      ctx.beginPath();
      ctx.moveTo(cx - hw(f0), y0); ctx.lineTo(cx + hw(f0), y0);
      ctx.lineTo(cx + hw(f1), y1); ctx.lineTo(cx - hw(f1), y1);

  } else if (lm === "tokyostation") {

      const now = new Date();

  } else if (lm === "stpauls") {
    // St Paul's Cathedral: pedimented portico, drum colonnade, lead dome, lantern

    ctx.fillRect(b.x + b.w * 0.8, bodyY, b.w * 0.2, GROUND - bodyY);

      ctx.fillStyle = "rgba(255,225,165,0.65)";
      for (let wx2 = b.x + 12; wx2 < b.x + b.w - 14; wx2 += 15) ctx.fillRect(wx2, vy - b.h * 0.24, 8, 12);
    }
    // corner + central towers
    for (const fx2 of stage >= 2 ? [0] : [-0.42, 0, 0.42]) {
      const tx = cx + b.w * fx2, tw2 = fx2 === 0 ? 30 : 22;
      ctx.fillStyle = cream;
      ctx.fillRect(tx - tw2 / 2, GROUND - b.h * (fx2 === 0 ? 0.92 : 0.82), tw2, b.h * 0.3);
      ctx.fillStyle = roofC;
      ctx.beginPath();
      ctx.moveTo(tx - tw2 / 2 - 4, GROUND - b.h * (fx2 === 0 ? 0.92 : 0.82));
      ctx.lineTo(tx, GROUND - b.h * (fx2 === 0 ? 1.04 : 0.93));
      ctx.lineTo(tx + tw2 / 2 + 4, GROUND - b.h * (fx2 === 0 ? 0.92 : 0.82));
      ctx.closePath(); ctx.fill();
      if (stage < 1 && fx2 === 0) {                                   // flagpole
        ctx.fillStyle = "#c9b06a";
        ctx.fillRect(tx - 0.8, GROUND - b.h * 1.16, 1.6, 12);
        ctx.fillStyle = "#c04030";
        ctx.fillRect(tx + 1, GROUND - b.h * 1.16, 10, 6);
      }
    }

  } else if (lm === "royalhawaiian") {
    // The Royal Hawaiian: the "Pink Palace" — Spanish-Moorish resort behind palms
    const pink = "#e79ab0", pinkD = "#c47a90", pinkL = "#f2b8c8", roofC = "#a8503c";
    ctx.fillStyle = pink;
    ctx.fillRect(b.x, GROUND - b.h * 0.62, b.w, b.h * 0.62);
    ctx.fillStyle = "rgba(60,20,32,0.16)";
    ctx.fillRect(b.x + b.w * 0.85, GROUND - b.h * 0.62, b.w * 0.15, b.h * 0.62);
    ctx.fillStyle = roofC;                                            // pantile eaves
    ctx.fillRect(b.x - 5, GROUND - b.h * 0.64, b.w + 10, 6);
    ctx.strokeStyle = "rgba(120,50,36,0.6)";
    ctx.beginPath();
    for (let rx = b.x - 3; rx < b.x + b.w + 5; rx += 5) { ctx.moveTo(rx, GROUND - b.h * 0.64); ctx.lineTo(rx, GROUND - b.h * 0.64 + 6); }
    ctx.stroke();
    ctx.fillStyle = pinkL;                                            // arcaded ground floor
    ctx.fillRect(b.x, GROUND - 26, b.w, 26);
    ctx.fillStyle = "rgba(70,30,40,0.75)";
    for (let ax = b.x + 8; ax < b.x + b.w - 12; ax += 18) {
      ctx.beginPath();
      ctx.moveTo(ax, GROUND); ctx.lineTo(ax, GROUND - 14);
      ctx.quadraticCurveTo(ax + 5, GROUND - 22, ax + 10, GROUND - 14);
      ctx.lineTo(ax + 10, GROUND);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,235,190,0.75)";                         // guest windows
    for (let wy = GROUND - b.h * 0.56; wy < GROUND - 34; wy += 16)
      for (let wx2 = b.x + 9; wx2 < b.x + b.w - 12; wx2 += 15) {
        ctx.fillRect(wx2, wy, 8, 10);
        ctx.fillStyle = pinkD; ctx.fillRect(wx2 - 2, wy + 10, 12, 2);
        ctx.fillStyle = "rgba(255,235,190,0.75)";
      }
    // stepped central tower
    if (stage < 2) {
      ctx.fillStyle = pink;
      ctx.fillRect(cx - b.w * 0.17, GROUND - b.h * 0.84, b.w * 0.34, b.h * 0.24);
      ctx.fillStyle = roofC;
      ctx.beginPath();
      ctx.moveTo(cx - b.w * 0.2, GROUND - b.h * 0.84);
      ctx.lineTo(cx, GROUND - b.h * 0.98);
      ctx.lineTo(cx + b.w * 0.2, GROUND - b.h * 0.84);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,235,190,0.8)";
      ctx.fillRect(cx - 10, GROUND - b.h * 0.78, 8, 11);
      ctx.fillRect(cx + 3, GROUND - b.h * 0.78, 8, 11);
    }
    // coconut palms in front
    if (stage < 1) {
      for (const s2 of [-1, 1]) {
        const px = cx + s2 * b.w * 0.42;
        ctx.strokeStyle = "#8a6a48"; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px, GROUND); ctx.quadraticCurveTo(px + s2 * 5, GROUND - 26, px + s2 * 3, GROUND - 46);
        ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillStyle = "#3f7a48";
        for (let f = 0; f < 5; f++) {
          const a2 = Math.PI + (f / 4) * Math.PI;
          ctx.beginPath();
          ctx.ellipse(px + s2 * 3 + Math.cos(a2) * 12, GROUND - 46 + Math.sin(a2) * 7, 13, 4, a2, 0, 7);
          ctx.fill();
        }
      }
    }

  } else if (lm === "arizona") {
    // USS Arizona Memorial: the sagging white span straddling the sunken hull
    ctx.fillStyle = "rgba(46,86,120,0.55)";                           // harbour
    ctx.fillRect(b.x - 30, GROUND - 14, b.w + 60, 15);
    ctx.fillStyle = "rgba(70,60,50,0.5)";                             // the hull below the surface
    ctx.fillRect(b.x + 10, GROUND - 12, b.w - 20, 8);
    ctx.fillStyle = "rgba(200,190,160,0.25)";                         // oil sheen
    ctx.beginPath();
    ctx.ellipse(cx + Math.sin(performance.now() / 3000) * 14, GROUND - 12, 40, 4, 0, 0, 7);
    ctx.fill();
    const white = "#f2f4f2", whiteD = "#cdd2cf";
    const topF = stage >= 2 ? 0.5 : 0.85;
    // the memorial's sagging curve
    ctx.fillStyle = white;
    ctx.beginPath();
    ctx.moveTo(b.x + 6, GROUND - b.h * topF);
    ctx.quadraticCurveTo(cx, GROUND - b.h * (topF - 0.42), b.x + b.w - 6, GROUND - b.h * topF);
    ctx.lineTo(b.x + b.w - 6, GROUND - b.h * (topF - 0.16));
    ctx.quadraticCurveTo(cx, GROUND - b.h * (topF - 0.58), b.x + 6, GROUND - b.h * (topF - 0.16));
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = whiteD;                                           // open bays punched along it
    for (let i = 0; i < 7; i++) {
      const t2 = (i + 0.5) / 7, px = b.x + 10 + (b.w - 20) * t2;
      const py = GROUND - b.h * topF + Math.sin(t2 * Math.PI) * b.h * 0.34;
      ctx.fillRect(px - 4, py - 9, 8, 11);
    }
    ctx.fillStyle = white;                                            // end pylons
    ctx.fillRect(b.x + 2, GROUND - b.h * topF, 12, b.h * (topF - 0.1));
    ctx.fillRect(b.x + b.w - 14, GROUND - b.h * topF, 12, b.h * (topF - 0.1));
    if (stage < 1) {                                                  // flagpole rising from the wreck
      ctx.fillStyle = "#c8ccd4";
      ctx.fillRect(cx - 1, GROUND - b.h * 1.15, 2, b.h * 0.55);
      ctx.fillStyle = "#c04030";
      ctx.fillRect(cx + 1, GROUND - b.h * 1.15, 14, 8);
      ctx.fillStyle = "#e8e8f0";
      ctx.fillRect(cx + 1, GROUND - b.h * 1.11, 14, 2);
    }

  } else if (lm === "ostankino") {
    // Ostankino Tower: concrete needle on flying buttresses with a ringed restaurant
    const conc = "#cdc7bb", concD = "#a49d90";
    const hw4 = f => b.w * (0.42 - 0.34 * Math.pow(f, 0.55));
    const cut = stage >= 2 ? 0.6 : 0.88;
    ctx.fillStyle = concD;                             // ten splayed feet
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * b.w * 0.42, GROUND);
      ctx.lineTo(cx + i * b.w * 0.42 + 6, GROUND);
      ctx.lineTo(cx + i * b.w * 0.1, GROUND - b.h * 0.14);
      ctx.lineTo(cx + i * b.w * 0.1 - 5, GROUND - b.h * 0.14);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = conc;                              // tapered shaft
    ctx.beginPath();
    for (let f = 0.1; f <= cut; f += 0.04) ctx.lineTo(cx - hw4(f), GROUND - b.h * f);
    for (let f = cut; f >= 0.1; f -= 0.04) ctx.lineTo(cx + hw4(f), GROUND - b.h * f);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(20,16,26,0.16)";
    ctx.beginPath();
    for (let f = 0.1; f <= cut; f += 0.04) ctx.lineTo(cx + hw4(f) * 0.35, GROUND - b.h * f);
    for (let f = cut; f >= 0.1; f -= 0.04) ctx.lineTo(cx + hw4(f), GROUND - b.h * f);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.2)";         // vertical rib lines
    for (const k2 of [-0.5, 0, 0.5]) {
      ctx.beginPath();
      for (let f = 0.1; f <= cut; f += 0.06) ctx.lineTo(cx + hw4(f) * k2, GROUND - b.h * f);
      ctx.stroke();
    }
    // the ringed observation deck / restaurant
    const dY = GROUND - b.h * 0.52, dW = hw4(0.52) + b.w * 0.26;
    ctx.fillStyle = conc;
    ctx.fillRect(cx - dW, dY - 16, dW * 2, 16);
    ctx.fillStyle = CITIES[cityIdx].time === "night" ? "#ffe08a" : "#8ba0b4";
    ctx.fillRect(cx - dW * 0.9, dY - 13, dW * 1.8, 6);
    ctx.fillStyle = concD;
    ctx.fillRect(cx - dW * 1.06, dY - 18, dW * 2.12, 3);
    if (stage < 1) {                                   // steel antenna mast
      ctx.strokeStyle = "#b8bcc4"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, GROUND - b.h * 0.88); ctx.lineTo(cx, top - 6); ctx.stroke();
      ctx.strokeStyle = "#9aa0aa"; ctx.lineWidth = 1.5;
      for (let i = 1; i < 5; i++) {
        const yy = GROUND - b.h * (0.88 + 0.12 * (i / 5));
        ctx.beginPath(); ctx.moveTo(cx - 5 + i, yy); ctx.lineTo(cx + 5 - i, yy); ctx.stroke();
      }
      ctx.lineWidth = 1;
      if (blink) { ctx.fillStyle = "#ff5555"; ctx.beginPath(); ctx.arc(cx, top - 9, 2.5, 0, 7); ctx.fill(); }
    }
  }
  ctx.restore();

  // damage bar, so a long demolition reads as progress rather than nothing happening
  if (b.hp < b.maxHp) {
    const bw2 = Math.min(120, Math.max(56, b.w));
    const bx2 = Math.max(camX + 8, Math.min(camX + W - bw2 - 8, cx - bw2 / 2));
    const by2 = Math.max(108, top - 34);
    ctx.fillStyle = "rgba(6,8,16,0.75)";
    ctx.fillRect(bx2 - 1, by2 - 1, bw2 + 2, 6);
    const f2 = Math.max(0, b.hp / b.maxHp);
    ctx.fillStyle = f2 > 0.6 ? cbGood() : f2 > 0.3 ? "#ffcc44" : cbBad();
    ctx.fillRect(bx2, by2, bw2 * f2, 4);
    ctx.strokeStyle = "rgba(255,221,68,0.5)";
    ctx.strokeRect(bx2 - 1, by2 - 1, bw2 + 2, 6);
  }
  // landmark name plate — kept clear of the HUD and inside the frame
  ctx.textAlign = "center";
  ctx.font = "9px monospace";
  const plate = (b.lmName || city.landmarkName).toUpperCase();
  const pw = ctx.measureText(plate).width;
  const px3 = Math.max(camX + pw / 2 + 8, Math.min(camX + W - pw / 2 - 8, cx));
  const py3 = Math.max(96, top - 46);          // never rides up into the top bar
  ctx.fillStyle = "rgba(6,8,16,0.6)";
  ctx.fillRect(px3 - pw / 2 - 4, py3 - 9, pw + 8, 12);
  ctx.fillStyle = "rgba(255,221,68,0.92)";
  ctx.fillText(plate, px3, py3);
}

function drawKaiju() {
  const k = kaiju;
  drawKaijuModel(k.type, k.x, GROUND, k.facing, {
    walk: k.walk, swipeT: k.swipeT, stompT: k.stompT,
    swipeKind: k.swipeKind || 1,
    breathing: k.breathT > 0 || k.whirlT > 0 || k.dashT > 0,
    hurt: k.hurtT > 0 && Math.floor(performance.now() / 60) % 2,
    rage: k.rage, scale: 1,
    whirl: k.whirlT > 0, dash: k.dashT > 0
  });

  // helicopter or rubble chunk clutched overhead
  if (k.held) {
    const hx = k.x + k.facing * 14;
    const hy = GROUND - k.h - 14 + Math.sin(performance.now() / 120) * 2;
    if (k.held === "heli") {
      ctx.fillStyle = "#4a5a6a";
      ctx.beginPath(); ctx.ellipse(hx, hy, 16, 8, 0.2 * k.facing, 0, 7); ctx.fill();
      const r = Math.sin(performance.now() / 45) * 16;
      ctx.strokeStyle = "rgba(200,210,220,0.7)";
      ctx.beginPath(); ctx.moveTo(hx - r, hy - 10); ctx.lineTo(hx + r, hy - 10); ctx.stroke();
    } else {
      // jagged concrete slab
      ctx.fillStyle = "#8a7a60";
      ctx.beginPath();
      ctx.moveTo(hx - 15, hy + 6); ctx.lineTo(hx - 9, hy - 8); ctx.lineTo(hx + 3, hy - 10);
      ctx.lineTo(hx + 14, hy - 2); ctx.lineTo(hx + 10, hy + 7);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#5a4e3c";
      ctx.beginPath(); ctx.moveTo(hx - 6, hy - 6); ctx.lineTo(hx + 2, hy + 3); ctx.stroke();
    }
    ctx.fillStyle = "#aaddff";
    ctx.font = "9px monospace"; ctx.textAlign = "center";
    ctx.fillText("press again to hurl", k.x, hy - 20);
  }

  // ultimate aura
  if (k.ultT > 0) {
    const pr = 1 - k.ultT / 1.6;
    ctx.strokeStyle = k.type.beam;
    ctx.globalAlpha = 0.6 - pr * 0.4;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(k.x, GROUND - k.h / 2, 80 + pr * 120 + Math.sin(performance.now() / 50) * 8, 0, 7); ctx.stroke();
    ctx.lineWidth = 1; ctx.globalAlpha = 1;
  }

  // atomic breath beam (beam kaiju only)
  if (k.type.special === "beam" && k.breathT > 0) {
    const f = k.facing, walkBob = Math.sin(k.walk * 2) * 3;
    const bx = k.x + f * 46, by = GROUND - 108 + walkBob;
    const grad = ctx.createLinearGradient(bx, by, bx + f * 380, by + 380 * 0.28);
    grad.addColorStop(0, "rgba(150,240,255,0.95)");
    grad.addColorStop(1, "rgba(80,180,255,0)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 10 + Math.sin(performance.now() / 40) * 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + f * 380, by + 380 * 0.28);
    ctx.stroke();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + f * 380, by + 380 * 0.28);
    ctx.stroke();
    ctx.lineWidth = 1;
  }
}

// Kaiju model dispatcher — four distinct body plans.
// Origin = feet on ground at (x, gy). Total height ~130px at scale 1.
function drawKaijuModel(t, x, gy, f, o) {
  ctx.save();
  const walkBob = Math.sin((o.walk || 0) * 2) * 3;
  ctx.translate(x, gy + walkBob);
  // ground contact shadow (drawn before flip so it stays put)
  ctx.fillStyle = "rgba(0,0,0,0.32)";
  ctx.beginPath(); ctx.ellipse(0, -walkBob + 2, 54 * (o.scale || 1), 7, 0, 0, 7); ctx.fill();
  ctx.scale(f * (o.scale || 1), o.scale || 1);
  if (o.whirl) ctx.rotate(Math.sin(performance.now() / 60) * 0.12);
  const tailSweep = o.swipeT > 0 && o.swipeKind === 3;
  if (tailSweep) ctx.rotate(Math.sin(o.swipeT * 10) * 0.1); // body twists into the sweep

  const body = o.hurt ? "#ff8888" : t.body;
  const belly = o.hurt ? "#ffaaaa" : t.belly;
  const spineC = o.hurt ? "#ffcccc" : t.spines;
  const charged = (o.rage || 0) > 30 && Math.floor(performance.now() / 200) % 2;

  // rage aura glow behind the body
  if ((o.rage || 0) >= 100) {
    ctx.fillStyle = t.beam;
    ctx.globalAlpha = 0.12 + Math.sin(performance.now() / 120) * 0.06;
    ctx.beginPath(); ctx.ellipse(0, -65, 70, 78, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // (the old blurred self-shadow cost a Gaussian pass on EVERY body path —
  //  ruinous on mobile GPUs; the ground contact shadow carries the depth cue)

  if (t.feature === "cracks") drawVolkanorBody(t, o, body, belly, spineC, charged);
  else if (t.feature === "wings") drawZephyraxBody(t, o, body, belly, spineC, charged);
  else if (t.feature === "tentacles") drawKrakenothBody(t, o, body, belly, spineC, charged);
  else if (t.feature === "mech") drawMekagoraBody(t, o, body, belly, spineC, charged);
  else if (t.feature === "blob") drawGloopthraxBody(t, o, body, belly, spineC, charged);
  else drawGorgonaxBody(t, o, body, belly, spineC, charged, tailSweep);

  ctx.restore();
}

// ---- GORGONAX: classic upright theropod with dorsal plates ----
function drawGorgonaxBody(t, o, body, belly, spineC, charged, tailSweep) {

  // --- tail: tapered segments sprouting from hips ---
  const tailSwing = tailSweep ? Math.sin(o.swipeT * 10) * 1.25
                  : o.swipeT > 0 ? Math.sin(o.swipeT * 20) * 0.4
                  : Math.sin(performance.now() / 500) * 0.1;
  const tp = [
    [-14, -42],
    [-44, -36 + tailSwing * 22],
    [-72, -25 + tailSwing * 44],
    [-100, -10 + tailSwing * 62]
  ];
  ctx.lineCap = "round";
  const tws = [14, 10, 6];
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = shade(body, -6 * i);
    ctx.lineWidth = tws[i];
    ctx.beginPath();
    ctx.moveTo(tp[i][0], tp[i][1]);
    ctx.lineTo(tp[i + 1][0], tp[i + 1][1]);
    ctx.stroke();
  }
  // small spines along the tail ridge
  ctx.fillStyle = spineC;
  for (let i = 1; i < 3; i++) {
    const [sx2, sy2] = tp[i];
    ctx.beginPath();
    ctx.moveTo(sx2 - 4, sy2 - tws[i] / 2);
    ctx.lineTo(sx2, sy2 - tws[i] / 2 - 6);
    ctx.lineTo(sx2 + 4, sy2 - tws[i] / 2);
    ctx.closePath(); ctx.fill();
  }
  // tail tip spade
  const ttx = tp[3][0], tty = tp[3][1];
  ctx.beginPath(); ctx.moveTo(ttx + 7, tty - 7); ctx.lineTo(ttx - 12, tty); ctx.lineTo(ttx + 7, tty + 7); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1;

  // --- rear leg (behind body, darker) ---
  const legA = Math.sin((o.walk || 0) * 2) * 7;
  const stompDip = o.stompT > 0.55 ? 8 : 0;
  ctx.fillStyle = shade(body, -20);
  drawLeg(-2 - legA * 0.5, stompDip);

  // --- torso: hips (-45) up to shoulders (-95), leaning slightly forward ---
  const breathe = Math.sin(performance.now() / 600) * 1.5; // subtle chest rise
  const tg = ctx.createLinearGradient(-26, 0, 26, 0);
  tg.addColorStop(0, shade(body, -30));
  tg.addColorStop(0.55, body);
  tg.addColorStop(1, shade(body, 18));
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(-20, -40);                              // rear hip
  ctx.quadraticCurveTo(-26, -75, -12, -98);          // back line (spine side)
  ctx.quadraticCurveTo(0, -110, 14, -102);           // shoulder hump
  ctx.quadraticCurveTo(26 + breathe, -80, 20, -52);  // chest down to belly
  ctx.quadraticCurveTo(14, -38, -4, -36);            // groin
  ctx.closePath(); ctx.fill();
  // belly plates
  ctx.fillStyle = belly;
  ctx.beginPath();
  ctx.moveTo(16, -95);
  ctx.quadraticCurveTo(24, -74, 17, -50);
  ctx.quadraticCurveTo(12, -42, 4, -40);
  ctx.quadraticCurveTo(12, -68, 10, -92);
  ctx.closePath(); ctx.fill();
  // belly segment lines
  ctx.strokeStyle = shade(belly, -25);
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(6 + i * 0.8, -48 - i * 10);
    ctx.quadraticCurveTo(14, -50 - i * 10, 19 - i * 0.6, -52 - i * 10);
    ctx.stroke();
  }
  // scale texture: staggered crescent rows across the flank
  ctx.strokeStyle = "rgba(0,0,0,0.14)";
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 4; col++) {
      const sx3 = -16 + col * 8 + (row % 2) * 4;
      const sy3 = -50 - row * 11;
      ctx.beginPath();
      ctx.arc(sx3, sy3, 3.5, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
  }

  // --- front leg ---
  ctx.fillStyle = body;
  drawLeg(8 + legA * 0.5, 0);

  // --- arm: hangs from shoulder (front); anim differs per combo hit ---
  let armAng = 0.55;
  if (o.swipeT > 0) {
    if (o.swipeKind === 2)      armAng = 0.9 - (0.42 - o.swipeT) * 7.5;   // rising backhand (sweeps up)
    else if (o.swipeKind === 3) armAng = 0.3 + Math.sin(o.swipeT * 10) * 0.8; // flails during tail spin
    else                        armAng = -1.4 + (0.38 - o.swipeT) * 7;    // downward claw slash
  }
  // motion arc trail while swiping
  if (o.swipeT > 0.1 && o.swipeKind !== 3) {
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(8, -92, 38, armAng - 0.6, armAng + 0.25);
    ctx.stroke(); ctx.lineWidth = 1;
  }
  ctx.save();
  ctx.translate(8, -92);                     // shoulder joint
  ctx.rotate(armAng);
  // upper arm + forearm + claws
  ctx.fillStyle = body;
  ctx.fillRect(0, -4, 18, 9);              // upper arm
  ctx.fillRect(16, -3, 16, 8);             // forearm
  ctx.fillStyle = spineC;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(31, -3 + i * 4);
    ctx.lineTo(39, -1 + i * 4);
    ctx.lineTo(31, 1 + i * 4);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // --- neck + head: neck rises from shoulders, head faces forward ---
  ctx.fillStyle = body;
  ctx.beginPath();                            // neck
  ctx.moveTo(2, -100);
  ctx.quadraticCurveTo(8, -112, 16, -116);
  ctx.lineTo(22, -106);
  ctx.quadraticCurveTo(14, -100, 10, -96);
  ctx.closePath(); ctx.fill();
  // skull
  ctx.beginPath();
  ctx.ellipse(22, -118, 13, 9, 0.15, 0, 7);
  ctx.fill();
  // snout + jaws (hinge at back of snout)
  const jawOpen = o.breathing ? 0.38 : 0.06;
  ctx.save();
  ctx.translate(30, -118);
  ctx.rotate(-jawOpen * 0.4);
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(0, -5); ctx.lineTo(20, -3); ctx.lineTo(19, 1); ctx.lineTo(0, 1);
  ctx.closePath(); ctx.fill();               // upper jaw
  ctx.restore();
  ctx.save();
  ctx.translate(30, -116);
  ctx.rotate(jawOpen);
  ctx.fillStyle = shade(body, -15);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(17, 2); ctx.lineTo(16, 6); ctx.lineTo(0, 5);
  ctx.closePath(); ctx.fill();               // lower jaw
  // teeth
  ctx.fillStyle = "#e8e4d0";
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(3 + i * 4, 1); ctx.lineTo(4.5 + i * 4, -2); ctx.lineTo(6 + i * 4, 1);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // mouth glow when breathing
  if (o.breathing) {
    ctx.fillStyle = t.beam;
    ctx.beginPath(); ctx.arc(40, -115, 4 + Math.random() * 2, 0, 7); ctx.fill();
  }
  // nostril on the snout
  ctx.fillStyle = shade(body, -40);
  ctx.beginPath(); ctx.arc(44, -121, 1.5, 0, 7); ctx.fill();
  // eye with pupil
  ctx.fillStyle = o.breathing ? t.beam : "#ffcc33";
  ctx.fillRect(24, -124, 5, 4);
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(26, -123, 2, 2);
  // brow ridge + small horn behind the skull
  ctx.fillStyle = shade(body, -25);
  ctx.fillRect(21, -127, 10, 3);
  ctx.beginPath();
  ctx.moveTo(14, -124); ctx.lineTo(9, -132); ctx.lineTo(18, -126);
  ctx.closePath(); ctx.fill();

  // --- dorsal spines: along the BACK edge (rear contour), biggest mid-back ---
  ctx.fillStyle = charged ? "#ffffff" : spineC;
  const spinePath = [[-16, -50], [-20, -66], [-20, -82], [-14, -96], [-4, -106]];
  spinePath.forEach(([sx, sy], i) => {
    const s = [8, 11, 12, 10, 7][i];
    ctx.beginPath();
    ctx.moveTo(sx - s * 0.7, sy + 3);
    ctx.lineTo(sx - s * 0.1, sy - s);
    ctx.lineTo(sx + s * 0.5, sy + 2);
    ctx.closePath(); ctx.fill();
  });

  function drawLeg(hipX, dip) {
    // thigh from hip (-42) to knee (-22), shin to foot (0)
    ctx.beginPath();
    ctx.moveTo(hipX - 8, -46);
    ctx.quadraticCurveTo(hipX + 10, -34, hipX + 4, -20 + dip);   // thigh (bends forward)
    ctx.lineTo(hipX + 12, -20 + dip);
    ctx.quadraticCurveTo(hipX + 10, -8, hipX + 8, dip);          // shin
    ctx.lineTo(hipX - 6, dip);
    ctx.quadraticCurveTo(hipX - 10, -24, hipX - 8, -46);
    ctx.closePath(); ctx.fill();
    const fc = ctx.fillStyle;
    // thigh muscle highlight
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.ellipse(hipX, -34, 6, 10, 0.25, 0, 7);
    ctx.fill();
    // foot
    ctx.fillStyle = fc;
    ctx.fillRect(hipX - 6, -5 + dip, 20, 5);
    // two toe claws
    ctx.fillStyle = "#e8e4d0";
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.moveTo(hipX + 10 + i * 6, -4 + dip);
      ctx.lineTo(hipX + 17 + i * 6, -2 + dip);
      ctx.lineTo(hipX + 10 + i * 6, dip);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = fc;
  }
}

// ---- VOLKANOR: hulking magma brute — armoured bull-ape with a volcanic back ----
function drawVolkanorBody(t, o, body, belly, spineC, charged) {
  const now = performance.now();
  const legA = Math.sin((o.walk || 0) * 2) * 5;
  const stompDip = o.stompT > 0.55 ? 10 : 0;
  const glow = o.hurt ? "#ffdddd" : charged ? "#ffee66" : "#ff7a2a";
  const dark = shade(body, -26), darker = shade(body, -42), lightB = shade(body, 16);
  const breathe = o.breathing ? Math.sin(now / 150) * 1.6 : 0;

  // ---------- layer 1: far limbs, pushed back in shade ----------
  const drawLimbFar = (col) => {
    ctx.fillStyle = col;
    // far leg
    ctx.beginPath();
    ctx.moveTo(-16, -54);
    ctx.quadraticCurveTo(-30, -34, -24, -legA);
    ctx.lineTo(-4, -legA);
    ctx.quadraticCurveTo(-2, -34, 2, -54);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(-28, -6 - legA, 26, 6);
    // far arm hanging behind the chest
    ctx.beginPath();
    ctx.moveTo(-4, -96);
    ctx.quadraticCurveTo(-22, -74, -18, -44);
    ctx.lineTo(-2, -42);
    ctx.quadraticCurveTo(-4, -70, 10, -92);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(-10, -40, 9, 0, 7); ctx.fill();
  };
  drawLimbFar(darker);

  // ---------- layer 2: thick club tail ----------
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(-14, -62);
  ctx.quadraticCurveTo(-46, -56, -62, -30);
  ctx.quadraticCurveTo(-70, -18, -62, -12);
  ctx.quadraticCurveTo(-48, -26, -30, -40);
  ctx.quadraticCurveTo(-18, -48, -12, -50);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = darker;                                  // rocky club tip
  ctx.beginPath(); ctx.arc(-62, -20, 11, 0, 7); ctx.fill();
  ctx.fillStyle = glow;
  for (const [gx, gy] of [[-66, -24], [-58, -14], [-64, -13]])
    { ctx.beginPath(); ctx.arc(gx, gy, 1.8, 0, 7); ctx.fill(); }

  // ---------- layer 3: torso — heavy barrel chest hunched over the hips ----------
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-18, -50);                                    // hip, rear
  ctx.quadraticCurveTo(-26, -78, -18, -100);               // back rises
  ctx.quadraticCurveTo(-8, -118 - breathe, 12, -116 - breathe); // shoulder hump
  ctx.quadraticCurveTo(28, -112, 30, -92);                 // chest front
  ctx.quadraticCurveTo(32, -70, 24, -52);                  // belly
  ctx.quadraticCurveTo(4, -44, -18, -50);
  ctx.closePath(); ctx.fill();
  // lit top / shaded underside for volume
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  ctx.beginPath();
  ctx.moveTo(-18, -100);
  ctx.quadraticCurveTo(-8, -118 - breathe, 12, -116 - breathe);
  ctx.quadraticCurveTo(6, -104, -14, -96);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(0,0,20,0.18)";
  ctx.beginPath();
  ctx.moveTo(-18, -50); ctx.quadraticCurveTo(4, -44, 24, -52);
  ctx.quadraticCurveTo(6, -58, -16, -58);
  ctx.closePath(); ctx.fill();
  // pale armour plating across the belly
  ctx.fillStyle = belly;
  ctx.beginPath();
  ctx.moveTo(20, -104); ctx.quadraticCurveTo(32, -84, 22, -54);
  ctx.quadraticCurveTo(10, -50, 6, -56);
  ctx.quadraticCurveTo(14, -80, 12, -102);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(belly, -28); ctx.lineWidth = 1.2;
  for (let i = 0; i < 5; i++) {
    const yy = -60 - i * 10;

  }
  ctx.lineWidth = 1;
  // magma fissures webbing the hide
  ctx.strokeStyle = glow; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-14, -60); ctx.lineTo(-4, -74); ctx.lineTo(-10, -88); ctx.lineTo(0, -100);
  ctx.moveTo(-4, -74); ctx.lineTo(8, -80);
  ctx.moveTo(-10, -88); ctx.lineTo(-20, -92);
  ctx.stroke(); ctx.lineWidth = 1;
  // white-hot core burning in the chest
  const coreR = 9 + (charged ? Math.sin(now / 100) * 2 : 0);
  const cg = ctx.createRadialGradient(16, -88, 1, 16, -88, coreR * 1.8);
  cg.addColorStop(0, "#fff3c0"); cg.addColorStop(0.4, glow); cg.addColorStop(1, "rgba(255,90,20,0)");
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(16, -88, coreR * 1.8, 0, 7); ctx.fill();

  // ---------- layer 4: volcanic vents standing proud of the back ----------
  const vents = [[-16, -98], [-4, -110], [8, -116]];
  vents.forEach(([vx, vy], i) => {
    ctx.fillStyle = darker;                                // cone fused into the back
    ctx.beginPath();
    ctx.moveTo(vx - 11, vy + 5);
    ctx.lineTo(vx - 5, vy - 11);
    ctx.lineTo(vx + 5, vy - 11);
    ctx.lineTo(vx + 11, vy + 5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#2a1a16";                             // crater mouth
    ctx.beginPath(); ctx.ellipse(vx, vy - 11, 5.5, 2.2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = charged ? "#ffe27a" : glow;            // glowing throat
    ctx.beginPath(); ctx.ellipse(vx, vy - 10.5, 3.6, 1.4, 0, 0, 7); ctx.fill();
    if (charged || o.breathing) {                          // embers spitting out
      for (let e = 0; e < 3; e++) {
        const ph = (now / 260 + i * 0.4 + e * 0.33) % 1;
        ctx.fillStyle = `rgba(255,${150 - ph * 90 | 0},40,${1 - ph})`;
        ctx.beginPath();
        ctx.arc(vx + Math.sin(ph * 6 + i) * 4, vy - 12 - ph * 26, 2.4 * (1 - ph * 0.5), 0, 7);
        ctx.fill();
      }

  });

  // ---------- layer 5: neck and head, clearly forward of the chest ----------
  const headX = 44, headY = -104;
  ctx.fillStyle = body;                                    // short powerful neck
  ctx.beginPath();
  ctx.moveTo(14, -112 - breathe);
  ctx.quadraticCurveTo(32, -116, 42, -112);
  ctx.lineTo(44, -92);
  ctx.quadraticCurveTo(30, -88, 18, -96);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = darker;                                  // neck shadow under the jaw
  ctx.beginPath();
  ctx.moveTo(18, -96); ctx.quadraticCurveTo(30, -88, 44, -92);
  ctx.lineTo(44, -96); ctx.quadraticCurveTo(30, -93, 20, -100);
  ctx.closePath(); ctx.fill();
  // skull: blunt bull wedge
  ctx.fillStyle = lightB;
  ctx.beginPath();
  ctx.moveTo(30, -116);
  ctx.quadraticCurveTo(52, -122, 66, -112);                // brow ridge sweeping forward
  ctx.lineTo(74, -102);
  ctx.quadraticCurveTo(72, -96, 62, -97);                  // snout tip
  ctx.lineTo(34, -94);
  ctx.quadraticCurveTo(26, -104, 30, -116);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(0,0,20,0.16)";                     // lower half of skull in shade
  ctx.beginPath();
  ctx.moveTo(34, -100); ctx.lineTo(70, -101);
  ctx.quadraticCurveTo(72, -96, 62, -97); ctx.lineTo(34, -94);
  ctx.closePath(); ctx.fill();
  // hinged lower jaw with tusks
  const jaw = (o.breathing ? 7 : 0) + (o.swipeT > 0 ? 4 : 0);
  ctx.fillStyle = shade(body, -12);
  ctx.beginPath();
  ctx.moveTo(34, -94);
  ctx.lineTo(64, -95 + jaw * 0.4);
  ctx.quadraticCurveTo(68, -89 + jaw, 58, -87 + jaw);
  ctx.lineTo(34, -88 + jaw * 0.4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f0e6d0";                               // upward tusks
  for (const [tx2, ts] of [[56, 1], [46, 0.8]]) {
    ctx.beginPath();
    ctx.moveTo(tx2, -95 + jaw * 0.4);
    ctx.lineTo(tx2 + 3 * ts, -106 * 1 + jaw * 0.2);
    ctx.lineTo(tx2 + 7 * ts, -95 + jaw * 0.4);
    ctx.closePath(); ctx.fill();
  }
  if (o.breathing) {                                       // magma glow inside the mouth
    ctx.fillStyle = "rgba(255,140,40,0.8)";
    ctx.beginPath(); ctx.ellipse(52, -92 + jaw * 0.5, 11, 3 + jaw * 0.3, 0, 0, 7); ctx.fill();
  }
  // forward-curving horns
  ctx.fillStyle = "#e8ddc6";
  for (const [hx, hy, hs] of [[38, -116, 1], [50, -118, 0.85]]) {
    ctx.beginPath();
    ctx.moveTo(hx - 4 * hs, hy);
    ctx.quadraticCurveTo(hx + 10 * hs, hy - 16 * hs, hx + 22 * hs, hy - 8 * hs);
    ctx.quadraticCurveTo(hx + 12 * hs, hy - 8 * hs, hx + 4 * hs, hy + 1);
    ctx.closePath(); ctx.fill();
  }
  // deep-set molten eye under the brow
  ctx.fillStyle = "#1c1210";
  ctx.beginPath(); ctx.ellipse(56, -110, 6, 4, -0.15, 0, 7); ctx.fill();
  ctx.fillStyle = o.hurt ? "#ffffff" : charged ? "#fff0a0" : "#ffb03a";
  ctx.beginPath(); ctx.ellipse(57, -110, 3.4, 2.3, -0.15, 0, 7); ctx.fill();
  ctx.fillStyle = "#2a1408";
  ctx.beginPath(); ctx.ellipse(58, -110, 1.2, 2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,150,60,0.25)";                 // eye glow
  ctx.beginPath(); ctx.arc(57, -110, 8, 0, 7); ctx.fill();

  // ---------- layer 6: near leg ----------
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-2, -56);
  ctx.quadraticCurveTo(-14, -34, -8, legA - stompDip * 0.2);
  ctx.lineTo(18, legA - stompDip * 0.2);
  ctx.quadraticCurveTo(22, -34, 20, -56);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.09)";                // thigh mass highlight
  ctx.beginPath(); ctx.ellipse(6, -42, 9, 12, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = glow; ctx.lineWidth = 1.6;             // fissure down the shin
  ctx.beginPath(); ctx.moveTo(2, -46); ctx.lineTo(8, -30); ctx.lineTo(2, -16); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.fillStyle = darker;                                  // broad rocky foot
  ctx.fillRect(-12, -8 + legA * 0.2, 38, 8);
  ctx.fillStyle = "#e8ddc6";
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(16 + i * 6, -7 + legA * 0.2);

  // ---------- layer 7: near arm — huge, in front of everything ----------
  const swing = o.swipeT > 0 ? (o.swipeKind === 2 ? -1.9 : o.swipeKind === 3 ? 1.2 : 1.7) * Math.sin(Math.min(1, o.swipeT) * Math.PI) : 0;
  ctx.save();
  // shoulder low and forward so the knuckles drag by the hip and the head stays clear
  ctx.translate(16, -92);

  ctx.fillStyle = lightB;
  ctx.beginPath();                                         // boulder shoulder
  ctx.arc(0, 0, 16, 0, 7); ctx.fill();
  ctx.fillStyle = body;
  ctx.beginPath();                                         // upper arm → forearm
  ctx.moveTo(-10, -6);
  ctx.quadraticCurveTo(16, -14, 34, -8);
  ctx.quadraticCurveTo(50, -2, 54, 6);
  ctx.quadraticCurveTo(44, 18, 26, 14);
  ctx.quadraticCurveTo(8, 12, -8, 10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = darker;                                  // massive fist
  ctx.beginPath(); ctx.arc(54, 6, 14, 0, 7); ctx.fill();
  ctx.fillStyle = "#e8ddc6";                               // knuckle claws
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(60, -4 + i * 7);

    ctx.lineTo(60, 2 + i * 7);

  ctx.beginPath(); ctx.ellipse(16, -4, 14, 6, 0.05, 0, 7); ctx.fill();

  ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(18, -4); ctx.lineTo(34, 4); ctx.lineTo(48, 0); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.restore();
}

// ---- GLOOPTHRAX: a translucent devouring ooze with swallowed wreckage inside ----
function drawGloopthraxBody(t, o, body, belly, spineC, charged) {
  const now = performance.now();
  const wob = now / 260;
  const squash = 1 + Math.sin((o.walk || 0) * 2) * 0.09;      // oozes forward by squashing
  const surge = o.whirl || o.breathing ? 1.1 : 1;
  const H2 = 118 * (2 - squash) * surge, W2 = 52 * squash;
  const glow = charged ? "#eaffb0" : spineC;

  // wobbling outline: radius modulated by several sine terms so it never repeats
  const rAt = (a) => {
    const n = 1 + 0.11 * Math.sin(a * 3 + wob) + 0.08 * Math.sin(a * 5 - wob * 1.7)
                + 0.05 * Math.sin(a * 8 + wob * 0.6);
    return n;
  };
  const blobPath = (sx, sy, expand) => {
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const a = (i / 40) * Math.PI * 2;
      const n = rAt(a) * expand;
      // squat teardrop: wide at the base, narrower at the crown
      const rx = W2 * n * (1 + 0.28 * Math.cos(a));
      const ry = H2 * 0.5 * n;
      const px = sx + Math.sin(a) * rx;
      const py = sy - H2 * 0.5 + Math.cos(a + Math.PI) * ry;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
