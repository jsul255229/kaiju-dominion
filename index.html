<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KAIJU DOMINION</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0a14;
    font-family: "Courier New", Courier, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #0a0a14; }
  #wrap::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.12) 3px, rgba(0,0,0,0) 4px);
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<script>
"use strict";
// ============================================================
// KAIJU DOMINION  —  v1.0
// All kaiju, mecha and military units are original designs.
// You are GORGONAX, a 90-meter ancient kaiju risen from the deep.
// Smash real cities. Fight the army. Become legend.
// One file. Keyboard / touch / gamepad.
// ============================================================

const cv = document.getElementById("cv");
let ctx = cv.getContext("2d");   // let: temporarily swapped while baking backdrop caches

// Landscape logical resolution, letterboxed to fit any screen
// Logical resolution. Height is fixed; width stretches with the screen's aspect
// ratio (800–1000) so phones and ultrawide monitors fill instead of letterboxing.
let W = 800;
const H = 450;
let scale = 1, dpr = 1;
let portrait = false;
// automatic quality governor: if real frame times sag, we shed cost in steps —
// backing-store resolution first, then particles, then decorative extras
const QUALITY = [
  { dpr: 0.62, parts: 110, shimmer: false, clouds: false },
  { dpr: 0.80, parts: 200, shimmer: false, clouds: true },
  { dpr: 1.00, parts: 300, shimmer: true,  clouds: true }
];
let qTier = 2;
let lastRz = { w: 0, cw: 0, ch: 0 };
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2) * QUALITY[qTier].dpr;
  // visualViewport tracks the *usable* area on mobile (URL bar, keyboard, safe areas)
  const vv = window.visualViewport;
  const availW = Math.max(1, Math.floor(vv ? vv.width : window.innerWidth));
  const availH = Math.max(1, Math.floor(vv ? vv.height : window.innerHeight));
  // only nag on actual touch devices held upright — a tall desktop window is fine,
  // it just letterboxes
  portrait = availH > availW * 1.05 &&
             (window.matchMedia ? window.matchMedia("(pointer: coarse)").matches : false);
  // stretch the playfield to the screen's shape before computing the fit
  W = Math.round(Math.min(1000, Math.max(800, (availW / availH) * H)));
  scale = Math.min(availW / W, availH / H);
  // iOS fires visualViewport scroll/resize storms during play — reallocating the
  // canvas backing store on every event is catastrophic. Bail out when unchanged.
  const cw2 = Math.max(1, Math.round(W * scale * dpr)), ch2 = Math.max(1, Math.round(H * scale * dpr));
  if (W === lastRz.w && cw2 === lastRz.cw && ch2 === lastRz.ch) return;
  lastRz = { w: W, cw: cw2, ch: ch2 };
  cv.style.width = (W * scale) + "px";
  cv.style.height = (H * scale) + "px";
  cv.width = Math.max(1, Math.round(W * scale * dpr));
  cv.height = Math.max(1, Math.round(H * scale * dpr));
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
  window.visualViewport.addEventListener("scroll", resize);
}
resize();

// ---- text that never overflows its box ----
// shrinks the font until the string fits, then draws it
function fitText(text, x, y, maxW, size, weight) {
  let px = size;
  ctx.font = (weight ? weight + " " : "") + px + "px monospace";
  while (px > 6 && ctx.measureText(text).width > maxW) {
    px -= 0.5;
    ctx.font = (weight ? weight + " " : "") + px + "px monospace";
  }
  ctx.fillText(text, x, y);
  return px;
}
// clips a string with an ellipsis instead of letting it run past its box
function clipText(text, maxW, size, weight) {
  ctx.font = (weight ? weight + " " : "") + size + "px monospace";
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t + "…";
}
// a consistent back affordance; returns its hit rect
let btnFlash = { r: null, t: 0 };
function flashButton(rect) { btnFlash = { r: rect, t: 0.18 }; }
function drawBackButton(label) {
  const r = { x: 16, y: 10, w: 96, h: 30 };
  ctx.fillStyle = "rgba(20,26,42,0.94)";
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = "#6a76a0"; ctx.lineWidth = 1.5;
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  ctx.lineWidth = 1;
  ctx.fillStyle = "#b6c0d6";
  ctx.font = "bold 11px monospace"; ctx.textAlign = "center";
  ctx.fillText("◀ " + (label || "BACK"), r.x + r.w / 2, r.y + 19);
  // generous invisible padding so near-misses still count
  return { x: r.x - 12, y: r.y - 10, w: r.w + 24, h: r.h + 18, dx: r.x, dy: r.y, dw: r.w, dh: r.h };
}
function inRect(p, r) { return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

// ---------- Input mode: the game follows whatever you last actually used ----------
// "key" | "touch" | "pad" — every hint in the game phrases itself accordingly
let inputMode = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ? "touch" : "key";
let inputModeT = 0;                       // shows a brief toast when it switches
function setInputMode(m) {
  if (inputMode === m) return;
  inputMode = m;
  inputModeT = 2.2;
}
const HINTS = {
  key:   { confirm: "SPACE", back: "ESC", move: "← →", pause: "P", pick: "← →",
           attack: "SPACE", stomp: "K", special: "L", roar: "R", nav: "↑ ↓" },
  touch: { confirm: "TAP", back: "TAP BACK", move: "DRAG", pause: "TAP ❚❚", pick: "SWIPE",
           attack: "CLAW", stomp: "STOMP", special: "BEAM", roar: "ROAR", nav: "TAP" },
  pad:   { confirm: "Ⓐ", back: "Ⓑ", move: "STICK", pause: "START", pick: "D-PAD",
           attack: "Ⓐ", stomp: "Ⓑ", special: "Ⓨ", roar: "LB", nav: "D-PAD" }
};
function hint(k) { return (HINTS[inputMode] || HINTS.key)[k]; }
function isTouch() { return inputMode === "touch"; }

// ---------- Audio ----------
let audioCtx = null, muted = false;
// ---------- Player options (persisted separately from game progress) ----------
let OPT = (function () {
  try {
    const o = JSON.parse(localStorage.getItem("kdOptions") || "{}");
    return { music: o.music ?? 0.8, sfx: o.sfx ?? 0.8,
             reduceFlash: !!o.reduceFlash, colorblind: !!o.colorblind, lefty: !!o.lefty };
  } catch (e) { return { music: 0.8, sfx: 0.8, reduceFlash: false, colorblind: false, lefty: false }; }
})();
function saveOptions() { try { localStorage.setItem("kdOptions", JSON.stringify(OPT)); } catch (e) {} }
// colour-vision-safe signal colours: blue/orange replaces green/red
function cbGood() { return OPT.colorblind ? "#4aa8ff" : "#66dd66"; }
function cbBad()  { return OPT.colorblind ? "#ff9a3c" : "#ff5555"; }
function cbDone() { return OPT.colorblind ? "#66bbff" : "#66ff99"; }

// during firestorms and chain collapses dozens of sounds can fire at once —
// on mobile Safari the audio thread will strangle the frame rate. Budget voices.
let voiceCount = 0, voiceWindow = 0;
function voiceOK() {
  const now = performance.now();
  if (now - voiceWindow > 120) { voiceWindow = now; voiceCount = 0; }
  return ++voiceCount <= 12;
}
function snd(freq, dur = 0.1, type = "square", vol = 0.15, slide = 0, chan = "sfx") {
  vol *= chan === "music" ? OPT.music : OPT.sfx;
  if (vol <= 0.001 || !voiceOK()) return;
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function noiseBurst(dur = 0.3, vol = 0.25, chan = "sfx") {
  vol *= chan === "music" ? OPT.music : OPT.sfx;
  if (vol <= 0.001 || !voiceOK()) return;
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const len = audioCtx.sampleRate * dur;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
    src.buffer = buf;
    g.gain.value = vol;
    src.connect(g).connect(audioCtx.destination);
    src.start();
  } catch (e) {}
}
window.sndRaw = snd; window.nbRaw = noiseBurst;
const sfx = {
  smash: () => { noiseBurst(0.25, 0.3); snd(60, 0.3, "sawtooth", 0.3, -30); },
  roar:  () => kaijuRoar(kaiju ? kaiju.type : (typeof KAIJUS !== "undefined" ? KAIJUS[selKaiju] : null)),
  klaxon:() => { snd(196, 0.7, "square", 0.28); snd(147, 0.7, "square", 0.22);
                 setTimeout(() => snd(392, 0.25, "sawtooth", 0.14, -100), 160); noiseBurst(0.2, 0.1); },
  breath:() => { noiseBurst(0.4, 0.2); snd(220, 0.4, "sawtooth", 0.15, -100); },
  tank:  () => snd(140, 0.15, "square", 0.12, -60),
  hit:   () => snd(90, 0.2, "sawtooth", 0.2, -40),
  heli:  () => snd(80, 0.1, "triangle", 0.06),
  boom:  () => { noiseBurst(0.35, 0.35); snd(45, 0.4, "sawtooth", 0.3, -20); },
  step:  () => { snd(40, 0.12, "sine", 0.3, -15); },
  pickup:() => { snd(440, 0.15, "sine", 0.2, 220); snd(660, 0.2, "sine", 0.15, 330); },
  ult:   () => { snd(50, 1.4, "sawtooth", 0.4, -30); snd(100, 1.2, "square", 0.25, 400); noiseBurst(1.0, 0.3); },
  buy:   () => { snd(520, 0.08, "square", 0.15); snd(780, 0.12, "square", 0.15); },
  grade: () => { snd(392, 0.12, "square", 0.18); snd(523, 0.12, "square", 0.18); setTimeout(() => snd(784, 0.3, "square", 0.2), 130); }
};

// each kaiju has its own voice — the roar is part of the character
function kaijuRoar(t) {
  const f = t && t.feature;
  if (f === "cracks") {              // VOLKANOR: subterranean rumble with crackle
    snd(42, 1.1, "sawtooth", 0.45, -12); snd(60, 0.8, "triangle", 0.3, -20);
    for (let i = 0; i < 3; i++) setTimeout(() => noiseBurst(0.12, 0.09), i * 150);
  } else if (f === "wings") {        // ZEPHYRAX: rising storm screech
    snd(320, 0.5, "sawtooth", 0.26, 900); snd(180, 0.4, "square", 0.16, 500);
    noiseBurst(0.25, 0.12);
  } else if (f === "tentacles") {    // KRAKENOTH: wet three-note warble
    snd(90, 0.5, "triangle", 0.34, 60);
    setTimeout(() => snd(70, 0.5, "triangle", 0.3, -40), 180);
    setTimeout(() => snd(110, 0.4, "triangle", 0.24, -60), 360);
    noiseBurst(0.4, 0.1);
  } else if (f === "blob") {         // GLOOPTHRAX: descending bubble chorus
    for (let i = 0; i < 4; i++)
      setTimeout(() => snd(260 - i * 40 + Math.random() * 30, 0.13, "sine", 0.22, -120), i * 95);
    noiseBurst(0.16, 0.08);
  } else if (f === "mech") {         // MEKAGORA: war-horn chord over servo grind
    snd(196, 0.8, "square", 0.3); snd(131, 0.8, "square", 0.24);
    setTimeout(() => { snd(392, 0.3, "sawtooth", 0.14, -140); noiseBurst(0.2, 0.1); }, 200);
  } else {                           // GORGONAX: the classic deep bellow
    snd(70, 0.9, "sawtooth", 0.4, -35); snd(110, 0.7, "square", 0.2, -50); noiseBurst(0.6, 0.15);
  }
}

// ---------- Procedural music: bass/drum loop that intensifies with destruction ----------
let musT = 0, musBeat = 0, musBar = 0;

// ---------- Dynamic score ----------
// Every city gets its own key and mode, so the soundtrack changes as you travel.
// Layers arm themselves as the devastation climbs, and the guardian mecha brings
// its own theme in over the top.
const SCALES = {
  // semitone offsets from the root
  minor:    [0, 2, 3, 5, 7, 8, 10],
  phrygian: [0, 1, 3, 5, 7, 8, 10],   // dark, "eastern" colour
  dorian:   [0, 2, 3, 5, 7, 9, 10],
  hirajoshi:[0, 2, 3, 7, 8],          // Japanese pentatonic
  insen:    [0, 1, 5, 7, 10],
  blues:    [0, 3, 5, 6, 7, 10]
};
// root frequency + mode + ostinato shape, chosen to suit each city
const CITY_MUSIC = {
  honolulu: { root: 61.7, mode: "dorian",    fig: [0, 4, 2, 4, 1, 4, 2, 5], tone: "triangle", perc: "light" },
  rio:      { root: 65.4, mode: "dorian",    fig: [0, 0, 3, 0, 5, 3, 2, 0], tone: "triangle", perc: "samba" },
  capetown: { root: 58.3, mode: "minor",     fig: [0, 2, 4, 2, 0, 5, 4, 2], tone: "triangle", perc: "light" },
  sydney:   { root: 61.7, mode: "minor",     fig: [0, 0, 4, 4, 2, 2, 5, 3], tone: "triangle", perc: "rock" },
  cairo:    { root: 55.0, mode: "phrygian",  fig: [0, 1, 0, 3, 0, 1, 4, 2], tone: "sawtooth", perc: "hand" },
  rome:     { root: 55.0, mode: "minor",     fig: [0, 4, 3, 4, 0, 5, 3, 1], tone: "triangle", perc: "rock" },
  dubai:    { root: 51.9, mode: "phrygian",  fig: [0, 1, 3, 1, 0, 5, 3, 1], tone: "sawtooth", perc: "hand" },
  mumbai:   { root: 58.3, mode: "phrygian",  fig: [0, 2, 1, 4, 2, 1, 5, 2], tone: "sawtooth", perc: "hand" },
  sanfran:  { root: 55.0, mode: "blues",     fig: [0, 3, 0, 4, 3, 0, 5, 3], tone: "square",   perc: "rock" },
  paris:    { root: 51.9, mode: "minor",     fig: [0, 5, 4, 3, 2, 3, 4, 5], tone: "triangle", perc: "rock" },
  london:   { root: 49.0, mode: "dorian",    fig: [0, 0, 5, 0, 3, 0, 5, 4], tone: "square",   perc: "rock" },
  tokyo:    { root: 55.0, mode: "hirajoshi", fig: [0, 1, 2, 1, 0, 3, 2, 1], tone: "square",   perc: "taiko" },
  shanghai: { root: 51.9, mode: "insen",     fig: [0, 2, 1, 3, 0, 4, 3, 1], tone: "square",   perc: "taiko" },
  moscow:   { root: 46.2, mode: "minor",     fig: [0, 0, 2, 3, 0, 0, 5, 4], tone: "sawtooth", perc: "march" },
  newyork:  { root: 49.0, mode: "minor",     fig: [0, 3, 5, 3, 0, 6, 4, 2], tone: "sawtooth", perc: "march" }
};
function musNote(M, deg, oct) {
  const sc = SCALES[M.mode] || SCALES.minor;
  const st = sc[((deg % sc.length) + sc.length) % sc.length] + 12 * (oct || 0);
  return M.root * Math.pow(2, st / 12);
}
function musicTick(dt) {
  if (muted || state !== S.PLAY || OPT.music <= 0.001) return;
  // everything in here plays on the music channel
  const snd = (f, d, t, v, sl) => window.sndRaw(f, d, t, v, sl, "music");
  const noiseBurst = (d, v) => window.nbRaw(d, v, "music");
  musT -= dt;
  if (musT > 0) return;
  const M = CITY_MUSIC[CITIES[cityIdx % CITIES.length].bg] || CITY_MUSIC.newyork;
  const bossOn = boss && boss.hp > 0;
  const rivalOn = rival && rival.hp > 0;
  const heat = Math.min(1.35, destroyedPct / CLEAR_PCT + (bossOn ? 0.35 : 0) + (rivalOn ? 0.25 : 0));
  const bpm = 88 + heat * 62;
  musT = 60 / bpm / 2;                        // eighth notes
  musBeat++;
  if (musBeat % 8 === 0) musBar++;
  const step = musBeat % 8, bar4 = musBar % 4;

  // ---- LAYER 1: bass ostinato, always present ----
  const deg = M.fig[step];
  const bass = musNote(M, deg, bar4 === 3 ? 1 : 0);
  snd(bass, 0.17, M.tone, 0.085);

  // ---- LAYER 2: percussion, styled per region ----
  if (M.perc === "taiko") {
    if (step === 0 || step === 3 || step === 6) snd(46, 0.22, "sine", 0.2, -14);
    if (step === 4) snd(58, 0.14, "sine", 0.12, -10);
  } else if (M.perc === "samba") {
    if (step === 0 || step === 4) snd(40, 0.18, "sine", 0.18, -8);
    if (step === 3 || step === 7) noiseBurst(0.03, 0.05);
    if (step % 2 === 1) noiseBurst(0.012, 0.022);
  } else if (M.perc === "hand") {
    if (step === 0 || step === 3 || step === 5) snd(52, 0.12, "sine", 0.14, -12);
    if (step === 2 || step === 6) noiseBurst(0.02, 0.035);
  } else if (M.perc === "march") {
    if (step === 0 || step === 4) snd(38, 0.2, "sine", 0.22, -8);
    if (step === 2 || step === 6) noiseBurst(0.035, 0.06);
  } else if (M.perc === "light") {
    if (step === 0) snd(42, 0.18, "sine", 0.16, -8);
    if (step % 2 === 1) noiseBurst(0.01, 0.018);
  } else {                                     // rock
    if (step === 0 || step === 4) snd(38, 0.2, "sine", 0.2, -8);
    if (step === 4) noiseBurst(0.04, 0.05);
    if (step % 2 === 1) noiseBurst(0.012, 0.025);
  }

  // ---- LAYER 3 (heat > 0.25): a low brass swell answering the bass ----
  if (heat > 0.25 && (step === 0 || step === 5)) {
    snd(musNote(M, deg, 1), 0.34, "sawtooth", 0.05, -3);
  }
  // ---- LAYER 4 (heat > 0.45): the kaiju motif — a rising minor-third cry ----
  if (heat > 0.45 && step === 2 && bar4 % 2 === 0) {
    snd(musNote(M, 0, 2), 0.3, "square", 0.045, 20);
    setTimeout(() => { if (!muted && state === S.PLAY) snd(musNote(M, 2, 2), 0.36, "square", 0.04, -12); }, 150);
  }
  // ---- LAYER 5 (heat > 0.7): driving sixteenths + air-raid siren tail ----
  if (heat > 0.7) {
    snd(musNote(M, deg, 1), 0.07, M.tone, 0.03);
    if (musBar % 8 === 7 && step === 0) snd(340, 1.1, "sine", 0.05, -180);   // distant siren
  }
  // ---- LAYER 6 (heat > 1.0): full chaos — dissonant stabs ----
  if (heat > 1.0 && (step === 1 || step === 6)) {
    snd(musNote(M, deg + 1, 2), 0.09, "sawtooth", 0.035);
  }

  // ---- guardian mecha theme: mechanical, on top of everything ----
  if (bossOn) {
    if (step === 0) snd(musNote(M, 0, -1), 0.26, "square", 0.075, -6);
    if (step === 2 || step === 6) snd(musNote(M, 4, 0), 0.1, "square", 0.05);
    if (step === 4) noiseBurst(0.05, 0.05);
  }
  // ---- rival kaiju: a menacing detuned drone underneath ----
  if (rivalOn && step % 4 === 0) snd(M.root * 0.99, 0.5, "sawtooth", 0.05);
}

// ---------- Cities (real places, generic skylines) ----------
const CITIES = [
  { name: "HONOLULU", lat: 21.31, lon: -157.86, sub: "Waik\u012bk\u012b", tint: "#ff88cc", water: "The Pacific",
    landmark: "diamondhead", landmarkName: "Diamond Head", time: "dusk", weather: "clear",
    lm2: [["alohatower", "Aloha Tower"], ["iolani", "\u02bbIolani Palace"],
          ["royalhawaiian", "The Royal Hawaiian"], ["arizona", "USS Arizona Memorial"]],
    navy: true, mil: "usa", vehicle: "jeep", bg: "honolulu" },
  { name: "RIO DE JANEIRO", lat: -22.9, lon: -43.2, sub: "Copacabana", tint: "#ffd044", water: "Guanabara Bay",
    landmark: "christ", landmarkName: "Christ the Redeemer", time: "day", weather: "clear",
    lm2: [["maracana", "Maracanã Stadium"], ["lapa", "Arcos da Lapa"],
          ["riocathedral", "Metropolitan Cathedral"], ["riomuseum", "Museum of Tomorrow"]],
    mil: "brazil", vehicle: "hatch", bg: "rio" },
  { name: "CAPE TOWN", lat: -33.92, lon: 18.42, sub: "City Bowl", tint: "#66ddaa", water: "Table Bay",
    landmark: "tablemtn", landmarkName: "Table Mountain", time: "day", weather: "clear",
    lm2: [["ctstadium", "Cape Town Stadium"], ["clocktower", "V&A Clock Tower"],
          ["bokaap", "Bo-Kaap"], ["goodhope", "Castle of Good Hope"]],
    navy: true, mil: "safrica", vehicle: "bakkie", bg: "capetown" },
  { name: "SYDNEY", lat: -33.9, lon: 151.2, sub: "Harbour Front", tint: "#44ddcc", water: "Sydney Harbour",
    landmark: "shells", landmarkName: "Sydney Opera House", time: "day", weather: "clear",
    lm2: [["sydtower", "Sydney Tower"], ["qvb", "Queen Victoria Building"],
          ["stmarys", "St Mary's Cathedral"], ["lunapark", "Luna Park"]],
    navy: true, mil: "aus", vehicle: "ute", bg: "sydney" },

  try {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const g of gps) {

        break;

    }
  } catch (e) {}
}

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const keys = {};

  setInputMode("key");

  keys[e.key.toLowerCase()] = true;

  const confirm = e.key === " " || e.key === "Enter";
  const back = e.key === "Escape" || e.key === "Backspace";
  const num = parseInt(e.key);

  if (e.key === "m" || e.key === "M") { muted = !muted; return; }
  // difficulty hotkeys only on menu screens — during play D walks right, and
  // key auto-repeat would cycle the setting continuously
  const onMenuScreen = state === S.MENU || state === S.SELECT || state === S.MAP;
  if ((e.key === "d" || e.key === "D") && onMenuScreen && !e.repeat) { setDifficulty(diffIdx + 1); return; }
  if (e.key === "[" && onMenuScreen && !e.repeat) { setDifficulty(diffIdx - 1); return; }
  if (e.key === "]" && onMenuScreen && !e.repeat) { setDifficulty(diffIdx + 1); return; }
  if (e.key === "p" || e.key === "P") {                 // pause toggles from either side
    if (state === S.PLAY) { state = S.PAUSE; pauseSel = 0; confirmWipe = false; }

    return;
  }

  // One key press causes exactly one transition. Each branch returns, so a single
  // SPACE can never cascade title → select → map → in-game.
  switch (state) {
    case S.MENU:
    case S.OVER:
    case S.WIN:
      if (e.key === "o" || e.key === "O") { openSettings(S.MENU); return; }
      if (confirm) { state = S.SELECT; sfx.pickup(); }
      return;

    case S.SELECT: {
      if (back) { state = S.MENU; sfx.pickup(); return; }
      if (e.key === "ArrowLeft") { selKaiju = (selKaiju + KAIJUS.length - 1) % KAIJUS.length; sfx.pickup(); return; }
      if (e.key === "ArrowRight") { selKaiju = (selKaiju + 1) % KAIJUS.length; sfx.pickup(); return; }
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        const maxS = skinUnl[selKaiju] || 0;
        if (maxS > 0) {
          const d = e.key === "ArrowUp" ? 1 : -1;
          skinSel[selKaiju] = ((skinSel[selKaiju] || 0) + d + maxS + 1) % (maxS + 1);
          localStorage.setItem("kdSkinSel", JSON.stringify(skinSel));
          sfx.pickup();
        }
        return;
      }
      if (confirm && isUnlocked(KAIJUS[selKaiju])) { startGame(); sfx.pickup(); }
      return;
    }

    case S.MAP: {
      if (back) { state = S.SELECT; sfx.pickup(); return; }
      const maxSel = Math.min(unlockedCities, CITIES.length - 1);
      if (e.key === "ArrowLeft") { mapSel = Math.max(0, mapSel - 1); sfx.pickup(); return; }
      if (e.key === "ArrowRight") { mapSel = Math.min(maxSel, mapSel + 1); sfx.pickup(); return; }
      if (e.key === "ArrowUp") { mapSel = Math.max(0, mapSel - 5); sfx.pickup(); return; }
      if (e.key === "ArrowDown") { mapSel = Math.min(maxSel, mapSel + 5); sfx.pickup(); return; }
      if ((e.key === "n" || e.key === "N") && ngNext > 0 && score === 0) { ngPlus = ngPlus > 0 ? 0 : ngNext; sfx.pickup(); return; }
      if (confirm) launchCity(mapSel);
      return;
    }

    case S.SETTINGS: {
      if (back) { state = settingsFrom; sfx.pickup(); return; }
      if (e.key === "ArrowUp") { settingsSel = (settingsSel + OPT_ROWS.length - 1) % OPT_ROWS.length; sfx.pickup(); return; }
      if (e.key === "ArrowDown") { settingsSel = (settingsSel + 1) % OPT_ROWS.length; sfx.pickup(); return; }
      if (e.key === "ArrowLeft") { settingsAdjust(-1); return; }
      if (e.key === "ArrowRight") { settingsAdjust(1); return; }
      if (confirm) settingsActivate();
      return;
    }

    case S.PAUSE: {
      if (back) { state = S.PLAY; confirmWipe = false; return; }
      if (e.key === "ArrowUp") { pauseSel = (pauseSel + PAUSE_ITEMS.length - 1) % PAUSE_ITEMS.length; confirmWipe = false; sfx.pickup(); return; }
      if (e.key === "ArrowDown") { pauseSel = (pauseSel + 1) % PAUSE_ITEMS.length; confirmWipe = false; sfx.pickup(); return; }
      if (num >= 1 && num <= PAUSE_ITEMS.length) { pauseSel = num - 1; pauseAction(num - 1); return; }
      if (confirm) pauseAction(pauseSel);
      return;
    }

    case S.PLAY:
      if (back) { state = S.PAUSE; pauseSel = 0; confirmWipe = false; }
      return;

    case S.INTRO:
      if (confirm || back) finishIntro();
      return;

    case S.LEVELCLEAR:
      if (confirm) { state = S.SHOP; sfx.pickup(); }
      return;

    case S.SHOP:
      if (num >= 1 && num <= MUTS.length) { buyMut(MUTS[num - 1].id); return; }
      if (confirm) nextCity();
      return;
  }
});

// A tap that lands in the letterbox next to the canvas used to be swallowed
// entirely — which is exactly how an edge-hugging button feels "broken".
// On menu screens, forward those to the same handler.
document.getElementById("wrap").addEventListener("pointerdown", e => {
  if (e.target === cv) return;                        // already handled
  if (state === S.PLAY || state === S.INTRO) return;  // gameplay owns its own input
  const r = cv.getBoundingClientRect();
  const near = e.clientX > r.left - 70 && e.clientX < r.right + 70 &&
               e.clientY > r.top - 70 && e.clientY < r.bottom + 70;
  if (!near) return;
  cv.dispatchEvent(new PointerEvent("pointerdown", {
    bubbles: false, pointerType: e.pointerType || "mouse",
    clientX: e.clientX, clientY: e.clientY

}, true);

cv.addEventListener("pointermove", e => {
  const t = touches[e.pointerId];
  if (t) { const p = toGame(e); t.x = p.x; t.y = p.y; }

function endTouch(e) { delete touches[e.pointerId]; }
cv.addEventListener("pointerup", endTouch);
cv.addEventListener("pointercancel", endTouch);
function toGame(e) {
  const r = cv.getBoundingClientRect();
  // derive the mapping from the element's actual rendered size rather than the
  // cached `scale` — that keeps hit-testing correct under browser zoom, pinch
  // zoom, and any mid-frame layout change
  const sx = r.width > 0 ? W / r.width : 1;
  const sy = r.height > 0 ? H / r.height : 1;
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}
// clamps a point into the play field, so a tap that lands a few pixels into the
// letterbox still registers on the control it was clearly aimed at
function toGameClamped(e) {
  const p = toGame(e);
  return { x: Math.max(0, Math.min(W, p.x)), y: Math.max(0, Math.min(H, p.y)) };
}

// Gamepad
let padConnected = false, padPrev = {};
let pad = { axis: 0, swipe: false, stomp: false, breath: false, roar: false };
window.addEventListener("gamepadconnected", () => padConnected = true);
function pollGamepad() {
  pad.axis = 0; pad.swipe = false; pad.stomp = false; pad.breath = false; pad.roar = false;
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const g of gps) if (g && g.connected) { gp = g; break; }
  if (!gp) return;
  padConnected = true;
  const ax = gp.axes[0] || 0;
  // any real stick or button activity means the player has picked up the controller
  if (Math.abs(ax) > 0.35 || gp.buttons.some(bt => bt && bt.pressed)) setInputMode("pad");
  if (Math.abs(ax) > 0.2) pad.axis = ax;
  if (gp.buttons[14]?.pressed) pad.axis = -1;
  if (gp.buttons[15]?.pressed) pad.axis = 1;
  pad.swipe = gp.buttons[2]?.pressed || gp.buttons[0]?.pressed;   // X or A
  pad.stomp = gp.buttons[1]?.pressed;                              // B
  pad.breath = gp.buttons[3]?.pressed || (gp.buttons[7]?.value > 0.4); // Y or RT
  pad.roar = gp.buttons[4]?.pressed || gp.buttons[5]?.pressed;     // LB or RB
  const start = gp.buttons[9]?.pressed;
  const dl = gp.buttons[14]?.pressed || (gp.axes[0] || 0) < -0.5;
  const dr = gp.buttons[15]?.pressed || (gp.axes[0] || 0) > 0.5;
  const du = gp.buttons[12]?.pressed || (gp.axes[1] || 0) < -0.5;
  const dd = gp.buttons[13]?.pressed || (gp.axes[1] || 0) > 0.5;
  const A = gp.buttons[0]?.pressed;                       // confirm
  const Bb = gp.buttons[1]?.pressed;                      // back (menus only)
  const menuState = state !== S.PLAY;
  const pressA = A && !padPrev.a, pressB = Bb && !padPrev.b;
  const pressL = dl && !padPrev.dl, pressR = dr && !padPrev.dr;
  const pressU = du && !padPrev.du, pressD = dd && !padPrev.dd;

  // START: pause toggle in play, confirm everywhere else
  if (start && !padPrev.start) {
    if (state === S.PLAY) { state = S.PAUSE; pauseSel = 0; confirmWipe = false; }
    else if (state === S.PAUSE) { state = S.PLAY; confirmWipe = false; }
    else if (state === S.MENU || state === S.OVER || state === S.WIN) state = S.SELECT;
    else if (state === S.SELECT && isUnlocked(KAIJUS[selKaiju])) startGame();
    else if (state === S.MAP) launchCity(mapSel);
    else if (state === S.LEVELCLEAR) state = S.SHOP;
    else if (state === S.SHOP) nextCity();
    else if (state === S.INTRO) finishIntro();
  } else if (menuState) {
    // one transition per press, mirroring the keyboard state machine
    switch (state) {
      case S.MENU: case S.OVER: case S.WIN:
        if (pressA) { state = S.SELECT; sfx.pickup(); }
        break;
      case S.SELECT:
        if (pressB) { state = S.MENU; sfx.pickup(); break; }
        if (pad.roar && !padPrev.roar) { setDifficulty(diffIdx + 1); break; }   // LB/RB
        if (pressL) { selKaiju = (selKaiju + KAIJUS.length - 1) % KAIJUS.length; sfx.pickup(); break; }
        if (pressR) { selKaiju = (selKaiju + 1) % KAIJUS.length; sfx.pickup(); break; }
        if (pressU || pressD) {
          const maxS = skinUnl[selKaiju] || 0;
          if (maxS > 0) {
            skinSel[selKaiju] = ((skinSel[selKaiju] || 0) + (pressU ? 1 : -1) + maxS + 1) % (maxS + 1);
            localStorage.setItem("kdSkinSel", JSON.stringify(skinSel));
            sfx.pickup();
          }
          break;
        }
        if (pressA && isUnlocked(KAIJUS[selKaiju])) { startGame(); sfx.pickup(); }
        break;
      case S.MAP: {
        if (pressB) { state = S.SELECT; sfx.pickup(); break; }
        const maxSel = Math.min(unlockedCities, CITIES.length - 1);
        if (pressL) { mapSel = Math.max(0, mapSel - 1); sfx.pickup(); break; }
        if (pressR) { mapSel = Math.min(maxSel, mapSel + 1); sfx.pickup(); break; }
        if (pressU) { mapSel = Math.max(0, mapSel - 5); sfx.pickup(); break; }
        if (pressD) { mapSel = Math.min(maxSel, mapSel + 5); sfx.pickup(); break; }
        if (pressA) launchCity(mapSel);
        break;
      }
      case S.SETTINGS:
        if (pressB) { state = settingsFrom; sfx.pickup(); break; }
        if (pressU) { settingsSel = (settingsSel + OPT_ROWS.length - 1) % OPT_ROWS.length; sfx.pickup(); break; }
        if (pressD) { settingsSel = (settingsSel + 1) % OPT_ROWS.length; sfx.pickup(); break; }
        if (pressL) { settingsAdjust(-1); break; }
        if (pressR) { settingsAdjust(1); break; }
        if (pressA) settingsActivate();
        break;
      case S.PAUSE:
        if (pressB) { state = S.PLAY; confirmWipe = false; break; }
        if (pressU) { pauseSel = (pauseSel + PAUSE_ITEMS.length - 1) % PAUSE_ITEMS.length; confirmWipe = false; sfx.pickup(); break; }
        if (pressD) { pauseSel = (pauseSel + 1) % PAUSE_ITEMS.length; confirmWipe = false; sfx.pickup(); break; }
        if (pressA) pauseAction(pauseSel);
        break;
      case S.LEVELCLEAR:
        if (pressA) { state = S.SHOP; sfx.pickup(); }
        break;
      case S.SHOP:
        if (pressA) nextCity();
        break;
      case S.INTRO:
        if (pressA || pressB) finishIntro();
        break;
    }
  }
  padPrev.a = A; padPrev.b = Bb; padPrev.du = du; padPrev.dd = dd; padPrev.roar = pad.roar;
  padPrev.start = start; padPrev.swipe = pad.swipe; padPrev.dl = dl; padPrev.dr = dr;
}

// Read touch buttons (zones set in drawHUD)
function touchControls() {
  const out = { axis: 0, swipe: false, stomp: false, breath: false, roar: false };
  for (const id in touches) {
    const t = touches[id];
    if (OPT.lefty ? t.sx > W * 0.55 : t.sx < W * 0.45) {
      // virtual stick: horizontal drag
      const dx = t.x - t.sx;
      if (Math.abs(dx) > 8) out.axis = Math.max(-1, Math.min(1, dx / 50));
    } else {
      // buttons on right
      if (btns.swipe && inBtn(t, btns.swipe)) out.swipe = true;
      if (btns.stomp && inBtn(t, btns.stomp)) out.stomp = true;
      if (btns.breath && inBtn(t, btns.breath)) out.breath = true;
      if (btns.roar && inBtn(t, btns.roar)) out.roar = true;
    }
  }
  return out;
}
function inBtn(t, b) { return Math.hypot(t.x - b.x, t.y - b.y) < b.r + 14; }

// ---------- Army ----------
let spawnTimer = 3, armyLevel = 0;
function spawnUnit() {
  armyLevel = Math.min(1, destroyedPct * 1.6);
  const roll = Math.random();
  const fromRight = Math.random() < 0.7;
  const gx = fromRight ? camX + W + 60 : camX - 60;
  const dir = fromRight ? -1 : 1;
  const m = milOf();
  // heavier armour and the front-line jets show up as the rampage escalates
  const tankV = armyLevel > 0.35 ? m.tanks[0] : pick(m.tanks);
  const heliV = pick(m.helis), jetV = armyLevel > 0.5 ? m.jets[0] : pick(m.jets);
  if (armyLevel > 0.55 && roll < 0.12 && !units.some(u => u.kind === "walker")) {
    units.push({ kind: "walker", x: gx, y: 0, w: 60, h: 70, vx: dir * 28, hp: 20, fireT: 2, dir, chargeT: 0 });
    float(gx, GROUND - 100, "EXPERIMENTAL WALKER DEPLOYED", "#ff6688");
  } else if (armyLevel > 0.4 && roll < 0.22 && !units.some(u => u.kind === "mlrs")) {
    // heavy rocket artillery drives up the street and sets up to fire salvos
    const side = kaiju.x < worldW / 2 ? 1 : -1;
    const sx = Math.max(130, Math.min(worldW - 130, kaiju.x + side * (W * 0.62)));
    units.push({ kind: "mlrs", x: sx, y: 0, w: 90, h: 30, vx: -side * 30, hp: 12, fireT: 2.5,
                 dir: kaiju.x < sx ? -1 : 1 });
    float(sx, GROUND - 60, "ROCKET ARTILLERY DEPLOYING", "#ffaa66");
  } else if (armyLevel > 0.25 && roll < 0.34) {
    units.push({ kind: "arty", x: gx, y: 0, w: 40, h: 16, vx: dir * 30, hp: 2, fireT: 2 + Math.random() * 1.5, dir });
  } else if (roll < 0.5) {
    units.push({ kind: "tank", v: tankV, x: gx, y: 0, w: 44, h: 20, vx: dir * 40, hp: 3, fireT: 1 + Math.random(), dir });
  } else if (roll < 0.78 && units.filter(u => u.kind === "heli").length < 3) {
    units.push({ kind: "heli", v: heliV, x: gx, y: 150 + Math.random() * 80, w: 40, h: 16, vx: dir * 65,
                 hp: 6, fireT: 1.5, dir, bob: Math.random() * 6, stand: 110 + Math.random() * 110 });
  } else if (roll < 0.78) {
    units.push({ kind: "tank", v: tankV, x: gx, y: 0, w: 44, h: 20, vx: dir * 40, hp: 3, fireT: 1 + Math.random(), dir });
  } else if (armyLevel > 0.3) {
    units.push({ kind: "jet", v: jetV, x: gx, y: 60 + Math.random() * 60, w: 48, h: 12, vx: dir * 240, hp: 3, fireT: 0.4, dir, dropped: false });
  } else {
    units.push({ kind: "tank", v: tankV, x: gx, y: 0, w: 44, h: 20, vx: dir * 40, hp: 3, fireT: 1.2, dir });
  }
}

// ---------- Helpers ----------
function trimParticles() {
  const cap = QUALITY[qTier].parts;
  if (particles.length > cap) particles.splice(0, particles.length - cap);
}
function boom(x, y, color, n = 16, speed = 120, grav = 200) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * speed + 30;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.5 + Math.random() * 0.6, color, grav });
  }
}
function smoke(x, y, n = 3) {
  for (let i = 0; i < n; i++)
    particles.push({ x: x + (Math.random() - 0.5) * 20, y, vx: (Math.random() - 0.5) * 15, vy: -30 - Math.random() * 30, life: 1 + Math.random(), color: "smoke", grav: -20 });
}
function float(x, y, text, color = "#fff") { floaters.push({ x, y, text, color, life: 1.2 }); }

const GROUND = H - 60;

// ---------- Update ----------
function update(dt) {
  if (state === S.INTRO) {
    introT += dt;
    const lmb = buildings.find(b => b.landmark);
    const from = Math.max(0, Math.min(worldW - W, (lmb ? lmb.x + lmb.w / 2 : worldW / 2) - W / 2));
    if (introT < 1.6) camX = from;                 // hold on the landmark
    else {
      const p = Math.min(1, (introT - 1.6) / 1.7); // pan back to the kaiju
      const e = p * p * (3 - 2 * p);
      camX = from * (1 - e);
    }
    if (introT >= 3.6) finishIntro();
    return;
  }
  if (state !== S.PLAY) {
    if (state === S.LEVELCLEAR) clearTimer -= dt;
    return;
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 25);
  if (roarFlash > 0) roarFlash -= dt;
  levelTime += dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  if (bossWarnT > 0) bossWarnT -= dt;

  const tc = touchControls();
  const k = kaiju;

  // ----- movement -----
  let axis = 0;
  if (keys["arrowleft"] || keys["a"]) axis = -1;
  if (keys["arrowright"] || keys["d"]) axis = 1;
  if (pad.axis) axis = pad.axis;
  if (tc.axis) axis = tc.axis;
  const spd = k.type.speed;
  k.vx = axis * spd;
  if (k.dashT > 0) {
    k.dashT -= dt;
    k.vx = k.facing * 620;
    // shred everything in the dash path
    hitBuildings(k.x, 90, 160 * dt * 6);
    for (const u of units) if (Math.abs(u.x - k.x) < 100) damageUnit(u, 12 * dt * 6);
    if (Math.random() < dt * 20) boom(k.x - k.facing * 40, GROUND - 60 - Math.random() * 60, k.type.beam, 3, 60);
    shake = Math.max(shake, 3);
  }
  k.x = Math.max(60, Math.min(worldW - 60, k.x + k.vx * dt));
  if (axis) { k.facing = Math.sign(axis); k.walk += dt * 6; }
  // footstep thump
  if (axis && Math.floor(k.walk) !== Math.floor(k.walk - dt * 6)) { sfx.step(); shake = Math.max(shake, 1.5); haptic(15, 0.2); }

  // ----- attacks -----
  const wantSwipe = keys["j"] || keys["z"] || keys[" "] || pad.swipe || tc.swipe;
  const wantStomp = keys["k"] || keys["x"] || pad.stomp || tc.stomp;
  const wantBreath = keys["l"] || keys["c"] || pad.breath || tc.breath;
  const wantRoar = keys["r"] || pad.roar || tc.roar;

  // roar taunt: scatters civilians, terrifies nearby units, builds rage
  if (k.roarCd > 0) k.roarCd -= dt;
  if (wantRoar && k.roarCd <= 0) {
    k.roarCd = 8;
    sfx.roar();
    roarFlash = 0.6;
    shake = Math.max(shake, 6);
    haptic(150, 0.8);
    k.rage = Math.min(100, k.rage + 15 * levelRageBonus());
    float(k.x, GROUND - k.h - 24, "ROOOAAR!", "#ffdd44");
    for (const c of civilians) if (Math.abs(c.x - k.x) < 500) c.panic = true;
    for (const u of units)
      if (Math.abs(u.x - k.x) < 350 && u.kind !== "mlrs" && u.kind !== "walker") u.fearT = 2.5;
  }

  if (k.swipeT > 0) k.swipeT -= dt;
  if (k.stompT > 0) k.stompT -= dt;
  if (k.hurtT > 0) k.hurtT -= dt;
  if (k.chainT > 0) { k.chainT -= dt; if (k.chainT <= 0) k.chainN = 0; }
  if (k.grabCd > 0) k.grabCd -= dt;
  if (DIF().regen > 0 && k.hp > 0 && k.hp < k.maxHp) k.hp = Math.min(k.maxHp, k.hp + DIF().regen * dt);
  updateAnchor(dt);
  // faint crowd panic, when enough people are fleeing on screen
  crowdT -= dt;
  if (crowdT <= 0) {
    crowdT = 1.6 + Math.random() * 1.6;
    let n = 0;
    for (const c of civilians) if (!c.dead && c.panic && c.x > camX && c.x < camX + W) n++;
    if (n >= 3) {
      snd(650 + Math.random() * 350, 0.2, "triangle", 0.045, -260);
      setTimeout(() => snd(500 + Math.random() * 250, 0.16, "triangle", 0.035, -200), 130);
    }
  }
  // ----- fire census + quake waves -----
  fireCount = 0;
  for (const b2 of buildings) if (b2.burn > 0 && !b2.rubble) fireCount++;
  if (fireCount >= 8 && !firestormAlerted) {
    firestormAlerted = true;
    newsAlert("FIRESTORM SPREADING THROUGH " + CITIES[cityIdx].name, 3);
  }
  for (let qi = quakes.length - 1; qi >= 0; qi--) {
    const q = quakes[qi];
    q.r += 330 * dt;
    if (q.r > q.max) { quakes.splice(qi, 1); continue; }
    const fall = 1 - q.r / q.max;                        // weakens with distance
    for (const sgn of [-1, 1]) {
      const fx = q.x + sgn * q.r;
      if (Math.random() < dt * 14)                       // dust at the wavefront
        particles.push({ x: fx + (Math.random() - 0.5) * 22, y: GROUND - 4,
                         vx: (Math.random() - 0.5) * 40, vy: -30 - Math.random() * 40,
                         life: 0.5, color: "smoke", grav: -18 });
      for (const b2 of buildings) {
        if (b2.rubble || b2.falling) continue;
        if (Math.abs(b2.x + b2.w / 2 - fx) < 32)
          b2.hp -= q.power * dt * 6 * fall * (b2.landmark ? 0.45 : 1);
      }
      for (const u of units)
        if (u.kind === "tank" && Math.abs(u.x - fx) < 34 && Math.random() < dt * 4) damageUnit(u, 1);
      for (const c of civilians)
        if (!c.dead && Math.abs(c.x - fx) < 60) c.panic = true;
    }
  }

  // melee combo chain: 1) claw slash  2) rising backhand  3) spinning tail sweep
  // — or grab a low helicopter / rubble chunk, press again to hurl
  if (wantSwipe && k.swipeT <= 0) {
    // Picking up rubble is deliberate: you must be standing still, right on top of a
    // fresh pile, with nothing else in reach — and it goes on cooldown afterwards.
    // Otherwise it hijacks the attack button in a city full of debris.
    const targetNear = buildings.some(b => !b.rubble && Math.abs(b.x + b.w / 2 - k.x) < 130) ||
                       units.some(u => !AIR(u) && Math.abs(u.x - k.x) < 140) ||
                       (boss && boss.hp > 0 && Math.abs(boss.x - k.x) < 160) ||
                       (rival && rival.hp > 0 && Math.abs(rival.x - k.x) < 160);
    const standingStill = Math.abs(k.vx) < 12;
    const rubbleNear = (targetNear || !standingStill || (k.grabCd || 0) > 0) ? null :
      buildings.find(b => b.rubble && !b.chunkTaken && (b.rubbleT || 0) > 0 && Math.abs(b.x + b.w / 2 - k.x) < 40);
    if (k.held) {
      // hurl whatever we're holding
      const isRock = k.held === "rock";
      k.held = null;
      k.swipeT = 0.4;
      k.swipeKind = 1;
      sfx.smash();
      kBullets.push({ x: k.x + k.facing * 20, y: GROUND - k.h - 10, vx: k.facing * (isRock ? 380 : 430), vy: isRock ? -60 : -80, spin: 0, rock: isRock });
      float(k.x, GROUND - k.h - 26, "HURLED!", "#aaddff");
    } else if (units.some(u => u.kind === "heli" && Math.abs(u.x - k.x) < 95 && GROUND - u.y < 235)) {
      // aerial grab: snatch it out of the sky
      const grab = units.find(u => u.kind === "heli" && Math.abs(u.x - k.x) < 95 && GROUND - u.y < 235);
      units.splice(units.indexOf(grab), 1);
      k.held = "heli";
      k.swipeT = 0.35;
      k.swipeKind = 2;
      sfx.smash();
      haptic(50, 0.5);
      float(k.x, GROUND - k.h - 26, "GRABBED!", "#aaddff");
    } else if (rubbleNear) {
      // rip a chunk out of the rubble
      rubbleNear.chunkTaken = true;
      k.grabCd = 5;                      // can't chain-farm rubble
      k.held = "rock";
      k.swipeT = 0.4;
      k.swipeKind = 1;
      sfx.smash();
      haptic(40, 0.4);
      boom(k.x, GROUND - 10, "#8a7a60", 8, 80);
      float(k.x, GROUND - k.h - 26, "RUBBLE CHUNK!", "#ccbb99");
    } else {
    k.chainN = ((k.chainN || 0) % 3) + 1;
    k.chainT = 1.0;                 // window to continue the chain
    k.swipeKind = k.chainN;
    if (k.chainN === 1) {
      // claw slash — quick, forward
      k.swipeT = 0.38;
      sfx.smash();
      const hx = k.x + k.facing * 70, range = 75;
      hitBuildings(hx, range, meleeP());
      for (const u of units)
        if (Math.abs(u.x - hx) < range + (AIR(u) ? 40 : 0) && (!AIR(u) || GROUND - u.y < 250))
          damageUnit(u, AIR(u) ? 2 : 3);
    } else if (k.chainN === 2) {
      // rising backhand — reaches high, swats aircraft
      k.swipeT = 0.42;
      sfx.smash();
      const hx = k.x + k.facing * 60, range = 85;
      hitBuildings(hx, range, meleeP() * 1.1);
      boom(hx, GROUND - 170, "#ffee99", 6, 70);
      // the backhand is the universal anti-air swat: long reach, high ceiling, big damage
      for (const u of units)
        if (Math.abs(u.x - hx) < range + (AIR(u) ? 55 : 0) && GROUND - u.y < 300)
          damageUnit(u, AIR(u) ? 4 : 4);
    } else {
      // ---- signature finisher: every kaiju ends its chain its own way ----
      const feat = k.type.feature;
      const hx3 = k.x + k.facing * 70;
      k.swipeT = 0.6;
      shake = Math.max(shake, 6);
      haptic(60, 0.6);
      if (feat === "cracks") {
        // VOLKANOR — MAGMA SLAM: both fists down, fissure erupts forward, sets fires
        sfx.boom();
        const range = 130;
        hitBuildings(hx3, range, meleeP() * 1.7);
        for (const b2 of buildings)
          if (!b2.rubble && Math.abs(b2.x + b2.w / 2 - hx3) < range) b2.burn = Math.max(b2.burn, 3.5);
        craters.push({ x: hx3, r: 46 * (1 + 0.25 * mutRank("seismic")) });
        for (let i = 0; i < 3; i++) boom(hx3 - 40 + i * 40, GROUND - 12, "#ff8833", 12, 150, 240);
        boom(hx3, GROUND - 40, "#ffdd66", 14, 190);
        for (const u of units)
          if (Math.abs(u.x - hx3) < range + 30 && (!AIR(u) || GROUND - u.y < 250))
            damageUnit(u, AIR(u) ? 4 : 7);
        float(k.x, GROUND - k.h - 24, "MAGMA SLAM!", "#ff9944");
        shake = Math.max(shake, 11);
      } else if (feat === "wings") {
        // ZEPHYRAX — CYCLONE BUFFET: wing blast that shreds anything airborne
        sfx.smash();
        const range = 150;
        hitBuildings(hx3, range, meleeP() * 1.15);
        k.x += k.facing * 30;                              // lunges into it
        for (let i = 0; i < 10; i++)
          particles.push({ x: hx3, y: GROUND - 60 - Math.random() * 140,
                           vx: k.facing * (120 + Math.random() * 180), vy: (Math.random() - 0.5) * 90,
                           life: 0.5, color: "#ccbbff", grav: 0 });
        for (const u of units)
          if (Math.abs(u.x - hx3) < range + 60) damageUnit(u, u.kind === "heli" || u.kind === "jet" ? 9 : 4);
        float(k.x, GROUND - k.h - 24, "CYCLONE BUFFET!", "#ccbbff");
      } else if (feat === "tentacles") {
        // KRAKENOTH — TENTACLE LASH: long reach, both sides, drags units in
        sfx.boom();
        const range = 165;
        hitBuildings(k.x, range, meleeP() * 1.3);
        for (const u of units) {
          if (Math.abs(u.x - k.x) >= range + 50) continue;
          if (!AIR(u) || GROUND - u.y < 310) {
            damageUnit(u, AIR(u) ? 4 : 6);
            u.x += Math.sign(k.x - u.x) * 26;              // yanked toward the maw
            if (AIR(u)) u.y += 26;                         // dragged out of the sky
          }
        }
        for (const sgn of [-1, 1])
          for (let i = 1; i <= 3; i++)
            boom(k.x + sgn * i * 50, GROUND - 20 - i * 12, "#66ffcc", 5, 80);
        float(k.x, GROUND - k.h - 24, "TENTACLE LASH!", "#66ffcc");
      } else if (feat === "mech") {
        // MEKAGORA — ROCKET PUNCH: the fist launches as a projectile
        sfx.smash(); sfx.tank();
        kBullets.push({ x: k.x + k.facing * 30, y: GROUND - k.h * 0.72, vx: k.facing * 520, vy: -20,
                        spin: 0, rock: true, fist: true });
        hitBuildings(hx3, 60, meleeP() * 0.8);
        for (const u of units)                             // the launched fist tracks aircraft too
          if (Math.abs(u.x - hx3) < 130 && GROUND - u.y < 290) damageUnit(u, AIR(u) ? 5 : 6);
        boom(k.x + k.facing * 40, GROUND - k.h * 0.72, "#ff4466", 10, 130, 0);
        float(k.x, GROUND - k.h - 24, "ROCKET PUNCH!", "#ff6688");
      } else if (feat === "blob") {
        // GLOOPTHRAX — ACID SPRAY: melts a wide arc and keeps eating away at it
        sfx.smash();
        const range = 145;
        hitBuildings(hx3, range, meleeP() * 1.25);
        for (const b2 of buildings)
          if (!b2.rubble && Math.abs(b2.x + b2.w / 2 - hx3) < range) b2.burn = Math.max(b2.burn, 5);
        for (let i = 0; i < 16; i++)
          particles.push({ x: k.x + k.facing * 30, y: GROUND - 70 - Math.random() * 60,
                           vx: k.facing * (90 + Math.random() * 220), vy: -40 + Math.random() * 120,
                           life: 0.9, color: "#aaff66", grav: 220 });
        for (const u of units)
          if (Math.abs(u.x - hx3) < range && (!AIR(u) || GROUND - u.y < 260))
            damageUnit(u, AIR(u) ? 4 : 6);
        float(k.x, GROUND - k.h - 24, "ACID SPRAY!", "#aaff66");
      } else {
        // GORGONAX — TAIL SWEEP: hits both sides at once
        sfx.boom();
        const range = 115;
        hitBuildings(k.x, range, meleeP() * 1.4);
        boom(k.x - 90, GROUND - 30, "#ffcc66", 8, 90);
        boom(k.x + 90, GROUND - 30, "#ffcc66", 8, 90);
        for (const u of units)
          if (Math.abs(u.x - k.x) < range + 30 && (!AIR(u) || GROUND - u.y < 250))
            damageUnit(u, AIR(u) ? 3 : 5);
        float(k.x, GROUND - k.h - 24, "TAIL SWEEP!", "#ffcc66");
      }
    }
    }
  }

  // stomp — AoE ground shockwave
  if (wantStomp && k.stompT <= 0) {
    k.stompT = 0.8;
    sfx.boom();
    shake = 10;
    haptic(90, 0.9);
    const smash = 1 + 0.25 * mutRank("seismic");
    boom(k.x, GROUND, "#ffcc66", 20, 150);
    hitBuildings(k.x, 130 * smash, meleeP() * 0.65);
    craters.push({ x: k.x, r: 48 * smash });
    if (craters.length > 14) craters.shift();
    // the shock rolls outward through the block as a quake wave
    quakes.push({ x: k.x, r: 60, max: 400 * smash, power: meleeP() * 0.09 });
    if (quakes.length > 4) quakes.shift();
    for (const u of units) {
      if (u.kind === "tank" && Math.abs(u.x - k.x) < 160 * smash) damageUnit(u, 3);
    }
  }

  // ----- ULTIMATE: full rage + special press = cataclysm -----
  if (wantBreath && !k.prevSpec && k.rage >= 100 && k.ultT <= 0) {
    k.rage = 0;
    k.ultT = 1.6;
    k.ultX = k.x;
    sfx.ult(); sfx.roar();
    roarFlash = 1;
    shake = 22;
    aberrT = 0.8;
    haptic(500, 1);
    const ultNames = { beam: "OBLITERATION BEAM", nova: "EXTINCTION ERUPTION", dash: "TEMPEST", whirl: "ABYSSAL MAW" };
    float(k.x, GROUND - k.h - 40, "★ " + ultNames[k.type.special] + " ★", "#ffee66");
    pushNews(k.type.name + " unleashes " + ultNames[k.type.special] + " — catastrophic damage reported");
    k.prevSpec = true;
  }
  if (k.ultT > 0) {
    k.ultT -= dt;
    shake = Math.max(shake, 6);
    const sp2 = k.type.special;
    if (sp2 === "beam") {
      // sweeping horizon-splitting beam: front arc rakes forward
      const prog = 1 - k.ultT / 1.6;
      const bx = k.ultX + k.facing * (80 + prog * 620);
      hitBuildings(bx, 90, 700 * dt);
      craters.push({ x: bx, r: 30 });
      if (craters.length > 14) craters.shift();
      for (const u of units) if (Math.abs(u.x - bx) < 120) damageUnit(u, 30);
      if (Math.random() < dt * 30) boom(bx, GROUND - 40 - Math.random() * 120, k.type.beam, 6, 140);
    } else if (sp2 === "nova") {
      // ground erupts across the whole screen
      if (Math.random() < dt * 14) {
        const ex = camX + Math.random() * W;
        boom(ex, GROUND - 10, "#ff8844", 18, 200, 140);
        hitBuildings(ex, 80, 160);
        for (const u of units) if (Math.abs(u.x - ex) < 100) damageUnit(u, 12);
        for (const b2 of buildings) if (!b2.rubble && Math.abs(b2.x + b2.w / 2 - ex) < 120) b2.burn = Math.max(b2.burn, 3);
        shake = Math.max(shake, 12);
      }
    } else if (sp2 === "dash") {
      // hurricane fly-over: scream across the map shredding everything
      k.x += k.facing * 900 * dt;
      k.x = Math.max(60, Math.min(worldW - 60, k.x));
      hitBuildings(k.x, 140, 500 * dt);
      for (const u of units) if (Math.abs(u.x - k.x) < 160) damageUnit(u, 25);
      if (Math.random() < dt * 40) boom(k.x - k.facing * 40, GROUND - 40 - Math.random() * 120, k.type.beam, 4, 120);
      if (k.x <= 62 || k.x >= worldW - 62) k.facing *= -1;   // ricochet off world edges
    } else if (sp2 === "whirl") {
      // abyssal maw: drag the nearest buildings down into the earth
      k.maw = (k.maw || 0) - dt;
      if (k.maw <= 0) {
        k.maw = 0.35;
        let best = null, bd = 1e9;
        for (const b2 of buildings) {
          if (b2.rubble) continue;
          const d = Math.abs(b2.x + b2.w / 2 - k.x);
          if (d < 420 && d < bd) { bd = d; best = b2; }
        }
        if (best) {
          best.hp = 0;   // swallowed whole
          boom(best.x + best.w / 2, GROUND, k.type.beam, 24, 180);
          craters.push({ x: best.x + best.w / 2, r: best.w * 0.7 });
          if (craters.length > 14) craters.shift();
        }
      }
    }
  }

  // ----- SPECIAL (per kaiju, powered by rage) -----
  const sp = k.type.special;
  if (sp === "beam") {
    if (wantBreath && k.rage > 0) {
      k.breathT = 0.1;
      k.rage = Math.max(0, k.rage - dt * 22);
      if (Math.random() < dt * 12) sfx.breath();
      const bx = k.x + k.facing * 55, by = GROUND - k.h + 32;
      for (let d = 0; d < 380; d += 24) {
        const px2 = bx + k.facing * d, py2 = by + d * 0.28;
        if (Math.random() < 0.35) boom(px2, py2, k.type.beam, 2, 50, 60);
        hitBuildings(px2, 26, 90 * dt * 6);
        for (const u of units) {
          if (Math.abs(u.x - px2) < 30 && Math.abs((GROUND - (u.kind === "tank" ? 10 : u.y)) - py2) < 42) damageUnit(u, 3 * dt * 8);
        }
      }
    } else k.breathT = Math.max(0, k.breathT - dt);
  } else if (sp === "nova") {
    if (wantBreath && !k.prevSpec && k.rage >= 40) {
      k.rage -= 40;
      k.novaT = 0.5;
      sfx.boom(); sfx.roar();
      shake = 16;
      haptic(200, 1);
      boom(k.x, GROUND - 70, k.type.beam, 60, 260, 120);
      hitBuildings(k.x, 260, 130);
      craters.push({ x: k.x, r: 95 });
      if (craters.length > 14) craters.shift();
      aberrT = Math.max(aberrT, 0.5);
      for (const u of units) if (Math.abs(u.x - k.x) < 300) damageUnit(u, 10);
      // set nearby buildings ablaze
      for (const b of buildings) if (!b.rubble && Math.abs(b.x + b.w / 2 - k.x) < 320) b.burn = Math.max(b.burn, 3);
    }
    k.novaT = Math.max(0, k.novaT - dt);
  } else if (sp === "dash") {
    if (wantBreath && !k.prevSpec && k.rage >= 30 && k.dashT <= 0) {
      k.rage -= 30;
      k.dashT = 0.4;
      sfx.breath();
    }
  } else if (sp === "whirl") {
    if (wantBreath && k.rage > 0) {
      k.whirlT = 0.15;
      k.rage = Math.max(0, k.rage - dt * 18);
      if (Math.random() < dt * 10) sfx.smash();
      hitBuildings(k.x, 150, 110 * dt * 6);
      for (const u of units) {
        const uy = u.kind === "tank" ? GROUND - 10 : u.y;
        if (Math.abs(u.x - k.x) < 170 && GROUND - uy < 220) damageUnit(u, 4 * dt * 8);
      }
      if (Math.random() < dt * 16) boom(k.x + (Math.random() - 0.5) * 220, GROUND - Math.random() * 150, k.type.beam, 3, 80);
      shake = Math.max(shake, 2.5);
    } else k.whirlT = Math.max(0, k.whirlT - dt);
  }
  k.prevSpec = wantBreath;

  // ----- buildings collapse / burn -----
  for (const b of buildings) {
    if (b.rubbleT > 0) b.rubbleT -= dt;
    // multi-stage landmark destruction: crack → crumble → collapse
    if (b.landmark && !b.rubble) {
      const d = 1 - b.hp / b.maxHp;
      const st = d > 0.66 ? 2 : d > 0.33 ? 1 : 0;
      if (st > (b.stage || 0)) {
        b.stage = st;
        b.leanDir = b.leanDir || (Math.random() < 0.5 ? -1 : 1);
        sfx.boom();
        shake = Math.max(shake, 6);
        haptic(70, 0.6);
        aberrT = Math.max(aberrT, 0.3);
        boom(b.x + b.w / 2, GROUND - b.h * 0.8, "#ccbb99", 20, 150);
        smoke(b.x + b.w / 2, GROUND - b.h, 5);
        float(b.x + b.w / 2, GROUND - b.h - 20,
          (b.lmName || CITIES[cityIdx].landmarkName) + (st === 1 ? " IS CRACKING!" : " IS CRUMBLING!"), "#ffaa44");
      }
    }
    if (b.burn > 0) {
      b.burn -= dt;
      if (Math.random() < dt * 2.2) smoke(b.x + b.w / 2, GROUND - b.h, 1);
      if (Math.random() < dt * 1.2)                      // drifting embers
        particles.push({ x: b.x + Math.random() * b.w, y: GROUND - b.h * Math.random(),
                         vx: (Math.random() - 0.5) * 30, vy: -40 - Math.random() * 50,
                         life: 0.7, color: "#ffb04a", grav: -30 });
      b.hp -= dt * 7 * (b.landmark ? 0.45 : 1);          // fire eats the structure
      // fire jumps to neighbours — capped so a city burns block by block, not all at once
      if (fireCount < 24 && Math.random() < dt * 0.5) {
        const cxb = b.x + b.w / 2;
        for (const nb of buildings) {
          if (nb === b || nb.rubble || nb.burn > 0) continue;
          if (Math.abs(nb.x + nb.w / 2 - cxb) < (b.w + nb.w) / 2 + 55) {
            nb.burn = 4 + Math.random() * 2.5;
            fireCount++;
            smoke(nb.x + nb.w / 2, GROUND - nb.h, 2);
            break;                                       // one jump per roll
          }
        }
      }
    }
    if (!b.rubble && !b.falling && b.hp <= 0) {
      // ----- randomized destruction physics -----
      // landmarks & squat buildings burst; towers pick a random dramatic death
      const tall = b.h > b.w * 1.4 && !b.landmark;
      const roll = Math.random();
      if (tall && roll < (b.burn > 0 ? 0.5 : 0.28)) {
        // TOPPLE: tips over sideways — falls away from the kaiju into its neighbors
        b.falling = { mode: "topple", t: 0, dur: 0.9, dir: (b.x + b.w / 2) > k.x ? 1 : -1 };
        sfx.crack ? sfx.crack() : sfx.boom();
        shake = Math.max(shake, 4);
        float(b.x + b.w / 2, GROUND - b.h - 14, "TIMBER!", "#ffcc66");
      } else if (tall && roll < 0.5) {
        // PANCAKE: floors drop straight down one after another
        b.falling = { mode: "pancake", t: 0, dur: 0.8, h0: b.h };
        sfx.boom();
        shake = Math.max(shake, 5);
      } else if (tall && roll < 0.72) {
        // SHEAR: top half slices off diagonally and slides away
        b.falling = { mode: "shear", t: 0, dur: 0.85, h0: b.h,
                      topH: b.h * (0.35 + Math.random() * 0.2),
                      dir: (b.x + b.w / 2) > k.x ? 1 : -1 };
        b.h = b.falling.h0 - b.falling.topH;              // stump remains standing (for now)
        sfx.boom();
        shake = Math.max(shake, 4);
        boom(b.x + b.w / 2, GROUND - b.h, "#ccbb99", 10, 100);
      } else if (tall && roll < 0.86) {
        // SINK: foundations fail — the tower sinks into the street, tilting
        b.falling = { mode: "sink", t: 0, dur: 1.1, h0: b.h,
                      dir: Math.random() < 0.5 ? -1 : 1 };
        sfx.boom();
        shake = Math.max(shake, 5);
        float(b.x + b.w / 2, GROUND - b.h - 14, "FOUNDATION FAILURE!", "#ffaa88");
      } else {
        // BURST: blows apart on the spot (always for landmarks/squat blocks)
        finishCollapse(b);
      }
    }
    // animate ongoing falls
    if (b.falling) {
      const f = b.falling;
      f.t += dt;
      const p = Math.min(1, f.t / f.dur);
      if (f.mode === "topple") {
        f.ang = f.dir * Math.pow(p, 2.2) * Math.PI / 2;   // accelerating tip-over
        if (Math.random() < dt * 10) smoke(b.x + b.w / 2 + f.dir * b.h * p * 0.5, GROUND - 10, 1);
      } else if (f.mode === "pancake") {
        b.h = f.h0 * (1 - 0.8 * p);                        // floors compress downward
        if (Math.random() < dt * 14) {
          smoke(b.x + Math.random() * b.w, GROUND - b.h, 1);
          boom(b.x + Math.random() * b.w, GROUND - b.h, "#bbaa88", 3, 60);
        }
      } else if (f.mode === "shear") {
        // detached top block slides sideways and drops, tumbling slightly
        f.sx = f.dir * Math.pow(p, 1.6) * (b.w + 50);
        f.sy = Math.pow(p, 2) * (f.h0 - f.topH + 30);
        f.sang = f.dir * p * 0.5;
        if (Math.random() < dt * 10) smoke(b.x + b.w / 2 + f.sx, GROUND - b.h - f.topH / 2 + f.sy, 1);
      } else if (f.mode === "sink") {
        f.sink = f.h0 * 0.55 * Math.pow(p, 1.5);           // swallowed by the street
        f.ang = f.dir * p * 0.22;                          // slight tilt as it goes down
        if (Math.random() < dt * 12) {
          smoke(b.x + Math.random() * b.w, GROUND - 6, 1);
          boom(b.x + (Math.random() < 0.5 ? -4 : b.w + 4), GROUND - 4, "#8a7a60", 3, 50);
        }
      }
      if (p >= 1) {
        if (f.mode === "topple") {
          // slam into the ground: crush whatever the tower lands on
          const reach = f.dir > 0 ? [b.x + b.w, b.x + b.w + b.h] : [b.x - b.h, b.x];
          let chained = false;
          for (const nb of buildings) {
            if (nb === b || nb.rubble || nb.falling) continue;
            const nbC = nb.x + nb.w / 2;
            if (nbC > reach[0] && nbC < reach[1]) {
              const distF = 1 - Math.abs(nbC - (f.dir > 0 ? b.x + b.w : b.x)) / b.h;
              nb.hp -= nb.maxHp * (0.45 + 0.45 * distF);   // closer = harder hit
              nb.burn = Math.max(nb.burn, 1);
              chained = true;
              boom(nbC, GROUND - nb.h * 0.6, "#ccbb99", 8, 90);
            }
          }
          if (chained) {
            addScore(1500, b.x + b.w / 2 + f.dir * b.h * 0.6, GROUND - 60, "#ffcc44");
            float(b.x + b.w / 2 + f.dir * b.h * 0.6, GROUND - 84, "CHAIN COLLAPSE!", "#ffcc44");
            k.rage = Math.min(100, k.rage + 6 * levelRageBonus());
          }
          // dust wall along the fallen length
          for (let d2 = 0; d2 < 5; d2++) smoke(b.x + b.w / 2 + f.dir * (d2 + 1) * b.h / 5, GROUND - 12, 2);
        } else if (f.mode === "shear") {
          // the sliding top block crushes the immediate neighbor it lands on
          const landX = b.x + b.w / 2 + f.sx;
          for (const nb of buildings) {
            if (nb === b || nb.rubble || nb.falling) continue;
            if (Math.abs(nb.x + nb.w / 2 - landX) < nb.w / 2 + b.w / 2) {
              nb.hp -= nb.maxHp * 0.6;
              nb.burn = Math.max(nb.burn, 1);
              boom(landX, GROUND - nb.h * 0.5, "#ccbb99", 10, 100);
              float(landX, GROUND - nb.h - 20, "CRUSHED!", "#ffcc44");
              addScore(800, landX, GROUND - 60, "#ffcc44");
            }
          }
          smoke(landX, GROUND - 12, 4);
        }
        b.falling = null;
        finishCollapse(b);
      }
    }
  }
  destroyedPct = buildings.filter(b => b.rubble).length / buildings.length;

  // ----- rival kaiju (final city): a corrupted kaiju contests your claim -----
  const finalCity = cityIdx === CITIES.length - 1;
  if (finalCity && !rival && destroyedPct >= 0.3) {
    const base = KAIJUS[(selKaiju + 2) % KAIJUS.length];
    rival = {
      x: kaiju.x < worldW / 2 ? kaiju.x + 620 : kaiju.x - 620,
      hp: 320 + ngPlus * 130, maxHp: 320 + ngPlus * 130,
      dir: 1, walk: 0, hurtT: 0, atkT: 2.5, swipeT: 0, breathT: 0,
      type: { ...base, name: "OMEN " + base.name, body: "#38263f", belly: "#231830", spines: "#b040ff", beam: "#c060ff" }
    };
    rivalWarnT = 3;
    sfx.roar();
    newsAlert("SECOND CREATURE SURFACING", 3);
    float(rival.x, GROUND - 190, rival.type.name + " EMERGES", "#c060ff");
  }
  if (rival && rival.hp > 0) { updateRival(dt); if (state !== S.PLAY) return; }

  // ----- guardian mecha: every city fields its own, and it must be destroyed -----
  if (!boss && destroyedPct >= 0.45) {
    const M = mechOf();
    // later cities field better-prepared defenders
    const hp = Math.round(M.hp * (1 + ngPlus * 0.4) * (1 + cityIdx * 0.045) * DIF().boss);
    boss = { x: kaiju.x < worldW / 2 ? kaiju.x + 520 : kaiju.x - 520, y: 0, w: 90, h: 150,
             hp, maxHp: hp, dir: 1, fireT: 2, laserT: 0, laserCd: 5, walk: 0, hurtT: 0, spec: M };
    bossWarnT = 3;
    sfx.roar();
    newsAlert(M.name + " DEPLOYED TO ENGAGE", 2);
    float(boss.x, GROUND - 180, M.name + " DEPLOYED", M.glow);
  }
  if (boss) updateBoss(dt);

  // ----- level clear -----
  const lmLeft = buildings.filter(b => b.landmark && !b.rubble).length;
  if (lmLeft === 0 && destroyedPct >= CLEAR_PCT && (!boss || boss.hp <= 0) && (!finalCity || !rival || rival.hp <= 0)) {
    state = S.LEVELCLEAR;
    clearTimer = 1.2;
    let bonus = 10000 + Math.round(k.hp * 50);
    if (levelTime < SWIFT_SEC) bonus += 6000;
    // ----- grade: swift + healthy + big combo + first strike -----
    let gp = 0;
    if (levelTime < SWIFT_SEC) gp++;
    if (stats.dmg < k.maxHp * 0.35) gp++;
    if (comboBest >= 15) gp++;
    if (landmarkFirstBonus) gp++;
    const grade = ["C", "B", "A", "A", "S"][gp];
    if (gp > (gradeOf(cityIdx) ?? -1)) {
      bestGrades[CITIES[cityIdx].name] = gp;
      localStorage.setItem("kdGrades", JSON.stringify(bestGrades));
    }
    bonus += gp * 2500;
    const dnaGain = Math.round(score / 40) + gp * 1500;
    dna += dnaGain;
    localStorage.setItem("kdDNA", dna);
    let skinMsg = null;
    if (grade === "S" && unlockSkin(KAIJUS[selKaiju].id, 2)) skinMsg = "GOLDEN skin unlocked!";
    else if ((grade === "A" || grade === "S") && unlockSkin(KAIJUS[selKaiju].id, 1)) skinMsg = "ASHEN skin unlocked!";
    lastRecap = {
      grade, gp, bonus, dnaGain, skinMsg,
      bld: stats.bld, units: stats.units, civs: stats.civs,
      dmg: Math.round(stats.dmg), time: Math.round(levelTime),
      combo: comboBest, swift: levelTime < SWIFT_SEC, first: landmarkFirstBonus
    };
    score += bonus;
    awardXP(Math.round(score / 20) + 800);
    sfx.roar(); sfx.grade();
    return;
  }

  // ----- mid-level events -----
  if (rivalWarnT > 0) rivalWarnT -= dt;
  evtTimer -= dt;
  // the nuclear strike is a scripted beat, not a dice roll: once the city is a
  // third gone it happens, regardless of the ordinary event timer
  if (!evt && !nukedThisLevel && destroyedPct >= 0.32) startEvent("airstrike");
  else if (!evt && evtTimer <= 0 && destroyedPct < CLEAR_PCT - 0.03) startEvent();
  if (evt) updateEvent(dt);

  // ----- army spawning & AI -----
  spawnTimer -= dt;
  const maxUnits = Math.max(2, Math.round((4 + Math.floor(destroyedPct * 8) + cityIdx + ngPlus * 2) * DIF().units));
  // coastal cities: the fleet sits far offshore in the background and shells the
  // creature from over the horizon — three bombardments per level, untouchable
  if (CITIES[cityIdx].navy) {
    const F = navFleet;
    if (!F.seen && destroyedPct > 0.10) {
      F.seen = true;
      newsAlert("NAVAL TASK FORCE SIGHTED OFFSHORE", 1);
    }
    if (F.flashT > 0) F.flashT -= dt;
    if (F.cd > 0) F.cd -= dt;
    if (F.seen && F.volley <= 0 && F.strikes < 3 && F.cd <= 0 &&
        destroyedPct > 0.15 + F.strikes * 0.15) {
      F.volley = 3.2; F.shotT = 0.2; F.strikes++;
      newsAlert("NAVAL BOMBARDMENT INBOUND — CLEAR THE AREA", 2);
    }
    if (F.volley > 0) {
      F.volley -= dt;
      F.shotT -= dt;
      if (F.shotT <= 0) {
        F.shotT = 0.55;
        F.flashT = 0.14;
        navMarks.push({ x: Math.max(60, Math.min(worldW - 60, kaiju.x + (Math.random() - 0.5) * 480)), t: 1.15 });
        snd(46, 0.5, "sawtooth", 0.16, -12);           // the distant gun's thump
      }
      if (F.volley <= 0) F.cd = 9;
    }
    // marked impact points: the shell arrives when the reticle expires
    for (let i = navMarks.length - 1; i >= 0; i--) {
      const mk = navMarks[i];
      mk.t -= dt;
      if (mk.t <= 0) {
        navMarks.splice(i, 1);
        eBullets.push({ x: mk.x + (Math.random() - 0.5) * 26, y: -30,
                        vx: (Math.random() - 0.5) * 40, vy: 400 + Math.random() * 80,
                        grav: 110, dmg: 7, bomb: true, kind: "heshell" });
      }
    }
  }
  if (spawnTimer <= 0 && units.length < maxUnits) {
    spawnUnit();
    spawnTimer = Math.max(0.6, (3 - destroyedPct * 2.5 - cityIdx * 0.2 - ngPlus * 0.35) * DIF().spawn);
  }

  for (const u of units) {
    // terrified by the roar: flee, no firing
    if (u.fearT > 0) {
      u.fearT -= dt;
      const away = -Math.sign(k.x - u.x) || 1;
      if (u.kind === "tank" || u.kind === "arty") u.x += away * 55 * craterSlow(u.x) * dt;
      else if (u.kind === "heli") u.x += away * 85 * dt;
      continue;
    }
    if (u.kind === "tank") {
      // approach then stop and shell
      const dist = k.x - u.x;
      if (Math.abs(dist) > 240) u.x += u.vx * craterSlow(u.x) * dt;
      else u.vx = 0;
      u.fireT -= dt;
      if (u.fireT <= 0 && Math.abs(dist) < 500) {
        u.fireT = 2 + Math.random();
        sfx.tank();
        const a = Math.atan2((GROUND - k.h * 0.6) - GROUND, dist);
        eBullets.push({ x: u.x, y: GROUND - 14, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220 - 60, grav: 120, dmg: 4, kind: "shell" });
      }
    } else if (u.kind === "heli") {
      // each pilot holds a personal standoff so they don't stack into one column,
      // and they reposition slower than any kaiju walks — you can always close in
      const stand = u.stand || (u.stand = 110 + Math.random() * 110);
      const tx = k.x - u.dir * stand;
      u.x += Math.sign(tx - u.x) * Math.min(35, Math.abs(tx - u.x)) * dt * 2;
      u.y += Math.sin(performance.now() / 300 + u.bob) * 8 * dt;
      if (Math.random() < dt * 8) sfx.heli();
      u.fireT -= dt;
      if (u.fireT <= 0 && Math.abs(k.x - u.x) < 420) {
        u.fireT = 1.6;
        const a = Math.atan2((GROUND - k.h * 0.7) - u.y, k.x - u.x);
        eBullets.push({ x: u.x, y: u.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, grav: 0, dmg: 3, kind: "rocket" });
      }
    } else if (u.kind === "jet") {
      u.age = (u.age || 0) + dt;
      u.x += u.vx * dt;
      if (!u.dropped && Math.abs(u.x - k.x) < 90) {
        u.dropped = true;
        eBullets.push({ x: u.x, y: u.y, vx: u.vx * 0.4, vy: 40, grav: 260, dmg: 8, bomb: true, kind: "bomb" });
      }
    } else if (u.kind === "arty") {
      // artillery: stays far away, lobs high-arc shells
      const dist = k.x - u.x;
      if (Math.abs(dist) < 380) u.x -= Math.sign(dist) * 26 * craterSlow(u.x) * dt;
      u.fireT -= dt;
      if (u.fireT <= 0 && Math.abs(dist) < 800) {
        u.fireT = 3 + Math.random();
        sfx.tank();
        const t = 1.6; // flight time
        eBullets.push({ x: u.x, y: GROUND - 12, vx: dist / t, vy: -260, grav: 330, dmg: 6, bomb: true, kind: "heshell" });
      }
    } else if (u.kind === "destroyer") {
      // holds station in the shallows, lobbing shells the length of the city
      u.bobT += dt;
      u.fireT -= dt;
      if (u.fireT <= 0 && Math.abs(k.x - u.x) < 1500) {
        u.fireT = 3.6 + Math.random() * 1.5;
        sfx.tank();
        for (let s2 = 0; s2 < 2; s2++) {
          const t2 = 1.7 + s2 * 0.14;
          const dist2 = (k.x + (Math.random() - 0.5) * 130) - u.x;
          setTimeout(() => { if (state === S.PLAY) {
            eBullets.push({ x: u.x, y: GROUND - 22, vx: dist2 / t2, vy: -330, grav: 330, dmg: 6, bomb: true, kind: "heshell" }); } }, s2 * 220);
        }
      }
    } else if (u.kind === "carrier") {
      // the flat-top: scrambles strike jets, shells when the deck is clear
      u.bobT += dt;
      u.jetT -= dt;
      u.fireT -= dt;
      if (u.jetT <= 0 && units.filter(x2 => x2.kind === "jet").length < 4) {
        u.jetT = 6.5 + Math.random() * 2;
        const d2 = k.x > u.x ? 1 : -1;
        units.push({ kind: "jet", v: milOf().jets[0], x: u.x + d2 * 40, y: 64 + Math.random() * 40,
                     vx: d2 * 240, hp: 3, fireT: 0.5, dir: d2, dropped: false });
        boom(u.x + d2 * 50, GROUND - 40, "#cfe0ea", 6, 60, 0);
      }
      if (u.fireT <= 0 && Math.abs(k.x - u.x) < 1500) {
        u.fireT = 5 + Math.random() * 2;
        const t2 = 1.8, dist2 = k.x - u.x;
        eBullets.push({ x: u.x, y: GROUND - 30, vx: dist2 / t2, vy: -340, grav: 330, dmg: 7, bomb: true, kind: "heshell" });
      }
    } else if (u.kind === "mlrs") {
      // rocket artillery: rolls to standoff range, then ripple-fires a salvo
      const dist0 = k.x - u.x;
      if (Math.abs(dist0) > 460) u.x += u.vx * craterSlow(u.x) * dt;
      u.fireT -= dt;
      if (u.fireT <= 0) {
        u.fireT = 4 + Math.random() * 2;
        for (let s = 0; s < 4; s++) {
          const t = 1.8 + s * 0.12;
          const dist = (k.x + (Math.random() - 0.5) * 140) - u.x;
          setTimeout(() => { if (state === S.PLAY) { sfx.tank();
            eBullets.push({ x: u.x, y: GROUND - 34, vx: dist / t, vy: -320, grav: 340, dmg: 6, bomb: true, kind: "rocket" }); } }, s * 180);
        }
      }
    } else if (u.kind === "walker") {
      // laser walker: stalks you, charges then sweeps a beam
      u.walkT = (u.walkT || 0) + dt * 3;
      const dist = k.x - u.x;
      if (u.chargeT <= 0 && Math.abs(dist) > 200) u.x += Math.sign(dist) * 28 * dt;
      u.fireT -= dt;
      if (u.fireT <= 0 && Math.abs(dist) < 460) {
        u.chargeT = 1.1;              // telegraph
        u.fireT = 6;
      }
      if (u.chargeT > 0) {
        u.chargeT -= dt;
        if (u.chargeT <= 0) {
          // beam strike at kaiju's position
          sfx.breath(); haptic(120, 0.8);
          u.beamX = k.x; u.beamT = 0.35;
          if (Math.abs(k.x - u.beamX) < 55 && k.ultT <= 0) {
            const wd = 12 * dmgTakenMult();
            k.hp -= wd; stats.dmg += wd;
            k.hurtT = 0.3; shake = Math.max(shake, 8);
            boom(k.x, GROUND - 80, "#ff6688", 16, 120);
            if (k.hp <= 0) { endRun(); return; }
          }
        }
      }
      if (u.beamT > 0) u.beamT -= dt;
    }
  }
  units = units.filter(u =>
    u.hp > 0 && (u.kind !== "jet" || (u.age || 0) < 9 || (u.x > camX - 200 && u.x < camX + W + 200)));

  // ----- civilians & cars -----
  for (const c of civilians) {
    if (c.dead) continue;
    if (!c.panic && Math.abs(c.x - k.x) < 220) c.panic = true;
    if (c.panic) {
      const away = Math.sign(c.x - k.x) || 1;
      c.vx = away * (c.kind === "car" ? 130 : 55);
      c.x += c.vx * dt;
    }
    // squashed by kaiju stomps/dashes or walking over them
    if (Math.abs(c.x - k.x) < (k.stompT > 0.55 ? 90 : k.dashT > 0 ? 70 : 22)) {
      c.dead = true;
      addScore(c.kind === "car" ? (CITIES[cityIdx].vehicle === "bus" || CITIES[cityIdx].vehicle === "cablecar" ? 300 : 150) : 50, c.x, GROUND - 22, "#ffaa88");
      stats.civs++;
      boom(c.x, GROUND - 6, c.kind === "car" ? (c.color || "#c04040") : "#ff9977", 6, 60);
      haptic(20, 0.3);
    }
    if (c.x < 20 || c.x > worldW - 20) c.dead = true; // escaped
  }
  civilians = civilians.filter(c => !c.dead);

  // ----- enemy bullets -----
  for (const b of eBullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.vy += (b.grav || 0) * dt;
    // hit kaiju?
    if (Math.abs(b.x - k.x) < k.w / 2 && b.y > GROUND - k.h && b.y < GROUND) {
      b.dead = true;
      if (k.ultT <= 0) {          // invulnerable mid-ultimate
        const dmg = b.dmg * (1 + cityIdx * 0.12 + ngPlus * 0.35) * dmgTakenMult();
        k.hp -= dmg;
        stats.dmg += dmg;
        k.hurtT = 0.25;
      }
      sfx.hit();
      haptic(b.bomb ? 80 : 35, b.bomb ? 0.8 : 0.4);
      boom(b.x, b.y, "#ff8844", 8, 80);
      shake = Math.max(shake, b.bomb ? 8 : 3);
      if (k.hp <= 0) { endRun(); return; }
    }
    if (b.y >= GROUND) { b.dead = true; boom(b.x, GROUND, "#ff8844", b.bomb ? 18 : 6, b.bomb ? 140 : 60); if (b.bomb) { sfx.boom(); shake = Math.max(shake, 6); } }
  }
  // arcing ordnance (naval and artillery shells) may legitimately fly in from
  // far off-screen — cull those against the world, everything else against the camera
  eBullets = eBullets.filter(b => !b.dead &&
    (b.kind === "heshell" || b.kind === "missile"
      ? b.x > -300 && b.x < worldW + 300
      : b.x > camX - 100 && b.x < camX + W + 100));

  // ----- thrown helicopters -----
  for (const t of kBullets) {
    t.x += t.vx * dt; t.y += t.vy * dt;
    t.vy += 320 * dt;
    t.spin += dt * 12;
    let hitB = false;
    for (const b of buildings)
      if (!b.rubble && t.x > b.x && t.x < b.x + b.w && t.y > GROUND - b.h) { hitB = true; break; }
    if (t.y >= GROUND - 4 || hitB) {
      t.dead = true;
      sfx.boom();
      shake = Math.max(shake, 9);
      haptic(80, 0.7);
      aberrT = Math.max(aberrT, 0.25);
      boom(t.x, t.y, t.rock ? "#ccbb99" : "#ffaa55", 26, 170);
      hitBuildings(t.x, 110, t.rock ? 190 : 140);
      for (const u of units) if (Math.abs(u.x - t.x) < 130) damageUnit(u, t.rock ? 8 : 6);
      addScore(1000, t.x, t.y - 20, "#aaddff");
    }
  }
  kBullets = kBullets.filter(t => !t.dead && t.x > -100 && t.x < worldW + 100);

  // ----- powerups -----
  for (const p of powerups) {
    p.t -= dt;
    if (Math.abs(p.x - k.x) < 60) {
      p.dead = true;
      sfx.pickup();
      if (p.kind === "heal") { k.hp = Math.min(k.maxHp, k.hp + 20); float(k.x, GROUND - k.h - 16, "+20 HP", "#66ff88"); }
      else { k.rage = Math.min(100, k.rage + 35); float(k.x, GROUND - k.h - 16, "+RAGE", "#66eeff"); }
    }
  }
  powerups = powerups.filter(p => !p.dead && p.t > 0);

  // ----- particles & floaters -----
  for (const pt of particles) {
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vy += (pt.grav != null ? pt.grav : 200) * dt;
    pt.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  trimParticles();
  for (const f of floaters) { f.y -= 26 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);

  // ----- camera -----
  const target = k.x - W / 2;
  camX += (target - camX) * Math.min(1, dt * 5);
  camX = Math.max(0, Math.min(worldW - W, camX));
}

function endRun() {
  state = S.OVER;
  awardXP(Math.round(score / 40));
  haptic(300, 1);
  if (score > hiscore) { hiscore = score; localStorage.setItem("kdHi", hiscore); }
}

function updateBoss(dt) {
  const b = boss, k = kaiju;
  if (b.hp <= 0) return;
  b.walk += dt * 2.5;
  if (b.hurtT > 0) b.hurtT -= dt;
  const dist = k.x - b.x;
  b.dir = Math.sign(dist) || 1;
  if (Math.abs(dist) > 240 && b.laserT <= 0) b.x += b.dir * 42 * dt;

  // missile volleys
  b.fireT -= dt;
  if (b.fireT <= 0) {
    b.fireT = 2.6;
    sfx.tank();
    for (let i = 0; i < 2; i++) {
      const t = 1.3 + i * 0.2;
      eBullets.push({ x: b.x + b.dir * 30, y: GROUND - 120, vx: dist / t + (Math.random() - 0.5) * 40, vy: -160, grav: 260, dmg: 6, bomb: true, kind: "missile" });
    }
  }
  // sweeping chest laser
  b.laserCd -= dt;
  if (b.laserCd <= 0 && Math.abs(dist) < 420) {
    b.laserCd = 7;
    b.laserT = 1.4;
    sfx.breath();
  }
  if (b.laserT > 0) {
    b.laserT -= dt;
    // beam tracks kaiju slowly
    b.beamX = (b.beamX == null ? b.x + b.dir * 200 : b.beamX) + Math.sign(k.x - (b.beamX || 0)) * 130 * dt;
    if (Math.abs(k.x - b.beamX) < 45 && k.ultT <= 0) {
      const ld = 16 * dt * dmgTakenMult();
      k.hp -= ld; stats.dmg += ld;
      k.hurtT = 0.15;
      if (Math.random() < dt * 10) boom(k.x, GROUND - 90, "#ff4477", 4, 60);
      if (k.hp <= 0) { endRun(); return; }
    }
    hitBuildings(b.beamX, 30, 60 * dt);
  } else b.beamX = null;

  // kaiju attacks damage the boss
  if (k.swipeT > 0.35 && Math.abs(k.x + k.facing * 70 - b.x) < 100) { b.hp -= meleeP() * 0.06; b.hurtT = 0.2; }
  if (k.stompT > 0.7 && Math.abs(k.x - b.x) < 170) { b.hp -= 4; b.hurtT = 0.2; }
  if (k.breathT > 0 || k.whirlT > 0 || k.dashT > 0 || k.ultT > 0) {
    const reach = k.ultT > 0 ? 300 : k.type.special === "beam" ? 400 : 170;
    const inFront = k.ultT > 0 ? true : k.type.special === "beam" ? (b.x - k.x) * k.facing > 0 : true;
    if (Math.abs(b.x - k.x) < reach && inFront) { b.hp -= (k.ultT > 0 ? 60 : 22) * dt; b.hurtT = 0.1; }
  }

  if (b.hp <= 0) {
    const M = b.spec || mechOf();
    addScore(15000, b.x, GROUND - 160, M.glow);
    float(b.x, GROUND - 190, M.name + " DESTROYED!", "#ffdd44");
    newsAlert(M.name + " DESTROYED — CITY DEFENCELESS", 3);
    boom(b.x, GROUND - 80, M.glow, 60, 260, 120);
    boom(b.x, GROUND - 40, "#ffcc66", 40, 200);
    sfx.roar(); sfx.boom();
    shake = 18;
    haptic(400, 1);
    aberrT = Math.max(aberrT, 0.6);
    kaiju.rage = 100;
  }
}

// ---------- Rival kaiju (final city mirror-match) ----------
function updateRival(dt) {
  const r = rival, k = kaiju;
  r.walk += dt * 4;
  if (r.hurtT > 0) r.hurtT -= dt;
  if (r.swipeT > 0) r.swipeT -= dt;
  if (r.breathT > 0) r.breathT -= dt;
  const dist = k.x - r.x;
  r.dir = Math.sign(dist) || 1;
  if (Math.abs(dist) > 110 && r.breathT <= 0) r.x += r.dir * 78 * dt;
  r.x = Math.max(60, Math.min(worldW - 60, r.x));
  r.atkT -= dt;
  if (r.atkT <= 0) {
