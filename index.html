    if (Math.abs(dist) < 130) { r.swipeT = 0.5; r.atkT = 1.5; }
    else if (Math.abs(dist) < 480) { r.breathT = 1.1; r.atkT = 3.2; sfx.breath(); }
    else r.atkT = 0.8;
  }
  // rival hits the kaiju
  if (r.swipeT > 0.25 && Math.abs(k.x - (r.x + r.dir * 60)) < 90 && k.ultT <= 0) {
    const d = 46 * dt * dmgTakenMult();
    k.hp -= d; stats.dmg += d; k.hurtT = 0.15;
    if (Math.random() < dt * 12) boom(k.x, GROUND - 90, "#c060ff", 4, 60);
    if (k.hp <= 0) { endRun(); return; }
  }
  if (r.breathT > 0) {
    if ((k.x - r.x) * r.dir > 0 && Math.abs(k.x - r.x) < 420 && k.ultT <= 0) {
      const d = 13 * dt * dmgTakenMult();
      k.hp -= d; stats.dmg += d; k.hurtT = 0.12;
      if (Math.random() < dt * 8) boom(k.x, GROUND - 80, r.type.beam, 4, 60);
      if (k.hp <= 0) { endRun(); return; }
    }
    hitBuildings(r.x + r.dir * 220, 40, 40 * dt); // it wrecks the city too
  }
  // kaiju hits the rival
  if (k.swipeT > 0.35 && Math.abs(k.x + k.facing * 70 - r.x) < 100) { r.hp -= meleeP() * 0.06; r.hurtT = 0.2; }
  if (k.stompT > 0.7 && Math.abs(k.x - r.x) < 170) { r.hp -= 4; r.hurtT = 0.2; }
  if (k.breathT > 0 || k.whirlT > 0 || k.dashT > 0 || k.ultT > 0) {
    const reach = k.ultT > 0 ? 300 : k.type.special === "beam" ? 400 : 170;
    const inFront = k.ultT > 0 ? true : k.type.special === "beam" ? (r.x - k.x) * k.facing > 0 : true;
    if (Math.abs(r.x - k.x) < reach && inFront) { r.hp -= (k.ultT > 0 ? 55 : 20) * dt; r.hurtT = 0.1; }
  }
  if (r.hp <= 0) {
    addScore(20000, r.x, GROUND - 160, "#c060ff");
    float(r.x, GROUND - 190, r.type.name + " DEFEATED!", "#ffdd44");
    newsAlert("RIVAL CREATURE DOWN", 3);
    boom(r.x, GROUND - 80, "#c060ff", 60, 260, 120);
    boom(r.x, GROUND - 40, "#ffcc66", 40, 200);
    sfx.roar(); sfx.boom();
    shake = 16; haptic(400, 1);
    aberrT = Math.max(aberrT, 0.6);
    kaiju.rage = 100;
    dna += 2500;
    localStorage.setItem("kdDNA", dna);
  }
}

// ---------- Mid-level events ----------
let nukedThisLevel = false;
function startEvent(force) {
  const kind = force || ["convoy", "airstrike"][Math.floor(Math.random() * 2)];
  if (kind === "airstrike") nukedThisLevel = true;
  if (kind === "convoy") {
    const fromLeft = kaiju.x > worldW / 2;
    const x0 = fromLeft ? camX - 100 : camX + W + 100;
    const vx = fromLeft ? 90 : -90;
    evt = { kind, t: 20, trucks: [0, 1, 2, 3].map(i => ({ x: x0 - vx * i * 0.7, vx, dead: false })) };
    newsAlert("GOVERNMENT CONVOY EVACUATING", 1);
    float(kaiju.x, 100, "⚑ CONVOY ESCAPING — SMASH IT!", "#ffcc44");
  } else if (kind === "airstrike") {
    // tactical nuclear strike: bomber run, freefall, then a full detonation sequence
    const fromLeft = kaiju.x > worldW / 2;
    evt = { kind, t: 5.2, x: kaiju.x, phase: "warn",
            bomberX: fromLeft ? kaiju.x - 900 : kaiju.x + 900,
            bomberV: fromLeft ? 340 : -340,
            bombX: 0, bombY: 0, bombV: 0, flash: 0, blast: 0, ring: 0, cloud: 0, mush: 0 };
    newsAlert("NUCLEAR RELEASE AUTHORISED", 3);
    float(kaiju.x, 100, "☢ TACTICAL NUKE INBOUND — RUN! ☢", "#ff5544");
    sfx.tank();
  }
}
function AIR(u) { return u.kind === "heli" || u.kind === "jet"; }
function kaijuHits(x, r) {  // is the kaiju currently attacking near x?
  const k = kaiju;
  return (k.swipeT > 0.35 && Math.abs(k.x + k.facing * 70 - x) < r + 40) ||
         (k.stompT > 0.7 && Math.abs(k.x - x) < r + 120) ||
         (k.dashT > 0 && Math.abs(k.x - x) < r + 70) ||
         (k.breathT > 0 && (x - k.x) * k.facing > 0 && Math.abs(x - k.x) < 380) ||
         (k.ultT > 0 && Math.abs(k.x - x) < 300);
}
function updateEvent(dt) {
  const e = evt, k = kaiju;
  e.t -= dt;
  if (e.kind === "convoy") {
    let alive = 0;
    for (const tr of e.trucks) {
      if (tr.dead) continue;
      tr.x += tr.vx * craterSlow(tr.x) * dt;
      if (kaijuHits(tr.x, 20)) {
        tr.dead = true;
        addScore(1500, tr.x, GROUND - 30, "#ffcc44");
        boom(tr.x, GROUND - 14, "#ff9944", 14, 120);
        sfx.boom();
        k.rage = Math.min(100, k.rage + 8);
        dna += 300;
        float(tr.x, GROUND - 46, "+300 EVO", "#66ff88");
      } else if (tr.x < -150 || tr.x > worldW + 150) tr.dead = true; // escaped
      else alive++;
    }
    if (!alive || e.t <= 0) { evt = null; evtTimer = 20 + Math.random() * 10; }
  } else if (e.kind === "airstrike") {
    if (e.phase === "warn") {
      // bomber runs in; the target box stays locked where the warning was called
      e.bomberX += e.bomberV * dt;
      if (Math.abs(e.bomberX - e.x) < 30) {
        e.phase = "fall";
        e.bombX = e.bomberX; e.bombY = 70; e.bombV = 40;
        sfx.tank();
      }
    } else if (e.phase === "fall") {
      e.bomberX += e.bomberV * dt;
      e.bombV += 460 * dt;                              // free fall — no retarding chute
      e.bombY += e.bombV * dt;
      // it steers onto the ground-zero reticle it was marked against, so the
      // warning and the detonation happen in the same place
      e.bombX += (e.x - e.bombX) * Math.min(1, 3.4 * dt);
      if (e.bombY >= GROUND - 26) {
        e.phase = "detonate";
        e.flash = 1; e.blast = 0; e.ring = 0; e.cloud = 0; e.mush = 0;
        e.gz = e.bombX;                                  // ground zero
        sfx.boom(); sfx.roar();
        shake = 30; haptic(600, 1); aberrT = 1.2;
        boom(e.gz, GROUND - 20, "#ffffff", 60, 420, 40);
        boom(e.gz, GROUND - 10, "#ffcc55", 50, 300, 90);
        craters.push({ x: e.gz, r: 150 });
        // the fireball itself: everything close is simply gone
        for (const bd of buildings) {
          if (bd.rubble) continue;
          const d2 = Math.abs(bd.x + bd.w / 2 - e.gz);
          if (d2 < 150) { bd.hp = -1; bd.burn = 6; }
          else if (d2 < 340) { bd.hp -= 260 * (1 - (d2 - 150) / 190); bd.burn = Math.max(bd.burn, 4); }
          else if (d2 < 520) bd.burn = Math.max(bd.burn, 2);
        }
        for (const u of units) if (Math.abs(u.x - e.gz) < 420 && u.kind !== "walker") u.hp = 0;
        for (const c of civilians) {
          if (Math.abs(c.x - e.gz) < 380) c.dead = true;
          else if (Math.abs(c.x - e.gz) < 900) c.panic = true;
        }
        // the kaiju itself takes serious damage inside the blast radius
        const kd2 = Math.abs(k.x - e.gz);
        if (kd2 < 420 && k.ultT <= 0) {
          const dmg2 = (46 - kd2 / 14) * dmgTakenMult();
          k.hp -= dmg2; stats.dmg += dmg2; k.hurtT = 0.8;
          float(k.x, GROUND - 150, "-" + Math.round(dmg2) + " IRRADIATED", "#ff6644");
          if (k.hp <= 0) { endRun(); return; }
        }
      }
    } else {
      // detonation: flash → shockwave ring → rising mushroom column
      e.flash = Math.max(0, e.flash - dt * 2.2);
      e.blast += dt;
      e.ring += dt * 900;                                // shockwave expands fast
      e.cloud += dt;
      e.mush = Math.min(1, e.mush + dt * 0.45);
      // the shockwave keeps knocking things down as it passes
      if (e.blast < 1.4) {
        for (const bd of buildings) {
          if (bd.rubble) continue;
          const d2 = Math.abs(bd.x + bd.w / 2 - e.gz);
          if (Math.abs(d2 - e.ring) < 50) bd.hp -= 220 * dt;
        }
        shake = Math.max(shake, 12 * (1.4 - e.blast));
      }
      if (e.cloud > 5.5) { evt = null; evtTimer = 26 + Math.random() * 10; }
    }
  }
}
function drawEvent() {
  const e = evt;
  if (e.kind === "convoy") {
    for (const tr of e.trucks) {
      if (tr.dead) continue;
      ctx.fillStyle = "#4a5540";
      ctx.fillRect(tr.x - 16, GROUND - 18, 32, 12);
      ctx.fillRect(tr.x - 10, GROUND - 24, 16, 7);
      ctx.fillStyle = "#222";
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(tr.x + i * 10, GROUND - 5, 4, 0, 7); ctx.fill(); }
      ctx.fillStyle = "#ffdd44"; ctx.font = "bold 10px monospace"; ctx.textAlign = "center";
      ctx.fillText("$", tr.x, GROUND - 28);
    }
  } else if (e.kind === "airstrike") {
    const now2 = performance.now();
    if (e.phase === "warn" || e.phase === "fall") {
      // blinking ground-zero reticle
      if (Math.floor(now2 / 160) % 2) {
        ctx.strokeStyle = "#ff5544"; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
        ctx.beginPath(); ctx.arc(e.x, GROUND - 6, 120, 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.arc(e.x, GROUND - 6, 60, 0, 7); ctx.stroke();
        ctx.setLineDash([]); ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(e.x - 140, GROUND - 6); ctx.lineTo(e.x + 140, GROUND - 6);
        ctx.moveTo(e.x, GROUND - 146); ctx.lineTo(e.x, GROUND + 20);
        ctx.stroke();
      }
      ctx.fillStyle = "#ff5544"; ctx.font = "bold 13px monospace"; ctx.textAlign = "center";
      ctx.fillText("☢ NUCLEAR RELEASE — GROUND ZERO ☢", e.x, GROUND - 150);
      ctx.font = "bold 11px monospace";
      ctx.fillText(e.phase === "fall" ? "WEAPON AWAY" : "T-" + Math.max(0, e.t).toFixed(1), e.x, GROUND - 136);
      // the strategic bomber
      const bx2 = e.bomberX, bd2 = Math.sign(e.bomberV);
      ctx.fillStyle = "#4a5260";
      ctx.beginPath();
      ctx.moveTo(bx2 + bd2 * 34, 66); ctx.lineTo(bx2 - bd2 * 30, 62);
      ctx.lineTo(bx2 - bd2 * 30, 72); ctx.lineTo(bx2 + bd2 * 30, 74);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#3c4450";                        // swept wing + tail
      ctx.beginPath();
      ctx.moveTo(bx2 + bd2 * 8, 68); ctx.lineTo(bx2 - bd2 * 26, 86);
      ctx.lineTo(bx2 - bd2 * 38, 84); ctx.lineTo(bx2 - bd2 * 6, 68);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx2 - bd2 * 22, 62); ctx.lineTo(bx2 - bd2 * 34, 48);
      ctx.lineTo(bx2 - bd2 * 26, 62);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(220,230,240,0.3)";        // contrails
      ctx.beginPath();
      ctx.moveTo(bx2 - bd2 * 30, 66); ctx.lineTo(bx2 - bd2 * 150, 64);
      ctx.moveTo(bx2 - bd2 * 30, 72); ctx.lineTo(bx2 - bd2 * 140, 74);
      ctx.stroke();
      if (e.phase === "fall") {                          // the falling device
        const vy2 = Math.max(20, e.bombV || 20);
        const vx2 = (e.x - e.bombX) * 3.4;
        ctx.save();
        ctx.translate(e.bombX, e.bombY);
        ctx.rotate(Math.atan2(vy2, vx2) - Math.PI / 2);  // always nose-first
        ctx.fillStyle = "#c8ccd4";
        ctx.beginPath(); ctx.ellipse(0, 0, 5, 12, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#e8c84a";                       // live-ordnance band
        ctx.fillRect(-5, -5, 10, 2.5);
        ctx.fillStyle = "#8a9098";                       // tail fins
        ctx.fillRect(-6, 8, 12, 3);
        ctx.fillRect(-1.5, 8, 3, 8);
        ctx.fillStyle = "#3a3f48";                       // nose
        ctx.beginPath();
        ctx.moveTo(-4, -9); ctx.lineTo(0, -15); ctx.lineTo(4, -9);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        // speed streak trailing straight up behind it
        const st = ctx.createLinearGradient(e.bombX, e.bombY - 18, e.bombX, e.bombY - 90);
        st.addColorStop(0, "rgba(255,255,255,0.30)");
        st.addColorStop(1, "rgba(255,255,255,0)");
        ctx.strokeStyle = st; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(e.bombX, e.bombY - 16); ctx.lineTo(e.bombX - vx2 * 0.05, e.bombY - 90);
        ctx.stroke(); ctx.lineWidth = 1;
      }
    } else {
      const gz = e.gz, T = e.cloud;
      // 1. the initial fireball, collapsing into the stem
      if (T < 1.2) {
        const fr = 40 + T * 210;
        const fg = ctx.createRadialGradient(gz, GROUND - 40 - T * 40, 2, gz, GROUND - 40 - T * 40, fr);
        fg.addColorStop(0, "rgba(255,255,255," + Math.max(0, 1 - T) + ")");
        fg.addColorStop(0.4, "rgba(255,220,110," + Math.max(0, 0.9 - T * 0.7) + ")");
        fg.addColorStop(1, "rgba(255,90,30,0)");
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(gz, GROUND - 40 - T * 40, fr, 0, 7); ctx.fill();
      }
      // 2. the mushroom: rising stem topped by a boiling cap
      const mh = e.mush;
      const stemTop = GROUND - 40 - mh * 300;
      const stemW = 26 + mh * 22;
      ctx.fillStyle = "rgba(190,150,110,0.75)";
      ctx.beginPath();
      ctx.moveTo(gz - stemW * 1.5, GROUND);
      ctx.quadraticCurveTo(gz - stemW * 0.5, GROUND - 120 * mh, gz - stemW * 0.6, stemTop);
      ctx.lineTo(gz + stemW * 0.6, stemTop);
      ctx.quadraticCurveTo(gz + stemW * 0.5, GROUND - 120 * mh, gz + stemW * 1.5, GROUND);
      ctx.closePath(); ctx.fill();
      // billowing cap
      const capR = 30 + mh * 120;
      ctx.fillStyle = "rgba(214,176,128,0.85)";
      for (let i = 0; i < 9; i++) {
        const a2 = (i / 9) * Math.PI * 2 + now2 / 2600;
        ctx.beginPath();
        ctx.arc(gz + Math.cos(a2) * capR * 0.72, stemTop - 18 + Math.sin(a2) * capR * 0.3,
                capR * 0.46, 0, 7);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(255,206,140,0.5)";           // hot underside of the cap
      for (let i = 0; i < 5; i++) {
        const a2 = Math.PI + (i / 4) * Math.PI;
        ctx.beginPath();
        ctx.arc(gz + Math.cos(a2) * capR * 0.6, stemTop + 4 + Math.sin(a2) * capR * 0.12, capR * 0.3, 0, 7);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(255,240,190,0.28)";          // glow still burning in the core
      ctx.beginPath(); ctx.arc(gz, stemTop - 14, capR * 0.4 * Math.max(0, 1.4 - T * 0.4), 0, 7); ctx.fill();
      // 3. base surge — dust rolling outward along the ground
      const surge = Math.min(1, T / 2.2);
      ctx.fillStyle = "rgba(196,170,132," + (0.5 * (1 - surge * 0.7)) + ")";
      ctx.beginPath();
      ctx.ellipse(gz, GROUND - 12, 90 + surge * 460, 26 + surge * 34, 0, 0, 7);
      ctx.fill();
      // 4. the expanding shock ring
      if (e.blast < 1.5) {
        ctx.strokeStyle = "rgba(255,255,255," + Math.max(0, 0.55 - e.blast * 0.38) + ")";
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.ellipse(gz, GROUND - 30, e.ring, e.ring * 0.34, 0, 0, 7); ctx.stroke();
        ctx.lineWidth = 1;
      }
      // 5. whiteout flash across the whole screen
      if (e.flash > 0) {
        ctx.fillStyle = "rgba(255,255,250," + Math.min(1, e.flash) * (OPT.reduceFlash ? 0.25 : 1) + ")";
        ctx.fillRect(camX - 100, -100, W + 200, H + 200);
      }
      ctx.fillStyle = "#ffdd66"; ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
      if (T < 3) ctx.fillText("☢ GROUND ZERO ☢", gz, GROUND - 40 - mh * 320);
    }
  }
}

function hitBuildings(x, range, dmg) {
  for (const b of buildings) {
    if (b.rubble) continue;
    const cx = b.x + b.w / 2;
    if (Math.abs(cx - x) < range + b.w / 2) {
      // landmarks are reinforced: they take a fraction of the damage an ordinary
      // block would, so bringing one down is a sustained assault you can watch
      b.hp -= dmg * (b.landmark ? 0.45 : 1);
      if (Math.random() < 0.3) b.burn = Math.max(b.burn, 1.5);
      boom(x + (Math.random() - 0.5) * 30, GROUND - Math.random() * b.h, "#ccbb99", 4, 70);
      shake = Math.max(shake, 2);
    }
  }
}

function damageUnit(u, dmg) {
  u.hp -= dmg;
  if (u.hp <= 0 && !u.scored) {
    u.scored = true;
    stats.units++;
    if (stats.units === 10) pushNews("armed forces taking heavy losses · reinforcements requested");
    if (stats.units === 25) pushNews("general retreat ordered — the creature cannot be stopped");
    const ptsMap = { tank: 300, heli: 500, jet: 800, arty: 600, mlrs: 2500, destroyer: 1800, carrier: 3200, walker: 4000 };
    const pts = ptsMap[u.kind] || 300;
    const uy = (u.kind === "heli" || u.kind === "jet") ? u.y : GROUND - 24;
    addScore(pts, u.x, uy - 10, "#ffdd44");
    kaiju.rage = Math.min(100, kaiju.rage + 6 * levelRageBonus());
    const vamp = mutRank("vamp");
    if (vamp) kaiju.hp = Math.min(kaiju.maxHp, kaiju.hp + 2 * vamp);
    boom(u.x, uy, "#ff9944", u.kind === "mlrs" || u.kind === "walker" ? 30 : 16, 130);
    sfx.boom();
    haptic(50, 0.5);
  }
}

// ---------- Draw ----------
function draw() {
  const city = CITIES[cityIdx % CITIES.length];
  ctx.save();
  if (shake > 0 && (state === S.PLAY || state === S.INTRO)) {
    const sh = state === S.INTRO ? Math.min(shake, 1.2) : shake;   // keep intro titles readable
    ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  }

  drawSky(city);

  if (state === S.SETTINGS) { drawSettingsScreen(); ctx.restore(); return; }
  if (state === S.MENU) { drawMenu(); ctx.restore(); return; }
  if (state === S.SELECT) { drawSelect(); ctx.restore(); return; }
  if (state === S.MAP) { drawMap(); ctx.restore(); return; }

  ctx.save();
  if (killCam) {                       // punch-in zoom toward the collapse
    const p = Math.min(1, (1.8 - killCam.t) / 0.35);
    const z = 1 + 0.5 * p, yc = GROUND - 110;
    ctx.translate(W / 2, yc); ctx.scale(z, z);
    ctx.translate(-(killCam.x - camX), -yc);
  }
  ctx.translate(-camX, 0);

  drawBackdrop(city);
  drawBuildings(city);
  if (QUALITY[qTier].shimmer) drawHeatShimmer();

  drawGroundStrip(city);
  drawCivilians();
  drawPowerups();
  drawUnits();
  if (evt) drawEvent();
  if (boss && boss.hp > 0) drawBoss();
  if (rival && rival.hp > 0) {
    drawKaijuModel(rival.type, rival.x, GROUND, rival.dir, {
      walk: rival.walk, swipeT: rival.swipeT, swipeKind: 1,
      breathing: rival.breathT > 0,
      hurt: rival.hurtT > 0 && Math.floor(performance.now() / 60) % 2,
      rage: 70, scale: 1
    });
  }
  drawKaiju();
  drawBullets();
  drawParticles();

  // floaters
  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.font = "bold 13px monospace";
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawWeather(city);
  if (state === S.PLAY || state === S.PAUSE || state === S.LEVELCLEAR || state === S.INTRO) drawPhotoFilter(city);
  if (state === S.INTRO) {
    drawIntro(city);
    ctx.restore();
    return;
  }
  drawHUD(city);

  if (killCam && state === S.PLAY) {   // cinematic bars during the kill cam
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, 30); ctx.fillRect(0, H - 30, W, 30);
    ctx.textAlign = "center"; ctx.fillStyle = "#ffdd44"; ctx.font = "bold 13px monospace";
    ctx.fillText("FINAL TARGET ELIMINATED", W / 2, 20);
  }
  if (ngPlus > 0 && (state === S.PLAY || state === S.PAUSE)) {
    ctx.textAlign = "right"; ctx.fillStyle = "#ff66aa"; ctx.font = "bold 10px monospace";
    ctx.fillText("NEW GAME+" + ngPlus + " · score x" + (1 + ngPlus * 0.5).toFixed(1), W - 8, H - 8);
  }
  if (rivalWarnT > 0 && Math.floor(performance.now() / 300) % 2) {
    ctx.textAlign = "center";
    ctx.fillStyle = "#c060ff";
    ctx.font = "bold 22px monospace";
    ctx.fillText("⚠ RIVAL KAIJU EMERGING ⚠", W / 2, 118);
  }

  if (bossWarnT > 0 && Math.floor(performance.now() / 300) % 2) {
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff4477";
    ctx.font = "bold 22px monospace";
    ctx.fillText("⚠ " + (boss && boss.spec ? boss.spec.name : "GUARDIAN MECHA") + " INBOUND ⚠", W / 2, 92);
  }

  if (state === S.PAUSE) drawPauseMenu();
  if (state === S.LEVELCLEAR) drawRecap(city);
  if (state === S.SHOP) drawShop();
  if (state === S.OVER) {
    overlay(kaiju.type.name + " HAS FALLEN", "#ff4455",
      "score " + score + (score >= hiscore && score > 0 ? "  ★ NEW BEST ★" : "  ·  best " + hiscore) + "\n" + hint("confirm") + " to rise again");
  }
  if (state === S.WIN) {
    overlay("THE WORLD TREMBLES", "#ffdd44",
      "all ten cities razed  ·  final score " + score + "\nNEW GAME+" + ngNext + " unlocked — tougher armies, remixed skies, score x" + (1 + ngNext * 0.5).toFixed(1) + "\ntap / SPACE to rampage again");
  }
  ctx.restore();
  applyAberration();
}

// ---------- Screen-space FX ----------
function applyAberration() {
  if (aberrT <= 0) return;
  aberrT = Math.max(0, aberrT - 1 / 60);
  const off = 4 + aberrT * 14;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = Math.min(0.3, aberrT * 0.45);
  ctx.drawImage(cv, off, 0);
  ctx.drawImage(cv, -off, 0);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

function drawHeatShimmer() {
  const t = performance.now() / 180;
  ctx.strokeStyle = "rgba(255,255,255,0.07)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const b of buildings) {
    if (b.rubble || b.burn <= 0) continue;
    if (b.x < camX - 60 || b.x > camX + W + 60) continue;
    const bx = b.x + b.w / 2, top = GROUND - b.h;
    for (let i = -1; i <= 1; i++) {
      const xo = bx + i * 11;
      ctx.moveTo(xo + Math.sin(t + i) * 3, top - 4);
      ctx.quadraticCurveTo(xo + Math.sin(t * 1.4 + i) * 7, top - 24, xo + Math.sin(t * 0.8 + i * 2) * 4, top - 44);
    }
  }
  ctx.stroke();
  ctx.lineWidth = 1;
}

function drawSpotlight() {
  const lm = buildings.find(b => b.landmark);
  if (!lm) return;
  const cx2 = lm.x + lm.w / 2, top2 = GROUND - lm.h;
  const g2 = ctx.createLinearGradient(cx2, top2 - 60, cx2, GROUND);
  g2.addColorStop(0, "rgba(255,240,180,0.32)");
  g2.addColorStop(1, "rgba(255,240,180,0)");
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.moveTo(cx2 - 16, top2 - 70);
  ctx.lineTo(cx2 + 16, top2 - 70);
  ctx.lineTo(cx2 + lm.w * 1.1, GROUND);
  ctx.lineTo(cx2 - lm.w * 1.1, GROUND);
  ctx.closePath(); ctx.fill();
}

function drawIntro(city) {
  // letterbox bars
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, 42);
  ctx.fillRect(0, H - 42, W, 42);
  ctx.textAlign = "center";
  const a = Math.min(1, introT / 0.6);
  ctx.globalAlpha = a;
  ctx.fillStyle = city.tint;
  ctx.font = "bold 34px monospace";
  ctx.fillText(city.name, W / 2, 95);
  ctx.fillStyle = "#ccd";
  ctx.font = "12px monospace";
  ctx.fillText(city.sub + "  ·  " + city.time.toUpperCase() +
    (city.weather !== "clear" ? "  ·  " + city.weather.toUpperCase() : ""), W / 2, 116);
  if (introT > 0.8) {
    const names = buildings.filter(b => b.landmark).map(b => b.lmName);
    // backing panel — the target list was unreadable over a lit skyline
    ctx.globalAlpha = a * 0.82;
    ctx.fillStyle = "#06080f";
    ctx.fillRect(0, H - 96, W, 54);
    ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(255,221,68,0.5)";
    ctx.fillRect(0, H - 96, W, 1);
    ctx.fillStyle = "#ffdd44";
    ctx.font = "bold 11px monospace";
    ctx.fillText("▼ TARGETS ▼", W / 2, H - 84);
    ctx.font = "bold 10px monospace";
    ctx.fillText(names.slice(0, 3).join("  ·  ").toUpperCase(), W / 2, H - 70);
    if (names.length > 3) ctx.fillText(names.slice(3).join("  ·  ").toUpperCase(), W / 2, H - 58);
    ctx.fillStyle = "#aab";
    ctx.font = "10px monospace";
    ctx.fillText("raze all " + names.length + " landmarks + " + Math.round(CLEAR_PCT * 100) + "% of the city", W / 2, H - 44);
    ctx.fillStyle = "#7788aa";
    ctx.font = "9px monospace";
    ctx.fillText("DEFENDING FORCE: " + (MIL[city.mil] || MIL.usa).force, W / 2, H - 31);
  }
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = "#889";
  ctx.font = "10px monospace";
  ctx.fillText(hint("confirm") + " to skip", W / 2, H - 16);
  ctx.globalAlpha = 1;
}

// sky colour at a given screen y — lets landmarks punch see-through openings
// (arches, ring voids) that actually match the sky behind them
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function skyAt(y) {
  const tm = SKY_TIMES[CITIES[cityIdx % CITIES.length].time || "night"];
  const f = Math.max(0, Math.min(1, y / H));
  const [a, b2] = f < 0.6 ? [hexRGB(tm.top), hexRGB(tm.mid)] : [hexRGB(tm.mid), hexRGB(tm.bot)];
  const t2 = f < 0.6 ? f / 0.6 : (f - 0.6) / 0.4;
  const m = c => Math.round(a[c] + (b2[c] - a[c]) * t2);
  // nudged toward the haze band so voids blend with the backdrop rather than glowing
  return `rgb(${m(0) + 8},${m(1) + 6},${m(2) + 12})`;
}

function drawSky(city) {
  const tm = SKY_TIMES[city.time || "night"];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, tm.top);
  g.addColorStop(0.6, tm.mid);
  g.addColorStop(1, tm.bot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (tm.moon) {
    ctx.fillStyle = "#f0ead8";
    ctx.beginPath(); ctx.arc(W - 110, 70, 26, 0, 7); ctx.fill();
    ctx.fillStyle = "#e0d8c0";
    ctx.beginPath(); ctx.arc(W - 118, 64, 5, 0, 7); ctx.arc(W - 100, 78, 4, 0, 7); ctx.fill();
  } else if (city.time === "day" || city.time === "dawn") {
    ctx.fillStyle = city.time === "dawn" ? "#ffca7a" : "#fff4cc";
    ctx.beginPath(); ctx.arc(W - 130, city.time === "dawn" ? 150 : 80, 30, 0, 7); ctx.fill();
  }
  if (tm.stars) {
    ctx.fillStyle = "rgba(220,225,255,0.7)";
    for (let i = 0; i < 40; i++) ctx.fillRect((i * 97 + 31) % W, (i * 53 + 11) % (H * 0.5), 1.5, 1.5);
  }
  // drifting clouds (tinted by time of day)
  if (!QUALITY[qTier].clouds) return;
  const cl = city.time === "night" ? "rgba(60,60,90,0.35)" : city.time === "dusk" ? "rgba(200,120,90,0.25)"
           : city.time === "dawn" ? "rgba(230,170,120,0.28)" : "rgba(235,240,245,0.35)";
  ctx.fillStyle = cl;
  const ct2 = performance.now() / 1000;
  for (let i = 0; i < 5; i++) {
    const cx2 = ((i * 210 + ct2 * (6 + i * 2)) % (W + 200)) - 100;
    const cy2 = 40 + (i * 47) % 110;
    ctx.beginPath();
    ctx.ellipse(cx2, cy2, 46 + i * 8, 10 + i * 2, 0, 0, 7);
    ctx.ellipse(cx2 + 28, cy2 - 7, 26, 8, 0, 0, 7);
    ctx.ellipse(cx2 - 30, cy2 - 4, 22, 7, 0, 0, 7);
    ctx.fill();
  }
  // horizon haze band
  const hz = ctx.createLinearGradient(0, H * 0.45, 0, H * 0.72);
  hz.addColorStop(0, "rgba(200,200,220,0)");
  hz.addColorStop(1, city.time === "day" ? "rgba(200,215,228,0.22)" : "rgba(120,110,150,0.18)");
  ctx.fillStyle = hz;
  ctx.fillRect(0, H * 0.45, W, H * 0.27);
  // city glow on horizon
  ctx.fillStyle = city.tint + "22";
  ctx.fillRect(0, H * 0.55, W, H * 0.2);
  // burning-city glow: grows with destruction
  if (typeof destroyedPct === "number" && destroyedPct > 0.05) {
    const flick = 0.7 + Math.sin(performance.now() / 90) * 0.15;
    ctx.fillStyle = `rgba(255,110,40,${destroyedPct * 0.28 * flick})`;
    ctx.fillRect(0, H * 0.45, W, H * 0.35);
  }
  // roar flash
  if (roarFlash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${roarFlash * (OPT.reduceFlash ? 0.07 : 0.25)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- Weather ----------
let lightningT = 0;
function drawWeather(city) {
  const t = performance.now();
  if (city.weather === "rain" || city.weather === "storm") {
    ctx.strokeStyle = "rgba(160,190,230,0.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 70; i++) {
      const x = (i * 137 + t * 0.55 * (60 + i % 3 * 15)) % (W + 40) - 20;
      const y = (i * 89 + t * 0.55 * 130) % H;
      ctx.moveTo(x, y);
      ctx.lineTo(x - 3, y + 11);
    }
    ctx.stroke();
    if (city.weather === "storm") {
      lightningT -= 1 / 60;
      if (lightningT <= 0 && Math.random() < 0.004) { lightningT = 0.12; if (state === S.PLAY) { sfx.boom(); } }
      if (lightningT > 0) {
        ctx.fillStyle = `rgba(230,235,255,${lightningT * (OPT.reduceFlash ? 0.6 : 2.2)})`;
        ctx.fillRect(0, 0, W, H);
      }
    }
  } else if (city.weather === "fog") {
    for (let i = 0; i < 3; i++) {
      const y = H * 0.5 + i * 40;
      ctx.fillStyle = `rgba(190,200,215,${0.10 - i * 0.02})`;
      const off = (t * 0.01 * (i + 1)) % W;
      ctx.fillRect(-off, y, W * 2, 46);
    }
  } else if (city.weather === "snow") {
    // drifting flakes at three depths + a settled crust along the street
    for (let i = 0; i < 90; i++) {
      const sp = 18 + (i % 3) * 16, sz = 1.2 + (i % 3) * 0.7;
      const x = (i * 173 + Math.sin(t / 900 + i) * 26 + t * 0.012 * sp) % (W + 40) - 20;
      const y = (i * 71 + t * 0.012 * (sp * 1.6)) % H;
      ctx.fillStyle = `rgba(240,245,255,${0.35 + (i % 3) * 0.2})`;
      ctx.beginPath(); ctx.arc(x, y, sz, 0, 7); ctx.fill();
    }
  }
}

// how the distant skyline is massed — low and uniform in Rome/Paris,
// a wall of spires in Dubai/Shanghai, pitched roofs in London
// dens = share of skyline slots actually built; low values let mountains and
// coastline read through instead of being walled off by generic towers
const SKYLINE = {
  tokyo:    { far: [40, 80],  near: [60, 132], roof: "flat" },
  newyork:  { far: [50, 100], near: [72, 152], roof: "deco" },
  london:   { far: [26, 50],  near: [40, 82],  roof: "pitched" },
  sydney:   { far: [40, 80],  near: [56, 122], roof: "flat" },
  sanfran:  { far: [30, 60],  near: [46, 96],  roof: "pitched", dens: 0.85 },
  paris:    { far: [26, 44],  near: [38, 64],  roof: "mansard" },
  rio:      { far: [36, 80],  near: [56, 122], roof: "flat", dens: 0.72 },
  dubai:    { far: [60, 150], near: [92, 232], roof: "spire" },
  rome:     { far: [22, 40],  near: [34, 60],  roof: "pitched" },
  cairo:    { far: [22, 42],  near: [34, 66],  roof: "flat" },
  shanghai: { far: [60, 140], near: [92, 224], roof: "spire" },
  moscow:   { far: [34, 62],  near: [48, 98],  roof: "soviet" },
  mumbai:   { far: [40, 86],  near: [60, 150], roof: "flat", dens: 0.88 },
  capetown: { far: [26, 52],  near: [40, 92],  roof: "pitched", dens: 0.5 },
  honolulu: { far: [24, 54],  near: [40, 110], roof: "flat", dens: 0.45 }
};
// large-scale landforms behind the city — the thing that most sells "where am I"
function drawTerrain(city) {
  const tm = SKY_TIMES[city.time || "night"];
  const far = shade(tm.mid, city.time === "day" ? -14 : 10);
  const near = shade(tm.mid, city.time === "day" ? -26 : 4);
  const ridge = (pts, col) => {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], GROUND + 40);
    for (const [px, py] of pts) ctx.lineTo(px, py);
    ctx.lineTo(pts[pts.length - 1][0], GROUND + 40);
    ctx.closePath(); ctx.fill();
  };
  if (city.bg === "rio") {
    // the granite peaks that ring Rio, with favelas climbing the near slope
    for (let rep = 0; rep < 4; rep++) {
      const o = rep * 1500;
      ridge([[o - 100, GROUND], [o + 60, GROUND - 150], [o + 130, GROUND - 205],
             [o + 210, GROUND - 120], [o + 340, GROUND - 190], [o + 440, GROUND - 96],
             [o + 620, GROUND - 168], [o + 760, GROUND]], far);
      ridge([[o + 380, GROUND], [o + 520, GROUND - 118], [o + 640, GROUND - 158],
             [o + 780, GROUND - 84], [o + 980, GROUND - 132], [o + 1160, GROUND]], near);
      // favela shacks speckling the near hillside
      for (let i = 0; i < 46; i++) {
        const t2 = i / 46;
        const hx = o + 400 + t2 * 720;
        const hy = GROUND - 20 - Math.sin(t2 * Math.PI) * 118 + ((i * 37) % 22);
        ctx.fillStyle = ["#6e5a4c", "#7a5a48", "#66584e", "#7d6250"][i % 4];
        ctx.fillRect(hx, hy, 11, 9);
        ctx.fillStyle = "rgba(180,185,190,0.35)";
        ctx.fillRect(hx - 1, hy - 2, 13, 2);
        if (city.time !== "day" && i % 3 === 0) {
          ctx.fillStyle = "rgba(255,214,140,0.75)";
          ctx.fillRect(hx + 3, hy + 3, 3, 3);
        }
      }
    }
  } else if (city.bg === "cairo" || city.bg === "dubai") {
    // desert: layered dune ridges rolling to the horizon + heat haze
    const sand1 = city.bg === "cairo" ? "#8a7048" : "#7d6a4a";
    const sand2 = city.bg === "cairo" ? "#6d5738" : "#63523a";
    for (let rep = 0; rep < 5; rep++) {
      const o = rep * 1200;
      const pts = [];
      for (let i = 0; i <= 10; i++)
        pts.push([o + i * 120, GROUND - 46 - Math.sin(i * 0.9 + rep) * 26 - Math.cos(i * 0.4) * 14]);
      ridge(pts, sand2);
      const pts2 = [];
      for (let i = 0; i <= 10; i++)
        pts2.push([o + i * 120 + 60, GROUND - 20 - Math.sin(i * 1.3 + rep * 2) * 16]);
      ridge(pts2, sand1);
    }
    ctx.fillStyle = "rgba(255,220,160,0.10)";           // shimmering horizon
    ctx.fillRect(-200, GROUND - 60, 7000, 60);
  } else if (city.bg === "sanfran") {
    for (let rep = 0; rep < 4; rep++) {
      const o = rep * 1500;
      ridge([[o - 100, GROUND], [o + 200, GROUND - 92], [o + 460, GROUND - 62],
             [o + 700, GROUND - 108], [o + 1000, GROUND]], far);
    }
  } else if (city.bg === "moscow") {
    ctx.fillStyle = "rgba(226,234,246,0.13)";           // snow haze over a flat plain
    ctx.fillRect(-200, GROUND - 40, 7000, 42);
  } else if (city.bg === "capetown") {
    // Table Mountain's massif and Lion's Head standing over the City Bowl
    for (let rep = 0; rep < 4; rep++) {
      const o = rep * 1700;
      ridge([[o - 120, GROUND], [o + 60, GROUND - 120], [o + 150, GROUND - 214],
             [o + 470, GROUND - 208], [o + 560, GROUND - 96], [o + 700, GROUND]], far);
      ridge([[o + 640, GROUND], [o + 760, GROUND - 150], [o + 800, GROUND - 176],
             [o + 850, GROUND - 138], [o + 960, GROUND]], near);
      ctx.fillStyle = "rgba(240,246,252,0.28)";          // the tablecloth spilling over
      ctx.beginPath();
      ctx.ellipse(o + 310, GROUND - 214, 170, 15, 0, 0, 7);
      ctx.fill();
    }
  } else if (city.bg === "honolulu") {
    // volcanic ridgeline behind, open Pacific in front
    for (let rep = 0; rep < 4; rep++) {
      const o = rep * 1500;
      ridge([[o - 100, GROUND], [o + 120, GROUND - 118], [o + 240, GROUND - 86],
             [o + 380, GROUND - 150], [o + 520, GROUND - 92], [o + 680, GROUND - 132],
             [o + 860, GROUND]], far);
      ctx.strokeStyle = "rgba(120,180,160,0.25)";        // gullies in the ridge
      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.moveTo(o + 140 + i * 90, GROUND - 60 - (i % 3) * 24);
        ctx.lineTo(o + 150 + i * 90, GROUND - 10);
        ctx.stroke();
      }
    }
    ctx.fillStyle = "rgba(40,120,150,0.35)";             // the Pacific along the horizon
    ctx.fillRect(-200, GROUND - 34, 7000, 36);
    ctx.fillStyle = "rgba(230,250,255,0.2)";
    for (let i = 0; i < 40; i++) {
      const sx2 = (i * 320 + (performance.now() / 40) % 320) % 12000;
      ctx.fillRect(sx2, GROUND - 26 + (i % 3) * 7, 34, 2);
    }
  } else if (city.bg === "mumbai") {
    ctx.fillStyle = "rgba(60,90,130,0.32)";              // the Arabian Sea
    ctx.fillRect(-200, GROUND - 30, 7000, 32);
    ctx.fillStyle = "rgba(255,190,120,0.10)";            // haze
    ctx.fillRect(-200, GROUND - 70, 7000, 70);
  }
}

let bgTerr = null, bgSky = null, bgKey = "";
const BG_W = 6600, TERR_Y = 120, SKY_Y = 50;
let scnV0 = -1e9, scnV1 = 1e9;              // visible window, in scenery coordinates
function ensureBackdropCache(city) {
  const key = city.bg + "|" + city.time + "|" + city.weather + "|" + cityIdx;
  if (key === bgKey && bgTerr) return;
  bgKey = key;
  const mk = h => { const c = document.createElement("canvas"); c.width = BG_W; c.height = h; return c; };
  bgTerr = mk(H - TERR_Y);
  bgSky = mk(H - SKY_Y);
  const real = ctx;
  const oldV0 = scnV0, oldV1 = scnV1;
  scnV0 = -1e9; scnV1 = 1e9;                // bake the full strip
  ctx = bgTerr.getContext("2d");
  ctx.translate(0, -TERR_Y);
  drawTerrain(city);
  ctx = bgSky.getContext("2d");
  ctx.translate(0, -SKY_Y);
  renderSkyline(city);
  ctx = real;
  scnV0 = oldV0; scnV1 = oldV1;
}
function renderSkyline(city) {
  const rng = mulberry(cityIdx * 55 + 3);
  const SK = SKYLINE[city.bg] || { far: [40, 80], near: [60, 130], roof: "flat" };
  // far layer: hazier, shorter
  const dens = SK.dens === undefined ? 1 : SK.dens;
  ctx.fillStyle = "#171428";
  for (let i = 0; i < 52; i++) {
    const bx = i * 82 + rng() * 26, bh = SK.far[0] + rng() * (SK.far[1] - SK.far[0]);
    if (rng() > dens) continue;                          // leave a gap for the landscape
    ctx.fillRect(bx, GROUND - bh - 30, 48, bh + 30);
  }
  // near layer: varied silhouettes whose rooflines match the city's architecture
  ctx.fillStyle = "#1c1830";
  for (let i = 0; i < 48; i++) {
    const bx = i * 90 + rng() * 30;
    const bh = SK.near[0] + rng() * (SK.near[1] - SK.near[0]);
    const bw = 42 + rng() * 24;
    const ry = GROUND - bh - 30;
    if (rng() > dens) continue;
    ctx.fillRect(bx, ry, bw, bh + 30);
    const roof = (i * 7) % 4;
    if (SK.roof === "pitched") {                        // London / Rome / SF: gables + chimneys
      ctx.beginPath();
      ctx.moveTo(bx - 3, ry); ctx.lineTo(bx + bw / 2, ry - 11); ctx.lineTo(bx + bw + 3, ry);
      ctx.closePath(); ctx.fill();
      if (roof < 2) { ctx.fillRect(bx + bw * 0.7, ry - 15, 5, 12); ctx.fillRect(bx + bw * 0.2, ry - 13, 4, 10); }
    } else if (SK.roof === "mansard") {                 // Paris: uniform zinc mansards
      ctx.beginPath();
      ctx.moveTo(bx, ry); ctx.lineTo(bx + 6, ry - 9);
      ctx.lineTo(bx + bw - 6, ry - 9); ctx.lineTo(bx + bw, ry);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(bx + bw * 0.75, ry - 15, 4, 8);
    } else if (SK.roof === "spire") {                   // Dubai / Shanghai: tapered crowns
      ctx.beginPath();
      ctx.moveTo(bx, ry); ctx.lineTo(bx + bw / 2, ry - 34); ctx.lineTo(bx + bw, ry);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(bx + bw / 2 - 1.5, ry - 52, 3, 20);
    } else if (SK.roof === "soviet") {                  // Moscow: flat blocks + the odd spire
      ctx.fillRect(bx - 2, ry, bw + 4, 4);
      if (roof === 0) {
        ctx.fillRect(bx + bw * 0.3, ry - 22, bw * 0.4, 22);
        ctx.beginPath();
        ctx.moveTo(bx + bw * 0.26, ry - 22); ctx.lineTo(bx + bw / 2, ry - 46); ctx.lineTo(bx + bw * 0.74, ry - 22);
        ctx.closePath(); ctx.fill();
        ctx.fillRect(bx + bw / 2 - 1, ry - 58, 2, 13);
      }
    } else if (SK.roof === "deco") {                    // New York: stepped setbacks
      ctx.fillRect(bx + bw * 0.14, ry - 16, bw * 0.72, 16);
      ctx.fillRect(bx + bw * 0.3, ry - 28, bw * 0.4, 12);
      if (roof === 1) ctx.fillRect(bx + bw / 2 - 1.5, ry - 44, 3, 16);
    } else {                                            // flat: sheds, antennas, AC
      if (roof === 0) ctx.fillRect(bx - 2, ry, bw + 4, 3);
      else if (roof === 1) { ctx.fillRect(bx + bw * 0.3, ry - 7, bw * 0.35, 7); ctx.fillRect(bx + bw * 0.75, ry - 14, 2, 14); }
      else if (roof === 2) {
        ctx.beginPath();
        ctx.moveTo(bx, ry); ctx.lineTo(bx + bw, ry - 10); ctx.lineTo(bx + bw, ry);
        ctx.closePath(); ctx.fill();
      } else { ctx.fillRect(bx + 5, ry - 5, 8, 5); ctx.fillRect(bx + bw - 14, ry - 5, 8, 5); }
    }
    // NY: rooftop water towers standing on real roofs, legs planted
    if (city.bg === "newyork" && i % 5 === 2) {
      const wx = bx + bw * 0.3;
      ctx.fillRect(wx + 2, ry - 10, 3, 10);              // legs first, on the roof
      ctx.fillRect(wx + 11, ry - 10, 3, 10);
      ctx.fillRect(wx, ry - 24, 16, 14);                 // tank
      ctx.beginPath();                                   // conical cap
      ctx.moveTo(wx - 2, ry - 24); ctx.lineTo(wx + 8, ry - 34); ctx.lineTo(wx + 18, ry - 24);
      ctx.closePath(); ctx.fill();
    }
  }
  // tiny lit windows
  ctx.fillStyle = city.tint + "55";
  for (let i = 0; i < 160; i++) {
    const bx = (i * 61) % 4400, by = GROUND - 40 - (i * 37) % 150;
    ctx.fillRect(bx, by, 2, 3);
  }
}

function drawBackdrop(city) {
  // distant skyline: static layers are pre-baked per city — two blits per frame
  // instead of ~150 detailed paths
  ctx.save();
  ctx.translate(camX * 0.6, 0);
  scnV0 = camX * 0.4 - 280; scnV1 = camX * 0.4 + W + 280;
  ensureBackdropCache(city);
  ctx.imageSmoothingEnabled = true;          // soft haze suits the distance layers
  ctx.drawImage(bgTerr, 0, TERR_Y);
  drawTerrain(city);              // mountains / dunes / hills furthest back
  drawCityScenery(city);          // famous background sights, behind the skyline
  drawNavyFleet(city);            // grey silhouettes on the horizon water
  ctx.drawImage(bgSky, 0, SKY_Y);
  ctx.imageSmoothingEnabled = false;
  drawCityTransit(city);          // trains/trams gliding through the mid-ground
  ctx.restore();
}


// the task force: three grey silhouettes far out on the background water,
// screen-anchored like every distant thing, flashing when the guns speak
function drawNavyFleet(city) {
  if (!city.navy || !navFleet.seen) return;
  const OCEAN_Y = { honolulu: -76, sydney: -30, mumbai: -36, capetown: -28 };
  const oy = OCEAN_Y[city.bg];
  if (oy === undefined) return;
  const now = performance.now();
  const baseX = scnV0 + 280 + (scnV1 - scnV0 - 560) * 0.66;
  for (let i = 0; i < 3; i++) {
    const sc = i === 1 ? 1 : 0.78;
    const sx = baseX + (i - 1) * 62;
    const sy = GROUND + oy + (i === 1 ? 0 : -2) + Math.sin(now / 900 + i * 2.1) * 1.4;
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = "#3c4a5c";
    ctx.beginPath();                                   // hull
    ctx.moveTo(sx - 17 * sc, sy);
    ctx.lineTo(sx + 17 * sc, sy);
    ctx.lineTo(sx + 13 * sc, sy + 4 * sc);
    ctx.lineTo(sx - 13 * sc, sy + 4 * sc);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(sx - 6 * sc, sy - 6 * sc, 9 * sc, 6 * sc);     // superstructure
    ctx.fillRect(sx + 6 * sc, sy - 4 * sc, 5 * sc, 4 * sc);
    ctx.fillRect(sx - 1, sy - 10 * sc, 1.6, 5 * sc);            // mast
    ctx.fillStyle = "rgba(220,240,250,0.3)";                    // wake line
    ctx.fillRect(sx - 20 * sc, sy + 4 * sc, 40 * sc, 1.5);
    if (navFleet.flashT > 0 && i === navFleet.strikes % 3) {    // firing flash
      ctx.fillStyle = "#ffe9a0";
      ctx.beginPath(); ctx.arc(sx - 15 * sc, sy - 3 * sc, 4, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(255,233,160,0.45)"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sx - 15 * sc, sy - 3 * sc);
      ctx.lineTo(sx - 46, sy - 64);
      ctx.stroke(); ctx.lineWidth = 1;
    }
    ctx.globalAlpha = 1;
  }
}

// ---------- Per-city background sights ----------
function drawCityScenery(city) {
  const now = performance.now();
  if (city.bg === "tokyo") {
    // Mt. Fuji on the horizon
    for (let rep = 0; rep < 3; rep++) {
      const fx = 320 + rep * 1200;
      if (fx > scnV1 + 200 || fx + 1400 < scnV0) continue;
      ctx.fillStyle = "#232038";
      ctx.beginPath();
      ctx.moveTo(fx - 190, GROUND - 30);
      ctx.lineTo(fx - 34, GROUND - 168);
      ctx.lineTo(fx + 34, GROUND - 168);
      ctx.lineTo(fx + 190, GROUND - 30);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#d8dce8";                     // snow cap
      ctx.beginPath();
      ctx.moveTo(fx - 34, GROUND - 168);
      ctx.lineTo(fx + 34, GROUND - 168);
      ctx.lineTo(fx + 58, GROUND - 138);
      ctx.lineTo(fx + 30, GROUND - 146);
      ctx.lineTo(fx + 10, GROUND - 136);
      ctx.lineTo(fx - 16, GROUND - 148);
      ctx.lineTo(fx - 40, GROUND - 140);
      ctx.closePath(); ctx.fill();
    }
  } else if (city.bg === "london") {
    for (let rep = 0; rep < 3; rep++) {
      const off = rep * 1300;
      if (off > scnV1 || off + 1300 + 500 < scnV0) continue;
      // Tower Bridge: two gothic towers + high walkway + bascules
      const tbx = 500 + off, ty = GROUND - 30;
      ctx.fillStyle = "#2a2a44";
      for (const s of [-70, 70]) {
        ctx.fillRect(tbx + s - 14, ty - 118, 28, 118);          // tower
        ctx.beginPath();                                         // spire cap
        ctx.moveTo(tbx + s - 16, ty - 118); ctx.lineTo(tbx + s, ty - 142); ctx.lineTo(tbx + s + 16, ty - 118);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillRect(tbx - 70, ty - 100, 140, 8);                  // upper walkway
      ctx.fillRect(tbx - 130, ty - 40, 60, 7);                   // side spans
      ctx.fillRect(tbx + 70, ty - 40, 60, 7);
      ctx.fillRect(tbx - 70, ty - 40, 140, 7);                   // roadway
      // suspension chains
      ctx.strokeStyle = "#2a2a44"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(tbx - 130, ty - 40); ctx.quadraticCurveTo(tbx - 100, ty - 90, tbx - 70, ty - 100);
      ctx.moveTo(tbx + 130, ty - 40); ctx.quadraticCurveTo(tbx + 100, ty - 90, tbx + 70, ty - 100);
      ctx.stroke(); ctx.lineWidth = 1;
      // the London Eye further along
      const ex = 1150 + off, ey = GROUND - 105;
      ctx.strokeStyle = "#33395a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ex, ey, 68, 0, 7); ctx.stroke();
      const rot = now / 9000;
      ctx.beginPath();
      for (let i = 0; i < 12; i++) {
        const a = rot + i * Math.PI / 6;
        ctx.moveTo(ex, ey); ctx.lineTo(ex + Math.cos(a) * 68, ey + Math.sin(a) * 68);
      }
      ctx.stroke();
      ctx.beginPath();                                            // A-frame legs
      ctx.moveTo(ex - 30, GROUND - 30); ctx.lineTo(ex, ey); ctx.lineTo(ex + 30, GROUND - 30);
      ctx.stroke(); ctx.lineWidth = 1;
      // capsules
      ctx.fillStyle = "#44507a";
      for (let i = 0; i < 12; i++) {
        const a = rot + i * Math.PI / 6;
        ctx.fillRect(ex + Math.cos(a) * 68 - 3, ey + Math.sin(a) * 68 - 3, 6, 6);
      }
    }
  } else if (city.bg === "newyork") {
    for (let rep = 0; rep < 3; rep++) {
      const off = rep * 1400;
      if (off > scnV1 || off + 1400 + 500 < scnV0) continue;
      // Statue of Liberty silhouette out in the harbor
      const sx = 600 + off, sy = GROUND - 30;
      ctx.fillStyle = "#252a40";
      ctx.fillRect(sx - 26, sy - 34, 52, 34);                    // pedestal
      ctx.fillRect(sx - 14, sy - 52, 28, 18);
      ctx.beginPath();                                            // robed figure
      ctx.moveTo(sx - 12, sy - 52);
      ctx.quadraticCurveTo(sx - 14, sy - 92, sx - 5, sy - 100);
      ctx.lineTo(sx + 5, sy - 100);
      ctx.quadraticCurveTo(sx + 14, sy - 92, sx + 12, sy - 52);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(sx, sy - 106, 7, 0, 7); ctx.fill(); // head
      // crown spikes
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(sx + i * 3 - 1, sy - 111); ctx.lineTo(sx + i * 3.4, sy - 120); ctx.lineTo(sx + i * 3 + 1, sy - 111);
        ctx.closePath(); ctx.fill();
      }
      // torch arm raised
      ctx.strokeStyle = "#252a40"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(sx + 8, sy - 88); ctx.lineTo(sx + 22, sy - 126); ctx.stroke(); ctx.lineWidth = 1;
      ctx.fillStyle = "#ffcc55";
      ctx.beginPath(); ctx.arc(sx + 24, sy - 130, 4 + Math.sin(now / 300) * 1, 0, 7); ctx.fill();
    }
  } else if (city.bg === "sydney") {
    for (let rep = 0; rep < 3; rep++) {
      const off = rep * 1300;
      if (off > scnV1 || off + 1300 + 500 < scnV0) continue;
      // Harbour Bridge: giant steel through-arch ("the Coathanger")
      const hx = 650 + off, hy = GROUND - 30, hw = 260;
      ctx.strokeStyle = "#2a3448"; ctx.lineWidth = 6;
      ctx.beginPath();                                            // main arch
      ctx.moveTo(hx - hw, hy);
      ctx.quadraticCurveTo(hx, hy - 210, hx + hw, hy);
      ctx.stroke();
      ctx.lineWidth = 4;
      ctx.beginPath();                                            // lower chord
      ctx.moveTo(hx - hw, hy);
      ctx.quadraticCurveTo(hx, hy - 150, hx + hw, hy);
      ctx.stroke();
      ctx.fillStyle = "#2a3448";
      ctx.fillRect(hx - hw - 60, hy - 58, hw * 2 + 120, 7);       // deck
      // hangers
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = -5; i <= 5; i++) {
        const px = hx + i * hw / 6;
        const t2 = (px - (hx - hw)) / (2 * hw);
        const ay = hy - (420 * t2 * (1 - t2));                    // arch curve approx
        ctx.moveTo(px, ay); ctx.lineTo(px, hy - 58);
      }
      ctx.stroke(); ctx.lineWidth = 1;
      // stone pylons
      ctx.fillRect(hx - hw - 16, hy - 92, 24, 92);
      ctx.fillRect(hx + hw - 8, hy - 92, 24, 92);
      // ferry chugging under the deck
      const fx3 = hx - hw + ((now / 28) % (hw * 2));
      ctx.fillStyle = "#3a4a5a";
      ctx.fillRect(fx3 - 14, hy - 14, 28, 8);
      ctx.fillRect(fx3 - 7, hy - 20, 14, 6);
    }
  } else if (city.bg === "sanfran") {
    for (let rep = 0; rep < 3; rep++) {
      const off = rep * 1400;

      ctx.closePath(); ctx.fill();
      const gx = 700 + off;
      ctx.strokeStyle = "#8a3a28"; ctx.lineWidth = 7;             // distant tower
      ctx.beginPath();
      ctx.moveTo(gx - 16, GROUND - 30); ctx.lineTo(gx - 16, GROUND - 190);
      ctx.moveTo(gx + 16, GROUND - 30); ctx.lineTo(gx + 16, GROUND - 190);

      ctx.quadraticCurveTo(gx + 150, GROUND - 100, gx + 300, GROUND - 88);
      ctx.moveTo(gx, GROUND - 190);
      ctx.quadraticCurveTo(gx - 150, GROUND - 100, gx - 300, GROUND - 88);
      ctx.stroke(); ctx.lineWidth = 1;
      // Alcatraz on its island
      const ax = 1180 + off;

      ctx.beginPath(); ctx.ellipse(ax, GROUND - 34, 70, 14, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(ax - 34, GROUND - 66, 68, 26);
      ctx.fillRect(ax + 18, GROUND - 84, 10, 18);                 // lighthouse

      ctx.fillRect(ax + 20, GROUND - 88, 6, 4);

  } else if (city.bg === "paris") {
    for (let rep = 0; rep < 3; rep++) {
      const off = rep * 1300;
      if (off > scnV1 || off + 1300 + 500 < scnV0) continue;

      const ax = 520 + off, ay = GROUND - 30;

      ctx.fillRect(ax - 55, ay - 105, 110, 105);
      ctx.fillStyle = skyAt(ay - 70);                             // punch the arch out with the sky behind it
      ctx.beginPath();
      ctx.moveTo(ax - 26, ay);
      ctx.lineTo(ax - 26, ay - 55);
      ctx.quadraticCurveTo(ax, ay - 88, ax + 26, ay - 55);
      ctx.lineTo(ax + 26, ay);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#2c2840";
      ctx.fillRect(ax - 60, ay - 118, 120, 14);                   // attic
      // Sacré-Cœur on the hill of Montmartre
      const sx = 1150 + off, sy = GROUND - 30;
      ctx.fillStyle = "#282440";
      ctx.beginPath();                                            // the butte
      ctx.moveTo(sx - 220, sy);
      ctx.quadraticCurveTo(sx, sy - 95, sx + 220, sy);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#34304e";
      ctx.fillRect(sx - 40, sy - 118, 80, 42);                    // basilica body
      ctx.beginPath(); ctx.arc(sx, sy - 122, 26, Math.PI, 0); ctx.fill();    // grand dome
      ctx.beginPath(); ctx.arc(sx - 34, sy - 118, 12, Math.PI, 0); ctx.fill();
      ctx.beginPath(); ctx.arc(sx + 34, sy - 118, 12, Math.PI, 0); ctx.fill();

      ctx.fillRect(sx - 5, sy - 152, 10, 3);

  } else if (city.bg === "rio") {
    for (let rep = 0; rep < 3; rep++) {

      ctx.fillStyle = "#28304a";

      ctx.moveTo(360 + off, GROUND - 30);
      ctx.quadraticCurveTo(430 + off, GROUND - 200, 500 + off, GROUND - 30);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(520 + off, GROUND - 30);
      ctx.quadraticCurveTo(575 + off, GROUND - 140, 640 + off, GROUND - 30);
      ctx.closePath(); ctx.fill();
      // cable car line + gondola
      ctx.strokeStyle = "#3a4360"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(430 + off, GROUND - 195); ctx.lineTo(820 + off, GROUND - 80); ctx.stroke();
      const gp2 = (now / 8000) % 1;
      const gx2 = 430 + gp2 * 390 + off, gy2 = GROUND - 195 + gp2 * 115;
      ctx.fillStyle = "#3a4360"; ctx.fillRect(gx2 - 5, gy2, 10, 8);
      ctx.lineWidth = 1;
      // Corcovado, with the statue standing ON the summit (not floating above it)
      ctx.fillStyle = "#232a44";
      ctx.beginPath();
      ctx.moveTo(900 + off, GROUND - 30);
      ctx.quadraticCurveTo(1050 + off, GROUND - 190, 1220 + off, GROUND - 30);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#1c2338";                                   // shaded flank
      ctx.beginPath();
      ctx.moveTo(1057 + off, GROUND - 112);
      ctx.quadraticCurveTo(1140 + off, GROUND - 90, 1220 + off, GROUND - 30);
      ctx.lineTo(1057 + off, GROUND - 30);
      ctx.closePath(); ctx.fill();
      // the summit sits at the curve's apex: t=0.5 → x≈1055, y≈GROUND-112
      const px2 = 1055 + off, py2 = GROUND - 112;
      ctx.fillStyle = "#39415e";                                   // plinth
      ctx.fillRect(px2 - 9, py2 - 12, 18, 12);
      ctx.fillStyle = "#4c5678";                                   // robed figure
      ctx.beginPath();
      ctx.moveTo(px2 - 5, py2 - 12);
      ctx.lineTo(px2 - 3.5, py2 - 34);
      ctx.lineTo(px2 + 3.5, py2 - 34);
      ctx.lineTo(px2 + 5, py2 - 12);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(px2 - 16, py2 - 33, 32, 3.4);                   // outstretched arms
      ctx.fillRect(px2 - 16, py2 - 33, 3, 8);                      // hands turned down
      ctx.fillRect(px2 + 13, py2 - 33, 3, 8);
      ctx.beginPath(); ctx.arc(px2, py2 - 37, 3, 0, 7); ctx.fill(); // head
      ctx.fillStyle = "rgba(255,240,200,0.14)";                    // floodlit halo
      ctx.beginPath(); ctx.arc(px2, py2 - 26, 26, 0, 7); ctx.fill();
      // forested lower slopes
      ctx.fillStyle = "#1e3326";
      for (let i = 0; i < 16; i++) {
        const tx3 = 905 + off + i * 20;
        ctx.beginPath(); ctx.arc(tx3, GROUND - 30 - ((i * 29) % 22), 11, Math.PI, 0); ctx.fill();
      }
    }
  } else if (city.bg === "dubai") {
    for (let rep = 0; rep < 3; rep++) {
      const off = rep * 1400;
      if (off > scnV1 || off + 1400 + 500 < scnV0) continue;
      // desert dunes shimmering behind the towers
      ctx.fillStyle = "#2e2840";
      ctx.beginPath();
      ctx.moveTo(off, GROUND - 30);
      ctx.quadraticCurveTo(300 + off, GROUND - 85, 640 + off, GROUND - 30);
      ctx.quadraticCurveTo(900 + off, GROUND - 70, 1200 + off, GROUND - 30);
      ctx.closePath(); ctx.fill();
      // palm island fronds hint + marina supertowers cluster
      ctx.fillStyle = "#252a44";
      for (let i = 0; i < 5; i++) {
        const twx = 760 + i * 55 + off, twh = 120 + (i * 37) % 80;
        ctx.fillRect(twx, GROUND - 30 - twh, 26, twh);
        if (i % 2) {                                    // twisted tower hint
          ctx.strokeStyle = "#33395a";
          ctx.beginPath();
          ctx.moveTo(twx, GROUND - 30 - twh);
          ctx.lineTo(twx + 26, GROUND - 30 - twh * 0.6);
          ctx.moveTo(twx, GROUND - 30 - twh * 0.6);
          ctx.lineTo(twx + 26, GROUND - 30 - twh * 0.25);
          ctx.stroke();
        }
      }
    }
  } else if (city.bg === "rome") {
    for (let rep = 0; rep < 3; rep++) {
      const off = rep * 1300;
      if (off > scnV1 || off + 1300 + 500 < scnV0) continue;
      // rolling hills with umbrella pines
      ctx.fillStyle = "#2a2a3e";
      ctx.beginPath();
      ctx.moveTo(off, GROUND - 30);
      ctx.quadraticCurveTo(320 + off, GROUND - 95, 700 + off, GROUND - 30);
      ctx.closePath(); ctx.fill();
      for (let i = 0; i < 4; i++) {                     // umbrella pines
        const px2 = 180 + i * 130 + off, ph2 = GROUND - 70 - (i % 2) * 18;
        ctx.strokeStyle = "#232336"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(px2, GROUND - 30); ctx.lineTo(px2, ph2); ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillStyle = "#232a38";
        ctx.beginPath(); ctx.ellipse(px2, ph2, 26, 10, 0, Math.PI, 0); ctx.fill();
      }
      // aqueduct ruin marching along the horizon
      ctx.fillStyle = "#2c2c40";
      ctx.fillRect(820 + off, GROUND - 88, 300, 10);
      for (let a2 = 0; a2 < 6; a2++) {
        ctx.fillRect(830 + a2 * 50 + off, GROUND - 80, 12, 50);
      }

  } else if (city.bg === "cairo") {
    for (let rep = 0; rep < 3; rep++) {
      const off = rep * 1400;
      if (off > scnV1 || off + 1400 + 500 < scnV0) continue;
      // the two sister pyramids on the plateau
      for (const [px2, ps] of [[420, 1], [640, 0.72]]) {
        ctx.fillStyle = "#2e2a3c";
        ctx.beginPath();
        ctx.moveTo(px2 - 150 * ps + off, GROUND - 30);
        ctx.lineTo(px2 + off, GROUND - 30 - 170 * ps);
        ctx.lineTo(px2 + 150 * ps + off, GROUND - 30);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgba(0,0,20,0.25)";
        ctx.beginPath();
        ctx.moveTo(px2 + off, GROUND - 30);
        ctx.lineTo(px2 + off, GROUND - 30 - 170 * ps);
        ctx.lineTo(px2 + 150 * ps + off, GROUND - 30);
        ctx.closePath(); ctx.fill();
      }
      // felucca sails drifting on the Nile
      const fx4 = 1000 + ((now / 60) % 340) + off;
      ctx.fillStyle = "#2a2a40";
      ctx.beginPath();
      ctx.moveTo(fx4, GROUND - 34); ctx.lineTo(fx4 + 3, GROUND - 66); ctx.lineTo(fx4 + 26, GROUND - 38);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(fx4 - 8, GROUND - 34, 40, 5);
    }
  } else if (city.bg === "shanghai") {
    for (let rep = 0; rep < 4; rep++) {
      const off = rep * 1500;
      if (off > scnV1 || off + 1500 + 500 < scnV0) continue;
      // the Huangpu, with barges working downriver and neon bleeding into the water
      ctx.fillStyle = "rgba(30,40,72,0.85)";
      ctx.fillRect(off - 100, GROUND - 30, 1500, 32);
      ctx.fillStyle = "rgba(255,90,150,0.10)";
      ctx.fillRect(off - 100, GROUND - 30, 1500, 12);
      const bgx = off + ((now / 90) % 1500);
      ctx.fillStyle = "#20203a";                                   // cargo barge
      ctx.fillRect(bgx, GROUND - 40, 120, 12);
      ctx.fillRect(bgx + 92, GROUND - 52, 22, 13);
      ctx.fillStyle = "#3a3a5a";
      for (let c2 = 0; c2 < 5; c2++) ctx.fillRect(bgx + 8 + c2 * 16, GROUND - 50, 13, 10);
      // the Bund's colonial waterfront on the far bank
      ctx.fillStyle = "#242038";
      for (let i = 0; i < 7; i++) {
        const bx2 = off + 120 + i * 96, bh2 = 54 + ((i * 29) % 30);
        ctx.fillRect(bx2, GROUND - 30 - bh2, 78, bh2);
        if (i % 3 === 1) {                                          // domed roof
          ctx.beginPath();
          ctx.ellipse(bx2 + 39, GROUND - 30 - bh2, 22, 18, 0, Math.PI, 0);
          ctx.fill();
        } else if (i % 3 === 2) {                                   // clock/bell tower
          ctx.fillRect(bx2 + 30, GROUND - 30 - bh2 - 26, 18, 26);
          ctx.beginPath();
          ctx.moveTo(bx2 + 28, GROUND - 30 - bh2 - 26); ctx.lineTo(bx2 + 39, GROUND - 30 - bh2 - 44);
          ctx.lineTo(bx2 + 50, GROUND - 30 - bh2 - 26);
          ctx.closePath(); ctx.fill();

      // a cross-river suspension bridge fading into the haze
      ctx.strokeStyle = "#252140"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(off + 980, GROUND - 34);
      ctx.quadraticCurveTo(off + 1180, GROUND - 128, off + 1380, GROUND - 34);
      ctx.stroke();
      ctx.lineWidth = 1;
      ctx.fillStyle = "#252140";
      ctx.fillRect(off + 1178, GROUND - 150, 6, 120);
    }
  } else if (city.bg === "moscow") {
    for (let rep = 0; rep < 4; rep++) {
      const off = rep * 1500;
      if (off > scnV1 || off + 1500 + 500 < scnV0) continue;
      // the crenellated Kremlin wall with its towers, under snow
      const wallY = GROUND - 64;
      ctx.fillStyle = "#2d2334";
      ctx.fillRect(off - 60, wallY, 1200, 64);
      ctx.fillStyle = "#372a3e";
      for (let cx2 = off - 60; cx2 < off + 1140; cx2 += 22) {
        ctx.beginPath();                                            // swallowtail merlons
        ctx.moveTo(cx2, wallY);
        ctx.lineTo(cx2, wallY - 12); ctx.lineTo(cx2 + 5, wallY - 6);
        ctx.lineTo(cx2 + 10, wallY - 12); ctx.lineTo(cx2 + 10, wallY);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = "rgba(230,238,248,0.5)";                      // snow on the wall top
      ctx.fillRect(off - 60, wallY - 13, 1200, 2.5);
      for (const tx2 of [140, 470, 860]) {                          // wall towers with tent roofs
        ctx.fillStyle = "#2d2334";
        ctx.fillRect(off + tx2 - 17, wallY - 58, 34, 58);
        ctx.fillStyle = "#372a3e";
        ctx.beginPath();
        ctx.moveTo(off + tx2 - 22, wallY - 58); ctx.lineTo(off + tx2, wallY - 104);
        ctx.lineTo(off + tx2 + 22, wallY - 58);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgba(220,60,80,0.85)";                     // ruby star
        ctx.beginPath(); ctx.arc(off + tx2, wallY - 110, 3.5, 0, 7); ctx.fill();

      // gilded cathedral domes rising behind the wall
      for (const [dx2, dr] of [[300, 15], [330, 10], [270, 10], [640, 17], [676, 11]]) {
        ctx.fillStyle = "#5c4a2a";
        ctx.beginPath();
        ctx.moveTo(off + dx2 - dr, wallY - 20);
        ctx.bezierCurveTo(off + dx2 - dr * 1.3, wallY - 20 - dr * 1.1,
                          off + dx2 + dr * 1.3, wallY - 20 - dr * 1.1,
                          off + dx2 + dr, wallY - 20);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#6e5a32";
        ctx.fillRect(off + dx2 - 0.8, wallY - 22 - dr * 1.5, 1.6, dr * 0.7);

      // the frozen Moskva
      ctx.fillStyle = "rgba(180,205,230,0.16)";
      ctx.fillRect(off - 60, GROUND - 26, 1200, 28);

  } else if (city.bg === "mumbai") {
    for (let rep = 0; rep < 4; rep++) {
      const off = rep * 1500;
      if (off > scnV1 || off + 1500 + 500 < scnV0) continue;

      ctx.fillStyle = "#2a2438";
      ctx.fillRect(off + 260, GROUND - 46, 70, 22);
      ctx.beginPath();
      ctx.ellipse(off + 295, GROUND - 46, 20, 20, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(off + 293, GROUND - 78, 4, 12);
      for (const mx of [off + 266, off + 324]) {          // slim minarets
        ctx.fillRect(mx, GROUND - 74, 5, 28);
        ctx.beginPath(); ctx.moveTo(mx - 2, GROUND - 74); ctx.lineTo(mx + 2.5, GROUND - 88);
        ctx.lineTo(mx + 7, GROUND - 74); ctx.closePath(); ctx.fill();

      ctx.strokeStyle = "#2a2438"; ctx.lineWidth = 3;     // the causeway
      ctx.beginPath(); ctx.moveTo(off + 180, GROUND - 22); ctx.lineTo(off + 262, GROUND - 26); ctx.stroke();
