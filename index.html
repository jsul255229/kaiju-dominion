  ctx.moveTo(ax - 5, ay + 5); ctx.lineTo(ax, ay + 12); ctx.lineTo(ax + 5, ay + 5);
  ctx.lineTo(ax + 2, ay + 4); ctx.lineTo(ax - 2, ay + 4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = N.tie;                             // tie in the network colour
  ctx.beginPath();
  ctx.moveTo(ax - 1.6, ay + 8); ctx.lineTo(ax + 1.6, ay + 8);
  ctx.lineTo(ax + 2.6, barY + 34); ctx.lineTo(ax - 2.6, barY + 34);
  ctx.closePath(); ctx.fill();
  // head — tilts and leans in as the situation worsens
  const lean = anchor.mood >= 2 ? Math.sin(now / 420) * 1.4 : Math.sin(now / 900) * 0.7;
  ctx.save();
  ctx.translate(ax + lean, ay - 4);
  ctx.fillStyle = N.skin;
  ctx.beginPath(); ctx.ellipse(0, 0, 7.4, 8.6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = N.hair;                            // hair
  ctx.beginPath(); ctx.ellipse(0, -3.4, 7.6, 6.2, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(-7.6, -4.2, 2.4, 5);
  ctx.fillRect(5.2, -4.2, 2.4, 5);
  // eyes: widen with alarm, blink on a timer
  const blinking = anchor.blink < 0.12;
  const eyeH = blinking ? 0.5 : (anchor.mood >= 3 ? 2.9 : anchor.mood >= 2 ? 2.3 : 1.8);
  ctx.fillStyle = "#f6f6f8";
  for (const sx of [-2.9, 2.9]) { ctx.beginPath(); ctx.ellipse(sx, -0.6, 2.1, eyeH, 0, 0, 7); ctx.fill(); }
  if (!blinking) {
    ctx.fillStyle = "#1c2028";
    for (const sx of [-2.9, 2.9]) { ctx.beginPath(); ctx.arc(sx, -0.6, 1.05, 0, 7); ctx.fill(); }
  }
  ctx.strokeStyle = N.hair; ctx.lineWidth = 1;       // brows — raised when horrified
  const brow = anchor.mood >= 3 ? -4.6 : anchor.mood >= 2 ? -3.9 : -3.4;
  ctx.beginPath();
  ctx.moveTo(-4.8, brow + (anchor.mood >= 2 ? 0.8 : 0)); ctx.lineTo(-1.2, brow);
  ctx.moveTo(1.2, brow); ctx.lineTo(4.8, brow + (anchor.mood >= 2 ? 0.8 : 0));
  ctx.stroke();
  // mouth: animates while talking, hangs open when appalled
  const talking = anchor.talk > 0;
  const mo = talking ? 1.1 + Math.abs(Math.sin(now / 70)) * 2.4 : (anchor.mood >= 3 ? 2.2 : 0.7);
  ctx.fillStyle = "#7a3038";
  ctx.beginPath(); ctx.ellipse(0, 4.2, 2.6, mo, 0, 0, 7); ctx.fill();
  ctx.restore();
  ctx.restore();
  ctx.strokeStyle = anchor.alarm > 0.3 ? "#ff5555" : "#33405e";
  ctx.strokeRect(3, barY + 3, 54, 31);
  // "ON AIR" tally light
  if (Math.floor(now / 500) % 2) {
    ctx.fillStyle = "#ff3b3b";
    ctx.beginPath(); ctx.arc(52, barY + 8, 2.2, 0, 7); ctx.fill();
  }

  // ---- station ident: network on top, LIVE + location beneath, nothing crowded ----
  const idX = 62, idW = 72;
  ctx.fillStyle = N.col;
  ctx.fillRect(idX, barY + 4, idW, 13);
  ctx.fillStyle = "#fff"; ctx.textAlign = "center";
  fitText(N.net, idX + idW / 2, barY + 13, idW - 6, 9, "bold");
  ctx.fillStyle = "rgba(18,22,34,0.95)";
  ctx.fillRect(idX, barY + 19, idW, 13);
  ctx.strokeStyle = "rgba(120,40,40,0.6)";
  ctx.strokeRect(idX, barY + 19, idW, 13);
  ctx.fillStyle = Math.floor(now / 500) % 2 ? "#ff3b3b" : "#7a1c1c";   // recording dot
  ctx.beginPath(); ctx.arc(idX + 7, barY + 25.5, 3, 0, 7); ctx.fill();
  ctx.fillStyle = "#ff5555"; ctx.textAlign = "left";
  ctx.font = "bold 7px monospace";
  ctx.fillText("LIVE", idX + 12, barY + 28);
  ctx.fillStyle = "#9aa4bc"; ctx.textAlign = "right";
  fitText(city.name, idX + idW - 4, barY + 28, idW - 34, 7, "bold");

  // ---- live situation map: captioned header, then a clean plot area ----
  const mmX = 142, mmY = barY + 4, mmW = 150, mmH = 29;
  ctx.fillStyle = "rgba(12,20,34,0.95)";
  ctx.fillRect(mmX, mmY, mmW, mmH);
  ctx.strokeStyle = "#33405e"; ctx.strokeRect(mmX, mmY, mmW, mmH);
  ctx.fillStyle = "rgba(40,54,80,0.9)";                 // caption strip, above the plot
  ctx.fillRect(mmX + 1, mmY + 1, mmW - 2, 9);
  ctx.fillStyle = "#9aa4bc"; ctx.font = "6px monospace"; ctx.textAlign = "left";
  ctx.fillText("LIVE POSITION", mmX + 4, mmY + 7.5);
  ctx.textAlign = "right";
  ctx.fillStyle = "#6f7a94";
  ctx.fillText(Math.round(destroyedPct * 100) + "% RAZED", mmX + mmW - 4, mmY + 7.5);
  const pY = mmY + 11, pH = mmH - 12;                   // plot area, nothing else lives here
  ctx.fillStyle = "rgba(8,14,26,0.9)";
  ctx.fillRect(mmX + 1, pY - 1, mmW - 2, pH);
  const mapAt = wx => mmX + 1 + (wx / worldW) * (mmW - 2);
  // city strip: standing blocks along the baseline, rubble flattened
  for (const b of buildings) {
    if (b.landmark) continue;
    const bx = mapAt(b.x), bw = Math.max(1, (b.w / worldW) * (mmW - 2));
    ctx.fillStyle = b.rubble ? "#6a3a24" : "#3f5378";
    ctx.fillRect(bx, b.rubble ? pY + 12 : pY + 8, bw, b.rubble ? 4 : 8);
  }
  ctx.fillStyle = "#2a3450";                            // ground line
  ctx.fillRect(mmX + 1, pY + 16, mmW - 2, 1.5);
  for (const b of buildings) {                          // landmark targets
    if (!b.landmark) continue;
    const bx = mapAt(b.x + b.w / 2);
    ctx.fillStyle = b.rubble ? "#4a6a52" : (Math.floor(now / 400) % 2 ? "#ffdd44" : "#c9a020");
    ctx.beginPath();
    ctx.moveTo(bx, pY + 3); ctx.lineTo(bx + 3.2, pY + 9); ctx.lineTo(bx - 3.2, pY + 9);
    ctx.closePath(); ctx.fill();
  }
  if (boss && boss.hp > 0) { ctx.fillStyle = "#ff4477"; ctx.fillRect(mapAt(boss.x) - 1.5, pY + 4, 3, 12); }
  if (rival && rival.hp > 0) { ctx.fillStyle = "#c060ff"; ctx.fillRect(mapAt(rival.x) - 1.5, pY + 4, 3, 12); }
  for (const u of units) {                              // heavy threats worth broadcasting
    if (u.kind !== "walker" && u.kind !== "mlrs" && u.kind !== "destroyer" && u.kind !== "carrier") continue;
    ctx.fillStyle = u.kind === "destroyer" || u.kind === "carrier" ? "#6ab8e8" : "#ff8866";
    ctx.fillRect(mapAt(u.x) - 1, pY + 6, 2, 9);
  }
  if (evt) {                                            // event markers ride the top edge
    ctx.fillStyle = evt.kind === "airstrike" ? "#ff5544" : "#66eeff";
    if (evt.trucks) { for (const t of evt.trucks) if (!t.dead) ctx.fillRect(mapAt(t.x) - 1, pY, 2, 3); }
    else if (evt.x != null) ctx.fillRect(mapAt(evt.x) - 1, pY, 2, 3);
  }
  ctx.strokeStyle = "rgba(255,255,255,0.28)";           // broadcast camera window
  ctx.strokeRect(mapAt(camX), pY + 2, (W / worldW) * (mmW - 2), 15);
  // the creature: a pulsing threat blip on the baseline
  const kx = mapAt(kaiju.x), pulse = 3 + Math.sin(now / 180) * 1.6;
  ctx.fillStyle = "rgba(255,60,60,0.3)";
  ctx.beginPath(); ctx.arc(kx, pY + 12, pulse + 3, 0, 7); ctx.fill();
  ctx.fillStyle = "#ff3b3b";
  ctx.beginPath(); ctx.arc(kx, pY + 12, 2.6, 0, 7); ctx.fill();

  // ---- lower third: the headline the anchor is reading ----
  const ltX = 302, ltW = W - ltX - 6;
  ctx.fillStyle = anchor.headlineT > 0 ? "#c02020" : "rgba(20,26,40,0.9)";
  ctx.fillRect(ltX, barY + 4, 52, 12);
  ctx.fillStyle = "#fff"; ctx.font = "bold 7px monospace"; ctx.textAlign = "center";
  ctx.fillText(anchor.headlineT > 0 ? "BREAKING" : "DEVELOPING", ltX + 26, barY + 12);
  ctx.textAlign = "left";
  ctx.fillStyle = anchor.headlineT > 0 ? "#ffffff" : "#c3cbdd";
  const head = anchor.headline || (CITIES[cityIdx].name + " UNDER ATTACK");
  ctx.font = "bold 10px monospace";
  ctx.fillText(clipText(head, ltW - 60, 10, "bold"), ltX + 58, barY + 13);
  // status strap: casualties, destruction, military posture
  ctx.fillStyle = "rgba(20,26,40,0.9)";
  ctx.fillRect(ltX, barY + 19, ltW, 14);
  ctx.fillStyle = "#8f9ab4"; ctx.font = "8px monospace";
  const strap = stats.bld + " STRUCTURES LOST   ·   " + stats.civs + " CASUALTIES   ·   " +
                (boss && boss.hp > 0 ? "GUARDIAN UNIT ENGAGED" :
                 destroyedPct > 0.4 ? "MILITARY RESPONSE OVERWHELMED" : "MILITARY RESPONDING");
  ctx.fillText(clipText(strap, ltW - 8, 8), ltX + 5, barY + 29);

  // ---- the crawl ----
  if (news.length) {
    ctx.fillStyle = "rgba(4,6,12,0.97)";
    ctx.fillRect(0, barY + 35, W, 11);
    ctx.fillStyle = N.col;
    ctx.fillRect(0, barY + 35, 3, 11);
    const tape = news.join("   •   ") + "   •   ";
    ctx.save();
    ctx.beginPath(); ctx.rect(5, barY + 35, W - 5, 11); ctx.clip();
    ctx.font = "8px monospace";
    ctx.fillStyle = "#c8d2e4";
    ctx.textAlign = "left";
    const tw = ctx.measureText(tape).width;
    newsX = (newsX + 0.75) % tw;
    ctx.fillText(tape + tape, 8 - newsX, barY + 43);
    ctx.restore();
  }
  // red alert wash across the whole strap on a fresh bulletin
  if (anchor.alarm > 0.55) {
    ctx.fillStyle = "rgba(255,40,40," + ((anchor.alarm - 0.55) * 0.35) + ")";
    ctx.fillRect(0, barY, W, barH);
  }
}

function drawHUD(city) {
  const lmAll = buildings.filter(b => b.landmark);
  const lmDown = lmAll.filter(b => b.rubble).length;

  // ---------- LEFT: who you are and what you can do ----------
  ctx.textAlign = "left";
  ctx.fillStyle = "#c3cbdd";
  ctx.font = "bold 11px monospace";
  ctx.fillText(kaiju.type.name, 12, 19);
  ctx.fillStyle = "#5a637a";
  ctx.font = "9px monospace";
  ctx.fillText("LV." + kaijuLevel(), 12 + ctx.measureText(kaiju.type.name).width * 1.22 + 6, 19);
  // melee chain pips ride on the same line
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = kaiju.chainT > 0 && i < kaiju.chainN ? "#ffdd44" : "#2f3646";
    ctx.beginPath(); ctx.arc(146 + i * 10, 15.5, 3, 0, 7); ctx.fill();
  }
  // health
  ctx.fillStyle = "#20242f"; ctx.fillRect(12, 24, 160, 9);
  ctx.fillStyle = kaiju.hp / kaiju.maxHp > 0.3 ? cbGood() : cbBad();
  ctx.fillRect(12, 24, 160 * Math.max(0, kaiju.hp) / kaiju.maxHp, 9);
  ctx.strokeStyle = "#3d4557"; ctx.strokeRect(12, 24, 160, 9);
  // rage, with its state written inside the bar rather than on another line
  const ult = kaiju.rage >= 100;
  ctx.fillStyle = "#20242f"; ctx.fillRect(12, 36, 160, 9);
  ctx.fillStyle = ult && Math.floor(performance.now() / 150) % 2 ? "#ffffff" : kaiju.type.beam;
  ctx.fillRect(12, 36, 160 * kaiju.rage / 100, 9);
  ctx.strokeStyle = "#3d4557"; ctx.strokeRect(12, 36, 160, 9);
  ctx.fillStyle = ult ? "#101420" : "#8f9ab4";
  ctx.font = "bold 7px monospace";
  ctx.fillText(ult ? "★ ULTIMATE READY" : kaiju.type.specialName, 15, 43);

  // ---------- RIGHT: what the city still owes you ----------
  ctx.textAlign = "right";
  ctx.fillStyle = "#c3cbdd";
  ctx.font = "bold 11px monospace";
  ctx.fillText(city.name, W - 12, 19);
  ctx.fillStyle = "#20242f"; ctx.fillRect(W - 172, 24, 160, 9);
  ctx.fillStyle = "#ffaa44";
  ctx.fillRect(W - 172, 24, 160 * Math.min(1, destroyedPct / CLEAR_PCT), 9);
  ctx.strokeStyle = "#3d4557"; ctx.strokeRect(W - 172, 24, 160, 9);
  ctx.textAlign = "left";
  ctx.fillStyle = "#8f9ab4"; ctx.font = "bold 7px monospace";
  ctx.fillText(Math.round(destroyedPct * 100) + "% RAZED", W - 169, 31);
  // targets as pips only — the words were noise
  ctx.textAlign = "right";
  for (let i = 0; i < lmAll.length; i++) {
    const done = i < lmDown;
    ctx.fillStyle = done ? cbDone() : "#2f3646";
    ctx.fillRect(W - 12 - (lmAll.length - i) * 11, 36, 8, 8);
    if (!done) { ctx.strokeStyle = "#ffdd44"; ctx.strokeRect(W - 12 - (lmAll.length - i) * 11, 36, 8, 8); }
  }
  ctx.fillStyle = "#5a637a"; ctx.font = "7px monospace";
  ctx.fillText("TARGETS", W - 12 - lmAll.length * 11 - 4, 43);

  // ---------- score sits under the left stack, out of the play area ----------
  ctx.textAlign = "left";
  ctx.fillStyle = "#ffdd44"; ctx.font = "bold 12px monospace";
  const scoreTxt = score.toLocaleString();
  const scoreW = ctx.measureText(scoreTxt).width;        // measured in the font it is drawn in
  ctx.fillText(scoreTxt, 12, 60);
  if (diffIdx !== 1) {                                   // only when it is off the default
    ctx.fillStyle = DIF().col; ctx.font = "bold 7px monospace";
    ctx.fillText(DIF().name, 12 + scoreW + 10, 60);
  }

  drawBroadcast(city);

  // combo meter
  if (combo >= 2) {
    ctx.textAlign = "center";
    const m = comboMult();
    ctx.fillStyle = m >= 3 ? "#ff4477" : m >= 2 ? "#ffaa44" : "#ffdd88";
    ctx.font = "bold " + (14 + Math.min(8, combo)) + "px monospace";
    ctx.fillText(combo + " COMBO  x" + m.toFixed(1), W / 2, 46);
    // combo decay bar
    ctx.fillStyle = "#333";
    ctx.fillRect(W / 2 - 40, 52, 80, 4);
    ctx.fillStyle = "#ffaa44";
    ctx.fillRect(W / 2 - 40, 52, 80 * Math.max(0, comboT / 3), 4);
  }

  // boss health bar
  if (boss && boss.hp > 0) {
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff4477";
    ctx.font = "bold 11px monospace";
    ctx.fillText(boss.spec ? boss.spec.name : "GUARDIAN MECHA", W / 2, 72);
    ctx.fillStyle = "#333";
    ctx.fillRect(W / 2 - 120, 78, 240, 9);
    ctx.fillStyle = "#ff4477";
    ctx.fillRect(W / 2 - 120, 78, 240 * Math.max(0, boss.hp) / boss.maxHp, 9);
    ctx.strokeStyle = "#844";
    ctx.strokeRect(W / 2 - 120, 78, 240, 9);
  }

  // rival kaiju health bar
  if (rival && rival.hp > 0) {
    const ry = boss && boss.hp > 0 ? 100 : 72;
    ctx.textAlign = "center";
    ctx.fillStyle = "#c060ff";
    ctx.font = "bold 11px monospace";
    ctx.fillText(rival.type.name, W / 2, ry);
    ctx.fillStyle = "#333";
    ctx.fillRect(W / 2 - 120, ry + 6, 240, 9);
    ctx.fillStyle = "#c060ff";
    ctx.fillRect(W / 2 - 120, ry + 6, 240 * Math.max(0, rival.hp) / rival.maxHp, 9);
    ctx.strokeStyle = "#648";
    ctx.strokeRect(W / 2 - 120, ry + 6, 240, 9);
  }

  // touch buttons (right side) — only on coarse pointers
  if (isTouch() && state === S.PLAY) {
    const bx1 = OPT.lefty ? 58 : W - 58, bx2 = OPT.lefty ? 132 : W - 132;
    btns.swipe  = { x: bx1, y: H - 172, r: 30 };
    btns.stomp  = { x: bx2, y: H - 154, r: 26 };
    btns.breath = { x: bx1, y: H - 246, r: 26 };
    btns.roar   = { x: bx2, y: H - 222, r: 22 };
    drawBtn(btns.swipe, "CLAW", "#ffcc66");
    drawBtn(btns.stomp, "STOMP", "#ff9966");
    drawBtn(btns.breath, "BEAM", "#66eeff");
    drawBtn(btns.roar, "ROAR", kaiju.roarCd > 0 ? "#666677" : "#ffdd44");
    // move hint zone
    // virtual joystick: rests at the natural thumb spot, snaps to wherever the
    // thumb actually lands, and the nub tracks the drag
    let stick = null;
    for (const id in touches) { const t = touches[id];
      if (OPT.lefty ? t.sx > W * 0.55 : t.sx < W * 0.45) { stick = t; break; } }
    const jbx = stick ? stick.sx : (OPT.lefty ? W - 92 : 92);
    const jby = stick ? stick.sy : H - 190;   // resting spot sits above the kaiju
    const jr = 36;
    ctx.globalAlpha = stick ? 0.5 : 0.28;
    ctx.fillStyle = "#0e1420";                        // base
    ctx.beginPath(); ctx.arc(jbx, jby, jr, 0, 7); ctx.fill();
    ctx.strokeStyle = "#8fa2c0"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(jbx, jby, jr, 0, 7); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillStyle = "#8fa2c0";                        // direction ticks
    ctx.beginPath();
    ctx.moveTo(jbx - jr + 7, jby); ctx.lineTo(jbx - jr + 14, jby - 5); ctx.lineTo(jbx - jr + 14, jby + 5);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(jbx + jr - 7, jby); ctx.lineTo(jbx + jr - 14, jby - 5); ctx.lineTo(jbx + jr - 14, jby + 5);
    ctx.closePath(); ctx.fill();
    // the nub follows the thumb, clamped to the ring
    let nx = jbx, ny = jby;
    if (stick) {
      const dx = Math.max(-jr + 8, Math.min(jr - 8, stick.x - stick.sx));
      nx = jbx + dx;
    }
    ctx.globalAlpha = stick ? 0.85 : 0.4;
    const jg = ctx.createRadialGradient(nx - 3, ny - 3, 2, nx, ny, 15);
    jg.addColorStop(0, "#c9d4e8"); jg.addColorStop(1, "#5a6a88");
    ctx.fillStyle = jg;
    ctx.beginPath(); ctx.arc(nx, ny, 15, 0, 7); ctx.fill();
    if (!stick) {
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#c8d2e4"; ctx.font = "bold 8px monospace"; ctx.textAlign = "center";
      ctx.fillText("MOVE", jbx, jby + jr + 12);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }
}
function drawBtn(b, label, color) {
  ctx.globalAlpha = 0.55;                     // dark base so buttons read over any skyline
  ctx.fillStyle = "#0a0e18";
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1.5, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.95;
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.fillStyle = "#fff";
  ctx.font = "bold 10px monospace";
  ctx.textAlign = "center";
  ctx.fillText(label, b.x, b.y + 3);
  ctx.globalAlpha = 1;
}

function drawSettingsScreen() {
  ctx.fillStyle = "#080b14"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(150,190,255,0.3)";
  for (let i = 0; i < 50; i++) ctx.fillRect((i * 137.5) % W, (i * 71.3) % H, 1.2, 1.2);
  ctx.textAlign = "center";
  ctx.fillStyle = "#66eeff"; ctx.font = "bold 26px monospace";
  ctx.fillText("SETTINGS", W / 2, 58);
  ctx.fillStyle = "#5a637a"; ctx.font = "10px monospace";
  ctx.fillText(hint("nav") + " select   ·   " + hint("pick") + " adjust   ·   " + hint("back") + " done", W / 2, 80);
  settingsBtns = [];
  OPT_ROWS.forEach((r, i) => {
    const y = 104 + i * 46, sel = i === settingsSel;
    ctx.fillStyle = sel ? "rgba(40,52,80,0.9)" : "rgba(18,22,34,0.85)";
    ctx.fillRect(W / 2 - 210, y, 420, 38);
    ctx.strokeStyle = sel ? "#66eeff" : "#39405a";
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(W / 2 - 210, y, 420, 38);
    ctx.lineWidth = 1;
    settingsBtns.push({ x: W / 2 - 210, y, w: 420, h: 38, i });
    if (r.type === "action") {
      ctx.fillStyle = sel ? "#66eeff" : "#8892a8";
      ctx.font = "bold 13px monospace";
      ctx.fillText("◀  " + r.label, W / 2, y + 24);
      return;
    }
    ctx.textAlign = "left";
    ctx.fillStyle = sel ? "#e8eefc" : "#aab4c8";
    ctx.font = "bold 11px monospace";
    ctx.fillText(r.label, W / 2 - 194, y + 17);
    if (r.hint) {
      ctx.fillStyle = "#5a637a"; ctx.font = "8px monospace";
      ctx.fillText(r.hint, W / 2 - 194, y + 30);
    }
    ctx.textAlign = "right";
    if (r.type === "slider") {
      const v = OPT[r.k];
      ctx.fillStyle = "#20242f"; ctx.fillRect(W / 2 + 40, y + 12, 120, 12);
      ctx.fillStyle = sel ? "#66eeff" : "#4a7a9a";
      ctx.fillRect(W / 2 + 40, y + 12, 120 * v, 12);
      ctx.strokeStyle = "#39405a"; ctx.strokeRect(W / 2 + 40, y + 12, 120, 12);
      ctx.fillStyle = "#c8d2e4"; ctx.font = "bold 10px monospace";
      ctx.fillText(Math.round(v * 100) + "%", W / 2 + 196, y + 22);
      ctx.fillStyle = sel ? "#66eeff" : "#5a637a";
      ctx.fillText("▸", W / 2 + 178, y + 22);
      ctx.textAlign = "left";
      ctx.fillText("◂", W / 2 + 24, y + 22);
    } else {
      const on = OPT[r.k];
      ctx.fillStyle = on ? (OPT.colorblind ? "#4aa8ff" : "#66dd66") : "#39405a";
      ctx.fillRect(W / 2 + 120, y + 9, 56, 20);
      ctx.fillStyle = on ? "#0d1220" : "#8892a8";
      ctx.font = "bold 10px monospace"; ctx.textAlign = "center";
      ctx.fillText(on ? "ON" : "OFF", W / 2 + 148, y + 23);
    }
    ctx.textAlign = "center";
  });
}

function drawPauseMenu() {
  ctx.fillStyle = "rgba(4,6,14,0.93)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 34px monospace";
  ctx.fillText("PAUSED", W / 2, 80);
  ctx.fillStyle = "#8892a8"; ctx.font = "11px monospace";
  ctx.fillText(CITIES[cityIdx].name + " · " + Math.round(destroyedPct * 100) + "% RAZED · SCORE " + score, W / 2, 103);
  ctx.fillStyle = "#667"; ctx.font = "10px monospace";
  ctx.fillText(hint("nav") + " select   ·   " + hint("confirm") + " to confirm   ·   " + hint("pause") + " resumes", W / 2, 124);

  PAUSE_ITEMS.forEach((label, i) => {
    const y = 136 + i * 33, sel = i === pauseSel;
    const danger = i === PAUSE_ITEMS.length - 1;
    const isDiff = i === 1;
    const wipeArmed = danger && confirmWipe;
    ctx.fillStyle = wipeArmed ? "rgba(90,20,26,0.85)" : sel ? "rgba(40,52,80,0.9)" : "rgba(18,22,34,0.8)";
    ctx.fillRect(W / 2 - 150, y, 300, 27);
    ctx.strokeStyle = wipeArmed ? "#ff5566" : sel ? "#ffdd44" : "#39405a";
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(W / 2 - 150, y, 300, 27);
    ctx.lineWidth = 1;
    ctx.fillStyle = wipeArmed ? "#ffaaaa" : danger ? "#e06a70" : isDiff ? DIF().col : sel ? "#ffdd44" : "#aab";
    ctx.font = "bold 13px monospace";
    ctx.fillText(wipeArmed ? "PRESS AGAIN TO ERASE EVERYTHING"
      : isDiff ? "[2]  DIFFICULTY:  ◂ " + DIF().name + " ▸"
      : "[" + (i + 1) + "]  " + label, W / 2, y + 18);
  });

  ctx.fillStyle = "#4a5270"; ctx.font = "8px monospace";
  ctx.fillText("RESET ALL PROGRESS clears unlocked kaiju, skins, mutations, EVO, XP and grades.", W / 2, 338);

  // ---- control reference, phrased for whatever device is in the player's hands ----
  const rows = inputMode === "pad"
    ? [["STICK / D-PAD", "move"], ["Ⓐ / Ⓧ", "claw combo"], ["Ⓑ", "stomp"],
       ["Ⓨ / RT (hold)", "special"], ["LB", "roar"], ["START", "pause"], ["SELECT", "mute"]]
    : inputMode === "touch"
    ? [["DRAG LEFT SIDE", "move"], ["CLAW", "claw combo"], ["STOMP", "stomp"],
       ["BEAM (hold)", "special"], ["ROAR", "roar"], ["❚❚", "pause"]]
    : [["← →", "move"], ["SPACE / J", "claw combo"], ["K / X", "stomp"],
       ["L / C (hold)", "special"], ["R", "roar"], ["P / ESC", "pause"], ["M", "mute"]];
  const colW = 150, cols = Math.ceil(rows.length / 2);
  const x0 = W / 2 - (cols * colW) / 2;
  ctx.fillStyle = "#39405a"; ctx.font = "8px monospace"; ctx.textAlign = "center";
  ctx.fillText("CONTROLS  ·  " + (inputMode === "pad" ? "CONTROLLER" : inputMode === "touch" ? "TOUCH" : "KEYBOARD"),
               W / 2, 352);
  for (let i = 0; i < rows.length; i++) {
    const cx2 = x0 + Math.floor(i / 2) * colW, ry = 368 + (i % 2) * 13;
    ctx.textAlign = "right";
    ctx.fillStyle = "#8f9ab4"; ctx.font = "bold 8px monospace";
    ctx.fillText(rows[i][0], cx2 + colW * 0.52, ry);
    ctx.textAlign = "left";
    ctx.fillStyle = "#5a637a"; ctx.font = "8px monospace";
    ctx.fillText(rows[i][1], cx2 + colW * 0.56, ry);
  }
  ctx.textAlign = "center";
}

function overlay(title, color, sub) {
  ctx.fillStyle = "rgba(5,5,15,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = color;
  ctx.font = "bold 30px monospace";

  ctx.fillStyle = "#aab";
  ctx.font = "13px monospace";
  sub.split("\n").forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 14 + i * 20));

// ---------- City recap: stats + letter grade ----------
function drawRecap(city) {
  const r = lastRecap;
  if (!r) return;
  ctx.fillStyle = "rgba(5,5,15,0.94)";     // near-opaque: world text must not bleed through
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ff6644";
  ctx.font = "bold 26px monospace";
  ctx.fillText(city.name + " DESTROYED!", W / 2, 66);

  // giant grade stamp
  const gc = { S: "#ffdd44", A: "#66ff88", B: "#66eeff", C: "#99a" }[r.grade];
  const pop = 1 + Math.max(0, clearTimer) * 0.8;
  ctx.save();
  ctx.translate(W - 130, 130);
  ctx.rotate(-0.12);
  ctx.scale(pop, pop);
  ctx.strokeStyle = gc; ctx.lineWidth = 4;
  ctx.strokeRect(-42, -46, 84, 84);
  ctx.fillStyle = gc;
  ctx.font = "bold 64px monospace";
  ctx.fillText(r.grade, 0, 22);
  ctx.restore();
  ctx.lineWidth = 1;

  // stat lines
  ctx.textAlign = "left";
  ctx.font = "13px monospace";
  const lines = [
    ["BUILDINGS TOPPLED", r.bld],
    ["UNITS DESTROYED", r.units],
    ["CIVILIANS SCATTERED", r.civs],
    ["DAMAGE TAKEN", r.dmg + " HP"],
    ["RAMPAGE TIME", r.time + "s" + (r.swift ? "  ✓ SWIFT" : "")],
    ["BEST COMBO", "x" + (1 + Math.min(4, Math.floor(r.combo / 5)) * 0.5).toFixed(1) + (r.first ? "  ✓ FIRST STRIKE" : "")]
  ];
  lines.forEach(([lbl, val], i) => {
    const y = 110 + i * 26;
    ctx.fillStyle = "#778";
    ctx.fillText(lbl, 70, y);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "right";
    ctx.fillText("" + val, 420, y);
    ctx.textAlign = "left";
  });

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffdd44";
  ctx.font = "bold 14px monospace";
  ctx.fillText("BONUS +" + r.bonus + "   ·   EVO +" + r.dnaGain, W / 2, 296);
  if (r.skinMsg) {
    ctx.fillStyle = "#ffee88";
    if (Math.floor(performance.now() / 300) % 2) ctx.fillText("★ " + r.skinMsg + " ★", W / 2, 320);
  }
  ctx.fillStyle = "#aab";
  ctx.font = "12px monospace";
  ctx.fillText("LV." + kaijuLevel() + " (" + totalXP + " XP)   ·   EVO BANK " + dna, W / 2, 348);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px monospace";
  if (Math.floor(performance.now() / 500) % 2) ctx.fillText("tap / SPACE → MUTATION LAB", W / 2, 396);
}

// ---------- Mutation shop ----------
function drawShop() {
  ctx.fillStyle = "rgba(5,8,18,0.94)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#66ff88";
  ctx.font = "bold 24px monospace";
  ctx.fillText("⧖ MUTATION LAB", W / 2, 52);
  ctx.fillStyle = "#ffdd44";
  ctx.font = "bold 13px monospace";
  ctx.fillText("EVO BANK: " + dna, W / 2, 76);
  ctx.fillStyle = "#778";
  ctx.font = "10px monospace";
  ctx.fillText("press 1-" + MUTS.length + " or tap a mutation to evolve · perks are permanent", W / 2, 94);

  const rowY = 118, rowH = 52;
  MUTS.forEach((m, i) => {
    const y = rowY + i * rowH;
    const rank = mutRank(m.id);
    const maxed = rank >= m.max;
    const cost = mutCost(m.id);
    const afford = !maxed && dna >= cost;
    ctx.fillStyle = afford ? "rgba(40,70,50,0.55)" : "rgba(30,32,45,0.55)";
    ctx.fillRect(60, y, W - 120, rowH - 8);
    ctx.strokeStyle = afford ? "#66ff88" : maxed ? "#ffdd44" : "#445";
    ctx.strokeRect(60, y, W - 120, rowH - 8);
    ctx.textAlign = "left";
    ctx.fillStyle = maxed ? "#ffdd44" : "#fff";
    ctx.font = "bold 13px monospace";
    ctx.fillText((i + 1) + ". " + m.name, 74, y + 18);
    ctx.fillStyle = "#99a";
    ctx.font = "10px monospace";
    ctx.fillText(m.desc, 74, y + 34);
    // rank pips
    for (let p = 0; p < m.max; p++) {
      ctx.fillStyle = p < rank ? "#66ff88" : "#333";
      ctx.beginPath(); ctx.arc(W - 210 + p * 16, y + 20, 5, 0, 7); ctx.fill();
    }
    ctx.textAlign = "right";
    ctx.fillStyle = maxed ? "#ffdd44" : afford ? "#66ff88" : "#775";
    ctx.font = "bold 12px monospace";
    ctx.fillText(maxed ? "MAX" : cost + " EVO", W - 74, y + 24);
    ctx.textAlign = "center";
  });

  ctx.fillStyle = "#fff";
  ctx.font = "bold 15px monospace";
  if (Math.floor(performance.now() / 500) % 2)
    ctx.fillText(hint("confirm") + " → NEXT CITY", W / 2, H - 32);
}

function drawMenu() {

  ctx.fillStyle = "#66eeff";
  ctx.font = "bold 46px monospace";
  ctx.fillText("KAIJU DOMINION", W / 2, 92);
  ctx.shadowBlur = 0;

  // the kaiju, given room to be the hero of the screen
  drawKaijuModel(skinnedType(KAIJUS[selKaiju]), W / 2, 340, 1, { walk: t * 2.5, rage: 100, scale: 1.25 });

  // a single call to action
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 15px monospace";
  if (Math.floor(t * 1.6) % 2) ctx.fillText(hint("confirm") + "  TO BEGIN", W / 2, 384);

  // one quiet footer line carries everything else
  ctx.fillStyle = "#4c5570";
  ctx.font = "10px monospace";
  const foot = (hiscore > 0 ? "BEST  " + hiscore + "        " : "") +
               (padConnected ? "🎮 CONTROLLER READY        " : "") + "v1.0";

  ctx.fillText("⚙ SETTINGS", gearBtn.x + gearBtn.w / 2, gearBtn.y + 17);
  // fullscreen toggle for browsers that allow it (iPad, Android, desktop)
  fsBtn = null;
  const fsOK = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  const standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  // iPhone Safari can't hide its own bars — but installed to the home screen it can.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    ctx.strokeStyle = "#66eeff"; ctx.strokeRect(W / 2 - bw2 / 2, H - 52, bw2, 24);
    ctx.fillStyle = "#9adcf0"; ctx.textAlign = "center";

  }
  if (fsOK && !standalone) {
    fsBtn = { x: W - 118, y: 10, w: 102, h: 26 };
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    ctx.fillStyle = "rgba(20,26,42,0.94)";
    ctx.fillRect(fsBtn.x, fsBtn.y, fsBtn.w, fsBtn.h);
    ctx.strokeStyle = "#6a76a0"; ctx.strokeRect(fsBtn.x, fsBtn.y, fsBtn.w, fsBtn.h);
    ctx.fillStyle = "#b6c0d6"; ctx.font = "bold 9px monospace"; ctx.textAlign = "center";
    ctx.fillText(inFs ? "⛶ EXIT FULL" : "⛶ FULLSCREEN", fsBtn.x + fsBtn.w / 2, fsBtn.y + 17);
  }
  ctx.fillStyle = DIF().col; ctx.font = "bold 10px monospace";
  ctx.fillText("DIFFICULTY: " + DIF().name + "   (D to change)", W / 2, H - 30);
}

function drawSelect() {
  const t = performance.now() / 1000;
  ctx.textAlign = "center";
  ctx.fillStyle = "#66eeff";
  ctx.font = "bold 26px monospace";
  ctx.fillText("CHOOSE YOUR KAIJU", W / 2, 58);
  ctx.fillStyle = "#ffdd44";
  ctx.font = "11px monospace";
  ctx.fillText("KAIJU LEVEL " + kaijuLevel() + "  ·  " + totalXP + " XP  ·  +" + ((kaijuLevel() - 1) * 5) + "% HP  +" + ((kaijuLevel() - 1) * 4) + "% RAGE GAIN", W / 2, 72);

  backBtn = drawBackButton("TITLE");
  ctx.textAlign = "center";

  // ---- difficulty picker, right where you pick your kaiju ----
  const dW = 92, dH = 20, dY = 8, dX0 = W / 2 - (DIFFS.length * dW) / 2;
  diffBtns = [];
  // an explicit caption so the chips read as a setting, not as tabs
  ctx.textAlign = "right";
  ctx.fillStyle = "#8892a8"; ctx.font = "bold 10px monospace";
  ctx.fillText("DIFFICULTY:", dX0 - 10, dY + 14);
  ctx.textAlign = "center";
  ctx.font = "bold 9px monospace";
  for (let i = 0; i < DIFFS.length; i++) {
    const D = DIFFS[i], sel = i === diffIdx, bx = dX0 + i * dW;
    ctx.fillStyle = sel ? D.col : "rgba(18,22,34,0.9)";
    ctx.fillRect(bx, dY, dW - 4, dH);
    ctx.strokeStyle = sel ? D.col : "#39405a";
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(bx, dY, dW - 4, dH);
    ctx.lineWidth = 1;
    ctx.fillStyle = sel ? "#0d1220" : "#8892a8";
    ctx.fillText(D.name, bx + (dW - 4) / 2, dY + 14);
    diffBtns.push({ x: bx, y: dY, w: dW - 4, h: dH, i });
  }
  // the selected setting's plain-language description, right of the chips
  ctx.textAlign = "left";
  ctx.fillStyle = DIF().col; ctx.font = "bold 8px monospace";
  fitText(DIF().blurb, dX0 + DIFFS.length * dW + 8, dY + 14, W - (dX0 + DIFFS.length * dW) - 16, 8, "bold");
  ctx.textAlign = "center";

  const cw = W / KAIJUS.length;
  KAIJUS.forEach((kj, i) => {
    const cx = cw * i + cw / 2;
    const sel = i === selKaiju;
    const unlocked = isUnlocked(kj);
    // card
    ctx.fillStyle = sel ? "rgba(60,70,110,0.5)" : "rgba(30,32,50,0.5)";
    ctx.fillRect(cw * i + 8, 78, cw - 16, 318);
    ctx.strokeStyle = sel ? kj.beam : "#445";
    ctx.lineWidth = sel ? 2.5 : 1;
    ctx.strokeRect(cw * i + 8, 78, cw - 16, 318);
    ctx.lineWidth = 1;

    if (unlocked) {
      // live model preview, clipped to its own card so wings/tails never spill
      // over a neighbour's portrait
      ctx.save();
      ctx.beginPath();
      ctx.rect(cw * i + 9, 79, cw - 18, 184);
      ctx.clip();
      drawKaijuModel(skinnedType(kj), cx, 260, 1,
        { walk: sel ? t * 3 : 0, rage: sel ? 100 : 0, scale: 0.78, breathing: sel && Math.floor(t) % 3 === 0 });
      ctx.restore();
      ctx.fillStyle = sel ? "#fff" : "#99a";
      fitText(kj.name, cx, 292, cw - 22, 15, "bold");
      ctx.fillStyle = "#889";
      fitText(kj.title, cx, 308, cw - 20, 10);
      ctx.fillStyle = kj.beam;
      fitText(kj.specialName, cx, 328, cw - 20, 11, "bold");
      // stat bars
      const stats2 = [["PWR", kj.melee / 80], ["SPD", kj.speed / 170], ["HP", kj.hp / 140]];
      stats2.forEach(([lbl, v], si) => {
        ctx.fillStyle = "#667";
        ctx.font = "9px monospace";
        ctx.textAlign = "left";
        ctx.fillText(lbl, cw * i + 20, 348 + si * 12);
        ctx.fillStyle = "#333";
        ctx.fillRect(cw * i + 48, 341 + si * 12, cw - 72, 6);
        ctx.fillStyle = kj.beam;
        ctx.fillRect(cw * i + 48, 341 + si * 12, (cw - 72) * Math.min(1, v), 6);
        ctx.textAlign = "center";
      });
      // skin selector row (↑↓ or tap when unlocked by grades)
      const unl = skinUnl[kj.id] || 0;
      ctx.font = "9px monospace";
      if (unl > 0) {
        const cur2 = SKINS[Math.min(skinSel[kj.id] || 0, unl)];
        ctx.fillStyle = cur2.name === "GOLDEN" ? "#ffdd44" : cur2.name === "ASHEN" ? "#ccccdd" : "#889";
        fitText("◂ SKIN: " + cur2.name + " ▸", cx, 388, cw - 18, 9);
      } else if (sel) {
        ctx.fillStyle = "#556";
        fitText("skins: earn A / S grades", cx, 388, cw - 18, 9);
      }
    } else {
      // ---- CLASSIFIED: an unreadable containment blur, not this kaiju's real shape ----
      ctx.save();
      ctx.beginPath();
      ctx.rect(cw * i + 9, 79, cw - 18, 302);
      ctx.clip();
      // hazy mass: same generic blob for every locked slot, so nothing is given away
      const bx = cx, by = 250, br = 46 + Math.sin(t * 0.8 + i) * 2;
      const g = ctx.createRadialGradient(bx, by, 4, bx, by, br * 1.5);
      g.addColorStop(0, "rgba(30,34,48,0.95)");
      g.addColorStop(0.55, "rgba(16,18,28,0.8)");
      g.addColorStop(1, "rgba(10,12,20,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(bx, by, br * 1.1, br * 1.45, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(8,10,16,0.85)";
      ctx.beginPath();
      ctx.moveTo(bx - 34, by + 58);
      ctx.quadraticCurveTo(bx - 40, by - 20, bx - 14, by - 46);
      ctx.quadraticCurveTo(bx, by - 60 - Math.sin(t * 1.3 + i) * 4, bx + 16, by - 44);
      ctx.quadraticCurveTo(bx + 42, by - 16, bx + 34, by + 58);
      ctx.closePath(); ctx.fill();
      // two watching eyes in the dark
      const eg = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.1 + i * 2));
      ctx.fillStyle = "rgba(255,80,80," + eg + ")";
      for (const s2 of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(bx + s2 * 11, by - 26, 3.4, 2.2, 0, 0, 7); ctx.fill();
      }
      ctx.fillStyle = "rgba(255,180,180,0.25)";
      for (const s2 of [-1, 1]) {
        ctx.beginPath(); ctx.arc(bx + s2 * 11, by - 26, 8, 0, 7); ctx.fill();
      }
      // interference scanlines rolling over the containment feed
      ctx.fillStyle = "rgba(120,140,190,0.06)";
      for (let sy = 79; sy < 381; sy += 4) ctx.fillRect(cw * i + 9, sy, cw - 18, 2);
      ctx.fillStyle = "rgba(160,190,255,0.10)";
      ctx.fillRect(cw * i + 9, 79 + ((t * 90 + i * 60) % 302), cw - 18, 10);
      ctx.restore();
      // redacted plate
      ctx.fillStyle = "#20242f";
      ctx.fillRect(cw * i + 22, 282, cw - 44, 14);
      ctx.fillStyle = "#444a5a";
      ctx.font = "bold 12px monospace";
      ctx.fillText("███████", cx, 293);
      ctx.fillStyle = "#8892aa";
      ctx.font = "bold 12px monospace";
      ctx.fillText("⛨ CLASSIFIED", cx, 314);
      ctx.fillStyle = "#667";
      fitText(kj.unlockText || ("raze " + kj.unlockAt + " cities to unseal"), cx, 332, cw - 18, 10);
      ctx.fillStyle = "#556";
      ctx.fillText("progress " + Math.min(unlockedCities, kj.unlockAt) + "/" + kj.unlockAt, cx, 346);
      // unlock progress bar
      ctx.fillStyle = "#2a2f3e";
      ctx.fillRect(cw * i + 24, 354, cw - 48, 5);
      ctx.fillStyle = "#66889a";
      ctx.fillRect(cw * i + 24, 354, (cw - 48) * Math.min(1, unlockedCities / kj.unlockAt), 5);
    }
  });

  // selected kaiju detail line
  const cur = KAIJUS[selKaiju];
  ctx.fillStyle = "#aab";
  fitText(isUnlocked(cur) ? cur.specialName + ": " + cur.specialHint
                          : "Keep destroying cities to awaken this kaiju...", W / 2, 415, W - 40, 12);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px monospace";
  if (Math.floor(t * 1.6) % 2)
    ctx.fillText(isUnlocked(cur) ? hint("confirm") + "  TO RAMPAGE" : hint("pick") + " to browse", W / 2, 437);
}

  [[113,-22],[113,-26],[115,-32],[118,-35],[123,-34],[129,-32],[134,-33],[137,-35],[140,-38],
   [145,-39],[148,-38],[151,-33],[153,-28],[153,-25],[149,-21],[146,-19],[143,-14],[142,-11],
   [138,-12],[133,-12],[130,-11],[126,-14],[122,-17],[117,-20],[113,-22]],
  // Tasmania · New Zealand · Japan · British Isles · Madagascar · Sri Lanka · Iceland · Philippines
  [[145,-41],[148,-41],[148,-43],[145,-43],[145,-41]],
  [[172,-34],[176,-38],[178,-38],[176,-41],[172,-41],[168,-45],[166,-46],[170,-43],[170,-39],[172,-34]],
  [[130,31],[132,33],[135,34],[137,37],[139,35],[141,39],[142,42],[145,44],[144,45],[140,41],
   [137,36],[133,34],[130,31]],
  [[-5,50],[-1,51],[0,53],[-1,55],[-3,58],[-5,58],[-6,56],[-8,55],[-10,52],[-6,50]],
  [[43,-12],[48,-13],[50,-16],[50,-22],[47,-25],[45,-25],[43,-21],[43,-16],[43,-12]],
  [[80,6],[82,7],[82,9],[80,9],[80,6]],
  [[-24,64],[-19,66],[-14,66],[-14,64],[-19,63],[-24,64]],
  [[120,18],[122,17],[124,13],[126,10],[126,7],[122,6],[120,10],[119,14],[120,18]]
];
const MAP_BOX = { x: 30, y: 96, w: 740, h: 244 };
// Miller-ish latitude compression: keeps the high latitudes from stretching and
// spreads the mid-latitude band where most of the cities actually are
function mapProj(lon, lat) {
  const t = Math.max(-1, Math.min(1, lat / 90));
  const y = Math.sign(t) * Math.pow(Math.abs(t), 1.18);
  return [MAP_BOX.x + ((lon + 180) / 360) * MAP_BOX.w,
          MAP_BOX.y + (0.5 - y * 0.5) * MAP_BOX.h];
}

// Pins are relaxed apart so no two ever overlap; a hairline tether points back to
// the true coordinate. Deterministic, so it is computed once and cached.
let mapPins = null, mapPinsW = 0;
function layoutMapPins() {
  MAP_BOX.x = Math.round((W - MAP_BOX.w) / 2);   // stay centred at any playfield width
  if (mapPins && mapPinsW === W) return mapPins;
  mapPinsW = W;
  const pts = CITIES.map((c, i) => {
    const [x, y] = mapProj(c.lon, c.lat);
    return { i, x, y, tx: x, ty: y };
  });
  const MIN = 27;
  for (let iter = 0; iter < 140; iter++) {
    for (let a = 0; a < pts.length; a++) {
      for (let b = a + 1; b < pts.length; b++) {
        const dx = pts[b].x - pts[a].x, dy = pts[b].y - pts[a].y;
        const d = Math.hypot(dx, dy) || 0.0001;
        if (d < MIN) {
          const push = ((MIN - d) / 2) * 0.55;
          const ux = dx / d, uy = dy / d;
          pts[a].x -= ux * push; pts[a].y -= uy * push;
          pts[b].x += ux * push; pts[b].y += uy * push;
        }
      }
    }
    for (const p of pts) {                       // gentle spring back to true position
      p.x += (p.tx - p.x) * 0.05;
      p.y += (p.ty - p.y) * 0.05;
      p.x = Math.max(MAP_BOX.x + 14, Math.min(MAP_BOX.x + MAP_BOX.w - 14, p.x));
      p.y = Math.max(MAP_BOX.y + 14, Math.min(MAP_BOX.y + MAP_BOX.h - 30, p.y));
    }
  }
  mapPins = pts;
  return pts;
}
function mapNodeAt(px, py) {
  const pts = layoutMapPins();
  let best = -1, bd = 1e9;
  for (const p of pts) {
    if (p.i > unlockedCities) continue;
    const d = Math.hypot(px - p.x, py - p.y);
    if (d < bd) { bd = d; best = p.i; }
  }
  return bd < 40 ? best : -1;
}

function drawMap() {
  const now = performance.now();
  const B = MAP_BOX;
  const pins = layoutMapPins();

  // ---- backdrop ----
  const bg = ctx.createRadialGradient(W / 2, H * 0.4, 30, W / 2, H * 0.4, W * 0.8);
  bg.addColorStop(0, "#0c1526"); bg.addColorStop(1, "#03050b");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(190,210,255,0.45)";
  for (let i = 0; i < 70; i++) {
    const sx = (i * 137.5) % W, sy = (i * 71.3) % H;
    ctx.globalAlpha = 0.2 + 0.35 * Math.abs(Math.sin(now / 2600 + i));
    ctx.fillRect(sx, sy, 1.3, 1.3);
  }
  ctx.globalAlpha = 1;

  backBtn = drawBackButton("KAIJU");
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffdd44"; ctx.font = "bold 20px monospace";
  ctx.fillText("GLOBAL THREAT MAP", W / 2, 32);
  ctx.fillStyle = "#7f8ba4"; ctx.font = "10px monospace";
  const opened = Math.min(unlockedCities + 1, CITIES.length);
  ctx.fillText(opened + " / " + CITIES.length + " FRONTS OPEN" +
    (ngPlus > 0 ? "   ·   NEW GAME+" + ngPlus : ""), W / 2, 52);
  ctx.textAlign = "center";

  // ---- ocean, with depth banding for definition ----
  ctx.save();
  ctx.beginPath(); ctx.rect(B.x, B.y, B.w, B.h); ctx.clip();
  const og = ctx.createLinearGradient(0, B.y, 0, B.y + B.h);
  og.addColorStop(0, "#071726"); og.addColorStop(0.35, "#0d2740");
  og.addColorStop(0.65, "#0d2740"); og.addColorStop(1, "#071726");
  ctx.fillStyle = og; ctx.fillRect(B.x, B.y, B.w, B.h);
  // abyssal texture
  ctx.fillStyle = "rgba(120,180,225,0.035)";
  for (let i = 0; i < 320; i++) {
    const px = B.x + ((i * 97.3) % B.w), py = B.y + ((i * 53.7) % B.h);
    ctx.fillRect(px, py, 2, 1);
  }
  // graticule
  ctx.strokeStyle = "rgba(96,150,200,0.10)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let lon = -150; lon <= 150; lon += 30) { const [gx] = mapProj(lon, 0); ctx.moveTo(gx, B.y); ctx.lineTo(gx, B.y + B.h); }
  for (let lat = -60; lat <= 60; lat += 30) { const [, gy] = mapProj(0, lat); ctx.moveTo(B.x, gy); ctx.lineTo(B.x + B.w, gy); }
  ctx.stroke();
  ctx.strokeStyle = "rgba(130,190,235,0.18)";
  ctx.setLineDash([2, 4]);
  ctx.beginPath();
  const [, eqy] = mapProj(0, 0);
  ctx.moveTo(B.x, eqy); ctx.lineTo(B.x + B.w, eqy);
  ctx.stroke();
  ctx.setLineDash([]);

  // ---- landmasses: continental shelf halo, gradient body, lit coast, interior texture ----
  for (const poly of LANDMASSES) {
    ctx.beginPath();
    poly.forEach(([lo, la], i) => {
      const [px, py] = mapProj(lo, la);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.strokeStyle = "rgba(90,175,230,0.16)"; ctx.lineWidth = 9; ctx.stroke();  // shelf
    ctx.strokeStyle = "rgba(90,175,230,0.10)"; ctx.lineWidth = 16; ctx.stroke();
    const lg = ctx.createLinearGradient(0, B.y, 0, B.y + B.h);
    lg.addColorStop(0, "#33486b"); lg.addColorStop(0.5, "#2a3c5b"); lg.addColorStop(1, "#22314c");
    ctx.fillStyle = lg; ctx.fill();
    ctx.strokeStyle = "rgba(150,215,255,0.7)"; ctx.lineWidth = 1.3; ctx.stroke();
  }
  ctx.lineWidth = 1;
  // relief speckle inside the land only
  ctx.save();
  ctx.beginPath();
  for (const poly of LANDMASSES) {
    poly.forEach(([lo, la], i) => {
      const [px, py] = mapProj(lo, la);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.closePath();
  }
  ctx.clip();
  ctx.fillStyle = "rgba(160,200,240,0.07)";
  for (let i = 0; i < 900; i++) {
    const px = B.x + ((i * 61.7) % B.w), py = B.y + ((i * 37.3) % B.h);
    ctx.fillRect(px, py, 1.6, 1.6);
  }
  ctx.fillStyle = "rgba(10,18,32,0.16)";
  for (let i = 0; i < 400; i++) {
    const px = B.x + ((i * 91.1) % B.w), py = B.y + ((i * 47.9) % B.h);
    ctx.fillRect(px, py, 2.4, 1.4);
  }
  ctx.restore();
  ctx.restore();

  // frame + tactical corner brackets
  ctx.strokeStyle = "rgba(120,180,230,0.35)";
  ctx.strokeRect(B.x, B.y, B.w, B.h);
  ctx.strokeStyle = "#ffdd44"; ctx.lineWidth = 2;
  for (const [sx, sy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
    const px = sx > 0 ? B.x : B.x + B.w, py = sy > 0 ? B.y : B.y + B.h;
    ctx.beginPath();
    ctx.moveTo(px + sx * 16, py); ctx.lineTo(px, py); ctx.lineTo(px, py + sy * 16);
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  const gl = ["C", "B", "A", "A", "S"];
  const gc = { S: "#ffdd44", A: "#66ff88", B: "#66eeff", C: "#99a" };
  // difficulty colour: green (early) → red (late)
  const threat = (i, a2) => {
    const f = i / (CITIES.length - 1);
    const r = Math.round(70 + f * 185), g2 = Math.round(190 - f * 140), b2 = Math.round(150 - f * 100);
    return a2 === undefined ? "rgb(" + r + "," + g2 + "," + b2 + ")"
                            : "rgba(" + r + "," + g2 + "," + b2 + "," + a2 + ")";
  };

  // ---- tethers from true coordinate to displaced pin ----
  ctx.strokeStyle = "rgba(150,200,240,0.3)";
  for (const p of pins) {
    if (Math.hypot(p.x - p.tx, p.y - p.ty) < 3) continue;
    ctx.beginPath();
    ctx.moveTo(p.tx, p.ty); ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.fillStyle = "rgba(150,200,240,0.5)";
    ctx.fillRect(p.tx - 1, p.ty - 1, 2, 2);
  }

  // ---- labels, placed so none can ever collide ----
  const placed = [];
  const labelBoxes = [];
  ctx.font = "bold 9px monospace";
  for (const p of pins) {
    const i = p.i, c = CITIES[i];
    const unl = i <= unlockedCities;
    const txt = unl ? c.name : "???";
    const tw = ctx.measureText(txt).width + 8;
    const th = 12;
    // try slots around the pin until one is free
    const cands = [[0, -17], [0, 15], [tw / 2 + 12, 0], [-tw / 2 - 12, 0],
                   [tw / 2 + 12, -14], [-tw / 2 - 12, -14], [tw / 2 + 12, 14], [-tw / 2 - 12, 14],
                   [0, -29], [0, 27]];
    let put = null;
    for (const [ox, oy] of cands) {
      const bx = p.x + ox - tw / 2, by = p.y + oy - th / 2;
      if (bx < B.x + 2 || bx + tw > B.x + B.w - 2 || by < B.y + 2 || by + th > B.y + B.h - 2) continue;
      let clash = false;
      for (const r of labelBoxes)
        if (bx < r.x + r.w + 3 && bx + tw + 3 > r.x && by < r.y + r.h + 3 && by + th + 3 > r.y) { clash = true; break; }
      if (!clash) for (const q of pins)
        if (Math.abs((bx + tw / 2) - q.x) < tw / 2 + 8 && Math.abs((by + th / 2) - q.y) < th / 2 + 8) { clash = true; break; }
      if (!clash) { put = { x: bx, y: by, w: tw, h: th }; break; }
    }
    if (put) labelBoxes.push(put);
    placed.push({ p, put, txt, unl });
  }

  // ---- pins ----
  for (const p of pins) {
    const i = p.i, c = CITIES[i];
    const unl = i <= unlockedCities;
    const sel = i === mapSel;
    const razed = gradeOf(i) != null;
    const col = unl ? threat(i) : "#2a3040";
    if (unl) {
      const hg = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, sel ? 20 : 12);
      hg.addColorStop(0, unl ? threat(i, 0.8) : "rgba(0,0,0,0)"); hg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(p.x, p.y, sel ? 20 : 12, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // campaign number ring
    ctx.beginPath(); ctx.arc(p.x, p.y, sel ? 9.5 : 8, 0, 7);
    ctx.fillStyle = unl ? "#0a1020" : "#141a26"; ctx.fill();
    ctx.strokeStyle = unl ? col : "#3d465c"; ctx.lineWidth = sel ? 2.4 : 1.6; ctx.stroke();
    ctx.lineWidth = 1;
    ctx.textAlign = "center";
    // the pin always carries its campaign number; the grade is a separate badge
    if (!unl) {
      ctx.fillStyle = "#5a637a"; ctx.font = "bold 9px monospace";
      ctx.fillText("✕", p.x, p.y + 3);
    } else {
      ctx.fillStyle = col; ctx.font = "bold 9px monospace";
      ctx.fillText("" + (i + 1), p.x, p.y + 3);
      if (razed) {
        const g = gl[gradeOf(i)];
        ctx.fillStyle = "#070b14";
        ctx.beginPath(); ctx.arc(p.x + 8.5, p.y - 8.5, 6, 0, 7); ctx.fill();
        ctx.strokeStyle = gc[g]; ctx.lineWidth = 1.3; ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillStyle = gc[g]; ctx.font = "bold 8px monospace";
        ctx.fillText(g, p.x + 8.5, p.y - 6);
      }
    }
    if (sel) {
      const p2 = 1 + Math.sin(now / 240) * 0.1;
      ctx.strokeStyle = "#ffdd44"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(p.x, p.y, 16 * p2, 0, 7); ctx.stroke();
      ctx.beginPath();
      for (const a2 of [0, Math.PI / 2, Math.PI, Math.PI * 1.5]) {
        ctx.moveTo(p.x + Math.cos(a2) * 19, p.y + Math.sin(a2) * 19);
        ctx.lineTo(p.x + Math.cos(a2) * 25, p.y + Math.sin(a2) * 25);
      }
      ctx.stroke(); ctx.lineWidth = 1;
    }
  }

  // ---- draw the labels last so they sit above everything ----
  for (const L of placed) {
    if (!L.put) continue;
    const sel = L.p.i === mapSel;
    ctx.fillStyle = sel ? "rgba(255,221,68,0.95)" : "rgba(6,10,20,0.85)";
    ctx.fillRect(L.put.x, L.put.y, L.put.w, L.put.h);
    ctx.strokeStyle = sel ? "#ffdd44" : "rgba(120,150,190,0.4)";
    ctx.strokeRect(L.put.x, L.put.y, L.put.w, L.put.h);
    ctx.fillStyle = sel ? "#101420" : (L.unl ? "#c8d4e6" : "#5a637a");
    ctx.font = "bold 9px monospace"; ctx.textAlign = "center";
    ctx.fillText(L.txt, L.put.x + L.put.w / 2, L.put.y + 9);
  }

  // ---- dossier ----
  const c = CITIES[mapSel];
  const M = MECHS[c.mil] || MECHS.usa;
  const unlSel = mapSel <= unlockedCities;
  const panelY = H - 84;
  ctx.fillStyle = "rgba(8,12,22,0.95)";
  ctx.fillRect(B.x, panelY, B.w, 42);
  ctx.strokeStyle = unlSel ? threat(mapSel, 0.7) : "#2c3a55";
  ctx.strokeRect(B.x, panelY, B.w, 42);
  ctx.fillStyle = unlSel ? threat(mapSel) : "#39405a";
  ctx.fillRect(B.x, panelY, 4, 42);
  ctx.textAlign = "left";
  ctx.fillStyle = unlSel ? "#e8eefc" : "#5a627a"; ctx.font = "bold 13px monospace";
  ctx.fillText(unlSel ? (mapSel + 1) + ". " + c.name : "CLASSIFIED FRONT", B.x + 14, panelY + 17);
  ctx.font = "9px monospace"; ctx.fillStyle = "#7f8ba4";
  if (unlSel) {
    ctx.fillText(c.sub + "   ·   " + c.time.toUpperCase() +
      (c.weather !== "clear" ? " / " + c.weather.toUpperCase() : ""), B.x + 14, panelY + 31);
    ctx.textAlign = "center";
    ctx.fillStyle = "#8892a8"; ctx.font = "8px monospace";
    ctx.fillText("PRIME TARGET", B.x + B.w * 0.44, panelY + 14);
    ctx.fillStyle = "#dde3ee"; ctx.font = "bold 10px monospace";
    ctx.fillText(clipText(c.landmarkName.toUpperCase(), 190, 10, "bold"), B.x + B.w * 0.44, panelY + 29);
    ctx.textAlign = "right";
    ctx.font = "8px monospace"; ctx.fillStyle = "#7f8ba4";
    ctx.fillText(clipText((MIL[c.mil] || MIL.usa).force, 210, 8), B.x + B.w - 14, panelY + 14);
    ctx.fillStyle = M.glow; ctx.font = "bold 10px monospace";
    ctx.fillText("⚙ " + M.name, B.x + B.w - 14, panelY + 29);
  } else {
    ctx.fillText("raze " + mapSel + " cities to open this front", B.x + 14, panelY + 31);
  }
  ctx.textAlign = "center";

  // ---- controls + strike ----
  ctx.fillStyle = "#5a627a"; ctx.font = "9px monospace";
  ctx.fillText(hint("pick") + "  select      " + hint("confirm") + "  strike" +
    (ngNext > 0 && score === 0 ? "      N  new game+" : "") + "      " + hint("back") + "  back", W / 2, H - 30);
  const canGo = unlSel;
  const bw = 240, bx0 = W / 2 - bw / 2, by0 = H - 24;
  ctx.fillStyle = canGo ? "rgba(40,52,80,0.95)" : "rgba(18,22,34,0.9)";
  ctx.fillRect(bx0, by0, bw, 20);
  ctx.strokeStyle = canGo ? "#ffdd44" : "#39405a";
  ctx.lineWidth = canGo ? 2 : 1;
  ctx.strokeRect(bx0, by0, bw, 20);
  ctx.lineWidth = 1;
  ctx.fillStyle = canGo ? "#ffdd44" : "#4a5270"; ctx.font = "bold 12px monospace";
  ctx.fillText(canGo ? "▶  STRIKE " + c.name : "✕  LOCKED", W / 2, by0 + 14);
  mapBtn = { x: bx0, y: by0, w: bw, h: 20 };
}

// ---------- Per-city photo filter (color grade + vignette) ----------

function drawPhotoFilter(city) {

  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.22)");

// ---------- Main loop ----------
let last = performance.now();
let perfAcc = 0, perfN = 0, perfGood = 0, perfStamp = 0;
function frame(now) {
  let dt = Math.min(0.04, (now - last) / 1000);
  // measure REAL wall-clock frame spacing and govern quality from it
  const rawMs = perfStamp ? now - perfStamp : 16;
  perfStamp = now;
  if (state === S.PLAY && rawMs > 0 && rawMs < 400) {
    perfAcc += rawMs; perfN++;
    if (perfN >= 75) {
      const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
      if (avg > 27 && qTier > 0) { qTier--; resize(); perfGood = 0; }
      else if (avg < 15 && qTier < 2 && ++perfGood >= 3) { qTier++; resize(); perfGood = 0; }
      else if (avg >= 15) perfGood = 0;
    }
  }
  last = now;
  if (killCam) {                       // slow-mo kill cam on the final landmark
    killCam.t -= dt;
    if (killCam.t <= 0) killCam = null;
    else if (state === S.PLAY) dt *= 0.25;
  }
  pollGamepad();
  update(dt);
  musicTick(dt);
  draw();
  if (inputModeT > 0) {
    inputModeT -= dt;
    const lbl = inputMode === "pad" ? "🎮 CONTROLLER" : inputMode === "touch" ? "☝ TOUCH" : "⌨ KEYBOARD";
    ctx.globalAlpha = Math.min(1, inputModeT * 1.6);
    ctx.fillStyle = "rgba(10,14,24,0.9)";
    ctx.fillRect(W / 2 - 66, 6, 132, 18);
    ctx.strokeStyle = "#66eeff"; ctx.strokeRect(W / 2 - 66, 6, 132, 18);
    ctx.fillStyle = "#66eeff"; ctx.font = "bold 10px monospace"; ctx.textAlign = "center";
    ctx.fillText(lbl, W / 2, 19);
    ctx.globalAlpha = 1;
  }
  if (btnFlash.t > 0 && btnFlash.r) {
    btnFlash.t -= dt;
    ctx.fillStyle = "rgba(255,255,255," + Math.max(0, btnFlash.t * 2.2) + ")";
    ctx.fillRect(btnFlash.r.x, btnFlash.r.y, btnFlash.r.w, btnFlash.r.h);
  }
  if (portrait) drawRotateHint();
  requestAnimationFrame(frame);
}

// on a portrait phone the letterbox leaves the game tiny — ask for landscape
function drawRotateHint() {
  ctx.fillStyle = "rgba(4,6,14,0.92)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  const t = performance.now() / 1000;
  ctx.save();
  ctx.translate(W / 2, H / 2 - 22);
  ctx.rotate(Math.sin(t * 1.4) * 0.42 - 0.2);
  ctx.strokeStyle = "#ffdd44"; ctx.lineWidth = 3;
  ctx.strokeRect(-26, -42, 52, 84);
  ctx.fillStyle = "#ffdd44";
  ctx.fillRect(-8, 34, 16, 3);
  ctx.restore();
  ctx.fillStyle = "#ffdd44"; ctx.font = "bold 17px monospace";
  ctx.fillText("ROTATE YOUR DEVICE", W / 2, H / 2 + 62);
  ctx.fillStyle = "#8892a8"; ctx.font = "11px monospace";
  ctx.fillText("KAIJU DOMINION plays in landscape", W / 2, H / 2 + 82);
}
resetLevel(); // so menu backdrop has data
requestAnimationFrame(frame);
</script>
