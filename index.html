    ctx.closePath();
  };

  // spreading puddle it drags along the street
  ctx.fillStyle = shade(body, -30) + "cc";
  ctx.beginPath();
  ctx.ellipse(0, -3, W2 * 1.5 + Math.sin(wob) * 4, 9, 0, 0, 7);
  ctx.fill();

  // outer gel — translucent so the city shows through
  ctx.save();
  ctx.globalAlpha = 0.82;
  ctx.fillStyle = body;
  blobPath(0, 0, 1);
  ctx.fill();
  ctx.restore();

  // clip everything else to the blob so contents stay inside
  ctx.save();
  blobPath(0, 0, 1);
  ctx.clip();
  // inner brighter core
  ctx.fillStyle = belly;
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.ellipse(4, -H2 * 0.42, W2 * 0.62, H2 * 0.3, 0.2, 0, 7);
  ctx.fill();
  ctx.globalAlpha = 1;
  // swallowed wreckage slowly circulating in the goo
  const junk = [[0, 0.55, 0], [1, 0.3, 2.1], [2, 0.72, 4.0], [0, 0.42, 5.4]];
  junk.forEach(([kind, r, ph], i) => {
    const a = wob * 0.35 + ph;
    const jx = Math.cos(a) * W2 * r * 0.8;
    const jy = -H2 * 0.5 + Math.sin(a * 1.3) * H2 * 0.3;
    ctx.save();
    ctx.translate(jx, jy);
    ctx.rotate(Math.sin(a) * 0.6);
    ctx.globalAlpha = 0.5;
    if (kind === 0) {                                        // a car
      ctx.fillStyle = ["#c04040", "#4060c0", "#c0b040"][i % 3];
      ctx.fillRect(-9, -4, 18, 6);
      ctx.fillRect(-5, -8, 10, 5);
      ctx.fillStyle = "#222";
      ctx.beginPath(); ctx.arc(-5, 2, 2.2, 0, 7); ctx.arc(5, 2, 2.2, 0, 7); ctx.fill();
    } else if (kind === 1) {                                 // a steel girder
      ctx.fillStyle = "#8a8a96";
      ctx.fillRect(-14, -2, 28, 4);
      ctx.fillRect(-14, -5, 4, 10); ctx.fillRect(10, -5, 4, 10);
    } else {                                                 // chunk of masonry
      ctx.fillStyle = "#9a8f78";
      ctx.beginPath();
      ctx.moveTo(-8, 4); ctx.lineTo(-5, -6); ctx.lineTo(6, -7); ctx.lineTo(9, 3);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  });
  ctx.globalAlpha = 1;
  // bubbles rising through the gel
  for (let i = 0; i < 9; i++) {
    const ph = ((now / 1400) + i * 0.11) % 1;
    ctx.fillStyle = `rgba(240,255,200,${0.10 + (1 - ph) * 0.22})`;
    ctx.beginPath();
    ctx.arc(Math.sin(i * 2.3 + wob) * W2 * 0.6, -ph * H2, 2 + (i % 3), 0, 7);
    ctx.fill();
  }
  ctx.restore();

  // rim light along the wet outer surface
  ctx.strokeStyle = glow;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.55;
  blobPath(0, 0, 1);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
  ctx.fillStyle = "rgba(255,255,255,0.25)";                   // specular highlight
  ctx.beginPath();
  ctx.ellipse(-W2 * 0.42, -H2 * 0.66, W2 * 0.17, H2 * 0.16, -0.4, 0, 7);
  ctx.fill();

  // pseudopod arm that stretches out to strike
  const reach = o.swipeT > 0 ? Math.sin(Math.min(1, o.swipeT) * Math.PI) : 0;
  const armLen = 26 + reach * 62;
  const armY = -H2 * 0.55 + (o.swipeKind === 2 ? -20 : o.swipeKind === 3 ? 16 : 0) * reach;
  ctx.fillStyle = body;
  ctx.globalAlpha = 0.92;
  ctx.beginPath();
  ctx.moveTo(W2 * 0.2, armY - 16);
  ctx.quadraticCurveTo(W2 * 0.4 + armLen * 0.55, armY - 13 - reach * 8, W2 * 0.3 + armLen, armY - 2);
  ctx.quadraticCurveTo(W2 * 0.4 + armLen * 0.5, armY + 13 + reach * 6, W2 * 0.2, armY + 14);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = glow;                                       // corrosive drips off the pseudopod
  for (let i = 0; i < 3; i++) {
    const dp = ((now / 420) + i * 0.33) % 1;
    ctx.globalAlpha = 1 - dp;
    ctx.beginPath();
    ctx.arc(W2 * 0.25 + armLen * (0.4 + i * 0.2), armY + 12 + dp * 34, 2.6 - dp, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // asymmetric floating eyes — the only "face" it has
  const eyes = [[10, -H2 * 0.72, 9], [30, -H2 * 0.58, 6.5], [20, -H2 * 0.86, 5]];
  eyes.forEach(([ex, ey, er], i) => {
    const dx = Math.sin(wob * 0.7 + i * 2) * 2.5, dy = Math.cos(wob * 0.9 + i) * 2;
    ctx.fillStyle = "rgba(250,255,235,0.95)";
    ctx.beginPath(); ctx.arc(ex + dx, ey + dy, er, 0, 7); ctx.fill();
    ctx.fillStyle = o.hurt ? "#ff4444" : "#1c2a12";
    ctx.beginPath();
    ctx.arc(ex + dx + er * 0.35, ey + dy, er * 0.45, 0, 7);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.beginPath(); ctx.arc(ex + dx + er * 0.1, ey + dy - er * 0.35, er * 0.2, 0, 7); ctx.fill();
  });

  // dissolving mouth-gash opens when it surges or breathes
  if (o.breathing || o.whirl) {
    ctx.fillStyle = "rgba(30,50,16,0.9)";
    ctx.beginPath();
    ctx.ellipse(18, -H2 * 0.34, 16, 9 + Math.sin(now / 90) * 3, 0.1, 0, 7);
    ctx.fill();
    ctx.fillStyle = glow;
    for (let i = 0; i < 6; i++) {                             // acid teeth
      ctx.beginPath();
      ctx.moveTo(6 + i * 5, -H2 * 0.34 - 7);
      ctx.lineTo(9 + i * 5, -H2 * 0.34);
      ctx.lineTo(12 + i * 5, -H2 * 0.34 - 7);
      ctx.closePath(); ctx.fill();
    }
  }
  // sludge sloughing off the base
  ctx.fillStyle = shade(body, -14);
  for (let i = 0; i < 4; i++) {
    const dp = ((now / 700) + i * 0.25) % 1;
    ctx.globalAlpha = 0.7 * (1 - dp);
    ctx.beginPath();
    ctx.ellipse(-W2 * 0.7 + i * W2 * 0.45, -14 + dp * 14, 4 - dp * 2, 6 - dp * 3, 0, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- ZEPHYRAX: slender storm wyvern — huge wings, S-neck, whip tail ----
function drawZephyraxBody(t, o, body, belly, spineC, charged) {
  const now = performance.now();
  const legA = Math.sin((o.walk || 0) * 2) * 8;
  const stompDip = o.stompT > 0.55 ? 8 : 0;
  const flap = o.dash ? Math.sin(now / 45) * 0.7 : Math.sin(now / 320) * 0.22;
  const membrane = o.hurt ? "rgba(255,170,170,0.8)" : "rgba(140,130,220,0.78)";

  // far wing (behind everything)
  drawWing(-0.35 - flap * 0.8, shade(body, -30), "rgba(90,85,160,0.6)");

  // whip tail: long, thin, with a fan of feathers at the tip
  const tailSwing = o.swipeT > 0 && o.swipeKind === 3 ? Math.sin(o.swipeT * 10) * 1.2 : Math.sin(now / 420) * 0.15;
  ctx.strokeStyle = body; ctx.lineCap = "round";
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(-10, -52);
  ctx.quadraticCurveTo(-50, -48 + tailSwing * 30, -84, -30 + tailSwing * 55);
  ctx.quadraticCurveTo(-104, -20 + tailSwing * 65, -118, -26 + tailSwing * 70);
  ctx.stroke(); ctx.lineWidth = 1;
  // tail fan
  ctx.fillStyle = spineC;
  const fx2 = -118, fy2 = -26 + tailSwing * 70;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(fx2 + 4, fy2);
    ctx.lineTo(fx2 - 12, fy2 + i * 8 - 2);
    ctx.lineTo(fx2 + 2, fy2 + i * 3);
    ctx.closePath(); ctx.fill();
  }

  // rear leg: thin digitigrade stilt
  drawBirdLeg(-4 - legA * 0.6, stompDip, shade(body, -25));

  // torso: lean, tilted forward like a raptor
  const tg = ctx.createLinearGradient(-20, 0, 24, 0);
  tg.addColorStop(0, shade(body, -25));
  tg.addColorStop(0.6, body);
  tg.addColorStop(1, shade(body, 20));
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(-14, -48);
  ctx.quadraticCurveTo(-20, -72, -8, -88);
  ctx.quadraticCurveTo(6, -100, 18, -92);
  ctx.quadraticCurveTo(28, -78, 20, -58);
  ctx.quadraticCurveTo(12, -44, -4, -44);
  ctx.closePath(); ctx.fill();
  // feathered chest
  ctx.fillStyle = belly;
  ctx.beginPath();
  ctx.moveTo(18, -88);
  ctx.quadraticCurveTo(26, -72, 18, -56);
  ctx.quadraticCurveTo(10, -48, 2, -48);
  ctx.quadraticCurveTo(12, -66, 12, -84);
  ctx.closePath(); ctx.fill();
  // chevron feather marks
  ctx.strokeStyle = shade(belly, -30);
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(6, -54 - i * 9);
    ctx.lineTo(12, -58 - i * 9);
    ctx.lineTo(18, -54 - i * 9);
    ctx.stroke();
  }

  // front leg
  drawBirdLeg(8 + legA * 0.6, 0, body);

  // near wing — the showpiece: 3-fingered membrane, flaps hard during dash
  drawWing(0.25 + flap, body, membrane);

  // wing-claw arm doubles as the swipe
  let armAng = 0.5;
  if (o.swipeT > 0) {
    if (o.swipeKind === 2)      armAng = 0.9 - (0.42 - o.swipeT) * 7.5;
    else if (o.swipeKind === 3) armAng = 0.3 + Math.sin(o.swipeT * 10) * 0.8;
    else                        armAng = -1.3 + (0.38 - o.swipeT) * 6.5;
  }
  ctx.save();
  ctx.translate(10, -84);
  ctx.rotate(armAng);
  ctx.strokeStyle = body; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, 6); ctx.lineTo(30, 2); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.fillStyle = spineC;
  for (let i = 0; i < 2; i++) {
    ctx.beginPath();
    ctx.moveTo(28, i * 4 - 1); ctx.lineTo(37, 1 + i * 4); ctx.lineTo(28, 3 + i * 4);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // long S-curved neck: filled, tapering from shoulders to skull
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(4, -84);
  ctx.quadraticCurveTo(20, -102, 12, -116);
  ctx.quadraticCurveTo(8, -128, 22, -136);
  ctx.lineTo(30, -128);
  ctx.quadraticCurveTo(18, -122, 22, -112);
  ctx.quadraticCurveTo(28, -98, 16, -88);
  ctx.closePath(); ctx.fill();
  // neck plumage along the back curve
  ctx.fillStyle = shade(body, -20);
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(8 - i, -96 - i * 11);
    ctx.lineTo(-1 - i * 2, -102 - i * 12);
    ctx.lineTo(10 - i, -102 - i * 11);
    ctx.closePath(); ctx.fill();
  }
  // head: larger raptor skull with brow
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(28, -136, 11, 7.5, 0.12, 0, 7); ctx.fill();
  const jawOpen = o.breathing ? 0.4 : 0.05;
  ctx.save();
  ctx.translate(36, -137);
  ctx.rotate(-jawOpen * 0.3);
  ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(21, -0.5); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
  // hooked beak tip
  ctx.fillStyle = shade(body, -30);
  ctx.beginPath(); ctx.moveTo(18, -1.6); ctx.lineTo(23, 2); ctx.lineTo(16, 1); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(36, -134);
  ctx.rotate(jawOpen);
  ctx.fillStyle = shade(body, -18);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, 2); ctx.lineTo(0, 4.5); ctx.closePath(); ctx.fill();
  ctx.restore();
  // nostril
  ctx.fillStyle = shade(body, -40);
  ctx.beginPath(); ctx.arc(44, -139, 1.2, 0, 7); ctx.fill();
  // swept-back head crest (three blades)
  ctx.fillStyle = charged ? "#ffffff" : spineC;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(24 - i * 4, -141 + i * 1.5);
    ctx.lineTo(6 - i * 6, -149 - i * 3);
    ctx.lineTo(19 - i * 4, -136 + i * 1.5);
    ctx.closePath(); ctx.fill();
  }
  // eye with slit pupil + brow shadow
  ctx.fillStyle = shade(body, -30);
  ctx.fillRect(24, -143, 10, 2.5);
  ctx.fillStyle = o.breathing ? t.beam : "#ffee66";
  ctx.beginPath(); ctx.ellipse(29, -138, 3, 2.6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(28.5, -140, 1.4, 4);

  // static crackle when charged
  if (charged) {
    ctx.strokeStyle = "#ddccff";
    ctx.beginPath();
    ctx.moveTo(-20, -100); ctx.lineTo(-14, -108) ; ctx.lineTo(-18, -114);
    ctx.moveTo(20, -70); ctx.lineTo(26, -78);
    ctx.stroke();
  }

  function drawWing(ang, boneC, memC) {
    ctx.save();
    ctx.translate(-2, -86);
    ctx.rotate(-0.25 + ang * 0.5);
    // membrane: three finger struts with webbing
    const tips = [[-78, -52], [-92, -26], [-84, -2]];
    ctx.fillStyle = memC;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (const [tx, ty] of tips) ctx.lineTo(tx, ty);
    ctx.quadraticCurveTo(-40, 6, 0, 0);
    ctx.closePath(); ctx.fill();
    // bones
    ctx.strokeStyle = boneC; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-34, -30);          // leading arm
    for (const [tx, ty] of tips) { ctx.moveTo(-34, -30); ctx.lineTo(tx, ty); }
    ctx.stroke(); ctx.lineWidth = 1;
    // wing claw
    ctx.fillStyle = boneC;
    ctx.beginPath(); ctx.moveTo(-34, -30); ctx.lineTo(-42, -38); ctx.lineTo(-30, -34); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawBirdLeg(hipX, dip, color) {
    // digitigrade: thigh forward, ankle high and back, long toes
    ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(hipX, -50);
    ctx.lineTo(hipX + 8, -32 + dip);       // thigh
    ctx.lineTo(hipX - 2, -16 + dip);       // shin back to ankle
    ctx.lineTo(hipX + 4, dip);             // cannon to foot
    ctx.stroke(); ctx.lineWidth = 1;
    // three long toes
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(hipX + 4, dip); ctx.lineTo(hipX + 16, dip);
    ctx.moveTo(hipX + 4, dip); ctx.lineTo(hipX + 10, dip - 1);
    ctx.moveTo(hipX + 4, dip); ctx.lineTo(hipX - 6, dip);
    ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = "#e8e4d0";
    ctx.beginPath(); ctx.moveTo(hipX + 15, dip - 2); ctx.lineTo(hipX + 21, dip); ctx.lineTo(hipX + 15, dip + 1); ctx.closePath(); ctx.fill();
  }
}

// ---- KRAKENOTH: abyssal cephalopod — tentacle skirt, bulbous mantle, one huge eye ----
function drawKrakenothBody(t, o, body, belly, spineC, charged) {
  const now = performance.now();
  const crawl = (o.walk || 0) * 2;

  // tentacle skirt (locomotion — no legs at all)
  ctx.lineCap = "round";
  for (let i = 0; i < 6; i++) {
    const baseX = -25 + i * 10;
    const ph = crawl + i * 1.1;
    const reach = Math.sin(ph) * 14;
    const lift = Math.max(0, Math.cos(ph)) * 8;
    ctx.strokeStyle = i % 2 ? body : shade(body, -20);
    ctx.lineWidth = 8 - Math.abs(i - 2.5);
    ctx.beginPath();
    ctx.moveTo(baseX * 0.5, -46);
    ctx.quadraticCurveTo(baseX * 0.8, -24 - lift, baseX + reach, -2 - lift * 0.5);
    ctx.stroke();
    // curled tip
    ctx.beginPath();
    ctx.arc(baseX + reach, -4 - lift * 0.5, 3, 0, 5);
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  // mantle: tall bulbous dome, widest above the middle
  const squish = Math.sin(now / 500) * 2; // gelatinous pulse
  const tg = ctx.createLinearGradient(-34, 0, 30, 0);
  tg.addColorStop(0, shade(body, -30));
  tg.addColorStop(0.55, body);
  tg.addColorStop(1, shade(body, 18));
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(-26, -44);
  ctx.quadraticCurveTo(-38 - squish, -84, -22, -114);
  ctx.quadraticCurveTo(-4, -136 - squish, 16, -122);
  ctx.quadraticCurveTo(34 + squish, -100, 26, -66);
  ctx.quadraticCurveTo(20, -46, -2, -42);
  ctx.closePath(); ctx.fill();
  // mantle fin flaps on top
  ctx.fillStyle = shade(body, -15);
  const finWave = Math.sin(now / 300) * 4;
  ctx.beginPath();
  ctx.moveTo(-14, -118);
  ctx.quadraticCurveTo(-30, -132 + finWave, -20, -140 + finWave);
  ctx.quadraticCurveTo(-10, -132, -6, -124);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(4, -126);
  ctx.quadraticCurveTo(14, -140 - finWave, 24, -134 - finWave);
  ctx.quadraticCurveTo(20, -122, 12, -118);
  ctx.closePath(); ctx.fill();

  // pale underbelly with sucker rows
  ctx.fillStyle = belly;
  ctx.beginPath();
  ctx.moveTo(18, -110);
  ctx.quadraticCurveTo(30, -88, 22, -60);
  ctx.quadraticCurveTo(16, -48, 2, -46);
  ctx.quadraticCurveTo(12, -76, 10, -104);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade(belly, -30);
  for (let r = 0; r < 4; r++)
    for (let c2 = 0; c2 < 2; c2++)
      ctx.beginPath(), ctx.arc(10 + c2 * 8, -58 - r * 14, 2, 0, 7), ctx.fill();
  // wet rim-light along the mantle's dark edge
  ctx.strokeStyle = "rgba(200,240,255,0.25)"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-26, -50);
  ctx.quadraticCurveTo(-37 - squish, -84, -21, -112);
  ctx.stroke(); ctx.lineWidth = 1;
  // mottled skin texture patches
  ctx.fillStyle = shade(body, -22);
  for (const [mx, my, mr] of [[-14, -80, 5], [-22, -100, 4], [-4, -60, 4], [-8, -94, 3]]) {
    ctx.beginPath(); ctx.ellipse(mx, my, mr, mr * 0.7, 0.4, 0, 7); ctx.fill();
  }
  // siphon tube puffing behind the mantle
  ctx.fillStyle = shade(body, -18);
  ctx.beginPath();
  ctx.moveTo(-26, -66);
  ctx.quadraticCurveTo(-38, -62, -36, -54);
  ctx.lineTo(-28, -56);
  ctx.closePath(); ctx.fill();
  if (Math.sin(now / 500) > 0.5) {
    ctx.fillStyle = "rgba(160,200,220,0.25)";
    ctx.beginPath(); ctx.ellipse(-42, -56, 6 + Math.sin(now / 90) * 2, 3, 0.2, 0, 7); ctx.fill();
  }

  // bioluminescent spots — pulse when charged
  ctx.fillStyle = charged ? "#aaffee" : spineC;
  const spots = [[-18, -70], [-24, -92], [-10, -108], [-2, -122], [12, -114]];
  spots.forEach(([px, py], i) => {
    const glow = 0.5 + Math.sin(now / 250 + i * 1.3) * 0.5;
    ctx.globalAlpha = charged ? 1 : 0.3 + glow * 0.6;
    ctx.beginPath(); ctx.arc(px, py, 2.5 + glow, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // two big arm tentacles — the front one swipes
  let armAng = 0.45;
  if (o.swipeT > 0) {
    if (o.swipeKind === 2)      armAng = 0.9 - (0.42 - o.swipeT) * 7;
    else if (o.swipeKind === 3) armAng = 0.3 + Math.sin(o.swipeT * 10) * 1.0;
    else                        armAng = -1.2 + (0.38 - o.swipeT) * 6.5;
  }
  // rear arm tentacle
  drawArmTentacle(-0.2 + Math.sin(now / 400) * 0.15, shade(body, -25), 0.85);
  // front arm tentacle
  drawArmTentacle(armAng, body, 1);

  // one huge eye with a slit pupil — tracks forward, under a hooded brow
  const eyeY = -96;
  ctx.fillStyle = shade(body, -25);                     // fleshy brow hood
  ctx.beginPath(); ctx.ellipse(10, eyeY - 9, 15, 6, 0.1, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#e8f0e0";
  ctx.beginPath(); ctx.ellipse(10, eyeY, 13, 11, 0, 0, 7); ctx.fill();
  ctx.fillStyle = o.breathing ? t.beam : "#ffcc33";
  ctx.beginPath(); ctx.ellipse(13, eyeY, 8, 8, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(120,60,10,0.5)";              // iris ring
  ctx.beginPath(); ctx.ellipse(13, eyeY, 8, 8, 0, 0, 7); ctx.stroke();
  ctx.fillStyle = "#0a0a0a";
  ctx.beginPath(); ctx.ellipse(14, eyeY, 2.5, 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.85)";             // wet glint
  ctx.beginPath(); ctx.arc(9, eyeY - 4, 2, 0, 7); ctx.fill();
  // heavy lid when hurt
  if (o.hurt) {
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(10, eyeY - 6, 13, 5, 0, Math.PI, 0); ctx.fill();
  }
  // beak below the eye
  ctx.fillStyle = "#2a2018";
  const beakOpen = o.breathing ? 4 : 1;
  ctx.beginPath();
  ctx.moveTo(20, -74); ctx.lineTo(30, -70 - beakOpen); ctx.lineTo(22, -68);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(20, -66); ctx.lineTo(28, -64 + beakOpen); ctx.lineTo(20, -60);
  ctx.closePath(); ctx.fill();

  function drawArmTentacle(ang, color, sc) {
    ctx.save();
    ctx.translate(14, -82);
    ctx.rotate(ang);
    ctx.scale(sc, sc);
    const wig = Math.sin(now / 150) * 7;
    ctx.strokeStyle = color; ctx.lineCap = "round";
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(16, 8 + wig * 0.4, 30, 4);
    ctx.stroke();
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(30, 4);
    ctx.quadraticCurveTo(42, 0 - wig, 52, 4 + wig);
    ctx.stroke();
    ctx.lineWidth = 1;
    // suckers along the underside
    ctx.fillStyle = shade(color, 35);
    for (let i = 0; i < 4; i++)
      ctx.beginPath(), ctx.arc(10 + i * 11, 8 - i * 1.5, 1.8, 0, 7), ctx.fill();
    // glowing club tip
    ctx.fillStyle = charged ? "#aaffee" : spineC;
    ctx.beginPath(); ctx.arc(52, 4 + wig, 4.5, 0, 7); ctx.fill();
    ctx.restore();
  }
}

// ---- MEKAGORA: unlockable war machine — plated hull, piston legs, reactor core ----
function drawMekagoraBody(t, o, body, belly, spineC, charged) {
  const now = performance.now();
  const legA = Math.sin((o.walk || 0) * 2) * 6;
  const stompDip = o.stompT > 0.55 ? 8 : 0;
  const panel = shade(body, -25);
  const glow = o.hurt ? "#ffdddd" : charged ? "#ffffff" : spineC;

  // segmented armored tail: overlapping plates ending in a thruster
  ctx.fillStyle = panel;
  for (let i = 0; i < 5; i++) {
    const tx2 = -18 - i * 13, ty2 = -46 + i * 4;
    ctx.save();
    ctx.translate(tx2, ty2);
    ctx.rotate(i * 0.12);
    ctx.fillRect(-8, -7 + i, 16, 14 - i * 1.6);
    ctx.restore();
  }
  // tail thruster flare while walking
  if (Math.abs(legA) > 3) {
    ctx.fillStyle = "rgba(255,120,80,0.6)";
    ctx.beginPath();
    ctx.moveTo(-78, -30); ctx.lineTo(-92 - Math.random() * 8, -26); ctx.lineTo(-78, -22);
    ctx.closePath(); ctx.fill();
  }

  // rear leg: piston strut (darker)
  drawPistonLeg(-6 - legA * 0.5, stompDip, panel);

  // torso: angular plated hull
  const tg = ctx.createLinearGradient(-26, 0, 26, 0);
  tg.addColorStop(0, shade(body, -30));
  tg.addColorStop(0.5, body);
  tg.addColorStop(1, shade(body, 20));
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(-22, -42);
  ctx.lineTo(-26, -74);
  ctx.lineTo(-14, -102);
  ctx.lineTo(12, -108);
  ctx.lineTo(26, -88);
  ctx.lineTo(22, -54);
  ctx.lineTo(6, -40);
  ctx.closePath(); ctx.fill();
  // hull panel seams + rivets
  ctx.strokeStyle = "rgba(10,14,24,0.55)"; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, -60); ctx.lineTo(18, -64);
  ctx.moveTo(-20, -80); ctx.lineTo(20, -84);
  ctx.moveTo(-2, -42); ctx.lineTo(-6, -104);
  ctx.stroke(); ctx.lineWidth = 1;
  ctx.fillStyle = "rgba(220,230,240,0.35)";
  for (const [rx, ry] of [[-16, -56], [12, -58], [-14, -76], [14, -80], [-8, -98], [8, -100]])
    ctx.fillRect(rx, ry, 2, 2);
  // chest reactor core: pulsing ring
  const pulse = 0.6 + Math.sin(now / (charged ? 90 : 300)) * 0.4;
  ctx.fillStyle = "#1a2030";
  ctx.beginPath(); ctx.arc(8, -74, 10, 0, 7); ctx.fill();
  ctx.strokeStyle = glow; ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.5 + pulse * 0.5;
  ctx.beginPath(); ctx.arc(8, -74, 7, 0, 7); ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = 1;
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(8, -74, 3 + pulse * 1.5, 0, 7); ctx.fill();
  // vent grilles on the flank
  ctx.fillStyle = "#232838";
  for (let i = 0; i < 3; i++) ctx.fillRect(-20, -68 + i * 7, 10, 3);

  // dorsal fin array: angular blades with warning lights
  ctx.fillStyle = charged ? "#ffffff" : panel;
  const fins = [[-16, -88, 12], [-6, -100, 15], [6, -104, 11]];
  for (const [fx3, fy3, fs] of fins) {
    ctx.beginPath();
    ctx.moveTo(fx3 - fs * 0.5, fy3 + 3);
    ctx.lineTo(fx3 - fs * 0.1, fy3 - fs);
    ctx.lineTo(fx3 + fs * 0.45, fy3 + 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = Math.floor(now / 400 + fx3) % 2 ? "#ff3355" : "#701525";
    ctx.fillRect(fx3 - 1.5, fy3 - fs * 0.7, 3, 3);
    ctx.fillStyle = charged ? "#ffffff" : panel;
  }

  // front leg
  drawPistonLeg(8 + legA * 0.5, 0, body);

  // arm: servo shoulder + hydraulic forearm with claw manipulators
  let armAng = 0.5;
  if (o.swipeT > 0) {
    if (o.swipeKind === 2)      armAng = 0.9 - (0.42 - o.swipeT) * 7.5;
    else if (o.swipeKind === 3) armAng = 0.3 + Math.sin(o.swipeT * 10) * 0.8;
    else                        armAng = -1.4 + (0.38 - o.swipeT) * 7;
  }
  if (o.swipeT > 0.1 && o.swipeKind !== 3) {
    ctx.strokeStyle = "rgba(255,80,110,0.3)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(8, -92, 38, armAng - 0.6, armAng + 0.25); ctx.stroke();
    ctx.lineWidth = 1;
  }
  ctx.save();
  ctx.translate(8, -92);
  ctx.rotate(armAng);
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();       // shoulder servo
  ctx.strokeStyle = "rgba(10,14,24,0.5)";
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.stroke();
  ctx.fillRect(4, -5, 16, 10);                               // upper actuator
  ctx.fillStyle = panel;
  ctx.fillRect(18, -4, 16, 9);                               // forearm housing
  ctx.strokeStyle = "#232838"; ctx.lineWidth = 2;             // hydraulic rod
  ctx.beginPath(); ctx.moveTo(6, 4); ctx.lineTo(20, 6); ctx.stroke(); ctx.lineWidth = 1;
  // tri-claw manipulator
  ctx.fillStyle = "#c8ced8";
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(33, -4 + i * 4);
    ctx.lineTo(42, -2 + i * 4);
    ctx.lineTo(33, 0 + i * 4);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // neck + head: armored wedge with a glowing visor
  ctx.fillStyle = body;
  ctx.beginPath();                                            // neck gimbal
  ctx.moveTo(2, -102); ctx.lineTo(14, -114); ctx.lineTo(22, -104); ctx.lineTo(10, -96);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = panel;
  ctx.beginPath();                                            // angular skull
  ctx.moveTo(12, -124);
  ctx.lineTo(34, -122);
  ctx.lineTo(46, -116);                                       // snout tip
  ctx.lineTo(34, -110);
  ctx.lineTo(14, -110);
  ctx.closePath(); ctx.fill();
  // jaw plate (hinges when firing)
  const jawOpen = o.breathing ? 0.35 : 0.04;
  ctx.save();
  ctx.translate(32, -110);
  ctx.rotate(jawOpen);
  ctx.fillStyle = shade(body, -35);
  ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(13, 1); ctx.lineTo(11, 5); ctx.lineTo(-2, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c8ced8";                                  // metal teeth
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(1 + i * 4, 1); ctx.lineTo(2.5 + i * 4, -1.5); ctx.lineTo(4 + i * 4, 1);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // visor eye: sweeping scanner band
  ctx.fillStyle = "#141824";
  ctx.fillRect(18, -121, 18, 5);
  const scan = 18 + ((now / 12) % 16);
  ctx.fillStyle = o.breathing ? t.beam : glow;
  ctx.fillRect(scan, -121, 3.5, 5);
  // muzzle glow when firing
  if (o.breathing) {
    ctx.fillStyle = t.beam;
    ctx.beginPath(); ctx.arc(48, -114, 4 + Math.random() * 2, 0, 7); ctx.fill();
  }
  // antenna
  ctx.strokeStyle = "#c8ced8"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(16, -124); ctx.lineTo(12, -134); ctx.stroke(); ctx.lineWidth = 1;
  if (Math.floor(now / 500) % 2) { ctx.fillStyle = "#ff3355"; ctx.fillRect(10.5, -137, 3, 3); }

  function drawPistonLeg(hipX, dip, color) {
    // thigh block → knee servo → shin strut → splayed stabilizer foot
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(hipX - 8, -48);
    ctx.lineTo(hipX + 9, -44);
    ctx.lineTo(hipX + 7, -24 + dip);
    ctx.lineTo(hipX - 6, -26 + dip);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#232838"; ctx.lineWidth = 3;             // exposed piston
    ctx.beginPath(); ctx.moveTo(hipX + 4, -40); ctx.lineTo(hipX + 2, -22 + dip); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillStyle = shade(color, -15);
    ctx.beginPath(); ctx.arc(hipX, -24 + dip, 6, 0, 7); ctx.fill();  // knee servo
    ctx.fillStyle = color;
    ctx.fillRect(hipX - 4, -24 + dip, 9, 22);                   // shin strut
    // stabilizer foot with toe claws
    ctx.fillStyle = shade(color, -20);
    ctx.beginPath();
    ctx.moveTo(hipX - 10, dip); ctx.lineTo(hipX - 2, -6 + dip);
    ctx.lineTo(hipX + 8, -6 + dip); ctx.lineTo(hipX + 16, dip);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c8ced8";
    ctx.fillRect(hipX - 11, -2 + dip, 5, 3); ctx.fillRect(hipX + 12, -2 + dip, 5, 3);
  }
}

// simple hex shade helper
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}

function drawUnits() {
  const mil = milOf();
  for (const u of units) {
    if (u.kind === "tank") {
      const T = TANKS[u.v] || TANKS.abrams;
      const uy = GROUND - 10;
      const roll = performance.now() / 60;
      const L = T.L, hh = T.hullH;
      const face = kaiju.x > u.x ? 1 : -1;              // hull points at the monster
      if (T.wheeled) {
        // wheeled APC/IFV: rubber tyres under a boxy monocoque hull
        ctx.fillStyle = "#1c1c20";
        for (let i = 0; i < T.wheels; i++) {
          const wx = u.x - L + 8 + i * ((L * 2 - 16) / Math.max(1, T.wheels - 1));
          ctx.beginPath(); ctx.arc(wx, uy + 3, 6, 0, 7); ctx.fill();
          ctx.fillStyle = "#3a3a40";
          ctx.beginPath(); ctx.arc(wx, uy + 3, 2.5, 0, 7); ctx.fill();
          ctx.fillStyle = "#1c1c20";
        }
      } else {
        // tracked: return rollers, road wheels, crawling track links
        ctx.fillStyle = mil.trim;
        ctx.beginPath(); ctx.ellipse(u.x, uy + 3, L - 2, 8, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#22261c";
        for (let i = 0; i < T.wheels; i++) {
          const wx = u.x - L + 6 + i * ((L * 2 - 12) / Math.max(1, T.wheels - 1));
          ctx.beginPath(); ctx.arc(wx, uy + 4, 3.4, 0, 7); ctx.fill();
        }
        ctx.strokeStyle = shade(mil.hull, 10); ctx.lineWidth = 1.5;
        for (let i = 0; i < 7; i++) {
          const lx = u.x - L + ((i * 9 + roll) % (L * 2));
          ctx.beginPath(); ctx.moveTo(lx, uy - 3); ctx.lineTo(lx + 3, uy - 3); ctx.stroke();
        }
        ctx.lineWidth = 1;
        if (T.skirt) {                                   // side armour skirt over the track
          ctx.fillStyle = mil.dark;
          ctx.fillRect(u.x - L + 2, uy - 6, L * 2 - 4, 5);
        }
      }
      // hull: sloped glacis toward the threat
      ctx.fillStyle = mil.hull;
      ctx.beginPath();
      ctx.moveTo(u.x - L * face, uy - 3);
      ctx.lineTo(u.x - (L - 7) * face, uy - hh);
      ctx.lineTo(u.x + (L - 9) * face, uy - hh);
      ctx.lineTo(u.x + L * face, uy - 3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.07)";          // top-light on the deck
      ctx.fillRect(u.x - (L - 8), uy - hh, (L - 8) * 2, 2);
      // turret silhouette varies by type
      const ty = uy - hh, tCol = shade(mil.hull, -8);
      ctx.fillStyle = tCol;
      ctx.beginPath();
      if (T.turret === "flat") {                         // Abrams: long, low, flat-faced
        ctx.moveTo(u.x - 12 * face, ty); ctx.lineTo(u.x - 12 * face, ty - 8);
        ctx.lineTo(u.x + 10 * face, ty - 8); ctx.lineTo(u.x + 14 * face, ty - 4); ctx.lineTo(u.x + 14 * face, ty);
      } else if (T.turret === "sloped") {                // Challenger/Ariete: sloped cheeks
        ctx.moveTo(u.x - 12 * face, ty); ctx.lineTo(u.x - 10 * face, ty - 9);
        ctx.lineTo(u.x + 6 * face, ty - 9); ctx.lineTo(u.x + 14 * face, ty - 2); ctx.lineTo(u.x + 14 * face, ty);
      } else if (T.turret === "angular") {               // Leclerc/Type 10: hard facets
        ctx.moveTo(u.x - 11 * face, ty); ctx.lineTo(u.x - 11 * face, ty - 7);
        ctx.lineTo(u.x - 2 * face, ty - 10); ctx.lineTo(u.x + 8 * face, ty - 7);
        ctx.lineTo(u.x + 13 * face, ty - 3); ctx.lineTo(u.x + 13 * face, ty);
      } else if (T.turret === "wedge") {                 // Leopard: pointed wedge mantlet
        ctx.moveTo(u.x - 11 * face, ty); ctx.lineTo(u.x - 11 * face, ty - 9);
        ctx.lineTo(u.x + 4 * face, ty - 9); ctx.lineTo(u.x + 14 * face, ty - 1); ctx.lineTo(u.x + 14 * face, ty);
      } else if (T.turret === "round") {                 // Patton: cast rounded turret
        ctx.ellipse(u.x + 2 * face, ty - 3, 13, 7, 0, Math.PI, 0);
      } else if (T.turret === "ifv") {                   // small two-man IFV turret
        ctx.moveTo(u.x - 7 * face, ty); ctx.lineTo(u.x - 6 * face, ty - 8);
        ctx.lineTo(u.x + 6 * face, ty - 8); ctx.lineTo(u.x + 8 * face, ty);
      } else {                                            // remote weapon station
        ctx.moveTo(u.x - 4 * face, ty); ctx.lineTo(u.x - 4 * face, ty - 5);
        ctx.lineTo(u.x + 4 * face, ty - 5); ctx.lineTo(u.x + 4 * face, ty);
      }
      ctx.closePath(); ctx.fill();
      if (T.rack) {                                       // stowage basket on the bustle
        ctx.fillStyle = mil.trim;
        ctx.fillRect(u.x - 20 * face - (face > 0 ? 0 : 0), ty - 7, 8 * face, 5);
        ctx.strokeStyle = shade(mil.hull, 20); ctx.strokeRect(u.x - 20 * face, ty - 7, 8 * face, 5);
      }
      if (T.tow) {                                        // Bradley TOW launcher box
        ctx.fillStyle = mil.dark;
        ctx.fillRect(u.x - 12 * face, ty - 9, 7 * face, 6);
      }
      ctx.fillStyle = mil.trim;                           // commander's cupola
      ctx.fillRect(u.x - 4, ty - (T.turret === "ifv" || T.turret === "rws" ? 10 : 11), 7, 3);
      ctx.fillStyle = mil.flash;                          // national marking
      ctx.fillRect(u.x - 15 * face, uy - hh + 3, 4, 3);
      // main gun tracks the kaiju, with muzzle brake / thermal sleeve
      const gunY = ty - (T.turret === "ifv" || T.turret === "rws" ? 5 : 5);
      const a = Math.atan2((GROUND - kaiju.h * 0.6) - gunY, kaiju.x - u.x);
      ctx.strokeStyle = mil.trim; ctx.lineWidth = T.gunW;
      ctx.beginPath(); ctx.moveTo(u.x, gunY);
      ctx.lineTo(u.x + Math.cos(a) * T.gun, gunY + Math.sin(a) * T.gun); ctx.stroke();
      ctx.lineWidth = T.gunW + 2;
      ctx.beginPath();
      ctx.moveTo(u.x + Math.cos(a) * (T.gun - 5), gunY + Math.sin(a) * (T.gun - 5));
      ctx.lineTo(u.x + Math.cos(a) * T.gun, gunY + Math.sin(a) * T.gun);
      ctx.stroke(); ctx.lineWidth = 1;
      if (u.fireT !== undefined && u.fireT > 2.7) {
        ctx.fillStyle = "#ffdd88";
        ctx.beginPath();
        ctx.arc(u.x + Math.cos(a) * (T.gun + 4), gunY + Math.sin(a) * (T.gun + 4), 4 + Math.random() * 2, 0, 7);
        ctx.fill();
      }
    } else if (u.kind === "heli") {
      const Hs = HELIS[u.v] || HELIS.apache;
      const d = u.dir, gun = Hs.body === "gunship", util = Hs.body === "utility";
      const bodyC = gun ? "#3f4a44" : util ? "#39434f" : "#4a5560";
      const darkC = shade(bodyC, -14);
      // tail boom
      ctx.fillStyle = darkC;
      ctx.beginPath();
      ctx.moveTo(u.x - 9 * d, u.y - 3);
      ctx.lineTo(u.x - 36 * d, u.y - (Hs.tailHi ? 6 : 4));
      ctx.lineTo(u.x - 36 * d, u.y - 1);
      ctx.lineTo(u.x - 9 * d, u.y + 3);
      ctx.closePath(); ctx.fill();
      // vertical fin + stabiliser
      ctx.beginPath();
      ctx.moveTo(u.x - 33 * d, u.y - 4);
      ctx.lineTo(u.x - 40 * d, u.y - (Hs.tailHi ? 16 : 12));
      ctx.lineTo(u.x - 34 * d, u.y - (Hs.tailHi ? 16 : 12));
      ctx.lineTo(u.x - 30 * d, u.y - 3);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(u.x - 36 * d - 5 * d, u.y - 8, 10 * d, 2);
      // tail rotor disc (coaxial types have none)
      if (!Hs.coax) {
        ctx.strokeStyle = "rgba(200,210,220,0.65)"; ctx.lineWidth = 1.5;
        const tr = Math.abs(Math.sin(performance.now() / 22)) * 7 + 1;
        ctx.beginPath();
        ctx.moveTo(u.x - 38 * d, u.y - (Hs.tailHi ? 14 : 8) - tr);
        ctx.lineTo(u.x - 38 * d, u.y - (Hs.tailHi ? 14 : 8) + tr);
        ctx.stroke();
      }
      // fuselage: gunships are slim and pointed, utilities are deep and blunt
      ctx.fillStyle = bodyC;
      ctx.beginPath();
      if (gun) {
        ctx.moveTo(u.x + 20 * d, u.y - 1);
        ctx.lineTo(u.x + 12 * d, u.y - 7);
        ctx.lineTo(u.x - 10 * d, u.y - 6);
        ctx.lineTo(u.x - 11 * d, u.y + 4);
        ctx.lineTo(u.x + 16 * d, u.y + 4);
      } else {
        ctx.moveTo(u.x + 19 * d, u.y + 1);
        ctx.lineTo(u.x + 15 * d, u.y - 6);
        ctx.lineTo(u.x - 8 * d, u.y - 9);
        ctx.lineTo(u.x - 12 * d, u.y + 5);
        ctx.lineTo(u.x + 14 * d, u.y + 7);
      }
      ctx.closePath(); ctx.fill();
      // canopy: tandem stepped glass on gunships, wraparound on utilities
      ctx.fillStyle = "rgba(150,205,240,0.8)";
      if (gun) {
        ctx.beginPath();
        ctx.moveTo(u.x + 18 * d, u.y - 2); ctx.lineTo(u.x + 12 * d, u.y - 8);
        ctx.lineTo(u.x + 4 * d, u.y - 7); ctx.lineTo(u.x + 4 * d, u.y - 2);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(u.x + 3 * d, u.y - 2); ctx.lineTo(u.x + 3 * d, u.y - 8);
        ctx.lineTo(u.x - 5 * d, u.y - 7); ctx.lineTo(u.x - 5 * d, u.y - 2);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.beginPath();
        ctx.ellipse(u.x + 12 * d, u.y - 3, 7, 4.5, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(150,205,240,0.45)";        // cabin door windows
        ctx.fillRect(u.x - 6 * d, u.y - 6, 9 * d, 5);
      }
      if (Hs.chin) {                                     // chin-mounted cannon
        ctx.fillStyle = darkC;
        ctx.beginPath(); ctx.arc(u.x + 13 * d, u.y + 4, 3, 0, 7); ctx.fill();
        ctx.strokeStyle = darkC; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(u.x + 13 * d, u.y + 5);
        ctx.lineTo(u.x + 19 * d, u.y + 9); ctx.stroke(); ctx.lineWidth = 1;
      }
      if (Hs.wings) {                                    // stub wings + rocket pods / missiles
        ctx.fillStyle = darkC;
        ctx.fillRect(u.x - 6, u.y + 1, 14, 3);
        ctx.fillStyle = shade(bodyC, -22);
        ctx.fillRect(u.x - 9, u.y + 3, 6, 5); ctx.fillRect(u.x + 4, u.y + 3, 6, 5);
        ctx.fillStyle = "#5a5a48";
        ctx.fillRect(u.x - 11, u.y + 4, 3, 2); ctx.fillRect(u.x + 10, u.y + 4, 3, 2);
      }
      // undercarriage
      ctx.strokeStyle = shade(bodyC, -25); ctx.lineWidth = 2;
      if (Hs.wheel) {
        ctx.beginPath();
        ctx.moveTo(u.x + 6 * d, u.y + 5); ctx.lineTo(u.x + 7 * d, u.y + 10);
        ctx.moveTo(u.x - 6 * d, u.y + 5); ctx.lineTo(u.x - 7 * d, u.y + 10);
        ctx.stroke();
        ctx.fillStyle = "#22242a";
        ctx.beginPath(); ctx.arc(u.x + 7 * d, u.y + 11, 2, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(u.x - 7 * d, u.y + 11, 2, 0, 7); ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(u.x - 10, u.y + 7); ctx.lineTo(u.x - 8, u.y + 11);
        ctx.lineTo(u.x + 10, u.y + 11); ctx.lineTo(u.x + 12, u.y + 7);
        ctx.stroke();
      }
      ctx.lineWidth = 1;
      ctx.fillStyle = mil.flash;                         // roundel
      ctx.beginPath(); ctx.arc(u.x - 3 * d, u.y - 1, 1.8, 0, 7); ctx.fill();
      // main rotor: hub, blur disc, and discrete blades
      ctx.fillStyle = shade(bodyC, -25);
      ctx.fillRect(u.x - 1.5, u.y - 12, 3, 6);
      ctx.strokeStyle = "rgba(200,210,220,0.28)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(u.x - 27, u.y - 13); ctx.lineTo(u.x + 27, u.y - 13); ctx.stroke();
      ctx.strokeStyle = "rgba(210,220,232,0.85)"; ctx.lineWidth = 2;
      for (let bl = 0; bl < Hs.blades; bl++) {
        const ph = performance.now() / 90 + (bl * Math.PI * 2) / Hs.blades;
        const bx = Math.cos(ph) * 27;
        ctx.beginPath(); ctx.moveTo(u.x, u.y - 13); ctx.lineTo(u.x + bx, u.y - 13 - Math.sin(ph) * 1.5); ctx.stroke();
      }
      if (Hs.coax) {                                   // second, counter-rotating disc stacked above
        ctx.fillStyle = shade(bodyC, -25);
        ctx.fillRect(u.x - 1.5, u.y - 19, 3, 7);
        ctx.strokeStyle = "rgba(200,210,220,0.24)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(u.x - 26, u.y - 20); ctx.lineTo(u.x + 26, u.y - 20); ctx.stroke();
        ctx.strokeStyle = "rgba(210,220,232,0.8)"; ctx.lineWidth = 2;
        for (let bl = 0; bl < Hs.blades; bl++) {
          const ph = -performance.now() / 90 + (bl * Math.PI * 2) / Hs.blades;
          ctx.beginPath(); ctx.moveTo(u.x, u.y - 20); ctx.lineTo(u.x + Math.cos(ph) * 26, u.y - 20 - Math.sin(ph) * 1.5); ctx.stroke();
        }
      }
      ctx.lineWidth = 1;
    } else if (u.kind === "jet") {
      const J = JETS[u.v] || JETS.f35;
      const d = u.dir, L = J.len, tone = J.tone, dk = shade(tone, -16);
      // main wing plan
      ctx.fillStyle = dk;
      ctx.beginPath();
      if (J.wing === "delta" || J.wing === "puredelta") {
        ctx.moveTo(u.x + 4 * d, u.y);
        ctx.lineTo(u.x - 16 * d, u.y + 12);
        ctx.lineTo(u.x - 20 * d, u.y + 11);
        ctx.lineTo(u.x - 6 * d, u.y);
      } else if (J.wing === "trapezoid") {              // F-35: short, thick, kinked
        ctx.moveTo(u.x + 3 * d, u.y);
        ctx.lineTo(u.x - 10 * d, u.y + 10);
        ctx.lineTo(u.x - 17 * d, u.y + 10);
        ctx.lineTo(u.x - 8 * d, u.y);
      } else if (J.wing === "blended") {                // F-16: wing blends into the body
        ctx.moveTo(u.x + 6 * d, u.y);
        ctx.lineTo(u.x - 11 * d, u.y + 10);
        ctx.lineTo(u.x - 17 * d, u.y + 9);
        ctx.lineTo(u.x - 9 * d, u.y);
      } else if (J.wing === "straight") {               // AMX: near-straight wing
        ctx.moveTo(u.x + 2 * d, u.y + 1);
        ctx.lineTo(u.x - 4 * d, u.y + 11);
        ctx.lineTo(u.x - 10 * d, u.y + 11);
        ctx.lineTo(u.x - 8 * d, u.y + 1);
      } else {                                           // classic swept
        ctx.moveTo(u.x + 6 * d, u.y);
        ctx.lineTo(u.x - 12 * d, u.y + 9);
        ctx.lineTo(u.x - 17 * d, u.y + 8);
        ctx.lineTo(u.x - 4 * d, u.y);
      }
      ctx.closePath(); ctx.fill();
      if (J.canard) {                                    // forward canards
        ctx.beginPath();
        ctx.moveTo(u.x + 12 * d, u.y - 1);
        ctx.lineTo(u.x + 4 * d, u.y + 6);
        ctx.lineTo(u.x + 1 * d, u.y + 5);
        ctx.lineTo(u.x + 9 * d, u.y - 1);
        ctx.closePath(); ctx.fill();
      }
      // tails
      ctx.beginPath();
      if (J.tails === 2) {
        ctx.moveTo(u.x - 12 * d, u.y - 3); ctx.lineTo(u.x - 21 * d, u.y - 12);
        ctx.lineTo(u.x - 16 * d, u.y - 3); ctx.closePath(); ctx.fill();
        ctx.fillStyle = shade(tone, -26);
        ctx.beginPath();
        ctx.moveTo(u.x - 14 * d, u.y - 3); ctx.lineTo(u.x - 23 * d, u.y - 10);
        ctx.lineTo(u.x - 18 * d, u.y - 3); ctx.closePath(); ctx.fill();
      } else {
        ctx.moveTo(u.x - 13 * d, u.y - 3); ctx.lineTo(u.x - 21 * d, u.y - 14);
        ctx.lineTo(u.x - 17 * d, u.y - 3); ctx.closePath(); ctx.fill();
      }
      // fuselage over the wing
      ctx.fillStyle = tone;
      ctx.beginPath();
      ctx.moveTo(u.x + L * d, u.y + 1);
      ctx.lineTo(u.x + (L - 8) * d, u.y - 4);
      ctx.lineTo(u.x - (L - 6) * d, u.y - 4);
      ctx.lineTo(u.x - (L - 6) * d, u.y + 4);
      ctx.lineTo(u.x + (L - 10) * d, u.y + 5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.09)";          // spine highlight
      ctx.fillRect(u.x - (L - 8) * d, u.y - 4, (L - 2) * d, 1.5);
      ctx.fillStyle = "rgba(160,210,240,0.85)";          // canopy
      ctx.beginPath(); ctx.ellipse(u.x + (L - 12) * d, u.y - 3, 6, 3, 0, 0, 7); ctx.fill();
      ctx.fillStyle = mil.flash;                         // roundel on the wing root
      ctx.beginPath(); ctx.arc(u.x - 6 * d, u.y + 4, 1.8, 0, 7); ctx.fill();
      // afterburner
      ctx.fillStyle = `rgba(255,${150 + Math.random() * 100 | 0},60,0.9)`;
      ctx.beginPath();
      ctx.moveTo(u.x - (L - 6) * d, u.y - 2.5);
      ctx.lineTo(u.x - (L + 6 + Math.random() * 8) * d, u.y);
      ctx.lineTo(u.x - (L - 6) * d, u.y + 2.5);
      ctx.closePath(); ctx.fill();
      if (J.tails === 2) {                               // second nozzle glow
        ctx.fillStyle = "rgba(255,190,90,0.5)";
        ctx.beginPath(); ctx.arc(u.x - (L - 5) * d, u.y + 1, 2.5, 0, 7); ctx.fill();
      }
      ctx.strokeStyle = "rgba(220,230,240,0.22)";        // wingtip vapour
      ctx.beginPath();
      ctx.moveTo(u.x - 14 * d, u.y + 10); ctx.lineTo(u.x - 36 * d, u.y + 11);
      ctx.stroke();
    } else if (u.kind === "arty") {
      const uy = GROUND - 8;
      // self-propelled howitzer on the national palette
      ctx.fillStyle = "#1c1c20";
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(u.x + i * 9, uy + 3, 3.2, 0, 7); ctx.fill(); }
      ctx.fillStyle = mil.trim;
      ctx.beginPath(); ctx.ellipse(u.x, uy + 1, 22, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = mil.hull;
      ctx.fillRect(u.x - 20, uy - 8, 40, 8);
      ctx.fillStyle = shade(mil.hull, -8);               // tall casemate turret
      ctx.beginPath();
      ctx.moveTo(u.x - 14, uy - 8); ctx.lineTo(u.x - 12, uy - 20);
      ctx.lineTo(u.x + 10, uy - 20); ctx.lineTo(u.x + 14, uy - 8);
      ctx.closePath(); ctx.fill();
      const aim = kaiju.x > u.x ? 1 : -1;
      ctx.strokeStyle = mil.trim; ctx.lineWidth = 4;     // long high-angle barrel
      ctx.beginPath(); ctx.moveTo(u.x, uy - 18);
      ctx.lineTo(u.x + aim * 26, uy - 40); ctx.stroke();
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(u.x + aim * 22, uy - 37); ctx.lineTo(u.x + aim * 26, uy - 40);
      ctx.stroke(); ctx.lineWidth = 1;
      ctx.fillStyle = mil.flash;
      ctx.fillRect(u.x - 18, uy - 6, 4, 3);
    } else if (u.kind === "destroyer" || u.kind === "carrier") {
      const carrier = u.kind === "carrier";
      const bob = Math.sin((u.bobT || 0) * 1.4) * 2;
      const uy = GROUND - 4 + bob;
      const L = carrier ? 62 : 44;
      // wake + waterline
      ctx.fillStyle = "rgba(230,250,255,0.35)";
      ctx.beginPath(); ctx.ellipse(u.x, GROUND + 2, L + 12, 5, 0, 0, 7); ctx.fill();
      // hull
      ctx.fillStyle = carrier ? "#59626e" : "#66707c";
      ctx.beginPath();
      ctx.moveTo(u.x - L, uy - 12);
      ctx.lineTo(u.x + L, uy - 12);
      ctx.lineTo(u.x + L - 12, uy + 2);
      ctx.lineTo(u.x - L + 10, uy + 2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(10,14,20,0.25)";
      ctx.fillRect(u.x - L + 10, uy - 2, L * 2 - 22, 4);
      if (carrier) {
        // flat flight deck with parked airframes and the island
        ctx.fillStyle = "#4c545e";
        ctx.fillRect(u.x - L - 8, uy - 17, L * 2 + 16, 6);
        ctx.strokeStyle = "rgba(230,235,240,0.5)";
        for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(u.x + i * 24 - 8, uy - 14); ctx.lineTo(u.x + i * 24 + 8, uy - 14); ctx.stroke(); }
        ctx.fillStyle = "#39414c";
        ctx.fillRect(u.x + L * 0.35, uy - 30, 18, 13);      // island
        ctx.fillRect(u.x + L * 0.35 + 6, uy - 36, 3, 6);    // mast
        ctx.fillStyle = "#727c88";                          // parked jets
        for (const px of [-L * 0.6, -L * 0.25, L * 0.05]) {
          ctx.beginPath();
          ctx.moveTo(u.x + px, uy - 18); ctx.lineTo(u.x + px + 10, uy - 20); ctx.lineTo(u.x + px, uy - 22);
          ctx.closePath(); ctx.fill();
        }
      } else {
        // destroyer: superstructure, radar mast, forward gun tracking the kaiju
        ctx.fillStyle = "#57616d";
        ctx.fillRect(u.x - 14, uy - 26, 30, 14);
        ctx.fillRect(u.x + 18, uy - 20, 14, 8);
        ctx.fillStyle = "#39414c";
        ctx.fillRect(u.x - 2, uy - 34, 3, 9);
        ctx.strokeStyle = "#39414c"; ctx.lineWidth = 3;
        const aim = kaiju.x > u.x ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(u.x - L + 22, uy - 14);
        ctx.lineTo(u.x - L + 22 + aim * 14, uy - 22);
        ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillStyle = (milOf().flash || "#c02030");
        ctx.fillRect(u.x + L - 22, uy - 10, 5, 3);
      }
    } else if (u.kind === "mlrs") {
      // heavy multiple rocket launcher on an 8x8 truck chassis
      const uy = GROUND - 6;
      const aim = kaiju.x > u.x ? 1 : -1;
      ctx.fillStyle = "#1c1c20";                        // wheels
      for (let i = -3; i <= 3; i++) {
        if (i === 0) continue;
        ctx.beginPath(); ctx.arc(u.x + i * 12, uy + 4, 6, 0, 7); ctx.fill();
        ctx.fillStyle = "#3a3a42";
        ctx.beginPath(); ctx.arc(u.x + i * 12, uy + 4, 2.4, 0, 7); ctx.fill();
        ctx.fillStyle = "#1c1c20";
      }
      ctx.fillStyle = mil.hull;                          // chassis
      ctx.fillRect(u.x - 44, uy - 12, 88, 12);
      ctx.fillStyle = mil.dark;                          // armoured cab
      ctx.beginPath();
      ctx.moveTo(u.x + aim * 44, uy - 12);
      ctx.lineTo(u.x + aim * 44, uy - 28);
      ctx.lineTo(u.x + aim * 22, uy - 30);
      ctx.lineTo(u.x + aim * 20, uy - 12);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(150,190,220,0.6)";           // windscreen
      ctx.fillRect(u.x + aim * 30, uy - 27, aim * 12, 7);
      ctx.fillStyle = mil.trim;                          // outriggers braced on the road
      ctx.fillRect(u.x - 48, uy - 2, 8, 8);
      ctx.fillRect(u.x + 40, uy - 2, 8, 8);
      // elevated launcher pod, angled toward the kaiju
      ctx.save();
      ctx.translate(u.x - aim * 12, uy - 16);
      ctx.rotate(-aim * 0.5);
      ctx.fillStyle = mil.dark;
      ctx.fillRect(0, -20, aim * 46, 22);
      ctx.fillStyle = "#22242a";                         // rocket tubes
      for (let r = 0; r < 3; r++)
        for (let c = 0; c < 2; c++)
          ctx.fillRect(aim * (34 - c * 12), -17 + r * 7, aim * 8, 5);
      ctx.fillStyle = mil.trim;
      ctx.fillRect(0, -22, aim * 46, 3);
      ctx.restore();
      ctx.fillStyle = mil.flash;                         // national marking
      ctx.fillRect(u.x - 40, uy - 9, 5, 4);
    } else if (u.kind === "walker") {
      const uy = GROUND;
      const legSwing = Math.sin((u.walkT || 0)) * 8;
      ctx.fillStyle = u === undefined ? "#666" : "#6a4a6a";
      // legs
      ctx.strokeStyle = "#5a3a5a"; ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(u.x - 12, uy - 44); ctx.lineTo(u.x - 20 + legSwing, uy);
      ctx.moveTo(u.x + 12, uy - 44); ctx.lineTo(u.x + 20 - legSwing, uy);
      ctx.stroke(); ctx.lineWidth = 1;
      // body pod
      ctx.fillStyle = "#6a4a6a";
      ctx.beginPath(); ctx.ellipse(u.x, uy - 56, 26, 18, 0, 0, 7); ctx.fill();
      // eye / charge glow
      const charging = u.chargeT > 0;
      ctx.fillStyle = charging ? (Math.floor(performance.now() / 100) % 2 ? "#ff6688" : "#ffffff") : "#ff6688";
      ctx.beginPath(); ctx.arc(u.x + (kaiju.x > u.x ? 10 : -10), uy - 58, charging ? 7 : 5, 0, 7); ctx.fill();
      // beam strike
      if (u.beamT > 0 && u.beamX != null) {
        ctx.strokeStyle = `rgba(255,100,140,${u.beamT * 2.5})`;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(u.x, uy - 58);
        ctx.lineTo(u.beamX, GROUND);
        ctx.stroke(); ctx.lineWidth = 1;
      }
      // hp pips
      ctx.fillStyle = "#ff6688";
      for (let i = 0; i < Math.ceil(u.hp / 4); i++) ctx.fillRect(u.x - 20 + i * 9, uy - 84, 6, 3);
    }
  }
}

function drawCivilians() {
  const vkind = CITIES[cityIdx % CITIES.length].vehicle || "car";
  for (const c of civilians) {
    if (c.dead) continue;
    if (c.kind === "car") {
      const uy = GROUND - 3;
      if (vkind === "bus") {
        // London double-decker
        ctx.fillStyle = "#c0281e";
        ctx.fillRect(c.x - 14, uy - 20, 28, 18);
        ctx.fillStyle = "#ffe9b0";
        for (let wx = -11; wx <= 8; wx += 6) {
          ctx.fillRect(c.x + wx, uy - 17, 4, 4);   // upper deck windows
          ctx.fillRect(c.x + wx, uy - 9, 4, 4);    // lower deck
        }
        ctx.fillStyle = "#fff";
        ctx.fillRect(c.x - 10, uy - 24, 20, 3);    // route board
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(c.x - 8, uy - 1, 3, 0, 7); ctx.arc(c.x + 8, uy - 1, 3, 0, 7); ctx.fill();
      } else if (vkind === "cab") {
        // NYC yellow cab
        ctx.fillStyle = "#f2c018";
        ctx.fillRect(c.x - 11, uy - 8, 22, 6);
        ctx.fillRect(c.x - 6, uy - 12, 12, 5);
        ctx.fillStyle = "#222";
        ctx.fillRect(c.x - 3, uy - 14, 6, 3);      // roof light
        ctx.beginPath(); ctx.arc(c.x - 6, uy - 1, 2.5, 0, 7); ctx.arc(c.x + 6, uy - 1, 2.5, 0, 7); ctx.fill();
        ctx.fillStyle = "#555";                    // checker hint
        ctx.fillRect(c.x - 11, uy - 5, 22, 1.5);
      } else if (vkind === "taxi") {
        // Tokyo taxi: black with lit toplight
        ctx.fillStyle = "#20242c";
        ctx.fillRect(c.x - 10, uy - 8, 20, 6);
        ctx.fillRect(c.x - 5, uy - 12, 10, 5);
        ctx.fillStyle = Math.floor(performance.now() / 400) % 2 ? "#ffbb33" : "#dd8811";
        ctx.fillRect(c.x - 2, uy - 14, 4, 3);
        ctx.fillStyle = "#99bbcc";
        ctx.fillRect(c.x - 4, uy - 11, 8, 3);
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(c.x - 6, uy - 1, 2.5, 0, 7); ctx.arc(c.x + 6, uy - 1, 2.5, 0, 7); ctx.fill();
      } else if (vkind === "cablecar") {
        // SF cable car
        ctx.fillStyle = "#7a4530";
        ctx.fillRect(c.x - 13, uy - 14, 26, 12);
        ctx.fillStyle = "#e8d8a8";
        for (let wx = -10; wx <= 7; wx += 6) ctx.fillRect(c.x + wx, uy - 11, 4, 5);
        ctx.fillStyle = "#5a3020";
        ctx.fillRect(c.x - 14, uy - 16, 28, 3);    // roof
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(c.x - 8, uy - 1, 2.5, 0, 7); ctx.arc(c.x + 8, uy - 1, 2.5, 0, 7); ctx.fill();
      } else if (vkind === "ute") {
        // Aussie ute: cab + open tray
        ctx.fillStyle = c.color || "#d0d0d8";
        ctx.fillRect(c.x - 11, uy - 8, 22, 6);
        ctx.fillRect(c.x - 9, uy - 12, 9, 5);      // cab at the front
        ctx.strokeStyle = shade(c.color || "#d0d0d8", -50);
        ctx.strokeRect(c.x + 1, uy - 10, 9, 2);    // tray rail
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(c.x - 6, uy - 1, 2.5, 0, 7); ctx.arc(c.x + 6, uy - 1, 2.5, 0, 7); ctx.fill();
      } else if (vkind === "rickshaw") {
        // Mumbai auto-rickshaw: black canopy, yellow roof, three wheels
        ctx.fillStyle = "#e8c020";
        ctx.beginPath();
        ctx.moveTo(c.x - 9, uy - 8);
        ctx.quadraticCurveTo(c.x - 10, uy - 17, c.x - 1, uy - 18);
        ctx.quadraticCurveTo(c.x + 8, uy - 18, c.x + 9, uy - 8);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#1e2028";
        ctx.fillRect(c.x - 9, uy - 9, 18, 7);
        ctx.fillStyle = "#8fb0c0";
        ctx.fillRect(c.x + 1, uy - 15, 7, 5);
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(c.x - 6, uy - 1, 2.6, 0, 7); ctx.arc(c.x + 7, uy - 1, 2.6, 0, 7); ctx.fill();
      } else if (vkind === "bakkie") {
        // South African bakkie: pickup with a canopy over the load bed
        const body = c.color || "#c8c8d0";
        ctx.fillStyle = body;
        ctx.fillRect(c.x - 12, uy - 9, 24, 7);
        ctx.fillRect(c.x + 1, uy - 14, 10, 6);            // cab
        ctx.fillStyle = shade(body, -34);
        ctx.fillRect(c.x - 11, uy - 15, 12, 7);           // canopy over the tray
        ctx.fillStyle = "#8fb0c0";
        ctx.fillRect(c.x + 3, uy - 13, 6, 4);
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(c.x - 6, uy - 1, 2.8, 0, 7); ctx.arc(c.x + 7, uy - 1, 2.8, 0, 7); ctx.fill();
      } else if (vkind === "jeep") {
        // Honolulu rental jeep: open-top, surfboard on the rack
        const body = c.color || "#d85a5a";
        ctx.fillStyle = body;
        ctx.fillRect(c.x - 12, uy - 10, 24, 8);
        ctx.fillStyle = shade(body, -30);
        ctx.fillRect(c.x - 6, uy - 14, 12, 5);            // roll bar area
        ctx.strokeStyle = shade(body, -45); ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(c.x - 5, uy - 14); ctx.lineTo(c.x - 5, uy - 19);
        ctx.lineTo(c.x + 6, uy - 19); ctx.lineTo(c.x + 6, uy - 14);
        ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillStyle = "#f0e8d0";                        // surfboard
        ctx.beginPath();
        ctx.ellipse(c.x, uy - 21, 13, 2.6, -0.06, 0, 7); ctx.fill();
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(c.x - 7, uy - 1, 3.2, 0, 7); ctx.arc(c.x + 8, uy - 1, 3.2, 0, 7); ctx.fill();
      } else if (vkind === "lada") {
        // Moscow: boxy Lada saloon under a dusting of snow
        const body = c.color || "#9aa8b0";
        ctx.fillStyle = body;
        ctx.fillRect(c.x - 12, uy - 8, 24, 6);
        ctx.fillRect(c.x - 8, uy - 13, 16, 6);           // upright greenhouse
        ctx.fillStyle = "#7d90a0";
        ctx.fillRect(c.x - 6, uy - 12, 5, 4);
        ctx.fillRect(c.x + 1, uy - 12, 5, 4);
        ctx.fillStyle = "rgba(236,244,252,0.9)";         // snow on the roof
        ctx.fillRect(c.x - 8, uy - 14, 16, 2);
        ctx.fillStyle = "#e8e0c0";
        ctx.fillRect(c.x + 11, uy - 7, 2, 2);            // headlight
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(c.x - 7, uy - 1, 2.6, 0, 7); ctx.arc(c.x + 7, uy - 1, 2.6, 0, 7); ctx.fill();
      } else {
        // Paris hatchback: tiny rounded city car
        ctx.fillStyle = c.color || "#c0d0e0";
        ctx.beginPath();
        ctx.moveTo(c.x - 9, uy - 2);
        ctx.quadraticCurveTo(c.x - 10, uy - 10, c.x - 2, uy - 11);
        ctx.quadraticCurveTo(c.x + 8, uy - 11, c.x + 9, uy - 2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#99bbcc";
        ctx.fillRect(c.x - 5, uy - 9, 9, 4);
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(c.x - 5, uy - 1, 2.5, 0, 7); ctx.arc(c.x + 5, uy - 1, 2.5, 0, 7); ctx.fill();
      }
    } else {
      // a person: small, but solid enough to read as a human being
      const uy = GROUND;
      const sd = Math.abs(Math.round(c.x));
      const SHIRT = ["#d84a4a", "#3d6fd0", "#e0b23c", "#3aa06a", "#c860b0", "#e8e2d4", "#5a5a68"];
      const SKIN  = ["#f0c8a0", "#d8a878", "#a8734c", "#7a4f34", "#e8b894"];
      const HAIR  = ["#2a2018", "#4a3020", "#6a4a28", "#1a1a1c", "#8a7a5a"];
      const shirt = SHIRT[sd % SHIRT.length], skin = SKIN[(sd >> 2) % SKIN.length], hair = HAIR[(sd >> 3) % HAIR.length];
      const dir = c.vx < 0 ? -1 : 1;
      // running cycle — faster and wilder while panicking
      const spd = c.panic ? 90 : 220;
      const ph = performance.now() / spd + sd;
      const swing = (c.panic ? 4.2 : 2.4) * Math.sin(ph);
      const bob = c.panic ? Math.abs(Math.sin(ph)) * 1.6 : 0;
      const hipY = uy - 8 - bob;
      ctx.save();
      ctx.lineCap = "round";
      // legs
      ctx.strokeStyle = "#2c3040"; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(c.x, hipY); ctx.lineTo(c.x + swing, uy);
      ctx.moveTo(c.x, hipY); ctx.lineTo(c.x - swing, uy);
      ctx.stroke();
      // torso
      ctx.fillStyle = shirt;
      ctx.beginPath();
      ctx.moveTo(c.x - 2.6, hipY + 1);
      ctx.lineTo(c.x - 3.1, uy - 15);
      ctx.lineTo(c.x + 3.1, uy - 15);
      ctx.lineTo(c.x + 2.6, hipY + 1);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(0,0,20,0.18)";               // shaded side
      ctx.fillRect(c.x + 1, uy - 15, 2.1, hipY - uy + 16);
      // arms — thrown overhead in panic, pumping otherwise
      ctx.strokeStyle = skin; ctx.lineWidth = 2.1;
      ctx.beginPath();
      if (c.panic) {
        ctx.moveTo(c.x - 2.4, uy - 14); ctx.lineTo(c.x - 5 - swing * 0.3, uy - 21 + swing * 0.4);
        ctx.moveTo(c.x + 2.4, uy - 14); ctx.lineTo(c.x + 5 + swing * 0.3, uy - 21 - swing * 0.4);
      } else {
        ctx.moveTo(c.x - 2.4, uy - 14); ctx.lineTo(c.x - 3 - swing * 0.5, uy - 9);
        ctx.moveTo(c.x + 2.4, uy - 14); ctx.lineTo(c.x + 3 + swing * 0.5, uy - 9);
      }
      ctx.stroke();
      // head, with hair and a face dot so it reads which way they're running
      ctx.fillStyle = skin;
      ctx.beginPath(); ctx.arc(c.x, uy - 18.5, 3.1, 0, 7); ctx.fill();
      ctx.fillStyle = hair;
      ctx.beginPath(); ctx.arc(c.x, uy - 19.4, 3.1, Math.PI * 1.05, Math.PI * 2.05); ctx.fill();
      ctx.fillStyle = "rgba(20,16,20,0.85)";
      ctx.fillRect(c.x + dir * 1.2, uy - 19, 1, 1);
      if (c.panic) {                                     // open, screaming mouth
        ctx.fillStyle = "rgba(60,20,20,0.9)";
        ctx.beginPath(); ctx.ellipse(c.x + dir * 1, uy - 17, 0.9, 1.3, 0, 0, 7); ctx.fill();
      }
      ctx.restore();
      ctx.lineWidth = 1;
    }
  }
}

function drawBoss() {
  const b = boss, M = b.spec || mechOf();
  const uy = GROUND;
  const hurt = b.hurtT > 0 && Math.floor(performance.now() / 60) % 2;
  const legSwing = Math.sin(b.walk) * 12;
  const d = b.dir;
  const bodyC = hurt ? "#ffdede" : M.body;
  const darkC = hurt ? "#e8b8b8" : shade(M.body, -26);
  const midC  = hurt ? "#f0c8c8" : shade(M.body, -12);
  const trimC = hurt ? "#ffcccc" : M.trim;
  const now = performance.now();
  const charging = b.laserT > 0;

  // ---- legs: reverse-jointed on every frame, weight varies ----
  const legW = M.frame === "brute" || M.frame === "bear" ? 15 : M.frame === "falcon" ? 8 : 11;
  ctx.strokeStyle = darkC; ctx.lineWidth = legW; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(b.x - 22, uy - 88); ctx.lineTo(b.x - 34 + legSwing, uy - 44); ctx.lineTo(b.x - 26 + legSwing, uy - 4);
  ctx.moveTo(b.x + 22, uy - 88); ctx.lineTo(b.x + 34 - legSwing, uy - 44); ctx.lineTo(b.x + 26 - legSwing, uy - 4);
  ctx.stroke();
  ctx.strokeStyle = midC; ctx.lineWidth = legW * 0.45;   // hydraulic lines
  ctx.beginPath();
  ctx.moveTo(b.x - 24, uy - 80); ctx.lineTo(b.x - 32 + legSwing, uy - 48);
  ctx.moveTo(b.x + 24, uy - 80); ctx.lineTo(b.x + 32 - legSwing, uy - 48);
  ctx.stroke();
  ctx.lineWidth = 1; ctx.lineCap = "butt";
  ctx.fillStyle = darkC;                                  // splayed feet
  ctx.fillRect(b.x - 40 + legSwing, uy - 8, 30, 8);
  ctx.fillRect(b.x + 10 - legSwing, uy - 8, 30, 8);

  // ---- torso silhouette per frame ----
  ctx.fillStyle = bodyC;
  ctx.beginPath();
  if (M.frame === "brute" || M.frame === "bear") {        // wide, slab-shouldered
    ctx.moveTo(b.x - 46, uy - 86);
    ctx.lineTo(b.x + 46, uy - 86);
    ctx.lineTo(b.x + 40, uy - 146);
    ctx.lineTo(b.x - 40, uy - 146);
  } else if (M.frame === "falcon") {                      // narrow, forward-raked
    ctx.moveTo(b.x - 30, uy - 88);
    ctx.lineTo(b.x + 32, uy - 92);
    ctx.lineTo(b.x + 26, uy - 148);
    ctx.lineTo(b.x - 24, uy - 142);
  } else if (M.frame === "dragon") {                      // sinuous, plated
    ctx.moveTo(b.x - 38, uy - 86);
    ctx.lineTo(b.x + 40, uy - 90);
    ctx.lineTo(b.x + 30, uy - 150);
    ctx.lineTo(b.x - 32, uy - 144);
  } else {                                                 // samurai / knight: tapered cuirass
    ctx.moveTo(b.x - 38, uy - 86);
    ctx.lineTo(b.x + 38, uy - 86);
    ctx.lineTo(b.x + 30, uy - 148);
    ctx.lineTo(b.x - 30, uy - 148);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.10)";               // lit left plate
  ctx.fillRect(b.x - 38, uy - 146, 12, 60);
  ctx.fillStyle = "rgba(0,0,20,0.20)";
  ctx.fillRect(b.x + 24, uy - 146, 16, 60);
  ctx.fillStyle = trimC;                                  // national trim band
  ctx.fillRect(b.x - 42, uy - 104, 84, 7);
  ctx.fillStyle = darkC;
  ctx.fillRect(b.x - 42, uy - 97, 84, 3);

  // reactor core in the chest
  const cr = 11 + (charging ? Math.sin(now / 70) * 3 : Math.sin(now / 320) * 1.5);
  const cg = ctx.createRadialGradient(b.x, uy - 122, 1, b.x, uy - 122, cr * 1.9);
  cg.addColorStop(0, "#ffffff"); cg.addColorStop(0.4, M.glow); cg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(b.x, uy - 122, cr * 1.9, 0, 7); ctx.fill();

  // ---- shoulders / pauldrons ----
  ctx.fillStyle = midC;
  if (M.frame === "brute" || M.frame === "bear") {
    ctx.fillRect(b.x - 62, uy - 148, 22, 32);
    ctx.fillRect(b.x + 40, uy - 148, 22, 32);
    ctx.fillStyle = trimC;
    ctx.fillRect(b.x - 62, uy - 148, 22, 5);
    ctx.fillRect(b.x + 40, uy - 148, 22, 5);
  } else if (M.frame === "samurai") {                     // sode: layered lamellar plates
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i % 2 ? midC : bodyC;
      ctx.fillRect(b.x - 60, uy - 146 + i * 10, 24, 9);
      ctx.fillRect(b.x + 36, uy - 146 + i * 10, 24, 9);
    }
    ctx.fillStyle = trimC;
    ctx.fillRect(b.x - 60, uy - 148, 24, 3);
    ctx.fillRect(b.x + 36, uy - 148, 24, 3);
  } else if (M.frame === "knight") {                      // rounded pauldrons
    ctx.beginPath(); ctx.arc(b.x - 44, uy - 138, 16, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x + 44, uy - 138, 16, 0, 7); ctx.fill();
    ctx.fillStyle = trimC;
    ctx.beginPath(); ctx.arc(b.x - 44, uy - 138, 7, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x + 44, uy - 138, 7, 0, 7); ctx.fill();
  } else if (M.frame === "falcon") {                      // swept wing vanes
    for (const s2 of [-1, 1]) {
      ctx.fillStyle = midC;
      ctx.beginPath();
      ctx.moveTo(b.x + s2 * 28, uy - 144);
      ctx.lineTo(b.x + s2 * 74, uy - 158 + Math.sin(now / 300) * 3);
      ctx.lineTo(b.x + s2 * 70, uy - 138);
      ctx.lineTo(b.x + s2 * 30, uy - 122);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = trimC;
      ctx.beginPath();
      ctx.moveTo(b.x + s2 * 34, uy - 140); ctx.lineTo(b.x + s2 * 66, uy - 150);
      ctx.lineTo(b.x + s2 * 64, uy - 142);
      ctx.closePath(); ctx.fill();
    }
  } else {                                                 // dragon: spined shoulders
    for (const s2 of [-1, 1]) {
      ctx.fillStyle = midC;
      ctx.fillRect(b.x + s2 * 50 - 11, uy - 146, 22, 26);
      ctx.fillStyle = trimC;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(b.x + s2 * 50 - 8 + i * 7, uy - 146);
        ctx.lineTo(b.x + s2 * 50 - 5 + i * 7, uy - 160);
        ctx.lineTo(b.x + s2 * 50 - 1 + i * 7, uy - 146);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  // ---- head ----
  const hy = uy - 168;
  ctx.fillStyle = midC;
  if (M.frame === "samurai") {                             // kabuto with crest
    ctx.beginPath();
    ctx.moveTo(b.x - 15, hy + 20); ctx.lineTo(b.x - 13, hy + 2);
    ctx.lineTo(b.x + 13, hy + 2); ctx.lineTo(b.x + 15, hy + 20);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = trimC;                                 // maedate crest
    ctx.beginPath();
    ctx.moveTo(b.x - 12, hy + 2); ctx.lineTo(b.x - 4, hy - 20);
    ctx.lineTo(b.x, hy - 4); ctx.lineTo(b.x + 4, hy - 20);
    ctx.lineTo(b.x + 12, hy + 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#2a2a32";                             // menpo faceplate
    ctx.fillRect(b.x - 11, hy + 10, 22, 9);
  } else if (M.frame === "knight") {                       // visored great helm
    ctx.fillRect(b.x - 14, hy + 2, 28, 20);
    ctx.fillStyle = trimC;                                 // plume
    ctx.beginPath();
    ctx.moveTo(b.x - 3, hy + 2); ctx.quadraticCurveTo(b.x + 2, hy - 22, b.x + 16, hy - 14);
    ctx.quadraticCurveTo(b.x + 6, hy - 8, b.x + 5, hy + 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#1c1c24";
    ctx.fillRect(b.x - 12, hy + 9, 24, 5);
  } else if (M.frame === "falcon") {                       // raptor head with beak
    ctx.beginPath();
    ctx.moveTo(b.x - 12, hy + 22); ctx.lineTo(b.x - 10, hy + 2);
    ctx.lineTo(b.x + 10, hy);
    ctx.lineTo(b.x + 12 + d * 10, hy + 12);
    ctx.lineTo(b.x + 10, hy + 22);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = trimC;
    ctx.fillRect(b.x - 10, hy - 2, 20, 4);
  } else if (M.frame === "dragon") {                       // long muzzle + horns
    ctx.beginPath();
    ctx.moveTo(b.x - 13, hy + 22); ctx.lineTo(b.x - 11, hy + 2);
    ctx.lineTo(b.x + 8, hy + 2); ctx.lineTo(b.x + 22 * d, hy + 14);
    ctx.lineTo(b.x + 8, hy + 22);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = trimC;
    for (const s2 of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(b.x + s2 * 8, hy + 2); ctx.lineTo(b.x + s2 * 14, hy - 16);
      ctx.lineTo(b.x + s2 * 3, hy + 2);
      ctx.closePath(); ctx.fill();
    }
  } else if (M.frame === "bear") {                         // heavy blunt skull
    ctx.fillRect(b.x - 17, hy + 4, 34, 20);
    ctx.beginPath(); ctx.arc(b.x - 15, hy + 4, 6, 0, 7); ctx.arc(b.x + 15, hy + 4, 6, 0, 7); ctx.fill();
    ctx.fillStyle = trimC;
    ctx.beginPath();                                       // red star on the brow
    for (let i = 0; i < 10; i++) {
      const r2 = i % 2 ? 2.4 : 6, a2 = (i / 10) * Math.PI * 2 - Math.PI / 2;
      ctx.lineTo(b.x + Math.cos(a2) * r2, hy + 12 + Math.sin(a2) * r2);
    }
    ctx.closePath(); ctx.fill();
  } else {                                                 // brute: armoured box + antenna
    ctx.fillRect(b.x - 16, hy + 4, 32, 20);
    ctx.fillStyle = trimC;
    ctx.fillRect(b.x - 16, hy + 2, 32, 4);
    ctx.fillRect(b.x + 12, hy - 14, 2, 16);
  }
  // sensor eye — flares white while charging
  ctx.fillStyle = charging ? (Math.floor(now / 70) % 2 ? M.glow : "#ffffff") : M.glow;
  ctx.fillRect(b.x - 6 + d * 6, hy + 12, 11, 5);
  ctx.fillStyle = M.glow + "44";
  ctx.beginPath(); ctx.arc(b.x + d * 6, hy + 14, 12, 0, 7); ctx.fill();

  // ---- weapon hardware ----
  if (M.weapon === "missiles") {
    ctx.fillStyle = darkC;
    ctx.fillRect(b.x - 64, uy - 132, 16, 24);
    ctx.fillRect(b.x + 48, uy - 132, 16, 24);
    ctx.fillStyle = "#2a2a32";
    for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) {
      ctx.fillRect(b.x - 61 + c * 7, uy - 129 + r * 7, 5, 5);
      ctx.fillRect(b.x + 51 + c * 7, uy - 129 + r * 7, 5, 5);
    }
  } else if (M.weapon === "gatling") {
    ctx.fillStyle = darkC;                                  // rotating barrel cluster
    const spin = Math.sin(now / 60) * 3;
    ctx.fillRect(b.x + d * 34, uy - 128, d * 46, 16);
    ctx.fillStyle = midC;
    for (let i = 0; i < 3; i++)
      ctx.fillRect(b.x + d * 50, uy - 126 + i * 5 + spin, d * 34, 3);
    ctx.fillStyle = trimC;
    ctx.fillRect(b.x + d * 30, uy - 132, d * 12, 24);
  } else if (M.weapon === "blade") {                        // drawn energy katana
    ctx.save();
    ctx.translate(b.x + d * 40, uy - 130);
    ctx.rotate(d * (charging ? -0.9 : -0.35));
    ctx.fillStyle = darkC;
    ctx.fillRect(-4, -6, 14, 10);
    ctx.fillStyle = charging ? "#ffffff" : "#dfe8f2";
    ctx.beginPath();
    ctx.moveTo(8, -4); ctx.lineTo(d * 86, -8); ctx.lineTo(d * 92, -2); ctx.lineTo(8, 3);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = M.glow + "88";
    ctx.fillRect(8, -6, d * 82, 2);
    ctx.restore();
  } else if (M.weapon === "lance") {
    ctx.fillStyle = midC;
    ctx.beginPath();
    ctx.moveTo(b.x + d * 34, uy - 134); ctx.lineTo(b.x + d * 104, uy - 122);
    ctx.lineTo(b.x + d * 34, uy - 116);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = charging ? "#ffffff" : trimC;
    ctx.beginPath();
    ctx.moveTo(b.x + d * 88, uy - 126); ctx.lineTo(b.x + d * 116, uy - 122);
    ctx.lineTo(b.x + d * 88, uy - 118);
    ctx.closePath(); ctx.fill();
  } else if (M.weapon === "shield") {
    ctx.fillStyle = midC;                                   // tower shield on the near arm
    ctx.beginPath();
    ctx.moveTo(b.x + d * 44, uy - 150);
    ctx.lineTo(b.x + d * 70, uy - 142);
    ctx.lineTo(b.x + d * 70, uy - 96);
    ctx.lineTo(b.x + d * 44, uy - 84);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = trimC;
    ctx.fillRect(b.x + d * 50, uy - 130, d * 14, 30);
    ctx.fillStyle = charging ? "rgba(180,220,255,0.35)" : "rgba(180,220,255,0.12)";
    ctx.beginPath(); ctx.ellipse(b.x + d * 58, uy - 118, 26, 44, 0, 0, 7); ctx.fill();
  } else if (M.weapon === "railgun" || M.weapon === "cannon") {
    ctx.fillStyle = darkC;                                  // shoulder-mounted heavy barrel
    ctx.fillRect(b.x + d * 20, uy - 150, d * 68, 15);
    ctx.fillStyle = midC;
    ctx.fillRect(b.x + d * 74, uy - 152, d * 18, 19);
    ctx.fillStyle = charging ? "#ffffff" : trimC;
    ctx.fillRect(b.x + d * 88, uy - 148, d * 8, 11);
  } else if (M.weapon === "flail") {
    ctx.strokeStyle = darkC; ctx.lineWidth = 3;             // chain + wrecking head
    const sw = Math.sin(now / 320) * 0.5;
    const fx2 = b.x + d * (52 + Math.cos(sw) * 26), fy2 = uy - 118 + Math.sin(sw) * 34;
    ctx.beginPath(); ctx.moveTo(b.x + d * 34, uy - 132); ctx.lineTo(fx2, fy2); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillStyle = midC;
    ctx.beginPath(); ctx.arc(fx2, fy2, 13, 0, 7); ctx.fill();
    ctx.fillStyle = trimC;
    for (let i = 0; i < 6; i++) {
      const a2 = (i / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(fx2 + Math.cos(a2) * 11, fy2 + Math.sin(a2) * 11);
      ctx.lineTo(fx2 + Math.cos(a2) * 19, fy2 + Math.sin(a2) * 19);
      ctx.lineTo(fx2 + Math.cos(a2 + 0.4) * 11, fy2 + Math.sin(a2 + 0.4) * 11);
      ctx.closePath(); ctx.fill();
    }
  } else {                                                  // beam emitter arms
    ctx.fillStyle = darkC;
    ctx.fillRect(b.x + d * 34, uy - 134, d * 40, 14);
    ctx.fillStyle = charging ? "#ffffff" : M.glow;
    ctx.beginPath(); ctx.arc(b.x + d * 76, uy - 127, 7, 0, 7); ctx.fill();
  }

  // ---- the sweeping heavy beam ----
  if (b.laserT > 0 && b.beamX != null) {
    const ox = M.weapon === "blade" || M.weapon === "lance" ? b.x + d * 60 : b.x;
    const oy = M.weapon === "railgun" || M.weapon === "cannon" ? uy - 142 : uy - 120;
    ctx.strokeStyle = M.glow;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 9 + Math.sin(now / 40) * 3;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(b.beamX, GROUND); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(b.beamX, GROUND); ctx.stroke();
    ctx.lineWidth = 1;
    boomlessScorch(b.beamX);
  }
}
function boomlessScorch(x) {
  ctx.fillStyle = `rgba(255,120,150,${0.4 + Math.random() * 0.3})`;
  ctx.beginPath(); ctx.ellipse(x, GROUND, 18, 5, 0, 0, 7); ctx.fill();
}

function drawBullets() {
  // thrown helicopters / rubble chunks tumble through the air
  for (const t of kBullets) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.spin);
    if (t.rock) {
      ctx.fillStyle = "#8a7a60";
      ctx.beginPath();
      ctx.moveTo(-14, 5); ctx.lineTo(-8, -8); ctx.lineTo(4, -10); ctx.lineTo(13, -1); ctx.lineTo(9, 7);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#5a4e3c";
      ctx.beginPath(); ctx.moveTo(-5, -5); ctx.lineTo(3, 3); ctx.stroke();
    } else {
      ctx.fillStyle = "#4a5a6a";
      ctx.beginPath(); ctx.ellipse(0, 0, 16, 8, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(200,210,220,0.8)";
      ctx.beginPath(); ctx.moveTo(-20, -9); ctx.lineTo(20, -9); ctx.stroke();
    }
    ctx.restore();
    if (Math.random() < 0.3) smoke(t.x, t.y, 1);
  }
  // every munition is drawn as the thing it actually is, oriented along its flight path
  for (const b of eBullets) {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    const kind = b.kind || (b.bomb ? "bomb" : "shell");
    if (kind === "rocket" || kind === "missile") {
      const L = kind === "missile" ? 15 : 11;
      ctx.fillStyle = "#f2f2f0";                       // exhaust plume trailing behind
      ctx.beginPath();
      ctx.moveTo(-L, -2.2);
      ctx.lineTo(-L - 10 - Math.random() * 10, 0);
      ctx.lineTo(-L, 2.2);
      ctx.closePath();
      ctx.fillStyle = `rgba(255,${180 + Math.random() * 60 | 0},90,0.85)`;
      ctx.fill();
      ctx.fillStyle = "#c9ccd2";                       // body
      ctx.fillRect(-L, -2.4, L * 2, 4.8);
      ctx.fillStyle = "#8d939c";
      ctx.beginPath();                                 // nose cone
      ctx.moveTo(L, -2.4); ctx.lineTo(L + 6, 0); ctx.lineTo(L, 2.4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#d84a3a";                       // warhead band
      ctx.fillRect(L - 5, -2.4, 3, 4.8);
      ctx.fillStyle = "#6f757e";                       // tail fins
      ctx.beginPath();
      ctx.moveTo(-L, -2.4); ctx.lineTo(-L - 4, -6.5); ctx.lineTo(-L + 4, -2.4);
      ctx.moveTo(-L, 2.4); ctx.lineTo(-L - 4, 6.5); ctx.lineTo(-L + 4, 2.4);
      ctx.closePath(); ctx.fill();
      if (kind === "missile") {                        // mid-body strakes
        ctx.fillRect(-2, -5, 5, 2);
        ctx.fillRect(-2, 3, 5, 2);
      }
    } else if (kind === "bomb") {
      ctx.fillStyle = "#6a7078";                       // fat aerial bomb body
      ctx.beginPath();
      ctx.ellipse(0, 0, 9, 4.6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#565c64";
      ctx.beginPath();                                 // ogive nose
      ctx.moveTo(7, -4.2); ctx.lineTo(13, 0); ctx.lineTo(7, 4.2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#e8c84a";                       // yellow live-ordnance band
      ctx.fillRect(2, -4.4, 2.6, 8.8);
      ctx.fillStyle = "#4a5058";                       // boxed tail fins
      ctx.beginPath();
      ctx.moveTo(-8, -4); ctx.lineTo(-14, -7); ctx.lineTo(-14, 7); ctx.lineTo(-8, 4);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#2e343a"; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-14, -7); ctx.lineTo(-14, 7);
      ctx.moveTo(-11, -5.5); ctx.lineTo(-11, 5.5);
      ctx.stroke();
    } else if (kind === "heshell") {
      ctx.fillStyle = "#8a8378";                       // stubby HE artillery round
      ctx.fillRect(-6, -3, 10, 6);
      ctx.fillStyle = "#6f6a60";
      ctx.beginPath();
      ctx.moveTo(4, -3); ctx.lineTo(10, 0); ctx.lineTo(4, 3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#c0a038";                       // driving band
      ctx.fillRect(-5, -3, 2.4, 6);
      ctx.fillStyle = "rgba(255,200,120,0.5)";         // scorched air behind it
      ctx.beginPath(); ctx.arc(-9, 0, 3.4, 0, 7); ctx.fill();
    } else {
      // tank sabot round: long dart with a tracer burning at the base
      ctx.fillStyle = "#b9bec6";
      ctx.fillRect(-7, -1.5, 13, 3);
      ctx.fillStyle = "#8d939c";
      ctx.beginPath();
      ctx.moveTo(6, -1.5); ctx.lineTo(12, 0); ctx.lineTo(6, 1.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#6f757e";                       // fin stack
      ctx.beginPath();
      ctx.moveTo(-7, -1.5); ctx.lineTo(-10, -4); ctx.lineTo(-4, -1.5);
      ctx.moveTo(-7, 1.5); ctx.lineTo(-10, 4); ctx.lineTo(-4, 1.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffdd88";                       // tracer
      ctx.beginPath(); ctx.arc(-8, 0, 2.6, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,200,110,0.35)";
      ctx.beginPath(); ctx.arc(-13, 0, 4, 0, 7); ctx.fill();
    }
    ctx.restore();
    // smoke trail behind powered munitions
    if ((kind === "rocket" || kind === "missile") && Math.random() < 0.6)
      particles.push({ x: b.x - Math.cos(ang) * 14, y: b.y - Math.sin(ang) * 14,
                       vx: -Math.cos(ang) * 20, vy: -Math.sin(ang) * 20 - 10,
                       life: 0.5 + Math.random() * 0.4, color: "smoke", grav: -14 });
  }
}

function drawPowerups() {
  for (const p of powerups) {
    const blink = p.t < 3 && Math.floor(performance.now() / 150) % 2;
    if (blink) continue;
    const c = p.kind === "heal" ? "#66ff88" : "#66eeff";
    const bob = Math.sin(performance.now() / 300) * 4;
    const gg = ctx.createRadialGradient(p.x, p.y - 14 + bob, 2, p.x, p.y - 14 + bob, 16);
    gg.addColorStop(0, c + "88"); gg.addColorStop(1, c + "00");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(p.x, p.y - 14 + bob, 16, 0, 7); ctx.fill();
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(p.x, p.y - 14 + bob, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#000";
    ctx.font = "bold 11px monospace"; ctx.textAlign = "center";
    ctx.fillText(p.kind === "heal" ? "+" : "R", p.x, p.y - 10 + bob);
  }
}

function drawParticles() {
  for (const pt of particles) {
    if (pt.color === "smoke") {
      ctx.globalAlpha = Math.max(0, Math.min(0.4, pt.life * 0.3));
      ctx.fillStyle = "#888892";
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 8 * (1.6 - pt.life * 0.5), 0, 7); ctx.fill();
    } else {
      ctx.globalAlpha = Math.max(0, pt.life * 1.6);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- The live news broadcast: anchor, situation map, lower third, crawl ----------
function drawBroadcast(city) {
  const N = NEWSNET[city.mil] || NEWSNET.usa;
  const now = performance.now();
  const barY = H - 46, barH = 46;

  // ---- backing plate ----
  ctx.fillStyle = "rgba(6,8,14,0.9)";
  ctx.fillRect(0, barY, W, barH);
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  ctx.fillRect(0, barY, W, 1);

  // ---- studio window with the anchor ----
  const ax = 30, ay = barY + 18;                     // anchor centre
  ctx.save();
  ctx.beginPath(); ctx.rect(3, barY + 3, 54, 31); ctx.clip();
  const sg = ctx.createLinearGradient(0, barY, 0, H);
  sg.addColorStop(0, "#1b2740"); sg.addColorStop(1, "#0d1526");
  ctx.fillStyle = sg; ctx.fillRect(3, barY + 3, 54, 31);
  // studio backdrop: a faint skyline behind the presenter
  ctx.fillStyle = "rgba(90,130,190,0.22)";
  for (let i = 0; i < 7; i++) ctx.fillRect(6 + i * 8, barY + 12 + ((i * 5) % 7), 6, 20);
  // shoulders
  ctx.fillStyle = "#26304a";
  ctx.beginPath();
  ctx.moveTo(ax - 20, barY + 34); ctx.quadraticCurveTo(ax - 15, ay + 6, ax, ay + 5);
  ctx.quadraticCurveTo(ax + 15, ay + 6, ax + 20, barY + 34);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#e8ecf2";                         // collar
  ctx.beginPath();
